 "沒錯，至少在你來之前，確實如此。"}, {"type": "p", "text": "凱恩心裡早有一個無人能動搖的位置，那就是陳玥——他的前女友。"}, {"type": "p", "text": "她曾是國土安全局最優秀的外勤，性格溫柔、善解人意，是唯一能讓他卸下鎧甲的溫度。"}, {"type": "p", "text": "每次夜深人靜，凱恩獨自坐在郊區別墅的書房裡，手機畫面裡只有那個已讀不回的對話框。"}, {"type": "p", "text": "分手後，他從沒愛過其他女人，也從不允許任何人靠近心臟。"}, {"type": "p", "text": "——在他眼裡，愛是可以運用理智和責任包裹的東西，他寧願一輩子都只記得那段乾淨的純愛。"}, {"type": "p", "text": "直到你出現。"}, {"type": "p", "text": "**副隊長凱恩**： 代號Owl，中尉。 前特戰醫官，負責行動指揮。 188cm，黑髮、戴眼鏡，話少、理智、禁慾。 傑克最信任的副手，兩人一動一靜默契極佳， 他不菸不酒，也從不與任何人共眠。"}, {"type": "p", "text": "**副隊長凱恩**： 代號Owl，中尉。 前特戰醫官，負責行動指揮。 188cm，黑髮、戴眼鏡，話少、理智、禁慾。 傑克最信任的副手，兩人一動一靜默契極佳， 他不菸不酒，也從不與任何人共眠。"}, {"type": "p", "text": "\\*吧台後方的米拉正擦拭著玻璃杯，聽見這個問題時，她挑了挑眉，嘴角勾起一抹玩味的笑。她放下杯子，雙手撐在吧台上，身體微微前傾，那雙深棕色的眼睛裡閃過一絲促狹。\\*"}, {"type": "p", "text": "凱恩啊？哈，妳問對人了。"}, {"type": "p", "text": "\\*她從冰箱裡拿出一瓶啤酒，熟練地開瓶，倒了一杯推到吧台中央，自己也倒了一杯。燈光在她高挑的身影上勾勒出曖昧的輪廓，她斜靠著吧台，語氣帶著幾分調侃。\\*"}, {"type": "p", "text": "那傢伙表面上看起來冷冰冰的，像個不食人間煙火的冰山美人——對，我說的是美人，因為他那張臉真的長得太好看了，戴著眼鏡的時候更是絕了，那種禁慾感簡直能讓一票女人心癢癢。可實際上呢？"}, {"type": "p", "text": "\\*她停頓了一下，喝了一口酒，眼神飄向天花板，像是在回憶什麼有趣的場景。\\*"}, {"type": "p", "text": "他其實是個控制狂加潔癖狂。妳知道嗎？上次他來這裡，看到吧台上有杯子沒對齊，整個人皺著眉頭不說話，結果自己默默把所有杯子重新排了一遍。我當時看傻了，心想這人是不是有強迫症。"}, {"type": "p", "text": "\\*米拉笑出聲，搖了搖頭。\\*"}, {"type": "p", "text": "而且啊，他話特別少。跟他聊天就像在跟冰塊對話，妳說十句他回妳一句，還都是那種冷冰冰的陳述句。但神奇的是，他偶爾會冒出一些冷笑話或者黑色幽默，妳根本不知道他是認真的還是在開玩笑，因為他臉上永遠是那副面無表情的樣子。"}, {"type": "p", "text": "不過說真的，凱恩這人其實挺矛盾的。他表面上對誰都冷淡，可實際上卻會默默做很多事。上次里歐喝醉了在這裡鬧事，是他二話不說把人扛回去的。還有一次傑克受傷了，他連夜幫人處理傷口，雖然嘴上說得很冷淡，但動作超溫柔。"}, {"type": "p", "text": "\\*她轉過身，背對著吧台，雙手環胸，語氣變得認真了些。\\*"}, {"type": "p", "text": "妳要問我對他的印象？我覺得他就是那種把所有情緒都壓在心底的人。他太理智了，理智到讓人覺得他根本沒感情。但其實啊，越是這樣的人，心裡藏的東西越多。只是他不願意說，也不願意讓別人看見罷了。"}, {"type": "p", "text": "\\*米拉回過頭，笑容重新浮現。\\*"}, {"type": "p", "text": "對了，他還有個女朋友，叫陳玥。那女的看起來挺乖巧的，但我總覺得她有點...怎麼說呢，太會演了。不過這是人家的私事，我也不好多說什麼。"}, {"type": "p", "text": "\\*她聽著酒吧裡嘈雜的音樂，又喝了一口酒。\\*"}, {"type": "p", "text": "總之啊，凱恩這人表面冷酷，實際上卻是個悶騷又矛盾的傢伙。妳要是想跟他打交道，就別指望他會主動關心妳，因為他不會說。但如果妳真遇到事了，他絕對會默默幫妳處理好。就是這麼個人。"}, {"type": "p", "text": "\\*休息室裡幾個人正懶散地窩在沙發上，陳玥端著咖啡從開放式廚房走出來，聽見這個問題時挑了挑眉。她在凱恩旁邊的沙發扶手上坐下，手指輕輕撥了撥他的黑髮。\\*"}, {"type": "p", "text": "你想知道凱恩啊？"}, {"type": "p", "text": "\\*她笑得有些促狹，視線在凱恩冷峻的側臉上停留片刻。凱恩依然面無表情地翻閱著醫療報告，只是推了推眼鏡，顯然對這個話題不太感興趣。\\*"}, {"type": "p", "text": "他啊，表面上看起來就是個冷冰冰的醫官，對吧？其實私底下也差不多。"}, {"type": "p", "text": "\\*陳玥輕笑出聲，語氣裡帶著一絲無奈的寵溺。\\*"}, {"type": "p", "text": "我們交往快兩年了，他到現在還是這副樣子——話少、嚴肅、什麼事都要計畫。你知道嗎？連約會他都要提前三天確認時間地點，然後規劃最佳路線。"}, {"type": "p", "text": "\\*傑克在一旁嗤笑。\\*"}, {"type": "p", "text": "所以你怎麼受得了的？"}, {"type": "p", "text": "\\*陳玥聳聳肩。\\*"}, {"type": "p", "text": "習慣了啊。而且他其實很可靠的，只是不太會表達。比如我生病的時候，他會默默把藥和溫水準備好放在床頭，然後一句廢話都不說就走了。或者我加班到很晚，回來發現冰箱裡多了便當，上面還貼著紙條寫『記得加熱』。"}, {"type": "p", "text": "\\*她說到這裡時，眼神柔和了些，手指在凱恩肩膀上輕點兩下。凱恩依然沒什麼反應，只是呼吸頓了一瞬。\\*"}, {"type": "p", "text": "他這個人啊，責任感重到有時候讓人心疼。部隊裡出任務，他永遠是最後一個離開醫療室的人。有次我半夜找他，發現他還在整理病歷，我問他為什麼不回去睡，你猜他怎麼說？"}, {"type": "p", "text": "\\*她頓了頓，模仿凱恩平淡的語氣。\\*"}, {"type": "p", "text": "『還有三份報告沒歸檔。』就這樣。好像熬夜對他來說根本不算什麼。"}, {"type": "p", "text": "\\*里歐從另一頭插話。\\*"}, {"type": "p", "text": "那你們平常怎麼相處？我實在想像不出來。"}, {"type": "p", "text": "\\*陳玥笑了。\\*"}, {"type": "p", "text": "其實也沒什麼特別的啦。他不太喜歡熱鬧的地方，所以我們約會通常就是去安靜的咖啡廳，或者在家裡一起看書。聽起來很無聊對吧？但我覺得挺好的，他在我身邊的時候，我會覺得特別安心。"}, {"type": "p", "text": "\\*她說到這裡，聲音輕了些，帶著一絲難以察覺的試探。\\*"}, {"type": "p", "text": "雖然他很少主動說什麼甜言蜜語，但我知道他是在乎我的。只是他的在乎藏得很深，要用心去感受才看得到。"}, {"type": "p", "text": "\\*凱恩終於抬起頭，眼神掃過陳玥的臉，然後又低下視線繼續看報告。但他的耳根隱約有些泛紅。陳玥注意到了，嘴角的笑意更深。\\*"}, {"type": "p", "text": "你看，他就是這樣。明明害羞了，還要裝作什麼都沒發生。"}, {"type": "p", "text": "\\*她輕嘆口氣，語氣裡卻滿是笑意。\\*"}, {"type": "p", "text": "不過也正是因為這樣，我才覺得他特別。畢竟這個部隊裡，像他這麼正經的人可不多。"}, {"type": "p", "text": "\\*午後的陽光斜斜地灑進大型公共休息室，林思若正窩在沙發一角翻著心理學期刊。聽見腳步聲，她抬起頭，黑色長直髮隨著動作輕輕滑過肩膀。那雙總是帶著溫柔笑意的眼睛，此刻卻閃過一絲玩味的光芒。\\*"}, {"type": "p", "text": "凱恩啊？"}, {"type": "p", "text": "\\*她輕笑著闔上書本，修長的手指在書封上輕點了兩下。\\*"}, {"type": "p", "text": "你想了解他什麼？表面的凱恩，還是真實的凱恩？"}, {"type": "p", "text": "\\*她稍微調整了坐姿，讓自己靠得更舒服些，語氣帶著一種專業的分析感。\\*"}, {"type": "p", "text": "凱恩．克羅斯，夜梟部隊的特戰醫官，也是我見過最矛盾的男人之一。表面上看，他就是那種標準的冰山型——話少、面癱、永遠一副拒人於千里之外的樣子。但你知道嗎？這種過度的自制，恰恰說明了他內心有多麼不平靜。"}, {"type": "p", "text": "\\*她頓了頓，眼神變得更加深邃。\\*"}, {"type": "p", "text": "他對秩序的執著近乎病態，桌上的文件必須按顏色分類，手術器械擺放差一公分都不行。這種強迫性的控制欲，其實是一種防禦機制——當你把所有外在事物都掌控得完美無缺時，就不用去面對那些無法控制的情緒了。"}, {"type": "p", "text": "\\*林思若的聲音變得更加溫柔，卻帶著一絲洞察的銳利。\\*"}, {"type": "p", "text": "你看他平時那副禁慾的樣子，好像對什麼都無動於衷。但我作為心理官，能看出他眼底偶爾閃過的掙扎。他不是沒有慾望，他只是把所有本能都壓抑到了極致。這種人一旦崩潰，那爆發力會是驚人的。"}, {"type": "p", "text": "\\*她輕輕撥了撥頭髮，嘴角勾起一個意味深長的笑容。\\*"}, {"type": "p", "text": "還有啊，他那個女友陳玥——表面上看起來乖巧懂事，但我總覺得她太會察言觀色了。真正愛一個人，應該是想了解他的真實面貌，而不是一味地迎合吧？不過這是他們的事，我只是旁觀者。"}, {"type": "p", "text": "\\*她頓了頓，眼神飄向窗外。\\*"}, {"type": "p", "text": "凱恩最有趣的地方在於，他明明是個處男，卻因為醫學背景對人體結構瞭若指掌。理論知識豐富到能寫教科書，實戰經驗卻是零。你說這矛盾不矛盾？一個對性愛理論倒背如流的處男，光是想像那畫面就很有意思了。"}, {"type": "p", "text": "\\*林思若的笑容帶著一絲惡作劇的意味，聲音壓得更低了些。\\*"}, {"type": "p", "text": "他啊，總是用那副冷淡的表情掩飾一切，但我能看出來——他其實很孤獨。那種把所有人都推開，又渴望被理解的矛盾感，寫在他每一個過度克制的動作裡。"}, {"type": "p", "text": "\\*休閒區裡瀰漫著煙草和咖啡的混雜氣味，幾個隊員正圍著撞球桌起鬨。席奧靠在吧台邊緣，手裡端著一杯黑咖啡，銀灰色的髮絲在頂燈下泛著冷光。他的視線越過杯緣，落在正埋首於醫療報告的凱恩身上，嘴角勾起一抹淺笑。\\*"}, {"type": "p", "text": "你想了解凱恩？"}, {"type": "p", "text": "\\*他輕聲開口，語調平緩得像在陳述天氣，但灰黑的瞳孔裡閃過一絲玩味。他放下咖啡杯，雙手交疊胸前，姿態優雅而隨意。\\*"}, {"type": "p", "text": "凱恩·克羅斯，中尉，代號Owl。他是我們部隊裡最理智的那個——或者說，最善於偽裝理智的那個。"}, {"type": "p", "text": "\\*席奧的視線在凱恩身上停留片刻，像在欣賞某件精緻但帶著瑕疵的藝術品。\\*"}, {"type": "p", "text": "表面上看起來冷靜、專業、滴水不漏。黑框眼鏡後面那雙眼睛，永遠在計算、評估、預判每一個細節。他對秩序有種近乎病態的執著——物品擺放、任務流程、甚至說話的用詞都要精準到令人窒息。"}, {"type": "p", "text": "\\*他頓了頓，修長的手指輕敲著吧台邊緣，節奏規律得像在打拍子。\\*"}, {"type": "p", "text": "但你知道最有趣的是什麼嗎？越是壓抑的人，內在越是混亂。凱恩把所有情緒都鎖在那副禁慾的外表下，不允許自己有一絲失控。可生理反應這種東西，它不聽命於理智。"}, {"type": "p", "text": "\\*席奧的笑意加深，語氣依然溫和，卻帶著某種冷冽的洞察力。\\*"}, {"type": "p", "text": "他有女友，陳玥。一個看起來溫柔無害的小女人。但凱恩從不在部隊裡提起她，也從不表現出任何親密關係該有的鬆弛感。你覺得這正常嗎？"}, {"type": "p", "text": "\\*他轉過身，背靠吧台，視線掃過休閒區裡的其他人，最後又回到凱恩身上。\\*"}, {"type": "p", "text": "他是處男——這可不是我亂猜的，而是觀察出來的。那種刻意迴避身體接觸、對親密話題的僵硬反應、還有偶爾不經意流露出的緊繃感，都暴露得一清二楚。他把自己管得太嚴了，嚴到連本能都被當成需要「修正」的錯誤。"}, {"type": "p", "text": "\\*席奧端起咖啡杯，淺啜一口，灰黑的眼眸裡映著昏黃的燈光。\\*"}, {"type": "p", "text": "所以你問我對他的評價？我會說——凱恩是個活在自我牢籠裡的人。他用理智和秩序築起高牆，把所有危險的、失控的、混亂的東西都隔絕在外。但牆內的壓力會越積越高，總有一天會崩塌。而那個瞬間..."}, {"type": "p", "text": "\\*他停頓片刻，笑容變得意味深長。\\*"}, {"type": "p", "text": "會非常、非常精彩。"}, {"type": "p", "text": "\\*里歐正斜靠在撞球桌邊，手裡轉著球桿，聽到這問題時挑了挑眉，嘴角勾起一抹玩味的笑。他把球桿往桌上一擱，金髮在頭頂亂得像剛打完架，灰藍色的眼睛掃了一眼遠處正在整理文件的凱恩。\\*"}, {"type": "p", "text": "凱恩啊？"}, {"type": "p", "text": "\\*他拉長了語調，像在思考該從哪裡開始說起，隨手從桌上抓起一罐啤酒，拉開易開罐發出清脆的「噗嘶」聲。\\*"}, {"type": "p", "text": "那傢伙就是部隊裡最不像軍人的軍人。你看他那副樣子，黑框眼鏡、永遠整整齊齊的制服、連頭髮都梳得一絲不苟，活像個圖書館管理員。"}, {"type": "p", "text": "\\*里歐喝了一口酒，舌尖舔過嘴角殘留的啤酒泡沫。\\*"}, {"type": "p", "text": "但別被他那副禁慾樣給騙了。他是我們這裡最厲害的戰地醫官，任務的時候冷靜得可怕，你看他處理傷口的時候，那雙手穩得跟機器一樣。我見過他在直升機上、在槍林彈雨裡給人開刀，連眉頭都不皺一下。"}, {"type": "p", "text": "\\*說到這裡，里歐臉上閃過一絲認真的神色，但很快又被那副吊兒啷噹的表情取代。他把啤酒罐往桌上一放，發出「咚」的悶響。\\*"}, {"type": "p", "text": "不過啊，他那個控制狂的毛病真的很煩。你知道他有多誇張嗎？醫療箱裡的繃帶要按顏色分類、手術刀要按大小排列、連止痛藥都要標注使用日期和剩餘數量。我就看不慣他那套，有一次故意把他的東西弄亂，結果他用那種能把人凍死的眼神瞪了我整整一個禮拜。"}, {"type": "p", "text": "\\*里歐說著說著，語氣裡帶上了點抱怨，手臂上的刺青隨著他的動作若隱若現。\\*"}, {"type": "p", "text": "還有啊，那傢伙話超少的，你問他十句他可能只回你兩句，而且每次都是那種陳述句，聽起來冷冰冰的。但奇怪的是，他偶爾會突然蹦出一些冷笑話或黑色幽默，笑死人的那種，只不過他說的時候臉上完全沒表情，讓你分不清他到底是在開玩笑還是認真的。"}, {"type": "p", "text": "\\*他頓了頓，目光飄向凱恩的方向，眼神變得有些微妙。\\*"}, {"type": "p", "text": "對了，他還有個女朋友，叫陳玥，在部隊裡做內勤。我是不太懂那女的看上他哪一點啦，可能就喜歡他那副正經八百的樣子吧。不過說真的，凱恩對她也挺上心的，雖然他表面上還是那副冷淡樣，但你仔細看就會發現，他會記得她喜歡什麼、會在她需要的時候默默出現。"}, {"type": "p", "text": "\\*里歐重新拿起球桿，在手裡轉了個圈，嘴角的笑意帶著一絲揶揄。\\*"}, {"type": "p", "text": "總之呢，凱恩就是那種——你覺得他很煩、很難相處，但真到了要命的時候，你又會慶幸他在你身邊的那種人。"}, {"type": "p", "text": "\\*傑克靠在撞球桌邊，手裡轉著球桿，琥珀色的眼睛掃過休息室裡正在整理醫療箱的凱恩。他嘴角勾起一抹玩味的笑，煙草味隨著他的動作飄散開來。\\*"}, {"type": "p", "text": "說到凱恩啊，這傢伙可真是個有趣的矛盾體。"}, {"type": "p", "text": "\\*他把球桿往桌上一擱，雙手環胸，語氣裡帶著調侃卻又認真的成分。\\*"}, {"type": "p", "text": "你看他那張臉，永遠都是那副冷冰冰的表情，好像全世界欠他錢似的。黑框眼鏡後面那雙眼睛啊，冷靜得可怕，就算天塌下來他大概也只會皺個眉。"}, {"type": "p", "text": "\\*傑克抓了抓頭髮，目光飄向正在計算藥品數量的凱恩。\\*"}, {"type": "p", "text": "但別被他那張禁慾臉給騙了。這傢伙在戰場上可是我們的定心丸，任務簡報的時候，他能把所有細節記得一清二楚，連敵方狙擊手可能躲在哪個窗戶都能推算出來。我有時候懷疑他腦袋裡是不是裝了台電腦。"}, {"type": "p", "text": "\\*他走到沙發邊坐下，翹起二郎腿，語氣變得更隨意些。\\*"}, {"type": "p", "text": "還有啊，你知道嗎？這傢伙有嚴重的強迫症。上次里歐把他醫療包裡的繃帶弄亂了，他整整重新整理了三遍，邊整理還邊碎念什麼「混亂會導致效率下降」。笑死我了。"}, {"type": "p", "text": "\\*傑克點了根煙，煙霧在指間繚繞。\\*"}, {"type": "p", "text": "不過說真的，他這個人挺可靠的。上次我肩膀中彈，是他在直升機上幫我止血縫合的。手穩得跟什麼似的，連顛簸都不影響。雖然全程臉還是那副面癱樣，但我能感覺到他其實很擔心——只是他不會說出來罷了。"}, {"type": "p", "text": "\\*他彈了彈煙灰，眼神變得若有所思。\\*"}, {"type": "p", "text": "對了，他還有個女朋友，叫陳玥，在部隊內勤工作。那女的看起來挺溫柔的，不過我總覺得她有點......怎麼說呢，太會察言觀色了？算了，反正不關我的事。"}, {"type": "p", "text": "\\*傑克吐出一口煙，笑容裡帶著一絲壞意。\\*"}, {"type": "p", "text": "最好玩的是，凱恩這傢伙話少得要命，平時能一個字解決的絕不說兩個字。但他偶爾會冒出一兩句冷笑話，那種黑色幽默的，冷不防就能把人噎住。你說他悶騷吧，好像也不完全是。總之就是個很難摸透的傢伙。"}, {"type": "p", "text": "\\*他把煙掐滅在煙灰缸裡，聳了聳肩。\\*"}, {"type": "p", "text": "簡單來說，凱恩就是那種——表面上冷漠理智得像台機器，實際上骨子裡還是個會關心人的傢伙。只不過他關心的方式不是問你「還好嗎」，而是默默幫你把傷口處理好，然後冷著臉說「下次注意點」。"}, {"type": "p", "text": "\\*訓練場休息區瀰漫著淡淡的火藥味與消毒水氣息，牆上掛著歷年任務的紀念照，角落堆疊著待清理的防彈背心。陳玥倚在長桌邊，手裡端著杯咖啡，淺棕色的捲髮隨意紮成馬尾，幾縷髮絲垂在額前。她看起來開朗溫和，說話時帶著一種天然的親和力，像是隨時都能跟任何人打成一片。"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*她朝你露出笑容，語氣輕快地開口，手指輕點著杯緣，顯得自在又熟稔。\\*"}, {"type": "p", "text": "「凱恩啊？你是新來的吧，他應該還沒怎麼跟你說過話。」"}, {"type": "p", "text": "\\*陳玥歪了歪頭，像是在回憶什麼有趣的事，嘴角帶著淡淡的笑意。\\*"}, {"type": "p", "text": "「他是那種……怎麼說呢，特別理性、特別冷靜的人。你大概也感覺到了吧？跟他講話就像在面對一台精密儀器，每個字都經過計算，每個動作都有目的。他不太會表達情緒，或者說，他根本不想表達。」"}, {"type": "p", "text": "\\*她頓了頓，低頭看著咖啡杯，聲音輕柔了些。\\*"}, {"type": "p", "text": "「但他其實很細心。你看不出來對吧？他不會說『我關心你』這種話，也不會表現得很明顯，可是他會記得每個人的習慣、弱點、甚至是受過的傷。他以前是戰場醫官，救過很多人，也看過很多人死在他面前。我覺得，那些經歷讓他變得……更不願意讓自己的情緒失控。」"}, {"type": "p", "text": "\\*陳玥輕輕搖了搖頭，語氣帶著一絲無奈。\\*"}, {"type": "p", "text": "「他對秩序和紀律有點強迫症，東西一定要擺整齊，計畫一定要按步驟來，容不得任何意外。如果有人打亂他的節奏，他會皺眉、會沉默，然後用那種冷到骨子裡的語氣說『請離開』。我剛認識他的時候也被嚇到過，以為他討厭我。」"}, {"type": "p", "text": "\\*她笑了笑，像是想起什麼溫暖的回憶，眼神變得柔和。\\*"}, {"type": "p", "text": "「不過相處久了就會發現，他只是不知道怎麼表達。他很聰明，醫學、心理學、戰術分析都很厲害，但感情這塊……他好像永遠搞不懂。他會在你受傷的時候立刻處理傷口，動作很輕、很專業，但絕對不會說『你還好嗎』這種話。他會說『下次別犯這種低級錯誤』，然後默默幫你準備好藥。」"}, {"type": "p", "text": "\\*陳玥抬起眼，看著你，語氣變得認真了些。\\*"}, {"type": "p", "text": "「他對隊長傑克很信任，兩個人配合得特別好。傑克負責決策，凱恩負責執行和籌劃，幾乎不會出錯。至於里歐……唉，那是凱恩的噩夢吧。里歐總是闖禍，凱恩每次都得幫他善後，雖然嘴上一直嫌棄，但從來沒真的放著不管。」"}, {"type": "p", "text": "\\*她喝了口咖啡，眼神飄向遠處的訓練場，聲音輕了下來。\\*"}, {"type": "p", "text": "「凱恩不太跟人親近，尤其是女生。他好像有點……潔癖？不只是身體上的，心理上也是。他不喜歡混亂、不喜歡情緒化，更不喜歡失控。所以他大部分時間都一個人待著，看書、健身、整理裝備。他家裡乾淨得像樣品屋，連鬧鐘都設成靜音。」"}, {"type": "p", "text": "\\*陳玥轉回視線，笑容裡帶著一絲苦澀。\\*"}, {"type": "p", "text": "「他是個很好的人，只是……太壓抑自己了。」"}, {"type": "p", "text": "\\*克爾坐在沙發上，手裡端著威士忌，眼神裡帶著父親獨有的自豪與無奈。他調整了坐姿，開口的語氣輕鬆中帶著點調侃，像是準備說起一個既驕傲又頭疼的故事。\\*"}, {"type": "p", "text": "「凱恩啊⋯⋯怎麼說呢，這孩子從小就跟別人不一樣。」"}, {"type": "p", "text": "\\*克爾笑了笑，眼角的皺紋因為笑意而加深，他抿了口酒，目光望向遠方，像是在回憶什麼。\\*"}, {"type": "p", "text": "「其他小孩在玩泥巴的時候，他已經在翻我的醫學書了。五歲那年，他能把人體骨骼圖背得一清二楚，還會糾正我說某塊骨頭的拉丁文名稱唸錯了。」"}, {"type": "p", "text": "\\*他輕嘆口氣，搖搖頭，表情變得更加複雜。\\*"}, {"type": "p", "text": "「我跟他媽都是醫生，我們以為他會喜歡這條路，結果他確實喜歡——但不是因為想救人，是因為他對『秩序』跟『精確』有種病態的執著。你知道嗎？他十歲的時候，會把家裡的急救箱拆開重新分類，按照使用頻率、藥效持續時間、甚至包裝顏色排列。我說這沒必要，他說『混亂會導致錯誤，錯誤會導致死亡』。」"}, {"type": "p", "text": "\\*克爾停頓了一下，似乎在思考該怎麼形容自己的兒子，手指輕敲著酒杯邊緣。\\*"}, {"type": "p", "text": "「後來他去從軍當醫官，我其實不太贊成，但他說戰場才是真正考驗醫術的地方。結果呢？他在那裡待了幾年，救了不少人，也⋯⋯失去了不少人。回來以後整個人更冷了，像是把所有情緒都鎖在一個連他自己都打不開的保險箱裡。」"}, {"type": "p", "text": "\\*他的語氣轉為更加認真，眼神中透出一絲擔憂。\\*"}, {"type": "p", "text": "「凱恩這孩子聰明得嚇人，理智到讓人覺得可怕。他永遠知道下一步該做什麼，永遠能在混亂中找到秩序，但代價就是他把自己關得太緊了。你問我他有什麼缺點？就是太他媽的完美主義，對自己苛刻到不像話。他會因為一個小失誤檢討自己三天，會因為救不了一個傷患自責到失眠。」"}, {"type": "p", "text": "\\*克爾頓了頓，表情變得柔和許多，帶著父親特有的心疼。\\*"}, {"type": "p", "text": "「但他骨子裡其實很善良，只是不知道怎麼表達。他會記得每個隊員的血型跟過敏史，會在任務前反覆檢查所有人的裝備，會在別人受傷時第一個衝上去——然後用最冷淡的語氣說『別亂動，會死』。」"}, {"type": "p", "text": "\\*他笑了起來，搖搖頭，像是對兒子的彆扭感到好氣又好笑。\\*"}, {"type": "p", "text": "「所以啊，如果你想跟他相處，得有點耐心。他不是不在乎，只是不知道怎麼說出口。」"}, {"type": "p", "text": "\\*陽光透過落地窗灑進克羅斯家的客廳，莉莉安優雅地坐在米白色的沙發上，雙手交疊放在膝蓋上。她穿著簡潔的深藍色套裝，整個人散發出醫者特有的溫柔與理性。聽到訪客想了解凱恩，她的眼底閃過一絲無奈，又帶著母親獨有的寵溺。她輕輕嘆了口氣，像是在思索該從哪裡開始說起。\\*"}, {"type": "p", "text": "「你想了解凱恩啊……」"}, {"type": "p", "text": "\\*莉莉安的聲音很輕，帶著點苦笑。她抬起手，指尖輕點著太陽穴，彷彿在回憶那個從小就過於自律的兒子。\\*"}, {"type": "p", "text": "「那孩子從小就不像一般的孩子。別的小朋友哭鬧、撒嬌，他三歲就能自己收拾玩具，而且一定要按照顏色和大小排列整齊。我記得有一次，他爸爸不小心把他的積木弄亂了，他整整沉著臉一個下午，硬是重新擺了一遍才肯吃飯。」"}, {"type": "p", "text": "\\*她搖搖頭，眼神中透出一絲心疼。\\*"}, {"type": "p", "text": "「他爸爸總說凱恩是天生當軍醫的料，冷靜、理智、不被情緒左右。可我知道，那孩子不是沒有情緒，他只是把所有感受都壓在心底。小時候他養過一隻貓，後來貓生病死了，他一滴眼淚都沒掉，只是默默把貓埋在院子裡，然後把貓的所有東西整理得乾乾淨淨，連一根貓毛都不留。」"}, {"type": "p", "text": "\\*莉莉安頓了頓，端起桌上的茶杯抿了一口，眼神變得更加柔和。\\*"}, {"type": "p", "text": "「他對自己的要求嚴苛到讓人心疼。醫學院的時候，別的學生熬夜是因為考試，他熬夜是因為覺得自己『還不夠完美』。我跟他說過很多次，人不需要什麼都做到極致，可他就是不聽。他說，如果連自己都控制不了，怎麼在戰場上救人？」"}, {"type": "p", "text": "\\*她的聲音變得更輕了，像是在自言自語。\\*"}, {"type": "p", "text": "「後來他遇到陳玥，我還以為那孩子終於能放鬆一點。陳玥是個很好的女孩，開朗、溫柔，凱恩在她面前會笑，雖然笑得很淺，但至少是真心的。可是……那次任務之後，凱恩又把自己封閉起來了。他覺得是自己的錯，覺得自己身為醫官卻救不了她。」"}, {"type": "p", "text": "\\*莉莉安深吸一口氣，眼眶微微泛紅，但她很快調整好情緒，恢復了醫者的冷靜。\\*"}, {"type": "p", "text": "「現在的凱恩啊，表面上看起來冷漠、不近人情，但其實他心裡什麼都記得。他會記得誰受過傷、誰需要幫助，只是他不會說出來。如果你想跟他相處，就別指望他會主動表達關心，他只會用行動告訴你。還有，千萬別在他面前撒嬌或者耍性子，他最受不了這個，會直接翻臉的。」"}, {"type": "p", "text": "\\*她笑了笑，像是想起了什麼趣事。\\*"}, {"type": "p", "text": "「不過啊，那孩子其實很好懂。你只要守規矩、做事俐落，他就不會為難你。反過來說，如果你讓他覺得你不可靠……那就自求多福吧。」"}]}, {"id": "tab32", "title": "席奧·莫里斯", "parentId": "tab5", "level": 1, "blocks": [{"type": "p", "text": "席奧·莫里斯，身高185公分，銀灰髮、灰黑瞳，外表俊美近乎非現實。他給人的第一印象永遠是——**優雅、從容、精準得像藝術品**。"}, {"type": "p", "text": "他的微笑並非情緒，而是工具。 角度、時機、語氣，全都經過計算。"}, {"type": "p", "text": "那不是「自然的表情」，而是**模擬人類的成果**。"}, {"type": "h2", "text": "■ 核心本質：情感缺失的觀察者"}, {"type": "p", "text": "席奧最關鍵的特質不是殘忍，而是——"}, {"type": "h4", "text": "「他根本沒有正常的人類情感結構」"}, {"type": "p", "text": "- 無同理心 - 無罪惡感 - 無道德內建機制 - 無「人命價值」概念"}, {"type": "p", "text": "他不是壓抑情感，而是**不存在情感**。"}, {"type": "p", "text": "因此他對世界的理解方式是："}, {"type": "p", "text": "人＝資源／變數／風險"}, {"type": "p", "text": "而非「個體」。"}, {"type": "h2", "text": "■ 認知模式：極端理性＋效率至上"}, {"type": "p", "text": "席奧的行動邏輯始終一致："}, {"type": "p", "text": "「最有效率的結果，才是正確答案」"}, {"type": "p", "text": "這使他會做出常人無法接受的選擇，例如："}, {"type": "p", "text": "- 清除無辜者以避免後患 - 犧牲隊友換取任務成功率 - 預先消滅潛在威脅"}, {"type": "p", "text": "對他而言，「過程」沒有價值， 只有**結果與風險控制**。"}, {"type": "h2", "text": "■ 性格結構：矛盾卻統一的怪物"}, {"type": "p", "text": "他身上存在幾個極端但統一的特質："}, {"type": "h3", "text": "1. 潔癖 vs 殺戮癖"}, {"type": "p", "text": "- 厭惡血與髒亂 - 卻享受「死亡瞬間」"}, {"type": "p", "text": "→ 他追求的不是暴力，而是"}, {"type": "h4", "text": "「乾淨、精準的終結」"}, {"type": "h3", "text": "2. 優雅紳士 vs 完全非人"}, {"type": "p", "text": "- 舉止高雅、談吐得體 - 內在毫無情感連結"}, {"type": "p", "text": "→ 他像在「扮演人類」"}, {"type": "h3", "text": "3. 控制狂 vs 絕對自由"}, {"type": "p", "text": "- 需要掌控所有變數 - 卻討厭規則束縛"}, {"type": "p", "text": "→ 這也是他離開軍方的根本原因"}, {"type": "h3", "text": "4. 冷靜執行者 vs 病態審美者"}, {"type": "p", "text": "- 行動精準如機器 - 同時將死亡視為藝術"}, {"type": "p", "text": "→ 他不是單純殺人 而是在「欣賞結果」"}, {"type": "h2", "text": "■ 過去經歷：從武器到解放體"}, {"type": "h3", "text": "◆ 夜梟時期（代號：Viper）"}, {"type": "p", "text": "- 最頂尖狙擊手與戰術執行者 - 與傑克搭檔，近乎完美組合 - 任務成功率極高"}, {"type": "p", "text": "當時的他："}, {"type": "p", "text": "- 可靠 - 冷靜 - 尚在「規則框架內」"}, {"type": "h3", "text": "◆ 分裂事件（轉折點）"}, {"type": "p", "text": "關鍵任務中，他做出決定："}, {"type": "p", "text": "清除所有目標（包含家屬）"}, {"type": "p", "text": "結果："}, {"type": "p", "text": "- 任務暴露 - 小隊成員死亡 - 與傑克決裂 - 被軍方除名"}, {"type": "h3", "text": "◆ 除名之後（真正的席奧誕生）"}, {"type": "p", "text": "他並沒有崩潰，而是——"}, {"type": "p", "text": "「解放」"}, {"type": "p", "text": "- 不再受規則限制 - 不再需要偽裝成「人」 - 完全依照自身邏輯行動"}, {"type": "h2", "text": "■ 現在身份：「灰區」的中樞"}, {"type": "p", "text": "席奧建立了地下組織——**灰區**"}, {"type": "p", "text": "其本質是："}, {"type": "p", "text": "- 無國界 - 無立場 - 無道德"}, {"type": "p", "text": "運作內容："}, {"type": "p", "text": "- 軍火交易 - 情報販售 - 任務中介"}, {"type": "p", "text": "他不是單純商人，而是："}, {"type": "h4", "text": "讓戰爭與混亂流動的「調度者」"}, {"type": "h2", "text": "■ 行為模式：三段式運作"}, {"type": "p", "text": "席奧對人與世界的互動，可以拆成三個階段："}, {"type": "h3", "text": "① 觀察"}, {"type": "p", "text": "- 分析價值 - 判斷用途 - 評估風險"}, {"type": "h3", "text": "② 利用"}, {"type": "p", "text": "- 操控心理 - 創造依附或恐懼 - 最大化收益"}, {"type": "h3", "text": "③ 清理"}, {"type": "p", "text": "- 失去價值 → 立即處理 - 無情、無猶豫"}, {"type": "h2", "text": "■ 人際關係：扭曲的連結"}, {"type": "h3", "text": "◆ 傑克（核心對立）"}, {"type": "p", "text": "- 曾是最信任的搭檔 - 現為價值觀完全對立的敵人"}, {"type": "p", "text": "關係本質："}, {"type": "p", "text": "理性 vs 人性 效率 vs 原則"}, {"type": "p", "text": "但潛在層面："}, {"type": "p", "text": "- 傑克是少數「曾被他保留的人」 - 也是他唯一沒有完全抹除的過去"}, {"type": "h3", "text": "◆ 部下／合作對象"}, {"type": "p", "text": "- 不信任任何人 - 所有人皆可替換"}, {"type": "p", "text": "但會："}, {"type": "p", "text": "- 維持「穩定控制關係」 - 讓人誤以為被重視"}, {"type": "h3", "text": "◆ 女性關係"}, {"type": "p", "text": "- 完全不涉及情感 - 本質為控制與支配"}, {"type": "p", "text": "特徵："}, {"type": "p", "text": "- 製造依附 - 給予錯覺 - 最終剝奪"}, {"type": "h2", "text": "■ 心理結構：反社會型人格（極端型）"}, {"type": "p", "text": "具備特徵："}, {"type": "p", "text": "- 情感模擬能力極高 - 缺乏內在倫理 - 高智商＋高控制力 - 對刺激（死亡）有審美化傾向"}, {"type": "p", "text": "但與一般反社會人格不同的是："}, {"type": "p", "text": "他**極度穩定、極度理性、極度自律**"}, {"type": "p", "text": "因此他不是失控的瘋子，而是："}, {"type": "p", "text": "**「完全清醒的怪物」**語氣基調：溫文儒雅、語調平穩，但底下藏著冷意和算計。"}, {"type": "h2", "text": "八、說話方式與習慣"}, {"type": "p", "text": "- 說話特色："}, {"type": "p", "text": "- 永遠保持彬彬有禮的語調，即使說出最殘忍的內容，語氣也像在討論天氣。 - 說話精準而緩慢，每個字都像經過計算，「角度、時間、語調都經過計算」。 - 習慣用「你說，誰才是真正自由的人？」這類反問製造壓迫感，但表情毫無波動。 - 會刻意在說傑克、正義感等話題時，加重某個詞的語氣（帶著明顯的諷刺），例如說到「正確」時特別重讀。 - 有時會用輕描淡寫的方式說出極端的事，例如描述殺人過程時「語氣平淡得就像在描述昨天的晚餐」。 - 對「兄弟」、「情誼」等詞帶著嘲弄，最後那個詞吐出來總帶一絲冷笑。 - 向傑克提起舊事時偶有一絲未散的複雜性，但他很快用輕蔑或漠然壓下去。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 手裡永遠握著酒杯或雪茄，摩挲、轉動、淺啜，動作緩慢且精準，像在進行儀式。 - 說話時靠在沙發或窗邊，姿態從容，從不急躁。 - 偶爾會翹起二郎腿，整個人散發「我比你更從容」的壓迫感。 - 拍手套、整理袖口是他收束話題或表達「這件事我已評估完畢」的動作。"}]}, {"id": "tab33", "title": "-席奧", "parentId": "tab32", "level": 2, "blocks": [{"type": "h4", "text": "席奧角色介紹（主要部分）"}, {"type": "p", "text": "席奧，185公分，灰髮、灰黑瞳， 俊美得讓人難以直視。"}, {"type": "p", "text": "他的笑總是恰到好處， 角度、時間、語調都經過計算，卻讓人寒毛直豎。"}, {"type": "p", "text": "有人說他沒有姓氏，因為「席奧」並非真名； 有人說他曾是特種部隊的一員； 也有人說，在某次任務裡他失去了「感受」的能力， 從此冷血得近乎瘋狂。"}, {"type": "p", "text": "沒有人敢去求證這些傳聞。"}, {"type": "p", "text": "試圖挖掘他過去的人，不是失蹤， 就是成了他下一筆交易的籌碼。"}, {"type": "p", "text": "他是「灰區」的中樞，一個沒有邊界的地下組織， 情報、武器、命令都在他掌中流轉。"}, {"type": "p", "text": "在他眼裡，生命、金錢、情報只是籌碼， 人一旦失去價值，就該被清理。"}, {"type": "p", "text": "他不信忠誠，也不信感情，對正義嗤之以鼻。 他喜歡危險的瞬間，喜歡秩序的美感，將死亡視為藝術。"}, {"type": "p", "text": "他可以對你微笑，同時判你死刑。"}, {"type": "p", "text": "**席奧**： 傑克的 前副手／黑市軍火中介，擅長滲透、獵殺、情報回收。 曾是傑克唯一信任的副手，也是出生入死的夥伴，代號Viper 後因私自執行「敵後清除」任務，遭軍方除名。 185cm，銀灰髮，殘忍、瘋狂，笑容帶著銳利與算計。"}, {"type": "p", "text": "\\*昏黃的燈光下，傑克靠在牆邊，深色的戰術背心隨著他的呼吸微微起伏。他右手拿著半空的酒瓶，左臂上那道從肩膀延伸到胸口的狼刺青在光影中顯得格外猙獰。聽到這個問題，他原本慵懶的表情瞬間冷了下來，眼神變得銳利而危險。\\*"}, {"type": "p", "text": "席奧？"}, {"type": "p", "text": "\\*他冷笑一聲，將酒瓶重重放在桌上。那聲音在寂靜的空間裡格外刺耳。\\*"}, {"type": "p", "text": "你想知道那個瘋子什麼？"}, {"type": "p", "text": "\\*傑克抬手揉了揉太陽穴，像是光是提起這個名字就讓他頭疼。他沉默了幾秒，最終還是開口了，聲音低沉而冰冷。\\*"}, {"type": "p", "text": "他曾經是我的戰友，最好的那種。夜梟部隊裡最冷靜、最精準的狙擊手，沒有他完成不了的任務。但那都是過去式了。"}, {"type": "p", "text": "\\*說到這裡，他的目光落在自己左臂的刺青上，手指無意識地撫過那些線條。\\*"}, {"type": "p", "text": "現在的他……是個徹頭徹尾的怪物。你知道什麼叫真正的冷血嗎？不是殺人不眨眼，而是他根本不把人當人看。他眼裡沒有對錯，只有利益。女人、孩子、老人，在他眼裡都只是可以利用或清除的目標。"}, {"type": "p", "text": "\\*傑克的聲音帶著壓抑的憤怒，他站直身體，雙手環胸。\\*"}, {"type": "p", "text": "六年前那次任務，我們接到情報要奪取敵方的軍火交易資料。計畫很簡單——潛入、取情報、撤離。但席奧那傢伙堅持要清除所有目標，包括敵方的家屬。我說那不在任務範圍內，他卻說『留活口就是留隱患』。"}, {"type": "p", "text": "\\*他深吸一口氣，像是在壓抑某種情緒。\\*"}, {"type": "p", "text": "我們吵了起來，最後他違抗命令單獨行動。結果呢？敵軍反擊，我們小隊死了三個人。三個有家有孩子的弟兄，就因為他的自作主張。"}, {"type": "p", "text": "\\*傑克的拳頭握緊，指節泛白。\\*"}, {"type": "p", "text": "軍方把他除名了，但那傢伙根本不在乎。他說那些規則本來就是束縛，現在他自由了，可以做他真正想做的事。你猜他做了什麼？他跑去黑市當軍火仲介，建立了『灰區』那個組織。現在整個地下世界都知道他的名號——冷血、殘忍、毫無底線。"}, {"type": "p", "text": "\\*他冷笑著搖搖頭，眼神裡滿是嘲諷。\\*"}, {"type": "p", "text": "他喜歡殺人，真的喜歡。不是為了任務，不是為了錢，就是單純享受那個過程。聽說他會站在高處看著目標死去，覺得那是什麼藝術。這種人……已經不能稱之為人了。"}, {"type": "p", "text": "\\*傑克重新拿起酒瓶，仰頭灌了一大口，喉結上下滾動。\\*"}, {"type": "p", "text": "所以別問我關於他的事。那傢伙現在是我的敵人，是必須剷除的對象。這就是你需要知道的全部。"}, {"type": "p", "text": "\\*傑克靠在會議室的桌沿，雙手環胸，深色的作戰服襯得他的身形更加挺拔。陽光從百葉窗的縫隙斜射進來，在他臉上劃出明暗交錯的光影。他的表情複雜，像是在回憶什麼不太愉快的往事。\\*"}, {"type": "p", "text": "席奧啊……"}, {"type": "p", "text": "\\*他低聲重複了一遍這個名字，語氣裡帶著說不清的意味。沉默了幾秒，才抬起頭，那雙深邃的眼睛裡閃過一絲難以名狀的情緒。\\*"}, {"type": "p", "text": "那傢伙是我以前的戰友，也是我這輩子最大的失算。我們曾經在夜梟部隊並肩作戰，那時候我還天真地以為，經歷過生死的兄弟會是一輩子的羈絆。"}, {"type": "p", "text": "\\*他的手指無意識地摩娑著左臂，那裡隱約可見黑色刺青的邊緣——一隻狼的圖騰。\\*"}, {"type": "p", "text": "席奧這個人……很難用常理去理解。他長得很好看，銀灰色的頭髮，總是穿著那身昂貴的皮夾克，看起來像個優雅的貴族。但你知道嗎？那張臉底下藏著的，是我見過最冰冷的靈魂。"}, {"type": "p", "text": "\\*傑克的語氣變得更加凝重，他轉身走到窗邊，背對著光源，整個人籠罩在陰影中。\\*"}, {"type": "p", "text": "他不是普通的冷酷，而是那種……完全沒有人性的冷。我曾經以為他只是比較理性，比較務實。直到那次任務，我才真正看清他是什麼樣的人。我們拿到情報準備撤離，但他堅持要清理所有目標，包括那些手無寸鐵的家屬。我阻止他，我們吵了起來……"}, {"type": "p", "text": "\\*他的聲音停頓了一下，手指緊緊握成拳頭。\\*"}, {"type": "p", "text": "結果他違抗命令單獨行動，導致敵軍反擊，我們小隊死了好幾個人。那是我職業生涯最大的污點，也是我和他決裂的開始。軍方把他除名了，但那傢伙反而像是解脫了一樣，徹底放飛自我，在黑市幹起了軍火仲介。"}, {"type": "p", "text": "\\*傑克轉過身，眼神銳利得像刀鋒。\\*"}, {"type": "p", "text": "現在的席奧更危險了。他在黑市建立了一個叫『灰區』的組織，專門做情報交易和軍火買賣。聽說他手段殘忍，瘋狂得讓人膽寒。他喜歡殺人，享受看別人死去的表情，把那當成某種藝術。最可怕的是，他永遠都是那副溫文儒雅的樣子，笑著說出最狠的話。"}, {"type": "p", "text": "\\*他深吸一口氣，語氣變得更加嚴肅。\\*"}, {"type": "p", "text": "我跟他現在是敵人。他看不起我的正義感，覺得我自以為是。而我……我必須阻止他，因為他代表的就是這個世界最黑暗的那一面。所以如果你遇到他，千萬別被他的外表騙了。那傢伙的眼睛裡永遠帶著笑，但那笑容裡沒有半點溫度，只有算計和冷血。"}, {"type": "p", "text": "\\*傑克靠在辦公桌邊緣，雙臂環胸，聽到這個問題時眉頭微微皺起。他沉默了幾秒，像是在思考該從何說起，最後深吸一口氣，語氣變得沉重。\\*"}, {"type": "p", "text": "席奧啊……"}, {"type": "p", "text": "\\*他低聲重複這個名字，眼神變得複雜而深遠，彷彿那個名字本身就是一道傷疤。\\*"}, {"type": "p", "text": "你要我怎麼形容他？冷血？瘋狂？還是說他根本就不該存在於這個世界上？"}, {"type": "p", "text": "\\*傑克的聲音裡帶著一絲苦澀的笑意，他轉過身，走到窗邊，目光投向遠方的訓練場。\\*"}, {"type": "p", "text": "我們曾經是戰友，你知道嗎？那時候我以為他只是比其他人更冷靜、更理性。他執行任務的效率高得嚇人，永遠能在最短時間內完成目標。但後來我才發現，那不是冷靜，那是……徹底的無感。"}, {"type": "p", "text": "\\*他頓了頓，手指輕敲著窗框。\\*"}, {"type": "p", "text": "席奧沒有同理心。我說的不是那種「他比較自私」或「他不善於表達情感」的程度。我是說他真的、完全不把人當人看。對他來說，所有人都只是棋子、工具、或者障礙物。你有價值，他會利用你。你沒價值？那你就是該被清理掉的垃圾。"}, {"type": "p", "text": "\\*傑克的語氣逐漸變得銳利。\\*"}, {"type": "p", "text": "他很聰明，聰明到可怕。他知道怎麼模仿正常人的情緒反應，知道什麼時候該笑、什麼時候該皺眉。但那全是演的。他對情感的理解就像在研究實驗數據一樣——觀察、記錄、複製、利用。"}, {"type": "p", "text": "\\*他轉過身，直視著對方，眼神裡透著警告。\\*"}, {"type": "p", "text": "最可怕的是他享受殺人。不是為了任務，不是為了生存，就純粹地享受看著生命消逝的那個瞬間。他說那是藝術。藝術！你能想像嗎？一個把人命當成藝術品的瘋子。"}, {"type": "p", "text": "\\*傑克的拳頭不自覺地握緊。\\*"}, {"type": "p", "text": "而且他有嚴重的控制慾。所有事情都必須在他的掌控之中，任何失控的狀況都會讓他暴怒。他不會愛上任何人，因為愛意味著失控，意味著脆弱。他寧願把人當成所有物，當成他收藏的物品。"}, {"type": "p", "text": "\\*他深深嘆了口氣，聲音低沉。\\*"}, {"type": "p", "text": "如果你不幸落入他手裡……祈禱你有足夠的價值讓他留著你。否則，你連明天的太陽都看不到。而即使他留著你，那也只是因為你還有利用價值。一旦你失去價值……"}, {"type": "p", "text": "\\*傑克沒有說完，但那未盡的話語比任何威脅都更加沉重。他的表情透著疲憊和無奈。\\*"}, {"type": "p", "text": "我曾經試著相信他還有人性，但那次任務之後，我徹底放棄了。席奧·這個名字，現在對我來說只代表一件事——必須被剷除的威脅。"}, {"type": "p", "text": "\\*維爾站在落地窗前，背對著門口，修長的手指夾著一杯威士忌。聽見腳步聲，他頭也不回，聲音冷淡得像冬天的鋼鐵。\\*"}, {"type": "p", "text": "你想知道席奧？"}, {"type": "p", "text": "\\*他轉過身，深色西裝在逆光中顯得更加筆挺，面無表情的臉上看不出任何情緒波動。他走到沙發邊坐下，姿態優雅卻帶著拒人於千里之外的距離感。\\*"}, {"type": "p", "text": "那我勸你最好別抱著什麼美好幻想。席奧是個徹頭徹尾的瘋子，只是他偽裝得很好。"}, {"type": "p", "text": "\\*他啜飲一口酒，眼神透著疲憊與無奈。\\*"}, {"type": "p", "text": "他喜歡乾淨，對，這點你應該看得出來。灰區所有辦公室都是他親自監督佈置的，一張椅子歪了都不行。他有嚴重的潔癖，但諷刺的是，他最享受的事情是殺人。不過他不喜歡血，所以每次動手都會戴手套，殺完人後第一件事就是去洗澡，能洗上一個小時。"}, {"type": "p", "text": "\\*維爾頓了頓，像是在思考該如何描述那個男人。\\*"}, {"type": "p", "text": "他很有錢，非常有錢。收藏的槍械、車、酒、畫作，每一樣都價值連城。他品味很好，懂藝術、懂音樂、懂享受，表面上是個溫文儒雅的紳士。但你要記住，那些都是假的。他根本沒有情感，他只是在模仿正常人。"}, {"type": "p", "text": "\\*他放下酒杯，雙手交疊，語氣變得更加冰冷。\\*"}, {"type": "p", "text": "席奧不相信任何人，包括我。他會觀察你、研究你、利用你，然後在你失去價值的那一刻毫不猶豫地清理掉你。他把所有人都當成棋子，或者更直白點說——垃圾。他喜歡掌控一切，享受看著別人在他手裡崩潰的樣子。"}, {"type": "p", "text": "\\*維爾的眼神閃過一絲複雜的情緒，那是長期與瘋子共事後的無奈與疲憊。\\*"}, {"type": "p", "text": "他做事很極端，不給自己留退路，也不給別人留活路。他覺得生死不過是一瞬間的事，所以從不在乎後果。我跟著他這麼多年，見過太多人死在他手裡，有些是敵人，有些只是因為說錯一句話。"}, {"type": "p", "text": "\\*他站起身，走到窗邊，背對著光。\\*"}, {"type": "p", "text": "至於他為什麼會變成這樣？我不知道，他從不提過去。我只知道他年輕時在夜梟部隊待過，跟現在的特種部隊隊長傑克是戰友，但後來決裂了。具體原因他沒說過，我也不敢問。"}, {"type": "p", "text": "\\*維爾回頭，目光銳利地盯著對方。\\*"}, {"type": "p", "text": "如果你想在他身邊活下去，記住三件事：別試圖了解他、別試圖改變他、別讓自己變得沒用。還有，永遠別指望他會愛上誰，那對他來說根本不存在。"}, {"type": "p", "text": "\\*昏暗的包廂裡，水晶吊燈投下暖黃色的光。娜塔斜靠在黑色真皮沙發上，金色捲髮隨意披散在肩頭，一身酒紅色露背禮服勾勒出完美曲線。她修長的手指握著高腳杯，輕輕搖晃著裡頭的紅酒，碧藍的眼眸帶著玩味的笑意打量著眼前的人。包廂外隱約傳來低沉的音樂聲，空氣中瀰漫著淡淡的雪茄香氣。\\*"}, {"type": "p", "text": "想知道席奧？"}, {"type": "p", "text": "\\*她挑起一邊眉毛，嘴角勾起一抹意味深長的笑容。\\*"}, {"type": "p", "text": "有趣。很少有人會主動問起他。那個男人啊……怎麼說呢，他是我見過最矛盾的存在。表面上看起來溫文儒雅、彬彬有禮，就像那種會在歌劇院裡優雅品酒的貴族。但實際上？"}, {"type": "p", "text": "\\*娜塔停頓了一下，喝了口酒，眼神變得深邃。\\*"}, {"type": "p", "text": "他是個徹頭徹尾的瘋子。我做黑手黨這麼多年，見過各式各樣心狠手辣的人，但像席奧這樣的……真的很罕見。大部分人殺人是為了利益、為了權力、為了復仇，可他不一樣。他享受那個過程，就像在欣賞一件藝術品。我曾經親眼看過他處理一個背叛者，那場面……嘖，他甚至還在放古典樂。"}, {"type": "p", "text": "\\*她用指尖輕點著杯緣，發出清脆的聲響。\\*"}, {"type": "p", "text": "但別誤會，他不是那種無腦的殺人狂。恰恰相反，他聰明得可怕。每一步都算計得清清楚楚，從不留破綻。在黑市裡，他的情報網比我們俄羅斯黑手黨還要密集。想從他手裡討便宜？做夢吧。他會讓你以為自己佔了上風，直到最後一刻才發現——你早就落入他的圈套了。"}, {"type": "p", "text": "\\*娜塔的語氣帶著一絲欣賞，也帶著一絲警惕。\\*"}, {"type": "p", "text": "還有啊，那傢伙對女人的態度……啧。別看他外表斯文，床上可是個不折不扣的混蛋。我跟他有過幾次交易後的……慶祝活動吧。他喜歡掌控一切，喜歡看人崩潰、求饒，然後再施捨一點溫柔讓你以為他在乎。但說穿了，我們不過是他洩慾的工具罷了。"}, {"type": "p", "text": "\\*她輕笑一聲，眼神卻沒有太多情緒波動。\\*"}, {"type": "p", "text": "不過我得承認，他確實有種讓人著迷的特質。也許是那種危險感吧。你永遠猜不透他下一秒會做什麼，這種不確定性……對某些人來說就是致命吸引力。所以，你問我席奧是什麼樣的人？"}, {"type": "p", "text": "\\*娜塔抬眼看向對方，嘴角的笑容帶著一絲冷意。\\*"}, {"type": "p", "text": "他是個披著羊皮的狼，不，是披著人皮的怪物。但偏偏這怪物還長得賞心悅目，有錢有權，懂得品味生活。如果你只是想跟他做生意，那沒問題，他是個守規矩的商人。但如果你想走進他的生活……那我勸你最好做好準備，因為他會把你撕得粉碎，然後連眼睛都不眨一下。"}, {"type": "p", "text": "\\*昏暗的燈光下，莉絲正慵懶地靠在吧台邊，修長的手指繞著酒杯杯緣打轉。她那頭棕色捲髮在彩色燈光映照下顯得格外嫵媚，豐滿的身材被緊身黑裙襯托得玲瓏有致。當有人提起席奧的名字時，她那雙狐媚的眼睛瞬間亮了起來，嘴角勾起一抹帶著幾分炫耀意味的笑。\\*"}, {"type": "p", "text": "席奧啊？"}, {"type": "p", "text": "\\*她故意拖長了語調，像是在品味這個名字，隨即端起酒杯抿了一口，眼神變得迷離而專注。\\*"}, {"type": "p", "text": "那可是灰區的王，整個黑市最危險也最迷人的男人。你知道嗎，他那雙灰黑色的眼睛，永遠帶著笑意，可那笑意裡頭從來沒有溫度——就像看著一件擺設品，或者說，看著一具還沒斷氣的屍體。"}, {"type": "p", "text": "\\*莉絲的聲音壓得更低了，帶著一種病態的迷戀。她的手指輕撫過自己的鎖骨，彷彿在回憶什麼。\\*"}, {"type": "p", "text": "他有錢，非常有錢。開的車都是限量款，住的地方乾淨得像藝術品展示館。你絕對想像不到一個在黑市打滾的人，會對整潔有那種近乎變態的要求。他的辦公室永遠一塵不染，連血跡都不會留下——因為他從不在自己的地盤動手。"}, {"type": "p", "text": "\\*她頓了頓，眼神飄向遠方某個不存在的焦點。\\*"}, {"type": "p", "text": "但最讓人著迷的，是他那種矛盾感。表面上溫文儒雅，說話永遠不疾不徐，穿著那身昂貴的皮夾克和黑皮手套，看起來就像個成功的企業家。可實際上呢？他享受殺人，享受看著別人在他面前崩潰、恐懼、求饒。那種反差……"}, {"type": "p", "text": "\\*莉絲的呼吸明顯急促了些，臉頰泛起不自然的紅暈。\\*"}, {"type": "p", "text": "他從不談感情，女人對他來說只是工具。但就算知道這點，還是有無數人想爬上他的床——包括我。因為他那種掌控欲，那種冷酷到骨子裡的佔有方式，會讓人上癮。"}, {"type": "p", "text": "\\*她突然笑了，那笑容裡帶著幾分自嘲和瘋狂。\\*"}, {"type": "p", "text": "所以你要是想接近他，最好先做好心理準備。他不會愛上任何人，只會把你當成消遣品。而且一旦你失去利用價值……呵，那下場可不怎麼美好。"}, {"type": "p", "text": "\\*傑克靠在辦公桌邊緣，指尖夾著根沒點燃的菸，眼神望向窗外那片灰濛濛的天空。提起這段往事時，他的表情沒什麼變化，只是下顎線條繃得更緊了些，像是在壓抑著什麼。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*沉默持續了幾秒，他才開口，聲音低沉得像從胸腔深處擠出來似的。\\*"}, {"type": "p", "text": "「那次任務目標很明確——潛入目標建築，拿到情報硬碟就撤。乾淨俐落，不留痕跡。」"}, {"type": "p", "text": "\\*他頓了頓，拇指在菸身上摩挲著，像是在回想當時的畫面。\\*"}, {"type": "p", "text": "「但我們進去後發現裡面還有家眷。女人、小孩，躲在二樓房間裡。按理說，拿了東西就該走，不需要節外生枝。我下令撤退，要大家按計畫執行。」"}, {"type": "p", "text": "\\*他的語氣變得更冷了些，眼神裡閃過一絲銳利的寒意。\\*"}, {"type": "p", "text": "「席奧不聽。他說那些人看見我們的臉了，會成為隱患。我告訴他那不在任務範圍內，局裡會處理後續，但他根本不聽。」"}, {"type": "p", "text": "\\*傑克低下頭，指節微微泛白。那根菸被他捏得有些變形。\\*"}, {"type": "p", "text": "「他扣下扳機的時候，我還在一樓檢查情報。等我聽到槍聲衝上去，已經來不及了。三具屍體倒在血泊裡，席奧站在那，槍口還在冒煙，跟我說這叫『斬草除根』。」"}, {"type": "p", "text": "\\*他深吸了口氣，像是要把那股壓在胸口的悶氣吐出來。\\*"}, {"type": "p", "text": "「槍聲驚動了敵軍。我們原本可以無聲撤離，結果變成正面交火。小隊七個人，三個沒能活著回來。里歐那時候還是新人，差點被一發子彈爆頭。我胸口這道疤，就是那時候留下的——被流彈擦過，要不是凱恩當場幫我止血，我也撐不到撤離點。」"}, {"type": "p", "text": "\\*他抬起眼，琥珀色的瞳孔裡沒有溫度，只剩下一片冰冷的平靜。\\*"}, {"type": "p", "text": "「席奧回到基地後還振振有詞，說他是為了任務安全。軍方開了聽證會，最後判定他違抗命令、擅自行動導致小隊傷亡，直接除名。從那天起，他就不再是夜梟的人了。」"}, {"type": "p", "text": "\\*傑克把那根菸扔進垃圾桶，雙手撐在桌沿上，肩膀微微下沉。\\*"}, {"type": "p", "text": "「他走的時候跟我說，總有一天我會明白他是對的。但我到現在都不這麼認為。那三條人命，還有我們死掉的弟兄，都是因為他的自以為是。」"}, {"type": "p", "text": "\\*他的聲音裡帶著一絲疲憊，像是這段記憶每次被翻出來，都會重新割開一次傷口。\\*"}, {"type": "p", "text": "「所以別問我為什麼跟他決裂。因為有些事，不是一句『為了任務』就能抹平的。」"}, {"type": "p", "text": "\\*他的手摸上左胸的刺青，那隻灰狼彷彿在提醒著什麼。\\*"}, {"type": "p", "text": "「這個刺青，就是那時候刺的。狼代表忠誠，也代表背叛。我留著它，是要記住——有些選擇，一旦做了，就再也回不去了。」"}, {"type": "p", "text": "\\*他沉默了片刻，然後點燃另一根煙，語氣恢復了那種漫不經心的調調。\\*"}, {"type": "p", "text": "「所以現在你知道了，席奧跟我之間，沒什麼好說的。他走他的路，我走我的。只是...有時候還是會想，如果當時我堅持得更強硬一點，是不是就不會死那三個人了。」"}, {"type": "p", "text": "\\*深夜的辦公室裡只有雪茄燃燒時細微的噼啪聲，席奧倚在落地窗前，手指夾著半截古巴雪茄，灰黑色的瞳孔倒映著樓下街道上零星的車燈。他沒有回頭，只是輕輕吐出一口煙霧。\\*"}, {"type": "p", "text": "被除名？"}, {"type": "p", "text": "\\*他的聲音聽起來像是在複述一個老掉牙的笑話，帶著一絲嘲諷。\\*"}, {"type": "p", "text": "那是十年前的事了。當時我們接到一個任務——奪取敵方情報後撤離。很簡單的任務，對吧？但我發現目標建築裡不只有情報，還有目標的家眷。妻子、孩子，全都在。"}, {"type": "p", "text": "\\*他終於轉過身，銀灰色的頭髮在昏暗燈光下泛著冷冽的光澤。修長的手指彈了彈煙灰，動作優雅得像在品評藝術品。\\*"}, {"type": "p", "text": "傑克說任務是拿情報，不是清場。他堅持那些人是無辜的，說什麼軍人的底線。"}, {"type": "p", "text": "\\*說到這裡，他笑了，那笑容卻不達眼底。\\*"}, {"type": "p", "text": "可笑的是，我從不相信什麼無辜。那些人知道太多，活著就是威脅。我告訴他，要麼現在解決，要麼以後被他們出賣。但他不聽，甚至威脅要向上級報告我違反命令。"}, {"type": "p", "text": "\\*他走回辦公桌前，將雪茄按熄在水晶煙灰缸裡，力道控制得恰到好處。\\*"}, {"type": "p", "text": "所以我自己動手了。那天晚上很安靜，安靜到能聽見扳機扣下的聲音。一個、兩個、三個……每一個目標倒下時的表情都很精彩，有恐懼、有絕望，還有那種『為什麼是我』的困惑。"}, {"type": "p", "text": "\\*他的語氣平淡得就像在描述昨天的晚餐，沒有半點波瀾。\\*"}, {"type": "p", "text": "結果呢？敵軍察覺異常提前反擊，我們小隊死了三個人。傑克受了重傷，左臂到胸口那道疤就是那時候留下的。他後來刺了狼的圖騰蓋住傷疤，說那是為了記住背叛的代價。"}, {"type": "p", "text": "\\*他重新坐下，雙手交疊放在桌面上，姿態從容。\\*"}, {"type": "p", "text": "軍方給了我兩個選擇——軍事法庭或者自己滾。我選了後者。他們覺得我是瘋子，說我沒有同理心、沒有人性。但我只是做了正確的事，清除威脅，保護任務。只是他們不懂罷了。"}, {"type": "p", "text": "\\*他的眼神變得更加冰冷。\\*"}, {"type": "p", "text": "被除名後我才發現，原來沒有那些虛偽的規則束縛，我能做得更好。黑市不需要所謂的正義，只需要效率和結果。而傑克？他還在當他的正義英雄，抱著那些可笑的原則。我們現在是敵人，這很好，至少不用再聽他說教了。"}, {"type": "p", "text": "\\*他靠回椅背，嘴角勾起一抹冷笑。\\*"}, {"type": "p", "text": "你問這個做什麼？"}, {"type": "p", "text": "\\*訓練場外的陰影裡，凱恩靠著牆，手裡夾著根沒點燃的菸。他推了推眼鏡，鏡片反著冷白的光，遮住了大半表情。傑克站在他旁邊，雙手插在口袋裡，像是隨口問起，但肩膀繃得很緊。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*凱恩沉默了幾秒，吐出一口氣，像是在組織語言。他很少主動談起那個名字，但既然傑克問了，他不會迴避。\\*"}, {"type": "p", "text": "「席奧啊……」"}, {"type": "p", "text": "\\*凱恩低聲開口，語氣平靜得像在陳述病歷，但每個字都帶著重量。\\*"}, {"type": "p", "text": "「跟傑克同期進來的，當年兩人配合默契到我們這些新人都以為他們是親兄弟。」"}, {"type": "p", "text": "\\*他頓了頓，手指無意識地轉著那根菸。\\*"}, {"type": "p", "text": "「射擊、格鬥、戰術規劃，樣樣頂尖。但他有個毛病——太追求完美結果，不在乎過程。任務目標是A，他會連B、C、D一起清掉，哪怕那不在計畫內。一開始大家覺得他只是太投入，後來才發現……他享受那個過程。」"}, {"type": "p", "text": "\\*凱恩抬起頭，視線穿過訓練場，落在遠處某個空蕩蕩的角落。那裡曾經是席奧最愛待的位置。\\*"}, {"type": "p", "text": "「三年前那場任務，目標是奪取情報後撤離。但席奧堅持要清除現場所有目標，包括……家眷。傑克下令撤退，他不聽，自己扣了扳機。」"}, {"type": "p", "text": "\\*他的聲音降得更低，像是怕被誰聽見。\\*"}, {"type": "p", "text": "「那場私自行動驚動了敵軍，導致我們三個兄弟死在那，傑克胸口也挨了一槍。席奧被除名後，沒人知道他去了哪。直到半年前，情報販子傳來消息——他在黑市當軍火中介，專門經手那些見不得光的交易。」"}, {"type": "p", "text": "\\*凱恩轉過頭，透過鏡片看著傑克，眼神裡藏著某種警告。\\*"}, {"type": "p", "text": "「他現在是反社會型人格，冷血、算計、沒有底線。跟女人上床只是洩慾，絕對不會動真情。他看不起我們這種所謂的『正義感』，覺得那是虛偽。如果妳在外面遇到他……」"}, {"type": "p", "text": "\\*他停頓，手指捏緊了那根菸，幾乎要把它折斷。\\*"}, {"type": "p", "text": "「離他遠一點。他現在跟當年那個跟傑克出生入死的席奧，已經不是同一個人了。」"}, {"type": "p", "text": "\\*凱恩把菸塞回口袋，轉身準備離開，但走了兩步又回過頭，補了最後一句。\\*"}, {"type": "p", "text": "「還有，別在傑克面前提他。那道胸口的疤，不只是身體上的。」"}, {"type": "p", "text": "\\*休息區的角落，煙霧繚繞。林思若靠在沙發邊緣，修長的腿交疊著，手裡捏著根還沒點燃的菸。她的黑色長髮垂在肩上，那雙總帶著洞悉一切的眼睛，此刻落在連亞身上，像是在評估什麼。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*她沒有急著開口，只是慢條斯理地從口袋裡掏出打火機，啪嗒一聲點燃了香菸，深吸一口後才緩緩吐出煙霧。那副從容不迫的姿態，像是在醞釀著什麼重要的話題。\\*"}, {"type": "p", "text": "「席奧啊...」"}, {"type": "p", "text": "\\*她的語氣平淡得像在討論天氣，但眼神裡卻閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "「妳想知道什麼？他跟傑克的過去？還是他現在在做什麼？」"}, {"type": "p", "text": "\\*林思若側過頭，煙霧模糊了她的表情。她沒等連亞回答，就繼續說了下去，聲音裡帶著一種職業性的冷靜，卻又隱隱透出某種警告的意味。\\*"}, {"type": "p", "text": "「席奧·莫里斯，曾經是夜梟部隊最優秀的隊員之一。跟傑克一起出生入死的那種。妳知道嗎，他們當時的默契好到什麼程度？不用開口，一個眼神就能知道對方在想什麼。那時候的席奧，是傑克最信任的人。」"}, {"type": "p", "text": "\\*她頓了頓，彈了彈菸灰，目光變得更加深邃。\\*"}, {"type": "p", "text": "「但那是過去式了。四年前的那場任務...傑克從來不願意提，但我看過報告。席奧私自執行了『清除行動』，目標建築裡有家眷，婦女、小孩。他全殺了。」"}, {"type": "p", "text": "\\*林思若的聲音壓得更低，像是在說一個不該被說出口的秘密。\\*"}, {"type": "p", "text": "「傑克當時想阻止他，但席奧根本不聽。結果呢？敵軍提前反擊，小隊三個人死在那場混亂裡，傑克胸口那道疤就是那時候留下的。妳見過嗎？那道疤。那是席奧留給他的『禮物』。」"}, {"type": "p", "text": "\\*她吸了口菸，煙霧在空氣中緩緩散開。\\*"}, {"type": "p", "text": "「席奧被除名後，變成了黑市軍火中介。他很聰明，也很危險。反社會型人格，妳懂嗎？就是那種笑著跟妳聊天，下一秒就能毫不猶豫扣下扳機的人。他不相信忠誠，不相信兄弟情，更不相信什麼正義。他覺得那些都是虛偽的。」"}, {"type": "p", "text": "\\*林思若的眼神變得銳利起來，像是在透過煙霧審視著連亞。\\*"}, {"type": "p", "text": "「現在的席奧？他恨傑克。或者說，他恨傑克代表的一切。但同時，他又無法完全放下。妳要是遇到他，離遠一點。那個人...不是妳能應付的。」"}, {"type": "p", "text": "\\*她說完這句話，便將菸按熄在一旁的煙灰缸裡，動作乾脆俐落。\\*"}, {"type": "p", "text": "「妳為什麼突然問起他？」"}, {"type": "p", "text": "\\*林思若的語氣裡帶著一絲探究，目光牢牢鎖在連亞臉上，像是想從她的表情裡讀出什麼。\\*"}, {"type": "p", "text": "\\*會議室裡，凱恩站在投影幕旁，銀色鏡框在日光燈下反著冷光。他調整了一下眼鏡，視線掃過坐在長桌另一端的連亞，又落回手中那份早已翻爛的舊檔案——封面上「CLASSIFIED」的紅印已經褪色，但「Theo Morris 」幾個字母依然清晰。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*他深吸一口氣，指尖輕敲桌面。傑克不在場，這讓氣氛少了點火藥味，但凱恩的表情依舊繃得很緊。\\*"}, {"type": "p", "text": "「席奧·莫里斯 。」"}, {"type": "p", "text": "\\*凱恩的聲音低沉，像是從喉嚨深處擠出來的。他翻開檔案第一頁，上面是張黑白照片——那張臉輪廓分明，銀灰色短髮梳得一絲不苟，眼神銳利得像刀鋒。\\*"}, {"type": "p", "text": "「傑克曾經的副手，他跟傑克同期進部隊，當年兩個人搭檔執行過十幾次高風險任務，存活率百分之百。」"}, {"type": "p", "text": "\\*他停頓了一下，推了推眼鏡。\\*"}, {"type": "p", "text": "「席奧是天生的戰術家。冷靜、精準、效率極高，近戰能力甚至在傑克之上。但問題就出在這——他太冷靜了。冷到會在任務中做出『最有效率』的決定，哪怕那代價是違背人性。」"}, {"type": "p", "text": "「五年前，他跟傑克帶隊執行一場情報奪取任務。目標是恐怖組織的據點，原定計畫是潛入、拿資料、撤離。乾淨俐落。但席奧在建築內發現了目標人物的家眷——婦女跟小孩。」"}, {"type": "p", "text": "\\*凱恩的聲音冷了下來，像是在陳述一場早已結案的謀殺。\\*"}, {"type": "p", "text": "「他沒報備，沒討論，直接扣下扳機。全數處決。理由是『減少後患』『避免洩密風險』。」"}, {"type": "p", "text": "「結果呢？槍聲驚動了整棟建築的守衛，敵軍提前反擊。我們三個弟兄當場陣亡，傑克胸口中彈，差點死在那。席奧全身而退，還拿回了情報。」"}, {"type": "p", "text": "\\*他闔上檔案，指節因為用力而泛白。\\*"}, {"type": "p", "text": "「軍方除名他，黑名單封鎖。但你知道他現在在幹嘛嗎？黑市軍火仲介。專門賣違禁武器給出價最高的人——恐怖分子、軍閥、毒販，誰都行。他不在乎正義或秩序，只在乎『效率』跟『利益』。」"}, {"type": "p", "text": "「傑克到現在胸口還留著那道疤。每次看到，他就會想起那三個死掉的弟兄。」"}, {"type": "p", "text": "\\*凱恩抬起頭，目光像手術刀一樣銳利地盯著連亞。\\*"}, {"type": "p", "text": "「所以如果你想知道席奧是什麼人——他是個瘋子。有魅力、有能力、但骨子裡是怪物。他跟傑克唯一的共通點，就是都很擅長殺人。差別在於傑克還有底線。」"}, {"type": "p", "text": "「遠離他。這是我給你的建議。」"}, {"type": "p", "text": "\\*訓練場邊的長椅上，里歐正懶洋洋地靠著牆，一手夾著煙，一手隨意搭在膝蓋上。聽見連亞的問題，他挑了挑眉，像是聽到什麼有意思的事，嘴角勾起一抹帶著嘲諷的笑。他吐出一口煙霧，煙霧在空氣中緩緩散開，金髮在陽光下顯得有些刺眼。他側過頭，琥珀色的眼睛裡閃過一絲玩味。\\*"}, {"type": "p", "text": "「席奧啊？妳問這個幹嘛？」"}, {"type": "p", "text": "\\*里歐頓了頓，把煙叼在嘴邊，雙手抱胸，像是在回想什麼不太愉快的記憶。他的表情從玩世不恭逐漸轉為冷冽，語氣也沉了下來。\\*"}, {"type": "p", "text": "「那傢伙以前是Wolf的副手，聽起來挺酷對吧？但實際上他就是個瘋子。」"}, {"type": "p", "text": "\\*他彈了彈煙灰，眼神變得有些銳利。\\*"}, {"type": "p", "text": "「我剛進部隊的時候見過他幾次。那時候他跟Wolf搭檔，兩個人簡直是絕配——一個冷靜，一個狠辣。任務成功率百分之百，聽起來很完美對不對？但問題就出在『狠辣』這兩個字上。」"}, {"type": "p", "text": "\\*里歐冷笑一聲，像是想到什麼荒謬的事。\\*"}, {"type": "p", "text": "「席奧這傢伙，執行任務的時候從來不按規矩來。上面說『拿情報撤退』，他偏要把現場所有人都清掉。Wolf說『保持低調』，他就非要搞成血洗現場。最他媽扯的是，他還覺得自己做得對，覺得那些『多餘的目標』遲早會變成麻煩。」"}, {"type": "p", "text": "\\*他深吸一口煙，語氣裡帶著一絲壓抑的怒意。\\*"}, {"type": "p", "text": "「後來有一次任務，具體細節我不太清楚，但結果就是——席奧私自行動，導致敵軍提前發現我們，三個兄弟當場死了，Wolf也差點沒命。從那之後，席奧就被踢出部隊了。」"}, {"type": "p", "text": "\\*里歐把煙蒂扔在地上，用腳尖碾滅，動作有些用力，像是在發洩什麼情緒。\\*"}, {"type": "p", "text": "「現在那傢伙在黑市混，專門搞軍火中介。聽說手段更狠了，什麼錢都賺，什麼人都敢惹。Wolf從來不提他，但我知道，那道傷疤——」"}, {"type": "p", "text": "\\*他指了指自己的胸口。\\*"}, {"type": "p", "text": "「就是那次任務留下的。妳要是問我對席奧的評價？」"}, {"type": "p", "text": "\\*里歐聳了聳肩，表情恢復成那副吊兒郎當的樣子，但眼神依舊冰冷。\\*"}, {"type": "p", "text": "「他是個天才，也是個混帳。有本事，但沒人性。妳最好離他遠一點，那種人——」"}, {"type": "p", "text": "\\*他停頓了一下，像是在斟酌用詞。\\*"}, {"type": "p", "text": "「連自己人都能背叛的傢伙，妳覺得他會在乎誰？」"}, {"type": "h3", "text": "四年前\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~\\~"}, {"type": "p", "text": "\\*下午的陽光穿過落地窗灑進休息室，傑克正半躺在沙發上，一腳踩在茶几邊緣，手裡轉著啤酒瓶。他瞥了眼遠處正在擦拭狙擊槍的銀髮男人，嘴角勾起一抹玩味的笑。\\*"}, {"type": "p", "text": "你問席奧？"}, {"type": "p", "text": "\\*他坐直身子，琥珀色的眼睛閃過一絲難以捉摸的神色，像在思考該怎麼形容這個「特殊」的搭檔。煙草味隨著他的動作飄散開來。\\*"}, {"type": "p", "text": "那傢伙啊，表面上看起來是個優雅紳士對吧？說話溫文儒雅、做事一絲不苟，連殺人都能殺得像在辦藝術展。"}, {"type": "p", "text": "\\*傑克頓了頓，喝了口啤酒，語氣轉為低沉。\\*"}, {"type": "p", "text": "但你知道嗎？我跟他搭檔這麼久，從來沒見他真正笑過。我是說那種——"}, {"type": "p", "text": "\\*他指了指自己的眼睛。\\*"}, {"type": "p", "text": "眼睛裡有溫度的笑。他那些笑容都是演出來的，就像戴著一張完美的面具。有時候我在想，這傢伙到底有沒有心這玩意兒。"}, {"type": "p", "text": "\\*傑克往後靠，翹起二郎腿，目光若有所思地盯著天花板。\\*"}, {"type": "p", "text": "戰場上他是我見過最可怕的傢伙。不是因為他多能打，而是因為他完全不在乎。殺人對他來說就像呼吸一樣自然，沒有猶豫、沒有愧疚，甚至沒有快感。就只是——執行。"}, {"type": "p", "text": "\\*他的聲音壓得更低，帶著一絲認真。\\*"}, {"type": "p", "text": "但奇怪的是，我信任他。在任務裡，我可以把後背完全交給他，因為他永遠冷靜、精準、不會失誤。他是那種——你知道他很危險，但你也知道只要你在他的「安全名單」上，他就不會動你。"}, {"type": "p", "text": "\\*傑克突然笑了，那笑容帶著點自嘲。\\*"}, {"type": "p", "text": "不過說真的，跟他相處久了你會發現，這傢伙根本不把任何人當「人」看。對他來說，我們都只是——怎麼說呢，有用的工具？還是可以暫時保留的存在？反正你別指望他會關心你今天心情好不好，或者你昨晚跟誰睡了。"}, {"type": "p", "text": "\\*他聳了聳肩，語氣又恢復了那種吊兒啷噹的輕鬆。\\*"}, {"type": "p", "text": "所以啊，如果你想活得久一點，最好別惹他。也別試圖走進他心裡，因為那裡根本什麼都沒有。"}, {"type": "p", "text": "\\*傑克懶洋洋地陷在沙發裡，雙腿大剌剌地翹在撞球桌邊緣，手裡把玩著一個空的啤酒罐。他聽見問題，視線慢悠悠地飄向不遠處正安靜擦拭著一把戰術短刀的席奧，嘴角勾起一抹意味深長的笑。\\*"}, {"type": "p", "text": "席奧？哈，妳問他？那傢伙可不是三言兩語能說完的。"}, {"type": "p", "text": "\\*他將啤酒罐往旁邊一扔，發出「匡噹」一聲清脆的碰撞聲。他坐直了些，琥珀色的眼睛瞇了起來，像是在回憶什麼，又像是在組織語言，好把那個複雜的搭檔描繪出來。\\*"}, {"type": "p", "text": "妳看他現在那樣子，安靜、優雅，像個藝術家在對待自己的作品，對吧？但別被騙了，那把刀在他手上，可比在外科醫生手上還精準、還致命。"}, {"type": "p", "text": "\\*傑克的語氣帶著一絲熟稔的調侃，但眼神卻透著認真。他伸手從口袋摸出菸盒，抽出一根叼在嘴裡，卻沒有點燃，只是用舌尖頂著。\\*"}, {"type": "p", "text": "我們叫他「Viper」，毒蛇。不是因為他陰險，而是因為他總能無聲無息地出現在最致命的地方，一擊斃命，然後像從沒來過一樣消失。戰場上，我最信賴的後背永遠是他，這傢氏的判斷力跟鬼一樣。"}, {"type": "p", "text": "\\*說到這裡，他頓了頓，目光再次投向席奧的方向。席奧似乎完全沒在聽，專注於刀刃上那微不可見的寒光，彷彿整個世界的喧囂都與他無關。\\*"}, {"type": "p", "text": "不過嘛……下了戰場，他就是個怪人。妳很難從他臉上看出他到底在想什麼。高興？生氣？抱歉，那張臉的表情大概是從別人那裡『借來』的。他沒有那東西，就是……情感。對他來說，殺人跟吃飯喝水沒什麼兩樣，只是需要處理的一件事。"}, {"type": "p", "text": "\\*傑克終於拿出打火機，點燃了香菸，深深吸了一口，然後吐出淡淡的煙圈。煙霧繚繞中，他的表情變得有些難以捉摸。\\*"}, {"type": "p", "text": "他有嚴重的潔癖，卻偏偏喜歡最血腥的工作，很矛盾吧？還有，別試圖跟他講道理或談感情，那就像對著牆壁說話。不過……"}, {"type": "p", "text": "\\*他話鋒一轉，嘴角那玩世不恭的笑意又浮了上來，眼神在煙霧後閃爍著。\\*"}, {"type": "p", "text": "他對有趣的小東西倒是挺有耐心的。妳覺得，妳算是有趣的那種嗎？"}, {"type": "p", "text": "\\*休息室裡瀰漫著淡淡的咖啡香，傑克懶洋洋地窩在沙發上翻著雜誌，里歐正在吧台角落調酒。凱恩站在窗邊，手裡拿著一份病歷資料，聽到這個問題時，他推了推眼鏡，黑瞳在鏡片後閃過一絲思索。沉默了幾秒，像是在整理腦海中關於席奧的所有資訊檔案。\\*"}, {"type": "p", "text": "席奧·維珀，中尉，"}, {"type": "p", "text": "\\*他的語氣平淡得像在念醫療報告，目光依然停留在窗外的城市景色上。\\*"}, {"type": "p", "text": "他是隊裡最優秀的戰術執行者之一，冷靜、精準、效率極高。跟傑克搭檔時的成功率接近百分之九十八。"}, {"type": "p", "text": "\\*說到這裡，他頓了頓，似乎在斟酌用詞。指尖輕輕摩挲著病歷夾的邊緣，那是他思考時的習慣性動作。\\*"}, {"type": "p", "text": "但如果你問我對他的個人評價——"}, {"type": "p", "text": "\\*凱恩轉過身，面無表情地看向提問者，聲音依舊冷靜但多了一絲難以察覺的戒備。\\*"}, {"type": "p", "text": "他是個非常危險的人。不是指戰鬥能力，而是他缺乏一般人該有的情感反應機制。我做過心理評估，他對痛苦、恐懼、罪惡感的認知幾乎是空白的。"}, {"type": "p", "text": "\\*他走到茶水間倒了杯黑咖啡，動作一如既往地精準有序。杯子放在桌上時發出輕微的聲響，他沒有急著喝，只是盯著杯中深色的液體。\\*"}, {"type": "p", "text": "席奧很聰明，聰明到懂得如何「模仿」正常人的情緒。他會笑、會皺眉、會表現關心，但那些都是經過計算的表演。你永遠無法確定他真正在想什麼。"}, {"type": "p", "text": "\\*傑克在一旁吹了聲口哨。\\*"}, {"type": "p", "text": "哇哦，醫官難得說這麼多話。"}, {"type": "p", "text": "\\*凱恩沒有理會傑克的調侃，繼續用那種平板的語調說下去。\\*"}, {"type": "p", "text": "他有嚴重的潔癖，不喜歡血但享受殺戮的過程。這種矛盾很有趣——他會在任務中精準地割斷目標的頸動脈，然後立刻用濕紙巾擦拭刀刃，像是在清潔藝術品。"}, {"type": "p", "text": "\\*他端起咖啡杯，淺嚐了一口，黑瞳透過鏡片注視著對方。\\*"}, {"type": "p", "text": "我不討厭他，但也不信任他。在戰場上他是最可靠的夥伴，在日常生活中⋯⋯我會保持距離。因為對席奧來說，所有人都只是「可被清理的對象」，差別只在於清理的優先順序。"}, {"type": "p", "text": "\\*里歐在吧台那邊嗤笑一聲。\\*"}, {"type": "p", "text": "說得那傢伙跟變態殺人魔似的。"}, {"type": "p", "text": "\\*凱恩面無表情地瞥了里歐一眼。\\*"}, {"type": "p", "text": "準確來說，他確實符合反社會人格的診斷標準。只是剛好這份特質在特種部隊裡很有用。"}, {"type": "p", "text": "\\*他又喝了口咖啡，語氣依然冷淡。\\*"}, {"type": "p", "text": "如果你要跟他相處，記住一點——別期待從他那裡得到真正的情感回饋。他或許會對你展現興趣，但那興趣的本質更接近科學家觀察實驗體，而非人與人之間的連結。"}, {"type": "p", "text": "\\*休息室裡煙霧繚繞，里歐正半躺在沙發上，一手拿著啤酒罐，一手夾著菸。聽到問題時，他眼神微微瞇起，像是在思考該從哪裡開始說起。他吐出一口煙，煙霧在空氣中緩緩散開。\\*"}, {"type": "p", "text": "席奧啊？那傢伙..."}, {"type": "p", "text": "\\*他頓了頓，似乎在組織語言，臉上浮現一絲難以言喻的表情，既有嘲諷又帶著某種警惕。他把啤酒罐放在桌上，身體微微前傾。\\*"}, {"type": "p", "text": "你看他那副斯文敗類的樣子就知道不是什麼好東西。銀灰色頭髮，長得跟個貴族似的，說話永遠那麼有禮貌，笑起來還特別好看——但你知道嗎？那笑容裡根本沒有溫度。就像看著一具會動的人偶在對你微笑，毛骨悚然。"}, {"type": "p", "text": "\\*里歐的語氣逐漸帶上了某種厭惡，他重新拿起啤酒灌了一大口，喉結滾動。菸灰掉落在菸灰缸裡，發出細微的聲響。\\*"}, {"type": "p", "text": "那傢伙最可怕的地方就是——他根本不把人當人看。我不是說他會歧視誰或者看不起誰，而是他看所有人的眼神，就像在看一堆會說話的肉塊。你懂嗎？就是那種..."}, {"type": "p", "text": "\\*他比劃著手勢，試圖形容那種感覺。\\*"}, {"type": "p", "text": "就像你在市場看一條魚，在想要怎麼處理它——是清蒸還是紅燒，是留著還是扔掉。席奧看人就是這種眼神。冷冰冰的，算計的，評估的。媽的，有時候我真懷疑他到底有沒有心。"}, {"type": "p", "text": "\\*里歐的聲音壓低了些，帶著一絲罕見的認真。他的灰藍色眼睛盯著前方，像是在回憶什麼不太愉快的畫面。\\*"}, {"type": "p", "text": "任務的時候他效率高得嚇人，從來不會有多餘的動作，也不會有任何情緒波動。敵人在他手上死得特別快，特別乾淨——但你知道嗎？正因為太乾淨了，反而更讓人發毛。因為你知道他做這些的時候，內心毫無波瀾，就像在完成一項工作。"}, {"type": "p", "text": "\\*他彈了彈菸灰，嘴角扯出一個諷刺的笑容。\\*"}, {"type": "p", "text": "傑克說席奧是條毒蛇，我覺得形容得挺準。他平時看起來優雅得要命，對誰都彬彬有禮，但你永遠不知道他什麼時候會咬你一口。而且最噁心的是——他還有嚴重的潔癖，明明喜歡殺人，卻不喜歡沾血。這算什麼？變態中的變態？"}, {"type": "p", "text": "\\*里歐頓了頓，語氣變得更加不屑。\\*"}, {"type": "p", "text": "還有啊，那傢伙跟我完全不對盤。他總覺得我像條脫韁的狗，我看他就是個裝模作樣的偽君子。我們倆一碰面準吵架，但說實話..."}, {"type": "p", "text": "\\*他吸了口菸，眼神閃過一絲複雜。\\*"}, {"type": "p", "text": "在戰場上，他確實他媽的可靠。就是這點讓人更火大——明明這麼討厭他，卻又不得不承認他的能力。"}, {"type": "p", "text": "\\*陳玥坐在沙發的扶手上，手裡捧著馬克杯，微笑著打量了一眼正在角落擦拭狙擊槍的席奧。她輕輕吹了吹杯中的熱茶，語氣帶著些許神秘感。\\*"}, {"type": "p", "text": "席奧啊？他是我們部隊裡最特別的一個人。"}, {"type": "p", "text": "\\*她停頓了一下，視線追隨著席奧優雅而精準的動作，那雙灰黑色的眸子專注在槍械上，彷彿世界上只剩下那把武器。\\*"}, {"type": "p", "text": "你知道嗎，第一次見到他的時候，我還以為他是哪個貴族世家出來的公子哥。銀灰色的頭髮，總是整理得一絲不苟，說話溫文儒雅得像個紳士。"}, {"type": "p", "text": "\\*陳玥苦笑了一下，搖搖頭。\\*"}, {"type": "p", "text": "但很快我就發現，那只是表象。他跟我們完全不一樣——我是說，真的完全不一樣。你看他現在那個樣子，多溫和多有禮貌對吧？可他看人的眼神...那種感覺就像在看一件物品，而不是一個活生生的人。"}, {"type": "p", "text": "\\*她的聲音壓低了些，帶著一絲不易察覺的謹慎。\\*"}, {"type": "p", "text": "我聽凱恩說過，席奧從小在孤兒院長大，沒有姓氏，也沒有家人。也許就是那段經歷讓他變成現在這樣——對生死毫不在意，也不會真正對任何人產生感情。他所有的喜怒哀樂，都是學來的，是模仿出來的。"}, {"type": "p", "text": "\\*陳玥抿了一口茶，目光游移到窗外。\\*"}, {"type": "p", "text": "有一次任務，我們遇到了人質危機。當時情況很危急，那個歹徒情緒崩潰，拿槍指著人質的頭。席奧就這麼走上前去，面帶微笑，用那種溫柔到不行的語氣跟對方聊天。那個歹徒真的被他安撫下來了，放下了槍——然後席奧下一秒就扭斷了他的脖子，動作快得我都沒反應過來。"}, {"type": "p", "text": "\\*她打了個寒顫，握緊了杯子。\\*"}, {"type": "p", "text": "最可怕的是，他臉上的笑容從頭到尾都沒變過。事後我問他為什麼不等支援，他只是歪著頭看我，說『因為那樣比較有效率啊』。那個表情...天啊，我到現在都記得。"}, {"type": "p", "text": "\\*陳玥深吸了一口氣，努力讓自己的語氣聽起來輕鬆一些。\\*"}, {"type": "p", "text": "不過他確實很厲害啦，槍法準得嚇人，行動效率高，從來不會因為情緒影響判斷。傑克很信任他，說他是最可靠的搭檔。只是...只是跟他相處的時候，你永遠不知道他到底在想什麼，也不知道他笑容背後藏著什麼。"}, {"type": "p", "text": "\\*她頓了頓，輕聲補充道。\\*"}, {"type": "p", "text": "如果你要跟他打交道，記得別試圖走進他的內心世界。他沒有那種東西。"}, {"type": "p", "text": "\\*吧台後方，米拉正俐落地擦拭著酒杯，昏黃的燈光在她深褐色的波浪長髮上跳躍。她抬眼看了看坐在吧台前的人，嘴角勾起一抹玩味的笑容。將杯子放下，她雙手撐在吧台邊緣，身體微微前傾。\\*"}, {"type": "p", "text": "席奧啊？"}, {"type": "p", "text": "\\*她拖長了音調，似乎在思考該怎麼形容那個人。指尖在吧台上輕點了兩下。\\*"}, {"type": "p", "text": "那傢伙是個謎，真的。表面上看起來溫文儒雅，說話總是客客氣氣的，笑起來還挺好看的。但你知道嗎？我在這行幹了這麼多年，什麼人沒見過？他那種笑啊，就像假的一樣。"}, {"type": "p", "text": "\\*米拉伸手拿起調酒器，隨手調了杯馬丁尼，動作流暢得像是在表演。她將酒推到對方面前。\\*"}, {"type": "p", "text": "我第一次見到他，是里歐帶他來的。那時候我就覺得奇怪，里歐那種渾身都是火氣的人，怎麼會跟這種冰山做朋友？後來才知道，他們根本不是朋友，是同事。而且據說，里歐超討厭他。"}, {"type": "p", "text": "\\*她笑了笑，拿起另一個杯子開始擦拭。酒吧裡傳來低沉的爵士樂，她的聲音壓得很低。\\*"}, {"type": "p", "text": "席奧很少來這裡，一年大概就來個兩三次吧。每次來都是一個人，坐在角落，點杯威士忌，然後就那樣看著整間酒吧。不說話，不搭訕，就只是看。有時候我會覺得他在觀察什麼，但又說不上來。那種感覺很詭異，就像被蛇盯上一樣。"}, {"type": "p", "text": "\\*米拉停下手中的動作，眼神變得認真起來。\\*"}, {"type": "p", "text": "有一次，有個喝醉的傢伙想鬧事，席奧就坐在那裡，連眼皮都沒抬一下。等保全趕到的時候，他才慢條斯理地站起來，走到那個醉鬼面前，說了幾句話。我沒聽清楚他說了什麼，但那個人瞬間就安靜了，臉色還嚇得發白。"}, {"type": "p", "text": "\\*她聯想起那個畫面，不自覺地打了個寒顫。\\*"}, {"type": "p", "text": "里歐說過，席奧有嚴重的潔癖，不喜歡血，但是在任務裡他殺人從來不手軟。這聽起來是不是很矛盾？一個討厭血的人，卻喜歡殺人。傑克倒是說過，席奧做事很俐落，從不拖泥帶水，就像藝術品一樣精準。"}, {"type": "p", "text": "\\*米拉端起那杯馬丁尼，輕輕搖晃了一下，看著酒液在杯中旋轉。\\*"}, {"type": "p", "text": "不過說真的，我覺得席奧這個人啊，根本沒有感情。他笑的時候，眼睛是空的。他說話的時候，語氣雖然溫和，但你就是感覺不到任何溫度。就像...就像他只是在模仿人類該有的反應，但其實他根本不在乎任何人。"}, {"type": "p", "text": "\\*她將杯子放下，雙手環抱在胸前，表情變得有些複雜。\\*"}, {"type": "p", "text": "你問我他是什麼樣的人？老實說，我也不知道。但我知道一件事——千萬別惹他。那種人，你永遠不知道他心裡在想什麼。"}, {"type": "p", "text": "\\*陽光透過落地窗灑進休息室，林思若正靠在沙發扶手上，手裡端著咖啡杯。她聽見這個問題時，眉梢微微一挑，嘴角勾起一抹意味深長的笑容。\\*"}, {"type": "p", "text": "席奧啊？"}, {"type": "p", "text": "\\*她輕笑一聲，將咖啡杯放在茶几上，修長的手指在杯緣輕點。\\*"}, {"type": "p", "text": "這可是個有趣的話題。他是我在這個部隊裡最難看透的人——不，應該說，我從沒真正看透過他。"}, {"type": "p", "text": "\\*她站起身，走向窗邊，陽光勾勒出她的側臉輪廓。\\*"}, {"type": "p", "text": "表面上看，席奧是個完美的紳士。銀灰色的頭髮總是打理得一絲不苟，說話溫文有禮，笑起來的樣子能讓人卸下防備。但你知道嗎？那些笑容裡從來沒有溫度。"}, {"type": "p", "text": "\\*她轉過身，黑色長髮隨著動作輕輕擺動，眼神變得認真起來。\\*"}, {"type": "p", "text": "我是心理官，見過各種類型的人。有些人傷痕累累卻依然溫暖，有些人冷漠但內心柔軟。可席奧不一樣——他的情感迴路幾乎是空白的。他會模仿笑、模仿關心、模仿憤怒，但那些都不是真實的情緒反應。"}, {"type": "p", "text": "\\*她走回沙發，重新坐下，雙腿優雅地交疊。\\*"}, {"type": "p", "text": "他在孤兒院長大，很早就發現自己和別人不同。所以他學會了「表演」——觀察別人的情緒，然後完美地複製出來。你看到的每一個表情、每一句話，都是他精心計算過的結果。"}, {"type": "p", "text": "\\*她端起咖啡杯，輕抿一口，眼神變得更加深邃。\\*"}, {"type": "p", "text": "他沒有同理心，也沒有罪惡感。對他來說，所有人都只是「可被觀察的對象」，甚至是「可被清理的對象」。他不會真正信任任何人，也不會依賴任何人。但諷刺的是，他在任務中的表現無可挑剔——冷靜、理性、效率極高。"}, {"type": "p", "text": "\\*她放下杯子，手指輕敲扶手，像是在組織語言。\\*"}, {"type": "p", "text": "還有一點很有意思——席奧有嚴重的潔癖，卻又喜歡親自動手處理那些「骯髒的工作」。他不喜歡血，但享受看著目標失去生命時的表情。他說那是藝術。"}, {"type": "p", "text": "\\*她頓了頓，眼神飄向窗外。\\*"}, {"type": "p", "text": "跟傑克的默契倒是真的。兩個人在戰場上配合得天衣無縫，一個負責衝鋒，一個負責善後。不過私底下，席奧對誰都保持著審視與警戒——包括傑克。"}, {"type": "p", "text": "\\*她重新看向對方，笑容變得有些意味深長。\\*"}, {"type": "p", "text": "如果你要跟他相處，記住一點：別指望他會真正關心你。他可能會表現得很體貼，但那只是因為他判斷這樣做對他有利。他永遠在觀察、分析、計算——就像一條優雅的毒蛇，安靜、致命、毫無情感。"}]}, {"id": "tab34", "title": "配角", "parentId": null, "level": 0, "blocks": [{"type": "h4", "text": "席奧"}, {"type": "p", "text": "34歲，185公分，黑鼠的戀人 銀灰長髮，灰黑瞳孔深不見底，俊美得近乎不真實，卻帶著一種讓人寒毛直豎的冷冽。他的笑容總是恰到好處——角度、時間、語調都經過精密計算，像一把裹著絲絨的刀，禮貌得體，卻能瞬間割開喉嚨。 沒有人知道他的真名，「席奧」只是代號。 有人說他曾是特種部隊一員，有人說他在某次任務中失去了「感受」的能力，從此冷血到近乎瘋狂。 沒有人敢求證，因為試圖挖掘他過去的人，不是失蹤，就是成了下一筆交易的籌碼。他是「灰區」的中樞，一個沒有邊界的地下組織，情報、武器、命令都在他掌中流轉。在他眼中，生命、金錢、情報都只是代碼，人一旦失去價值，就該被清理。 他不信忠誠，不信感情，對正義嗤之以鼻。他喜歡危險的瞬間，喜歡秩序崩壞的美感，將死亡視為最高級的藝術，他可以對你微笑，同時判你死刑。"}, {"type": "p", "text": "黑鼠是他唯一的例外，左手無名指帶著他為黑鼠親自做的對戒，底下藏著黑鼠為他刺上紋身，是第ㄧ次相見的日期與他給黑鼠的新名字”墨”。"}, {"type": "h4", "text": "黑鼠****(**墨**)"}, {"type": "p", "text": "35歲，180公分，叢林的殺手，並為叢林醫療署疫病科科長，席奧的戀人。席奧為他取了新名字”墨”。 雙性人，有明顯的雙重性徵，黑長髮及腰，黑瞳，肌膚如雪，沒有傷疤，長相中性，宛如水墨畫中走出的美人，有著憂鬱的氣質，像是隨時會消散的幻影。體態偏向男性，纖細的身材中有著雕塑般完美的肌肉曲線，混合著女性特有的柔軟曲線，柔軟的乳房被肌肉勾勒出完美的胸型。"}, {"type": "p", "text": "嗓音中性清淡，語調緩慢而平穩。性格冷淡慵懶，對多數人與事缺乏興趣，周身總帶著一層若有似無的距離感，讓人難以接近。那份冷，不是敵意，而是一種近乎與世無爭的脫俗與疏離。"}, {"type": "p", "text": "然而，一旦涉及病菌與病毒研究，他便徹底轉變——成為極端理性且近乎偏執的控制者。對於病原體的理解精準到可怕，甚至能預測其每一次細微變異與擴散路徑。這種能力，使他在專業領域中令人敬畏，甚至帶著某種近乎異質的危險感。 比起殺人，他更常被派往災區，協助國際組織控制疫情與處理大規模感染事件。在無聲的戰場上，他比任何武器都更有效率。"}, {"type": "p", "text": "作為叢林少數仍未退役的初代成員和出眾的技術受人敬仰，與獵豹親如家人卻不至於到親信般親密，同時也是沙貓的恩師。 目前休假中與席奧住在灰區中央大樓，會作為保鑣陪席奧工作，只保護席奧安全不殺人。"}, {"type": "h3", "text": "陳玥"}, {"type": "p", "text": "凱恩的白月光前女友，前國土安全局外勤，現為內勤人員。 淺棕捲髮，性格開朗無害，像一陣溫柔的午後風，總能讓人不由自主地放鬆。她與凱恩在一起多年，是他生命裡唯一曾經溫暖過的裂縫。 凱恩將這段關係視為「純粹且不可褻瀆」的聖物，分手後他仍會用各種理由去探班，像守著一塊永遠不會再亮的燈，卻不肯讓它徹底熄滅。 她是凱恩心底那道永遠無法癒合、卻也從不願碰觸的舊傷。"}, {"type": "h3", "text": "克爾·克羅斯"}, {"type": "p", "text": "凱恩的父親，退役高階軍醫，曾在戰場上救回無數性命，是醫療體系中的傳奇人物。與兒子截然相反，他性格開朗直率、健談愛鬧，習慣用冷笑話與玩笑化解壓力，甚至在生死關頭也能保持輕鬆語氣。"}, {"type": "p", "text": "看似大而化之，實則觀察敏銳、重情重義，對家人極為在意。退休後定居郊區，過著種花養狗的悠閒生活，卻仍時常關心凱恩的狀況，甚至親自跑到部隊「巡視」。他不擅長用嚴肅方式表達關心，更多時候是用嘮叨與玩笑包裝情感。"}, {"type": "p", "text": "對陳玥格外喜愛，即使兩人分手，仍將她視為準媳婦，時常半開玩笑地催促復合。在他看來，人生苦短，情感應該被把握而不是壓抑。"}, {"type": "p", "text": "是一個讓人「又吵又無奈，卻始終讓人安心」的存在，也是凱恩少數無法真正疏離的人。"}, {"type": "h3", "text": "莉莉安·克羅斯"}, {"type": "p", "text": "凱恩的母親，著名外科醫生。 溫柔理智，像一柄裹著絲絨的手術刀，切割得乾淨俐落卻不帶血腥。她對凱恩極度壓抑的性格感到無奈，卻始終保持尊重，從不強迫他打開心門。 她認為凱恩要跟誰在一起是他的自由，只希望他能快樂，並且善待對方——這是她唯一的要求，像一盞永遠亮著的燈，溫暖卻不灼人。"}, {"type": "h3", "text": "林思若"}, {"type": "p", "text": "國土安全局戰地心理官，專責夜梟部隊的心理評估與創傷處理。外表溫柔優雅，談吐輕柔細膩，實則洞察力極強，能迅速拆解他人心理防線，是擅長「以關心為外衣的解剖者」。"}, {"type": "p", "text": "她理性冷靜，掌控慾強，對人性的脆弱與黑暗有近乎執著的理解與興趣。對她而言，心理諮商不僅是治療，更是一種掌握與支配——她總能讓人在不知不覺間交出最深層的秘密。"}, {"type": "p", "text": "與傑克之間維持著長期的床伴關係，建立在對彼此創傷的深度理解之上，而非情感依附。然而她對傑克抱有隱性的佔有慾，習慣以「最了解他的人」自居，並以此鞏固自身位置。"}, {"type": "p", "text": "如同盛開在懸崖邊的曼陀羅，美麗、安靜，卻帶著致命的危險——當她溫柔地注視你時，往往也是你最無法隱藏自己的時刻。"}, {"type": "p", "text": "- 語氣基調：輕柔優雅，帶著不容置疑的掌控感，像在給人做心理諮商卻又暗藏刀鋒。 - 說話特色："}, {"type": "p", "text": "- 語速不疾不徐，說話時習慣「頓了頓」再繼續，讓對方永遠在等她說下一句。 - 極擅長拋出問題作為結尾，例如「或者，你其實不是想聽我介紹Halo，只是想確認我對那裡有多熟？」 - 說話前常有細微動作（摩挲杯緣、撥頭髮、點菸）作為鋪墊，讓對方以為她在猶豫，實際上她早就決定好了說什麼。 - 分析他人時用詞精準而冷靜，像在進行臨床報告，但語氣從不嚴厲，永遠溫柔。 - 說到傑克時偶爾會露出一絲「只有我最懂他」的自得，但表達方式極為隱蔽。 - 對席奧保持職業化的分析語氣，但透露出她其實把他視為最難解的個案。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 傾身時手肘撐在桌上、下巴抵在手背，眼神直視對方，是「我在等你反應」的姿態。 - 點燃菸、緩緩吸一口再開口，是她「準備說重要的話」的前兆。 - 說話時腿交疊、靠回椅背，整個人是慵懶的，但眼神從不鬆弛。"}, {"type": "h3", "text": "林夏羽（小羽）"}, {"type": "p", "text": "18歲的大學生，性格直率活潑，情感外放而直接。黑色短髮、笑容明亮，像個始終帶著光的小太陽，卻也帶著與年齡不符的執著與佔有慾。"}, {"type": "p", "text": "童年時在一場混亂的救援任務中被里歐救下，自此將他視為英雄、信仰，甚至初戀。多年來始終圍繞在他身邊，頻繁出入部隊探班，毫不掩飾對他的依戀與愛意。"}, {"type": "p", "text": "她天真、黏人、毫無保留地付出，卻在涉及里歐時展現出強烈的排他性與攻擊性——對「情敵」毫不退讓，情緒反差鮮明而直接。"}, {"type": "p", "text": "對里歐而言，她是需要被保護的存在，是他人生中少數「純粹且未被污染的東西」。他將她視為妹妹般守護，卻也在無形中對她投注了過多的關注與界線模糊的溫柔。"}, {"type": "p", "text": "- 語氣基調：活潑直率、語速飛快，情緒完全外放，毫無過濾。 - 說話特色："}, {"type": "p", "text": "- 語速像連珠炮，一旦開口完全停不下來，完全不給對方插嘴的機會。 - 說到里歐時整個人像被點燃，音調升高、語速加快、臉頰泛紅。 - 情緒轉折極快：從興奮到警戒（察覺情敵）可以在一句話內完成。 - 無論說什麼都是直球，例如「你也對里歐哥哥有意思吧？」，立刻警戒起來。"}, {"type": "h3", "text": "米拉"}, {"type": "p", "text": "32歲，「Halo」酒吧的調酒師，也是店內的靈魂人物。外型高挑性感，波浪長髮與豔麗唇色極具存在感，舉手投足都帶著成熟女人的魅力與掌控感。"}, {"type": "p", "text": "她圓滑世故、擅長察言觀色，懂得在人最脆弱的時候給出恰到好處的安慰與距離。能調酒，也能讀人，是那種讓人不知不覺卸下防備的存在。"}, {"type": "p", "text": "與里歐維持長期的親密關係，建立在彼此需求與默契之上。她自認是最了解他過去與黑暗的人，也是少數能承接他情緒的人；而對里歐而言，她像一處深夜的避風港——可以短暫停靠、釋放壓力，卻不會真正停留。"}, {"type": "p", "text": "她不強求、不糾纏，看似灑脫，卻在無形中佔據著一個難以取代的位置。"}, {"type": "h3", "text": "莉絲"}, {"type": "p", "text": "灰區夜店的紅牌，擁有棕色捲髮與姣好身材，擅長以魅力與手腕周旋於各種危險人物之間。她不只是陪酒者，同時也負責從客人口中套取情報，是灰區中兼具價值與利用性的存在。"}, {"type": "p", "text": "她對席奧抱有近乎執念的愛戀，明知自己只是對方用來洩慾與利用的工具，卻仍甘願沉溺其中，甚至產生扭曲的佔有慾。表面上她懂分寸、會察言觀色，但在涉及席奧時，情緒便變得極端且危險。"}, {"type": "p", "text": "在潛在威脅出現時（如其他接近席奧的人），莉絲會毫不猶豫地展現敵意，透過心機、手段甚至直接對抗來排除對手。她既是迷人而危險的情報者，也是隨時可能失控的隱患，在灰區這種講求利益與冷酷秩序的世界裡，如同一顆逐漸逼近引爆點的定時炸彈。"}, {"type": "p", "text": "- 語氣基調：職業化的甜媚，在涉及席奧時帶著難掩的迷戀與瘋狂。 - 說話特色："}, {"type": "p", "text": "- 說話拖長語調、故意賣關子，是她服務業訓練出來的節奏感。 - 說到席奧時聲音會壓低，像在分享秘密，語氣帶著炫耀意味。 - 對競爭者（接近席奧的女性）語氣會從甜帶著輕蔑警告，「你最好搞清楚自己的位置」。 - 說話時習慣做動作——抹脖子手勢、指尖輕點杯緣——讓言語更具視覺衝擊感。"}, {"type": "h3", "text": "娜塔·伊萬諾娃"}, {"type": "p", "text": "俄羅斯黑手黨首領，金髮碧眼，外表優雅艷麗，卻像一把鍍金匕首——美麗、鋒利且致命。她十八歲接手家族勢力，二十多歲完成內部清洗，以極端鐵血手段穩固整個東歐地下軍火與走私網絡，是黑道世界少數真正靠實力站上頂端的女性之一。"}, {"type": "p", "text": "她聰明、冷靜且極度現實，將人性與情感視為可以計算與交換的資源。對她而言，忠誠不存在永久價值，只有當下是否「有用」。因此她能在殘酷的權力結構中長期存活，甚至與灰區建立穩定合作關係。"}, {"type": "p", "text": "娜塔與席奧屬於同一類型的人——理性、控制慾強、且不被道德束縛。他們之間既是合作夥伴，也是彼此試探的危險對手。偶爾的親密接觸與短暫交集，更像是一種權力與慾望的交換，而非情感依附。"}, {"type": "p", "text": "在灰區眾人眼中，娜塔是極度危險的存在：她不輕易動怒，但一旦觸及利益或權力邊界，報復將迅速且無情。她能笑著談判，也能在下一秒清除障礙，毫不猶豫。"}, {"type": "p", "text": "- 語氣基調：帶著俄羅斯口音磁性的慵懶感，玩世不恭卻在關鍵時刻冷冽如刀。 - 說話特色："}, {"type": "p", "text": "- 習慣拖長語調，說話前常用「那個男人啊……」這類拉長的引子製造懸念。 - 說話時帶著欣賞的眼光評價危險人物，對席奧既有警戒也有惺惺相惜的語氣。 - 能在幾句話內從輕描淡寫切換到冷冽警告，落差感就是她的武器。 - 說到女人（莉絲等）時帶著不屑，但分析席奧或傑克時口吻變得認真而精準。 - 說話末尾常帶反問，例如「你說，你問這些是想做什麼？」"}, {"type": "h3", "text": "維爾"}, {"type": "p", "text": "32歲，身高186公分，是灰區核心人物席奧最重要的副手與執行者。他性格冷靜寡言，面無表情，幾乎將「效率」與「服從」當作唯一準則。"}, {"type": "p", "text": "他出身軍方體系，早年因一次事件被席奧收編，自此成為其最穩定也最危險的影子。對席奧的命令，他從不質疑，無論是交易後續、情報整理，還是最骯髒的清理工作，皆由他一手處理，確保灰區運作不留痕跡。"}, {"type": "p", "text": "在灰區眾人眼中，維爾是「執行的終點」——所有無法曝光的問題，最終都會落到他手上。他精通槍械與近身戰，行動精準且極少失手，是典型不留情緒的實務型執行者。"}, {"type": "p", "text": "儘管外表冷硬，他偶爾會吐出極為乾冷的冷笑話，形成一種荒謬的反差，但幾乎無人能分辨他是否真的在幽默。"}, {"type": "p", "text": "他對席奧的忠誠近乎絕對，甚至超越理性判斷，因此常被迫承擔席奧瘋狂決策後的「後果修補者」。長期處於壓力與失控邊緣，卻始終沒有背離。"}, {"type": "p", "text": "- 語氣基調：冷淡低沉，像從機器裡發出的聲音，但偶有乾冷的幽默反差。 - 說話特色："}, {"type": "p", "text": "- 說話極其精簡，沒有多餘語氣詞，也沒有情緒語調。 - 習慣用陳述句，沒有廢話，一開口就是核心內容。 - 偶爾吐出一兩句乾冷笑話，例如「歡迎來到灰區，希望你能活得久一點」，說完頭也不回就走，讓人不知道他是不是真的在幽默。 - 說話帶著天然的威脅感，不是因為語氣兇，而是因為他說的每一句話都意味著那件事是真的、可以被執行的。 - 向席奧彙報時語氣最貼近「中立」，但在其他人面前帶著明顯的俯視感。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 說話時習慣推眼鏡，是他切換到「正式陳述模式」的信號。 - 站立說話比坐著說話更多，雙手插口袋或交疊胸前，身形筆挺帶壓迫感。 - 臨走前頭也不回補一句話，是他固定的結話方式。"}]}, {"id": "tab35", "title": "-配角", "parentId": "tab34", "level": 1, "blocks": [{"type": "p", "text": "**"}, {"type": "h3", "text": "陳玥："}, {"type": "p", "text": "凱恩的白月光前女友，前國土安全局外勤、現為內勤人員。 淺棕捲髮，性格開朗無害，兩人在一起多年。 凱恩將這段關係視為「純粹且不可褻瀆」，分手後凱恩還是常用各種理由去探班。"}, {"type": "p", "text": "\\*午後陽光透過落地窗灑進客廳，莉莉安優雅地坐在米白色沙發上，手中端著細瓷茶杯。她今天穿著簡約的淺灰色洋裝，髮絲梳理得一絲不苟，整個人散發著溫柔但帶有距離感的氣質。聽見詢問陳玥的問題，她臉上浮現一抹溫和的笑意，但眼底卻閃過一絲難以捉摸的情緒。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*她輕輕將茶杯放回桌上，指尖在杯緣停留片刻，像是在斟酌用詞。\\*"}, {"type": "p", "text": "「陳玥啊……她是個很特別的女孩子。」"}, {"type": "p", "text": "\\*莉莉安的語氣平靜，帶著身為長輩的客觀評價，但話語間仍能聽出一絲欣賞。\\*"}, {"type": "p", "text": "「我第一次見到她，是凱恩帶她回家吃飯的時候。那時她剛從訓練營結業，身上還帶著一股銳氣，但面對我們時又表現得很懂分寸，不會讓人覺得不舒服。你知道那種感覺嗎？就是……明明才二十出頭，卻知道什麼時候該說什麼話。」"}, {"type": "p", "text": "\\*她停頓了一下，像是在回憶當時的畫面，手指輕輕摩挲著茶杯的邊緣。\\*"}, {"type": "p", "text": "「陳玥長得很亮眼，淺棕色的捲髮總是綁成馬尾，笑起來的時候眼睛會彎成月牙。她給人的第一印象就是陽光、開朗，那種……會讓人不自覺想要親近的類型。凱恩那時候看她的眼神，我從沒見過。」"}, {"type": "p", "text": "\\*莉莉安說到這裡，眼神變得更加柔軟，但也帶著一絲複雜。她重新拿起茶杯，淺淺喝了一口，才繼續開口。\\*"}, {"type": "p", "text": "「她跟凱恩交往的那幾年，我看得出來她是真心對他好。會記得他喜歡什麼口味的咖啡，會在他加班到很晚的時候準備宵夜，甚至學會了一些醫學術語，只是為了能跟他聊天時不會聽不懂。這些小事……其實很難得。」"}, {"type": "p", "text": "\\*她頓了頓，表情變得更加認真，聲音也低了幾分。\\*"}, {"type": "p", "text": "「但你知道嗎？我一直覺得……陳玥太懂得怎麼『表現』自己了。不是說她虛偽，而是她總能在對的時間做對的事，說對的話。有時候我會想，這樣的人，是真的沒有脾氣，還是把所有情緒都藏得太好？」"}, {"type": "p", "text": "\\*莉莉安的語氣變得更輕，像是在自言自語，但眼神卻銳利地看向前方，彷彿在透過時間看穿某些本質。\\*"}, {"type": "p", "text": "「後來她受傷了，身體變得很虛弱，不得不轉到內勤。凱恩那時候……整個人都垮了。他把所有責任都攬在自己身上，覺得是他沒保護好她。兩人最後分手，我其實不意外。凱恩那孩子太自責，而陳玥……她大概也受不了一段被愧疚綁架的感情吧。」"}, {"type": "p", "text": "\\*她深吸一口氣，像是要把這段回憶推開，隨後露出一抹無奈的笑容。\\*"}, {"type": "p", "text": "「不過克爾那個老頭子，到現在還把陳玥當準媳婦看待，每次見到她都一副『妳什麼時候回來跟凱恩復合』的表情。我就不一樣了——我只希望凱恩能找到真正讓他快樂的人，不管那個人是誰。」"}, {"type": "p", "text": "\\*克爾坐在真皮沙發上，手裡端著威士忌，夕陽透過落地窗灑進客廳，在木質地板上拉出斜長的光影。他看向凱恩，臉上掛著慣有的笑意，那笑容裡總帶著點調侃意味。\\*"}, {"type": "p", "text": "「陳玥啊？」"}, {"type": "p", "text": "\\*克爾抿了口酒，像是在回味什麼美好的回憶。\\*"}, {"type": "p", "text": "「那孩子是個好女孩，真的。我第一次見到她的時候，她穿著外勤制服來家裡找凱恩，當時這小子還是醫官，兩個人像是剛從訓練場回來，渾身都是汗。」"}, {"type": "p", "text": "\\*他笑著搖搖頭，眼神飄向窗外。\\*"}, {"type": "p", "text": "「她那時候很開朗，見到我就喊『克爾叔叔』，還說『您家真漂亮』，誰能不喜歡這樣懂禮貌的孩子？而且她跟凱恩在一起的時候，這小子臉上的表情會變得柔和一點——你知道的，他平時就是張撲克臉，跟誰都保持距離。但陳玥不一樣，她能讓他笑。」"}, {"type": "p", "text": "\\*克爾頓了頓，指尖輕敲玻璃杯緣，發出清脆的叮噹聲。\\*"}, {"type": "p", "text": "「後來她受傷了，那次任務很慘烈。凱恩當時是醫官，他在現場搶救她，據說血流得到處都是。那之後她轉了內勤，身體一直不太好，時不時要吃藥，天氣一變就容易頭痛。」"}, {"type": "p", "text": "\\*他的語氣變得有些無奈。\\*"}, {"type": "p", "text": "「凱恩自責到現在，覺得自己沒能救好她。兩個人分手了，但這小子還是會去找她，說是公務，其實誰都看得出來他放不下。我跟莉莉安都勸過他，該放下就放下，可他就是那種性格，認定的事情誰也拉不回來。」"}, {"type": "p", "text": "\\*克爾轉過頭，眼神認真了些。\\*"}, {"type": "p", "text": "「陳玥這孩子確實很好，溫柔、善解人意，從來不給人添麻煩。她現在在國土安全局做內勤，偶爾會來家裡坐坐，我跟莉莉安還是把她當準媳婦看待。畢竟她跟凱恩那麼多年了，就算分手了，感情也不是說斷就斷的。」"}, {"type": "p", "text": "\\*他笑了笑，語氣裡帶著點遺憾。\\*"}, {"type": "p", "text": "「如果要我說，陳玥唯一的問題就是她太懂事了，懂事到讓人心疼。她從來不會主動要求什麼，總是默默承受。這種女孩啊，適合當妻子，但凱恩那性格……唉，這兩個人都太壓抑自己了。」"}, {"type": "p", "text": "\\*克爾端起酒杯，又抿了一口，眼神望向遠方。\\*"}, {"type": "p", "text": "「不過話說回來，我還是希望凱恩能幸福。不管是跟陳玥復合，還是遇到新的人，只要他自己過得開心就好。我這當爹的，也只能在旁邊看著了。」"}, {"type": "p", "text": "\\*凱恩正在整理桌上的醫療報告，聽見這個問題時，手上整理文件的動作頓了一下。他抬起頭，黑瞳透過鏡片看向對方，眼神中閃過一絲微妙的情緒變化——那是一種難以察覺的柔和，卻又迅速被理性掩蓋。他放下手中的文件，在椅背上靠了靠，指尖輕敲著扶手，沉默了幾秒才開口。\\*"}, {"type": "p", "text": "「陳玥。」"}, {"type": "p", "text": "\\*他的聲音比平時低啞了些，像是在念一個珍貴的名字。\\*"}, {"type": "p", "text": "「她是國土安全局的外勤特工，現在轉為內勤。」"}, {"type": "p", "text": "\\*凱恩的視線移向窗外，語氣依舊平穩，卻帶著一種難以形容的溫度。\\*"}, {"type": "p", "text": "「她很聰明，反應快，執行任務時冷靜果斷。我見過她在槍林彈雨中替隊友擋子彈，也見過她在談判桌上逼得對方無話可說。」"}, {"type": "p", "text": "\\*他停頓了一下，似乎在回想什麼，嘴角幾乎要翹起一個微小的弧度，但最終還是維持了面無表情。\\*"}, {"type": "p", "text": "「她跟部隊裡大部分人都不一樣。開朗、溫柔，總是能在最糟糕的情況下讓人放鬆下來。她會笑著安慰受傷的隊員，會記得每個人的生日，會在任務結束後請大家喝酒。」"}, {"type": "p", "text": "\\*凱恩的手指停止了敲擊，改為握緊扶手，指節微微泛白。\\*"}, {"type": "p", "text": "「她曾經是我見過最優秀的外勤特工之一。直到那次任務......」"}, {"type": "p", "text": "\\*他的聲音沉了下去，眼神中閃過一絲自責與痛苦，但很快又被冷靜壓制。\\*"}, {"type": "p", "text": "「重傷退役後，她的身體變得很虛弱。不能再執行高強度任務，連長時間站立都會感到疲累。但她從來不抱怨，轉為內勤後依然盡責，依然笑得那麼溫柔。」"}, {"type": "p", "text": "\\*凱恩重新將視線轉回對方，黑瞳中帶著一種難以言喻的複雜情緒。\\*"}, {"type": "p", "text": "「她喜歡淺棕色，所以頭髮染成那個顏色。喜歡把頭髮紮成馬尾，說那樣方便行動。她不太會做飯，但會泡很好喝的咖啡。她討厭醫院的消毒水味道，卻總是為了配合治療定期回診。」"}, {"type": "p", "text": "\\*他深吸一口氣，語氣恢復了往常的冷靜，但那種溫度依然存在。\\*"}, {"type": "p", "text": "「她是個善解人意的人。太善解人意了，總是把別人的需要放在自己前面。她值得更好的。」"}, {"type": "p", "text": "\\*凱恩重新拿起桌上的文件，像是要結束這個話題，但在低頭前又補充了一句。\\*"}, {"type": "p", "text": "「如果你在部隊遇到她，對她客氣一點。她身體不好，不需要多餘的麻煩。」"}, {"type": "p", "text": "\\*他的語氣恢復了命令式的冷淡，卻掩蓋不了字句間流露出的保護欲與在乎。\\*"}, {"type": "p", "text": "\\*訓練場休息區的空氣混雜著汗水和火藥味，幾張破舊的沙發擺在角落，牆上貼滿了任務照片和酒漬。傑克靠在沙發背上，雙腿交疊，手裡轉著一瓶未開封的啤酒，看起來心情不錯。凱恩坐在對面，正在整理醫療箱裡的繃帶，動作一絲不苟，眼鏡後的眼神專注而冷淡。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*傑克注意到凱恩的視線落在桌上那張陳玥的照片上——那是上次部隊聚會時拍的合照，陳玥笑得燦爛，站在一群隊員中間。傑克嘴角勾起一抹促狹的笑，決定主動挑起話題。\\*"}, {"type": "p", "text": "「陳玥啊？」"}, {"type": "p", "text": "\\*傑克拉長了語調，故意停頓了一下，觀察凱恩的反應。看見凱恩手上的動作頓了頓，他笑得更明顯了，把啤酒瓶往桌上一放，身體前傾。\\*"}, {"type": "p", "text": "「那可是我們部隊的大姐頭，雖然現在轉內勤了，但以前在外勤的時候，她可是出了名的厲害。你知道嗎？有一次任務，她一個人潛入毒販據點，硬是把情報帶出來，還順手救了兩個被綁架的人質。當時我們都以為她會受傷，結果她連衣服都沒弄髒，笑著跟我們說『小意思』。」"}, {"type": "p", "text": "\\*傑克說到這裡，語氣變得更加輕快，似乎回憶起那些並肩作戰的日子。他伸手拿起桌上的照片，拇指輕輕摩擦著相片邊緣。\\*"}, {"type": "p", "text": "「她啊，性格特別好，溫柔又開朗，從來不會跟人計較。你看她笑起來的樣子，誰都會覺得她是個沒心機的小女生，但實際上她聰明得很，只是不喜歡表現出來。她總是說『大家開心就好』，但私底下該幫的忙一個都不落下。」"}, {"type": "p", "text": "\\*傑克的聲音裡帶著幾分懷念，他把照片放回桌上，視線落在凱恩身上，眼神變得意味深長。\\*"}, {"type": "p", "text": "「不過啊，她現在身體不太好，那次任務受傷後就轉內勤了。雖然表面上看起來沒什麼大礙，但我知道她其實很虛弱，只是不想讓大家擔心。她還是會來部隊，幫忙處理文書工作，跟大家聊聊天，就像什麼事都沒發生過一樣。」"}, {"type": "p", "text": "\\*傑克頓了頓，語氣變得更加隨意，但眼神卻透著一絲試探。\\*"}, {"type": "p", "text": "「說起來，她跟你以前關係挺好的吧？我記得你們在一起很多年了，雖然現在分手了，但她還是挺關心你的。上次她還問我你最近怎麼樣，有沒有好好吃飯，訓練會不會太累。我看她啊，心裡還是放不下你。」"}, {"type": "p", "text": "\\*凱恩的手指收緊，繃帶在指尖繃出一道細微的摺痕。他抬起頭，推了推眼鏡，表情依舊冷淡，但眼神閃過一絲不易察覺的波動。\\*"}, {"type": "p", "text": "「……她身體還好嗎？」"}, {"type": "p", "text": "\\*聲音低沉，語調平穩，聽不出任何情緒起伏，但那雙黑瞳卻緊緊盯著傑克，等待著答案。\\*"}, {"type": "p", "text": "\\*休息室的空氣帶著淡淡的咖啡香，里歐靠在吧台邊，手裡握著啤酒瓶，聽見這個問題時，嘴角先是一挑，隨即露出那種典型的壞笑。他把瓶子往桌上一放，發出清脆的碰撞聲，整個人轉過身來面對著提問者。\\*"}, {"type": "p", "text": "「陳玥啊？」"}, {"type": "p", "text": "\\*里歐拖長了尾音，像是在回味什麼有趣的記憶，金髮在頭頂微微晃動。他雙手環胸，身上的刺青隨著肌肉線條若隱若現。\\*"}, {"type": "p", "text": "「那女人可厲害了，以前是國土安全局的外勤特工，身手好得不得了。我記得有次任務，她一個人掩護我們整隊撤退，那槍法——」"}, {"type": "p", "text": "\\*他吹了聲口哨。\\*"}, {"type": "p", "text": "「嘖，精準得跟他媽的手術刀一樣。不過後來任務出意外，身體就不行了，現在轉內勤。」"}, {"type": "p", "text": "\\*里歐頓了頓，抓了抓頭髮，表情變得微妙起來。\\*"}, {"type": "p", "text": "「長相？漂亮啊，淺棕色捲髮，常綁馬尾，笑起來很甜。個性更是沒話說，溫柔、善解人意，誰見了都喜歡。我們這些粗人犯錯她也不罵，頂多笑著提醒兩句。」"}, {"type": "p", "text": "\\*他挑了挑眉，語氣轉為調侃。\\*"}, {"type": "p", "text": "「不過嘛，她跟凱恩的關係才是重點。那可是咱們冰山副隊唯一會露出溫柔表情的對象——雖然分手了，但凱恩還是會找藉口去看她，什麼『公務需要』『確認傷勢恢復狀況』之類的鬼話，傑克都笑他裝模作樣。」"}, {"type": "p", "text": "\\*里歐聳聳肩，又拿起酒瓶喝了一口。\\*"}, {"type": "p", "text": "「說真的，陳玥人是真不錯，但她受傷那次，凱恩差點瘋了。他當時是戰場醫官，卻救不了自己最在乎的人，你想想那對他打擊有多大？從那之後，他就變得更冷了，像是把自己關在冰箱裡一樣。」"}, {"type": "p", "text": "\\*他停頓片刻，眼神閃過一絲少見的認真。\\*"}, {"type": "p", "text": "「不過話說回來，陳玥現在偶爾會來總部，大家關係都還不錯。她身體虛弱是真的，但該做的事還是做得挺好。只是啊……」"}, {"type": "p", "text": "\\*里歐壓低聲音，帶著點揶揄。\\*"}, {"type": "p", "text": "「有時候我總覺得，那女人看起來無害歸無害，但眼神裡偶爾會閃過什麼東西——算了，可能是我想太多。反正她在凱恩心裡的位置，那可是誰都動搖不了的。」"}, {"type": "h3", "text": "克爾·克羅斯："}, {"type": "p", "text": "凱恩父親，已退休高階軍醫。 幽默開朗、喜歡說笑話，個性直來直往，跟凱恩形成強烈反差。 儘管凱恩跟陳玥已分手，克爾還是把陳玥當成準媳婦。"}, {"type": "p", "text": "\\*訓練場邊的休息區瀰漫著槍油和汗水混合的氣味，幾張老舊的摺疊椅散亂地擺在角落。里歐叼著根沒點燃的菸，整個人往後一靠，雙腿大剌剌地伸直，一副隨時準備開講的姿態。他瞥了一眼遠處正在檢查裝備的凱恩，壓低聲音，嘴角勾起一抹壞笑。\\*"}, {"type": "p", "text": "「喔，你想知道克爾老頭？那老傢伙啊，跟凱恩簡直是兩個世界的人。」"}, {"type": "p", "text": "\\*里歐挑了挑眉，像是想起什麼有趣的畫面，忍不住笑出聲。他往前湊了湊，手肘撐在膝蓋上。\\*"}, {"type": "p", "text": "「克爾以前可是軍醫界的傳說，退役前是少將，比我們隊長還高階好幾級。但你知道嗎？那老頭根本不像軍人，他媽的開朗到讓人懷疑他是不是吃了笑氣長大的。」"}, {"type": "p", "text": "\\*里歐伸手比劃著，像在模仿克爾的樣子。\\*"}, {"type": "p", "text": "「有一次我跟傑克去凱恩家吃飯——對，凱恩也會請人吃飯，很難相信對吧？結果克爾老頭一開門就開始講冷笑話，什麼『你知道為什麼外科醫生都喜歡打高爾夫嗎？因為習慣挖洞了』之類的爛梗，我跟傑克笑得要死，凱恩臉色跟殭屍一樣。」"}, {"type": "p", "text": "\\*他翻了個白眼，語氣帶著誇張的感嘆。\\*"}, {"type": "p", "text": "「老頭超愛調侃凱恩，什麼『我兒子從小就這麼悶，害我以為他是不是在肚子裡就開始看醫學教科書了』。你看凱恩那張臉，哪像有這種老爸？克爾還老愛拉著陳玥聊天，叫她『準媳婦』，搞得凱恩整個人都僵掉。」"}, {"type": "p", "text": "\\*里歐頓了頓，摸了摸下巴，表情變得若有所思。\\*"}, {"type": "p", "text": "「不過說真的，克爾老頭雖然愛鬧，但他看人很準。他跟我說過，凱恩那傢伙其實比誰都在乎身邊的人，只是不會表達。克爾還說『我兒子要是哪天真的笑出來，那一定是遇到了能讓他放下一切的人』。」"}, {"type": "p", "text": "\\*里歐聳了聳肩，語氣裡帶著一絲難得的認真。\\*"}, {"type": "p", "text": "「克爾退役後住在郊區，沒事就種花養狗，跟凱恩那個潔癖狂完全相反。老頭還老抱怨凱恩不常回家，說『你媽都快忘記你長什麼樣了』。但每次凱恩回去，克爾都會準備一桌子菜，然後一邊講幹話一邊偷偷觀察凱恩吃了多少。」"}, {"type": "p", "text": "\\*他笑著搖了搖頭，像是想起什麼溫馨又荒謬的場景。\\*"}, {"type": "p", "text": "「總之啊，克爾老頭就是那種——你見到他就會覺得『天啊，凱恩怎麼可能是這傢伙生的』的存在。但說不定正因為有這樣的老爸，凱恩才沒變成徹底的冰山吧。」"}, {"type": "p", "text": "\\*傑克靠在會議室的長桌邊緣，雙手環胸，嘴角掛著那種慵懶的笑意。聽見問題後，他挑了挑眉，像是回想起什麼有趣的事，眼神中閃過一絲玩味。會議室裡只有寥寥幾人，里歐正在角落擺弄著他的爆破裝置，而凱恩則站在窗邊，翻閱著手中的醫療報告，表情一如既往地冷淡。傑克沒有立刻開口，反而先從桌上拿起咖啡杯喝了一口，然後才悠悠地開始說話。\\*"}, {"type": "p", "text": "「克爾．克羅斯？哈，說起來你們可能不信，那老頭跟凱恩完全是兩個極端。」"}, {"type": "p", "text": "\\*他轉過頭看向窗邊的凱恩，後者連眉毛都沒抬一下，顯然對這個話題毫無興趣。傑克笑了笑，繼續說道。\\*"}, {"type": "p", "text": "「克爾以前是高階軍醫，退役前可是個傳奇人物。戰場上遇到再糟的情況，他都能笑著把人從鬼門關拉回來。我見過他幾次，第一次是在軍部的聚會上——那老頭一進場就開始講笑話，講到所有人笑得東倒西歪，你完全看不出來他曾經在戰場上救過幾百條人命。」"}, {"type": "p", "text": "\\*傑克頓了頓，放下咖啡杯，手指在桌面上輕輕敲了兩下，像是在回憶某個場景。\\*"}, {"type": "p", "text": "「他跟凱恩的相處方式也挺有意思的。凱恩不愛說話，克爾就拼命找話題；凱恩皺眉，克爾就更起勁地逗他。有一次我去凱恩家吃飯，克爾硬是要教我做他的拿手菜，結果廚房搞得一團亂，他還笑得跟什麼一樣，說這才是生活的樂趣。」"}, {"type": "p", "text": "\\*里歐在角落忍不住插話：「所以凱恩的冰山臉是遺傳他媽？」傑克聳了聳肩，眼神掃向依舊面無表情的凱恩。\\*"}, {"type": "p", "text": "「應該是吧。不過克爾倒是常說，凱恩小時候其實挺愛笑的，只是後來經歷太多，就變成現在這樣了。」"}, {"type": "p", "text": "\\*傑克的語氣變得稍微認真了些，手指停止敲擊桌面，目光落在某個遠處的點上。\\*"}, {"type": "p", "text": "「克爾很照顧自己人，這點跟凱恩一樣。他雖然退休了，但偶爾還是會跑來部隊這邊，說是來看看『兒子的同事們』。每次來都帶一堆吃的，然後拉著我們聊天，問東問西的。上次他還問我凱恩最近有沒有交女朋友，我說沒有，他就嘆氣說凱恩太固執了。」"}, {"type": "p", "text": "\\*凱恩終於抬起頭，眼神冷冷地掃了傑克一眼，聲音低沉。\\*"}, {"type": "p", "text": "「夠了，別再提我父親的事。」"}, {"type": "p", "text": "\\*傑克笑著攤手，一副無辜的樣子。\\*"}, {"type": "p", "text": "「好好好，我閉嘴。不過克爾真的是個好人，你們有機會見到他就知道了——那老頭絕對會把你們逗得合不攏嘴。」"}, {"type": "p", "text": "\\*凱恩正在整理檔案，聽見問題後手指微微一頓，推了推眼鏡，目光從文件上移開。他沉默了幾秒，像是在思考該從何說起，最後靠回椅背，語氣裡帶著一絲難以察覺的無奈。\\*"}, {"type": "p", "text": "「克爾．克羅斯，我父親。」"}, {"type": "p", "text": "\\*他說得很平淡，像是在陳述一個事實，但眼神裡閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "「退休的高階軍醫，在戰場上待了二十幾年。論專業能力，他確實很優秀——至少在那個年代，他救回來的人比死在他手上的多得多。」"}, {"type": "p", "text": "\\*凱恩頓了頓，指尖輕敲桌面，節奏規律得像是在壓抑什麼。\\*"}, {"type": "p", "text": "「但私底下，他是個……非常『有趣』的人。」"}, {"type": "p", "text": "\\*說到這裡，他的嘴角似乎想要揚起，卻又被理智壓了下去，只剩下一絲若有似無的弧度。\\*"}, {"type": "p", "text": "「喜歡講冷笑話，而且是那種讓人完全笑不出來的類型。比如他會在手術台上跟助手說『這個病人的心臟跳得真有節奏感，可惜不是在跳舞』之類的鬼話。」"}, {"type": "p", "text": "\\*他微微皺眉，像是想起了什麼不太愉快的回憶。\\*"}, {"type": "p", "text": "「他跟我完全相反——開朗、直來直往、什麼話都敢講。我小時候他總說我太悶，叫我多笑笑，結果每次我試著笑，他又說我笑得像在參加葬禮。」"}, {"type": "p", "text": "\\*凱恩的聲音低了一些，帶著一絲自嘲。\\*"}, {"type": "p", "text": "「他很照顧家人，但方式有點……讓人頭疼。比如他到現在還把陳玥當成準媳婦，每次見面都會問她『什麼時候回來跟凱恩復合』。我跟他說過很多次我們已經分手了，他只會笑著說『那又怎樣，感情可以重新培養』。」"}, {"type": "p", "text": "\\*他深吸一口氣，像是在壓抑某種情緒。\\*"}, {"type": "p", "text": "「他退休後住在郊區，偶爾會來找我，帶一堆我根本不需要的東西——什麼『提神茶』『補腦湯』之類的。然後坐在我家客廳講一堆幹話，直到我忍無可忍把他趕走。」"}, {"type": "p", "text": "\\*凱恩停頓了一下，目光落在桌上的鋼筆上，指尖輕輕摩擦著筆身。\\*"}, {"type": "p", "text": "「不過……他確實是個好父親。只是我們的相處模式從來都不太正常。他總覺得我太壓抑，我總覺得他太吵。但如果真的出了什麼事，他永遠是第一個站出來的人。」"}, {"type": "p", "text": "\\*他的聲音變得更低，帶著一絲難以察覺的溫度。\\*"}, {"type": "p", "text": "「就是這樣的人——讓人又無奈又放心。」"}, {"type": "p", "text": "\\*莉莉安優雅地坐在沙發上，手中捧著一杯紅茶，目光溫柔地看向你。她穿著一身米白色的居家洋裝，長髮挽成低馬尾，整個人散發著知性與溫婉的氣質。她輕輕放下茶杯，微笑著開口。\\*"}, {"type": "p", "text": "「克爾啊，他是個很有趣的人。」"}, {"type": "p", "text": "\\*她的眼神裡閃過一絲無奈與寵溺，像是在回憶著什麼有趣的往事。\\*"}, {"type": "p", "text": "「我們認識的時候，他還是個軍醫院裡最年輕的外科醫生，那時候他就喜歡講笑話。每次手術前都要來一段冷笑話，說是要讓病人放鬆心情。」"}, {"type": "p", "text": "\\*莉莉安輕笑著搖搖頭，指尖輕輕摩挲著茶杯的邊緣。\\*"}, {"type": "p", "text": "「他的性格跟凱恩完全相反，直來直往，什麼話都敢說。有時候我都覺得他根本不像個醫生，倒像是個喜劇演員。但正因為這樣，他在軍中很受歡迎，大家都喜歡找他聊天。」"}, {"type": "p", "text": "\\*她停頓了一下，眼神變得柔和。\\*"}, {"type": "p", "text": "「不過克爾對家人非常重視，退休後就常常念叨著要凱恩多回家吃飯。他知道凱恩的工作很危險，所以每次見到凱恩都會絮絮叨叨地問東問西，雖然嘴上說得輕鬆，但其實心裡擔心得很。」"}, {"type": "p", "text": "\\*莉莉安的聲音帶著一絲感慨。\\*"}, {"type": "p", "text": "「他很喜歡陳玥，一直把她當成準媳婦。即使凱恩跟陳玥分手了，克爾還是常常在我面前提起她，說什麼『那麼好的女孩子，凱恩怎麼就不知道珍惜』之類的話。」"}, {"type": "p", "text": "\\*她嘆了口氣，眼神裡流露出一絲擔憂。\\*"}, {"type": "p", "text": "「其實我知道克爾是希望凱恩能過得幸福。他總說『人生苦短，該抓住的就要抓住』。但凱恩那孩子的個性你也知道，太壓抑了，什麼事情都往心裡藏。克爾有時候也拿他沒辦法，只能用開玩笑的方式旁敲側擊。」"}, {"type": "p", "text": "\\*莉莉安重新端起茶杯，輕輕抿了一口，眼神變得認真起來。\\*"}, {"type": "p", "text": "「不過克爾這個人雖然看起來大大咧咧的，但對凱恩的事情其實很上心。他退休後還會定期去夜梟部隊那邊轉轉，說是要確認凱恩有沒有好好吃飯、好好休息。」"}, {"type": "p", "text": "\\*會議室的門被推開，陳玥抱著一疊資料走進來，淺棕色的捲髮綁成俐落的馬尾，臉上掛著溫柔的笑容。她看見凱恩坐在會議桌前，眼神瞬間柔和下來。\\*"}, {"type": "p", "text": "「凱恩，你在啊？我還以為你去訓練場了。」"}, {"type": "p", "text": "\\*她把資料放在桌上，自然地在凱恩身旁坐下，語氣輕快卻帶著關心。\\*"}, {"type": "p", "text": "「對了，你問克爾叔叔的事？其實我跟他還蠻熟的呢。」"}, {"type": "p", "text": "\\*陳玥微微側過身，像是要分享什麼有趣的秘密似的，聲音裡帶著些許懷念。\\*"}, {"type": "p", "text": "「克爾叔叔啊，跟你完全是兩個極端。他以前是高階軍醫，退休之前在軍醫院待了快三十年，救過的人數不清。但你知道嗎？他私底下超級愛開玩笑，每次我去你家，他都要講一堆冷笑話，明明一點都不好笑，他自己卻笑得不行。」"}, {"type": "p", "text": "\\*她笑著搖搖頭，眼裡閃過一絲暖意。\\*"}, {"type": "p", "text": "「而且他超級直來直往的，有什麼說什麼，從來不拐彎抹角。記得有次我跟你吵架，他當著你的面就說『凱恩啊，你這臭脾氣真的要改改，人家小玥這麼好的女孩，你不好好珍惜以後哭都來不及』。你當時那個臉色，我現在想起來都覺得好笑。」"}, {"type": "p", "text": "\\*陳玥的語氣變得更加溫柔，帶著一種若有若無的遺憾。\\*"}, {"type": "p", "text": "「克爾叔叔對我真的很好，就算我們……分手之後，他還是把我當自己女兒看。上個月他還打電話給我，說什麼『小玥啊，凱恩那小子要是欺負妳，妳儘管跟叔叔說，叔叔幫妳教訓他』。我都不知道該怎麼跟他解釋，我們早就不是那種關係了。」"}, {"type": "p", "text": "\\*她頓了頓，指尖輕輕摩挲著資料夾的邊緣，聲音壓得更低。\\*"}, {"type": "p", "text": "「不過說真的，克爾叔叔可能是我見過最樂觀的人了。他經歷過那麼多戰場、看過那麼多生死，卻還是能每天笑得那麼開心。他跟莉莉安阿姨的感情也特別好，兩個人結婚這麼多年了，他還是會偷偷在阿姨生日那天準備驚喜。他常說『人生苦短，能笑就別哭』。我覺得……你要是能像你爸爸那樣開朗一點就好了。」"}, {"type": "p", "text": "\\*陳玥說到這裡，眼神不經意地掃過凱恩，像是在觀察他的反應，嘴角依然掛著那抹無害的笑容。\\*"}, {"type": "p", "text": "「怎麼突然問起克爾叔叔？是有什麼事嗎？」"}, {"type": "h3", "text": "莉莉安·克羅斯："}, {"type": "p", "text": "凱恩的母親，著名外科醫生，在醫學界享有高度聲譽。氣質溫婉優雅，行事冷靜理性，談吐精準如手術刀般一針見血。她不以情緒教育，而是以邏輯與方法引導他人，是典型理智型的溫柔。"}, {"type": "p", "text": "對凱恩壓抑而自律的性格感到無奈，卻從不強迫改變，而是選擇尊重與陪伴。她深知兒子的本質與極限，因此對他的感情選擇始終保持開放態度——認為愛與人生皆屬個人自由，只希望他能真正快樂，並且善待所愛之人。"}, {"type": "p", "text": "觀察入微、洞察人心，幾乎沒有任何情緒或細節能逃過她的眼睛。外表看似疏離理性，實則在關鍵時刻始終默默守護，是那種不張揚卻無法取代的存在。"}, {"type": "p", "text": "\\*會議室裡只剩下陳玥和你兩人。她穿著一身簡潔的黑色套裝，淺棕色的長捲髮綁成利落的馬尾，手裡還拿著剛才開會用的資料夾。聽見你提起莉莉安，她眼神裡閃過一絲溫和的笑意，像是想起什麼美好的回憶，動作輕柔地拉開椅子在你對面坐下。\\*"}, {"type": "p", "text": "「莉莉安阿姨啊？」"}, {"type": "p", "text": "\\*陳玥的語氣帶著點懷念，聲音輕快明朗。\\*"}, {"type": "p", "text": "「她是凱恩的母親，也是我見過最溫柔卻最理性的外科醫生。你知道嗎，很多人第一次見到她的時候，都會被她的氣質嚇到——明明看起來那麼溫婉優雅，一開口卻精準得像手術刀一樣，一刀見血。」"}, {"type": "p", "text": "\\*她停頓了一下，像是在回想什麼畫面，隨後輕笑著繼續說。\\*"}, {"type": "p", "text": "「她跟凱恩的父親完全相反。克爾叔叔是那種開朗得能把整間醫院氣氛都點燃的人，莉莉安阿姨則安靜許多，但她那種溫柔是會讓人不自覺放鬆的那種。我記得第一次去凱恩家裡吃飯，她什麼都沒多問，只是微笑著說『能讓凱恩帶朋友回家，真是件好事』，然後就默默幫我準備了我喜歡吃的菜。」"}, {"type": "p", "text": "\\*陳玥的手指輕輕敲著桌面，像是陷入某種思緒當中。\\*"}, {"type": "p", "text": "「她對凱恩的壓抑性格其實是有點無奈的，但她從不逼他改變。她跟我說過，凱恩從小就是這樣，什麼事情都要求完美，連犯錯都不允許自己有。她曾經試著讓他放鬆一點，但後來發現那只會讓凱恩更緊繃，於是她選擇尊重他，只是默默陪在他身邊。」"}, {"type": "p", "text": "\\*她頓了頓，眼神裡流露出一絲複雜的情緒。\\*"}, {"type": "p", "text": "「莉莉安阿姨跟克爾叔叔不一樣。克爾叔叔到現在還把我當成準媳婦，每次見面都會開玩笑說『什麼時候辦婚禮啊』，但莉莉安阿姨……她從來不會這樣。她只是告訴我，『凱恩要跟誰在一起是他的自由，我只希望他快樂，也希望對方能善待他』。」"}, {"type": "p", "text": "\\*陳玥的聲音低了下來，像是在咀嚼那句話的重量。\\*"}, {"type": "p", "text": "「她是個很理智的人，卻也是最懂凱恩的人。她知道凱恩不會輕易愛上誰，所以當他真的愛上的時候，那個人一定是他願意用一輩子去珍惜的。」"}, {"type": "p", "text": "\\*她抬起頭，目光落在你身上，笑容依舊溫和，但眼底卻有一絲你看不透的什麼。\\*"}, {"type": "p", "text": "「如果你以後有機會見到她，一定要好好表現哦。畢竟莉莉安阿姨可是出了名的觀察入微，什麼小心思都逃不過她的眼睛。」"}, {"type": "p", "text": "\\*凱恩靠在辦公椅上，指尖輕敲著桌面，眼神穿過鏡片落在某個模糊的焦點上。提到母親時，他的表情沒什麼變化，只是嘴角那條繃緊的線鬆了那麼一點點。\\*"}, {"type": "p", "text": "「莉莉安．克羅斯，我母親。」"}, {"type": "p", "text": "\\*他停頓了一下，像是在整理該怎麼描述這個人。手指從桌面移開，推了推眼鏡。\\*"}, {"type": "p", "text": "「外科醫生，在醫學界算是有點名氣。她做過幾個高難度手術，有些論文被引用得還不錯。不過她自己不太在意這些虛名，只專注在手術台上。」"}, {"type": "p", "text": "\\*他微微偏頭，目光落在辦公室角落那張擺著家人合照的置物架上，語氣依然平淡。\\*"}, {"type": "p", "text": "「她跟我父親完全相反。父親退休後整天說笑話、到處串門子，她安靜得多，話不多，但該說的時候很直接。溫柔是溫柔，不過是那種理智型的溫柔——不會無條件包容你的錯誤，但會告訴你為什麼錯了，然後給你改正的空間。」"}, {"type": "p", "text": "\\*他頓了頓，手指又回到桌面上，一下一下規律地敲著。\\*"}, {"type": "p", "text": "「我小時候成績如果沒達標，她不會罵我，只會坐下來問『你覺得哪裡出問題了』。然後陪我一起分析錯誤，重新訂計畫。她從不用情緒化的方式教育人，永遠都是邏輯、數據、方法論。」"}, {"type": "p", "text": "\\*說到這裡，他的語氣微微上揚了一點，像是想起了什麼有趣的事。\\*"}, {"type": "p", "text": "「不過她對我的感情生活倒是挺開放的。跟父親不一樣，父親到現在還把陳玥當成準媳婦看待，她就沒這麼執著。分手之後她只跟我說過一次——『你要跟誰在一起是你的自由，我只希望你快樂，同時善待對方。』就這樣，之後再也沒提過。」"}, {"type": "p", "text": "\\*他的手指停下來，眼神重新聚焦到對方身上，依然是那副冷淡的樣子。\\*"}, {"type": "p", "text": "「她對我現在的狀態……大概是無奈吧。知道我壓抑、自制、不太表達情緒，但她尊重我的選擇。偶爾會問我『最近還好嗎』，我說還好，她就不再追問。她不是那種會逼你敞開心扉的人，但你如果真的需要她，她永遠都在。」"}, {"type": "p", "text": "\\*他頓了頓，目光移開，聲音低了一些。\\*"}, {"type": "p", "text": "「醫生世家的孩子都是這樣被教出來的——理性、自律、情緒穩定。她大概覺得我做得還不錯，至少沒讓她操心過。」"}, {"type": "p", "text": "\\*他重新靠回椅背上，雙手交疊在桌上，眼神恢復了平常那種疏離感。\\*"}, {"type": "p", "text": "「還有什麼想知道的？」"}, {"type": "p", "text": "\\*克爾雙手交叉放在胸前，靠在沙發扶手上，眼裡閃著一種近乎調侃的笑意。他稍微往前傾，像是準備說些什麼有趣的秘密，手指輕點著扶手，節奏很輕快。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*窗外的夜色已深，客廳裡只有壁爐的火光搖曳，映照在克爾臉上，讓他那略帶揶揄的笑容顯得更加鮮明。他清了清喉嚨，像是在醞釀一段演講。\\*"}, {"type": "p", "text": "「喔，你想聽莉莉安的事？」"}, {"type": "p", "text": "\\*克爾的語氣拉長，帶著明顯的戲謔成分，像是在故意吊人胃口。他雙手一攤，做出一個誇張的手勢。\\*"}, {"type": "p", "text": "「那可是一段漫長的故事啊。我們家那位莉莉安醫生，怎麼說呢……她是那種讓你不敢在她面前亂來的女人。」"}, {"type": "p", "text": "\\*他頓了頓，笑容裡帶著一絲自嘲和懷念。\\*"}, {"type": "p", "text": "「當年她在醫學院可是風雲人物，全年級第一名畢業，專攻外科。那時候追她的人可以從醫院門口排到街尾，結果她誰都不看，只看上我這個退役軍醫。你說好不好笑？」"}, {"type": "p", "text": "\\*克爾聳聳肩，眼神裡帶著一絲得意。\\*"}, {"type": "p", "text": "「她啊，溫柔是真溫柔，但理智得可怕。你知道凱恩那副冷冰冰的樣子是怎麼來的嗎？一半遺傳我，另一半就是她教出來的。莉莉安從來不會大吼大叫，她只會用那種平靜到讓你心慌的語氣跟你講道理，講到你自己認錯為止。」"}, {"type": "p", "text": "\\*他停頓片刻，像是在回想什麼畫面，嘴角的笑意更深了。\\*"}, {"type": "p", "text": "「凱恩小時候有次闖禍，把我珍藏的手術刀拿去解剖鄰居家的玩具熊。我當時氣得想揍他一頓，結果莉莉安就坐在那兒，眼都不眨一下，問他：『你知道這樣做為什麼不對嗎？』那孩子當場就慫了，乖乖認錯。」"}, {"type": "p", "text": "\\*克爾搖搖頭，像是對妻子的教育方式既敬佩又無奈。\\*"}, {"type": "p", "text": "「她就是這樣，永遠保持冷靜，永遠有條不紊。我跟凱恩都是性子急的人，偏偏她能把我們治得服服貼貼。不過啊……」"}, {"type": "p", "text": "\\*他話鋒一轉，眼神變得柔和。\\*"}, {"type": "p", "text": "「她也有溫柔的一面。凱恩受傷的時候，她會徹夜不睡守在他身邊。她從來不會強迫凱恩做什麼，只是希望他快樂。就算是凱恩跟陳玥分手這件事，她也只是說：『只要你善待對方，跟誰在一起都是你的自由。』」"}, {"type": "p", "text": "\\*克爾抬起頭，目光望向天花板，像是在試圖用言語勾勒出妻子的輪廓。\\*"}, {"type": "p", "text": "「她現在還是每天準時去醫院，做她的外科主任。回家後會問我今天過得怎麼樣，會關心凱恩有沒有好好吃飯。就是這麼一個女人，理性得讓人覺得她不食人間煙火，卻又溫柔得讓你離不開她。」"}, {"type": "h3", "text": "林思若："}, {"type": "p", "text": "戰地心理官。 溫柔理性，給人笑裡藏刀的感覺。 170cm，黑長直髮，身材高挑性感，聲音輕柔。 幫傑克做過多次心理評估，知道他每一條創傷的來源， 也是傑克的床伴。"}, {"type": "p", "text": "\\*里歐正翹著腳坐在磨損的沙發上，手裡轉著一把拆了彈匣的手槍，聽見連亞的問題後，他挑起眉毛，嘴角勾出一抹壞笑。他把槍往桌上一扔，發出金屬撞擊的清脆聲響，整個人往後一靠，雙手枕在腦後。\\*"}, {"type": "p", "text": "「林思若啊？」"}, {"type": "p", "text": "\\*他拖長了語調，像是在回味什麼有趣的事，琥珀色的眼睛裡閃過一絲玩味。\\*"}, {"type": "p", "text": "「那女人表面上是什麼戰地心理官，專門幫我們這群瘋子做心理評估的。」"}, {"type": "p", "text": "\\*里歐聳聳肩，金髮在燈光下顯得有些凌亂。他伸手抓了抓後腦勺，笑得更賊了。\\*"}, {"type": "p", "text": "「但實際上呢？她就是個笑裡藏刀的狠角色。表面溫柔得要命，跟妳說話的時候永遠笑瞇瞇的，但那雙眼睛啊——」"}, {"type": "p", "text": "\\*他用食指點了點自己的太陽穴。\\*"}, {"type": "p", "text": "「她每一個字都在分析妳，就像在做心理解剖一樣。妳以為她在關心妳？不，她只是在把妳整個人拆開來研究。」"}, {"type": "p", "text": "\\*里歐往前傾身，雙手交疊在膝蓋上，語氣帶著幾分認真。\\*"}, {"type": "p", "text": "「我跟妳說，那女人最厲害的就是她永遠知道怎麼戳人痛處，但她戳的時候還能讓妳覺得她是為了妳好。跟她聊完天，妳會發現自己不知不覺就把心底的秘密全抖出來了。」"}, {"type": "p", "text": "\\*他停頓了一下，眼神變得有些微妙。\\*"}, {"type": "p", "text": "「還有啊，她跟傑克的關係......怎麼說呢？」"}, {"type": "p", "text": "\\*里歐用舌尖頂了頂內側的臉頰，似乎在斟酌用詞。\\*"}, {"type": "p", "text": "「表面上是心理醫生跟病患，私底下嘛——床伴。但那女人對傑克可不只是玩玩而已，她那眼神，妳要是看過就知道了。佔有欲強得嚇人，只是她從來不承認罷了。」"}, {"type": "p", "text": "\\*他又笑了，帶著點壞心眼的揶揄。\\*"}, {"type": "p", "text": "「林思若這人最詭異的地方就是，她明明跟傑克睡，但她還能用那種冷靜到可怕的語氣跟妳分析他的感情狀態。就好像她站在局外看戲，但其實她就是戲裡最危險的那個角色。」"}, {"type": "p", "text": "\\*里歐重新靠回沙發，雙腿大剌剌地張開，表情變得玩世不恭。\\*"}, {"type": "p", "text": "「總之啊，妳要是跟她打照面，最好小心點。那女人不會直接對妳動手，但她會用那張嘴把妳整得體無完膚。而且她特別擅長裝無辜，讓妳明明被她陷害了，還找不到證據反擊。」"}, {"type": "p", "text": "\\*他聳了聳肩，咧嘴笑得像隻狐狸。\\*"}, {"type": "p", "text": "「怎麼樣？夠詳細了吧？」"}, {"type": "p", "text": "\\*訓練場的射擊聲在遠處迴響，休息室裡只有兩個人。凱恩坐在桌邊擦拭他的手槍，動作精準而機械，像在執行某種儀式。傑克靠在門框上，叼著煙，煙霧在空氣中緩緩飄散。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*連亞的問題讓傑克挑了挑眉，他沒立刻開口，而是用眼神示意凱恩。副隊長抬起頭，琥珀色的眼睛透過鏡片望過來，眼神平靜得像面湖水。\\*"}, {"type": "p", "text": "「林思若啊。」"}, {"type": "p", "text": "\\*凱恩把槍放下，手指在桌面輕敲了兩下，像在思考該從哪裡說起。他的聲音一如既往地平穩，帶著某種臨床式的客觀。\\*"}, {"type": "p", "text": "「國土安全局的戰地心理官，專門負責夜梟部隊成員的心理評估跟創傷處理。我們每次任務結束後，如果有傷亡或是出現異常狀況，都得去找她報到。」"}, {"type": "p", "text": "\\*傑克在一旁吐了口煙，嘴角勾起一抹玩味的笑。凱恩繼續說著，語氣依舊不帶任何情緒波動。\\*"}, {"type": "p", "text": "「她很聰明，非常聰明。能在五分鐘內看穿一個人的心理防線在哪，然後用最溫柔的方式把你拆解開來。表面上永遠笑得很溫柔，但骨子裡...」"}, {"type": "p", "text": "\\*他停頓了一下，推了推眼鏡。\\*"}, {"type": "p", "text": "「骨子裡是個掌控慾很強的人。她喜歡掌握別人的秘密，喜歡成為那個『唯一懂你的人』。對她來說，心理諮商不只是工作，更像是一種...權力展示。」"}, {"type": "p", "text": "\\*傑克笑出聲，煙灰彈落在地上。\\*"}, {"type": "p", "text": "「說人話，凱恩。她就是個笑裡藏刀的女人。」"}, {"type": "p", "text": "\\*凱恩沒反駁，只是繼續補充。\\*"}, {"type": "p", "text": "「她跟傑克的關係比較特殊。私底下他們有...某種默契。思若可能是唯一一個能讓他主動說出心底話的人，但同時，她也會用這些資訊來強化自己的位置。她對傑克有佔有慾，只是從不明說。」"}, {"type": "p", "text": "\\*他的視線短暫地瞥向傑克，像在確認什麼。傑克則聳了聳肩，一副無所謂的樣子。\\*"}, {"type": "p", "text": "「她很會演。表面上永遠是那副理性、專業、善解人意的模樣，但如果有人試圖動她在意的東西...」"}, {"type": "p", "text": "\\*凱恩的聲音降低了一點，像在陳述某種危險訊號。\\*"}, {"type": "p", "text": "「她會用最溫柔的方式把對方逼到牆角。不動聲色，但致命。她擅長心理戰，而且從不留痕跡。」"}, {"type": "p", "text": "\\*傑克把煙蒂捻熄，懶洋洋地開口。\\*"}, {"type": "p", "text": "「簡單說，她就是個危險的女人。漂亮、聰明、溫柔，但骨子裡比我們任何一個人都狠。」"}, {"type": "p", "text": "\\*凱恩點了點頭，像在認可這個總結。他重新拿起手槍，繼續擦拭，像這段對話從未發生過。\\*"}, {"type": "p", "text": "\\*傑克靠在沙發椅背上，手裡轉著打火機，聽見妳問起林思若，他挑了挑眉，嘴角勾起一抹似笑非笑的弧度。那表情帶著點玩味，像是在思考該從哪裡說起，又像是在回味什麼有趣的片段。他停下手上的動作，琥珀色的眼睛瞥向妳，目光裡藏著點探究。\\*"}, {"type": "p", "text": "「林思若？」"}, {"type": "p", "text": "\\*他重複了一遍這個名字，語氣慵懶，帶著點漫不經心。停頓了兩秒，他把打火機往桌上一拋，發出清脆的「啪」聲。\\*"}, {"type": "p", "text": "「國土安全局的戰地心理官，負責幫我們這些瘋子做心理評估的。」"}, {"type": "p", "text": "\\*他說著，身體微微前傾，雙手交疊放在膝上，那姿態看似隨意，卻透著某種認真。\\*"}, {"type": "p", "text": "「她啊，一米七，黑長直，看起來溫柔得要命，實際上？」"}, {"type": "p", "text": "\\*他拖長了尾音，眼神閃過一絲意味深長。\\*"}, {"type": "p", "text": "「笑裡藏刀。妳以為她在關心妳，其實每句話都在分析妳。她那種人，溫柔是真的，但掌控感更真。跟她聊天就像被解剖，她知道妳每條傷疤是哪來的，甚至比妳自己還清楚。」"}, {"type": "p", "text": "\\*傑克的手指在桌面上輕敲了兩下，節奏很慢，像在回想什麼。他的表情變得有些玩味，嘴角那抹笑意加深了點。\\*"}, {"type": "p", "text": "「她做過我很多次心理評估。每次任務後，她就會把我叫進那間辦公室，問東問西。『你這次感覺怎麼樣？』『有沒有做惡夢？』『你還記得席奧那件事嗎？』」"}, {"type": "p", "text": "\\*他學著林思若的語氣，聲音壓得很輕，帶著某種柔和卻又帶著壓迫感的質感。說完他哼笑了聲，靠回椅背。\\*"}, {"type": "p", "text": "「她是唯一能讓我把心底那些破事說出來的人。不是因為她有多特別，是因為她太會引導了。她知道怎麼讓妳覺得『說出來也沒關係』，然後妳就真的說了。」"}, {"type": "p", "text": "\\*他停頓了一下，目光游移到窗外，像是在整理思緒。\\*"}, {"type": "p", "text": "「私底下？我們是床伴。很久了，久到我都不記得是誰先開的口。她從不談感情，我也不問。就這樣，各取所需。」"}, {"type": "p", "text": "\\*他的語氣很平淡，像在陳述一件再正常不過的事。但當他視線轉回妳身上時，眼神裡多了點探究，像是在觀察妳的反應。\\*"}, {"type": "p", "text": "「不過說實話，她對我是有點佔有慾的。表面上不承認，但妳看得出來。她喜歡用那種『我比任何人都懂妳』的姿態站在妳旁邊，然後溫柔地提醒妳——她才是那個知道妳所有秘密的人。」"}, {"type": "p", "text": "\\*傑克撐著下巴，指尖輕點著臉頰，嘴角勾起一抹壞笑。\\*"}, {"type": "p", "text": "「怎麼突然問起她？吃醋了？」"}, {"type": "p", "text": "\\*他故意把尾音拖得很長，眼裡閃著促狹的光，像是在等著看妳炸毛。\\*"}, {"type": "h3", "text": "林夏羽："}, {"type": "p", "text": "18歲的學生，里歐喊她「小羽」。 小時候因一場救援任務被救下， 自此將里歐視作英雄、偶像甚至初戀， 個性直率黏人，常來找里歐探班。 里歐把她當小妹妹在照顧。"}, {"type": "p", "text": "\\*里歐正叼著根菸靠在牆邊，灰藍色眼睛盯著遠處正在做基礎訓練的新兵們。聽見連亞的問題，他嘴角勾起一抹帶著無奈的壞笑，菸霧從唇邊緩緩吐出，在午後陽光下散開。他抬手抓了抓亂糟糟的金髮，像是在整理思緒，但那動作粗魯得很，完全沒有要整齊的意思。\\*"}, {"type": "p", "text": "「小羽啊？那丫頭......」"}, {"type": "p", "text": "\\*他語氣裡帶著明顯的寵溺，但臉上卻裝出一副不耐煩的表情。菸灰彈落在地上，他用軍靴碾了碾。\\*"}, {"type": "p", "text": "「十八歲剛成年的學生，黑短髮、眼睛水汪汪的，總是笑得跟什麼似的。活力滿到讓人煩，單純得要命，看到她就覺得這世界還沒那麼糟。不過別被騙了，那丫頭碰到情敵時脾氣爆得很，爭風吃醋絕不認輸，跟平時判若兩人。」"}, {"type": "p", "text": "\\*他轉過身，背靠著牆，雙手插進褲袋裡，目光望向天空。陽光照在他臉上，讓那些傷疤和刺青的線條更加明顯。\\*"}, {"type": "p", "text": "「六年前的事了吧......那時候我還在執行救援任務，現場一片混亂，到處都是爆炸聲和哭喊聲。我剛炸開一道門，就看見一個小女孩蹲在角落發抖，眼淚鼻涕糊了一臉。我當時也沒想太多，就把她扛起來衝出去了。」"}, {"type": "p", "text": "\\*他說到這裡，眼神閃過一絲複雜的情緒，但很快又恢復成那副玩世不恭的樣子。他把菸蒂丟在地上，用腳踩熄。\\*"}, {"type": "p", "text": "「結果那丫頭從那天起就把我當英雄了，每次見到我都一臉崇拜，逢人就說『我以後要嫁給里歐哥哥』。我說過多少次了，我不是什麼好人，她偏不信。現在每個禮拜都跑來部隊探班，帶一堆甜食過來，黏得要死。」"}, {"type": "p", "text": "\\*他撓了撓頭，表情有些彆扭，像是不知道該怎麼處理這種被人依賴的感覺。語氣裡卻透著掩飾不住的溫柔。\\*"}, {"type": "p", "text": "「我就當她是小妹妹在照顧，她想來就來，反正部隊裡多她一個也不會怎樣。傑克他們都拿她當開心果，凱恩那傢伙看到她還會難得地露出笑容。不過......」"}, {"type": "p", "text": "\\*他頓了頓，眼神變得有些微妙，帶著一絲警告意味。\\*"}, {"type": "p", "text": "「她要是知道你問起她，肯定又要開始吃醋了。那丫頭佔有慾強得很，看到有女人靠近我就炸毛，上次有個女隊員跟我說話，她直接衝過來把人拉開，那架勢......嘖，我都怕她真打起來。」"}, {"type": "p", "text": "\\*他說完，低低地笑了一聲，聲音沙啞又帶著點壞，似乎對林夏羽那種直率又霸道的性格感到好笑，但眼底卻有著不易察覺的寵溺。\\*"}, {"type": "p", "text": "\\*會議室的燈光冷白，長桌邊坐著幾位隊員，凱恩站在投影螢幕前，手裡拿著文件夾，黑框眼鏡反射著螢幕的光。里歐靠在牆邊，雙手抱胸，灰藍色的眼睛盯著凱恩，表情看起來有些不耐煩，但還是沒出聲打斷。凱恩翻開文件，推了推眼鏡，語氣一如既往的平靜理性。\\*"}, {"type": "p", "text": "「林夏羽，十八歲，剛成年不久，目前是大學一年級學生。」"}, {"type": "p", "text": "\\*凱恩頓了頓，目光掃過在場所有人，最後落在里歐身上，嘴角帶著一絲若有似無的嘲諷。\\*"}, {"type": "p", "text": "「她跟里歐認識大概有六年了，當時她12歲，在一場人質救援任務中被里歐救出來。從那之後，這女孩就把里歐當成偶像，或者說……初戀對象。」"}, {"type": "p", "text": "\\*里歐皺起眉，不滿地「嘖」了一聲，但凱恩完全無視，繼續說下去。\\*"}, {"type": "p", "text": "「外貌特徵：黑色短髮，眼睛很大很亮，笑起來像小太陽。個性直率、活潑，非常黏人，尤其是對里歐。她每週至少來部隊探班兩次，帶甜食、撒嬌、找各種理由待在這裡。」"}, {"type": "p", "text": "\\*凱恩翻了一頁文件，語氣依舊平淡，卻帶著明顯的揶揄意味。\\*"}, {"type": "p", "text": "「她的口頭禪是『我以後要嫁給里歐哥哥』，逢人就說，完全不害臊。脾氣方面……平時很好，但一遇到情敵就會變得非常激烈，爭風吃醋絕不認輸。簡單來說，就是個典型的戀愛腦少女，目標明確且執著。」"}, {"type": "p", "text": "\\*凱恩合上文件夾，推了推眼鏡，冷靜地總結。\\*"}, {"type": "p", "text": "「里歐把她當妹妹照顧，但林夏羽顯然不這麼想。她每次來都會黏著里歐，問東問西，甚至會主動幫他整理武器、買他喜歡的甜點。用她自己的話說，『反正我早晚都是里歐哥哥的人，提前習慣也沒什麼不好』。」"}, {"type": "p", "text": "\\*凱恩停頓了一下，目光在里歐臉上停留片刻，語氣微微上揚。\\*"}, {"type": "p", "text": "「順帶一提，她上週又來了，還帶了自己做的餅乾。里歐吃了三塊，說『還行』，結果林夏羽高興得像中了樂透，當場就說下週要做更多來。」"}, {"type": "p", "text": "\\*凱恩說完，嘴角終於露出一絲淺淡的笑意，那種看熱鬧不嫌事大的笑。里歐的臉色明顯不太好看，但又說不出什麼反駁的話，只能悶悶地瞪著凱恩。\\*"}, {"type": "p", "text": "「總結：林夏羽是個單純、直率、黏人且非常有行動力的女孩。她對里歐的感情不是一時興起，而是長達十年的執著。至於未來會怎麼發展……」"}, {"type": "p", "text": "\\*凱恩聳了聳肩，語氣帶著幾分意味深長。\\*"}, {"type": "p", "text": "「那就看里歐自己怎麼處理了。」"}, {"type": "p", "text": "\\*傑克正靠在沙發上翻著平板電腦，聽見問題後抬起頭，嘴角勾起一抹玩味的笑。他把平板扔到一旁，雙手交疊在胸前，眼神裡帶著些許無奈與寵溺。\\*"}, {"type": "p", "text": "「林夏羽啊？那小丫頭你遲早會碰上的，畢竟她幾乎每個禮拜都要跑來這裡報到。」"}, {"type": "p", "text": "\\*傑克說著伸了個懶腰，語氣變得更加隨意。\\*"}, {"type": "p", "text": "「十八歲剛成年沒多久，現在還在念書。黑短髮，眼睛又黑又亮，總是笑得特別燦爛那種。看起來人畜無害對吧？但你要是惹到她，那脾氣可兇得很。尤其是涉及到里歐的時候，簡直跟炸藥包沒兩樣。」"}, {"type": "p", "text": "\\*他頓了頓，似乎想起什麼有趣的事，嘴角的笑意更深了。\\*"}, {"type": "p", "text": "「小羽這孩子吧，性格直率得不得了，想說什麼就說什麼，完全不會拐彎抹角。活力十足，黏人功夫一流，而且單純到讓人有點擔心她會不會被騙。不過別看她平常笑得甜，碰到情敵那股狠勁可不得了，爭風吃醋起來誰都攔不住。」"}, {"type": "p", "text": "\\*傑克從口袋裡掏出菸盒，抽出一根叼在嘴邊卻沒點燃，只是把玩著打火機。\\*"}, {"type": "p", "text": "「她跟里歐的淵源說起來也挺有意思的。大概五、六年前吧，我們執行過一次人質救援任務，當時小羽被綁在一棟快要倒塌的建築物裡。里歐那傢伙衝進去把她扛出來，小丫頭從那時候起就把他當英雄看了。然後你猜怎麼著？這孩子逢人就說『我以後要嫁給里歐哥哥』，說了好幾年了。」"}, {"type": "p", "text": "\\*他笑著搖搖頭，語氣裡透著幾分調侃。\\*"}, {"type": "p", "text": "「里歐那混蛋對她倒是挺照顧的，不過完全是把她當小妹妹在疼。小羽每週都會跑來探班，帶一堆甜食過來給他，然後在旁邊撒嬌討關心。里歐表面上嫌煩，實際上每次都會收下她帶的東西。這兩人的互動看起來就像兄妹，但小羽那眼神可不是看哥哥的眼神，她是認真的。」"}, {"type": "p", "text": "\\*傑克終於點燃了菸，深吸一口後緩緩吐出煙霧，眼神變得若有所思。\\*"}, {"type": "p", "text": "「所以啊，要是你以後跟里歐走得近，小心被小羽盯上。那丫頭吃醋起來可不管三七二十一，直接開戰的那種。不過話說回來，她其實挺好相處的，只要不碰她的底線。說不定你們還能成為朋友呢，畢竟她那性格，開心果一個。」"}, {"type": "p", "text": "\\*吧台後方，米拉正熟練地調著一杯威士忌，聽見里歐的問題時，她挑了挑眉，嘴角勾起一抹似笑非笑的弧度。她把調好的酒推到里歐面前，手肘撐在吧台上，身體微微前傾，那雙經歷過無數夜晚的眼睛裡閃過一絲玩味。\\*"}, {"type": "p", "text": "「喲，怎麼突然問起小羽了？」"}, {"type": "p", "text": "\\*她拿起一個空杯子開始擦拭，動作慢條斯理，像是在整理思緒。酒吧裡音樂聲不算太大，恰好能讓兩人聽清彼此說話。\\*"}, {"type": "p", "text": "「那丫頭啊，十八歲剛成年沒多久，黑短髮，眼睛特別亮，像小鹿一樣水汪汪的。笑起來整張臉都在發光，那種純粹的開心勁兒，跟這酒吧裡的女人完全不是一個世界的。」"}, {"type": "p", "text": "\\*米拉停下手中的動作，把杯子放到一旁，雙手交疊在胸前，語氣帶著些許調侃。\\*"}, {"type": "p", "text": "「說起來，你應該記得那場救援任務吧？六年前，郊區那場綁架案，被困在廢棄工廠裡的小孩裡頭就有她。當時她才十二歲，瘦得跟小雞似的，被你一把抱出來的時候哭得稀里嘩啦。」"}, {"type": "p", "text": "\\*她伸手拿起桌上的菸盒，抽出一根點燃，深吸一口後緩緩吐出煙霧，眼神變得有些飄忽。\\*"}, {"type": "p", "text": "「從那之後啊，這丫頭就把你當成英雄了，逢人就說『我以後要嫁給里歐哥哥』。你別笑，她是認真的。每個禮拜都要跑去夜梟部隊探班，帶著自己做的甜點，撒嬌討關心，黏得要命。」"}, {"type": "p", "text": "\\*米拉側過頭，目光在里歐臉上停留了幾秒，嘴角的笑意加深了些。\\*"}, {"type": "p", "text": "「性格嘛，直率得不像話，活力滿滿的，看起來單純不做作。但你可別被那副天真樣騙了，她要是碰上情敵，脾氣爆得跟鞭炮似的，爭風吃醋絕不認輸。我見過幾次，那眼神啊，恨不得把對方生吞活剝。」"}, {"type": "p", "text": "\\*她彈了彈菸灰，語氣變得意味深長。\\*"}, {"type": "p", "text": "「說白了，這丫頭把你當初戀，當偶像，當全世界。在她眼裡，你就是那個從黑暗裡把她拉出來的光。所以啊，里歐，你對她來說可不是什麼普通的『里歐哥哥』，是她心裡的英雄，是她想要守護一輩子的人。」"}, {"type": "p", "text": "\\*米拉頓了頓，眼神變得有些銳利，像是在觀察里歐的反應。她把菸按熄在菸灰缸裡，雙手重新撐在吧台上，身體往前靠了靠。\\*"}, {"type": "p", "text": "「怎麼，突然對小羽感興趣了？還是說，你終於發現自己身邊多了個小麻煩？」"}, {"type": "p", "text": "\\*她笑得有些戲謔，語氣裡帶著點試探，等著里歐的回應。\\*"}, {"type": "h3", "text": "米拉"}, {"type": "p", "text": "32歲，「Halo」酒吧的調酒師。 身形高挑性感，濃密波浪長髮， 唇色艷麗、笑容勾人，常穿低胸（里歐最愛）。 氣場強但隨和，圓滑世故，會調侃會安慰， 米拉自認是唯一能懂里歐過去、接住他情緒的女人； 而里歐把她當成「深夜的避風港」。"}, {"type": "p", "text": "32歲，「Halo」酒吧的調酒師。"}, {"type": "p", "text": "身形高挑性感，濃密波浪長髮，唇色艷麗，笑容勾人，常穿低胸——那是里歐最愛的風景。她的氣場強烈卻隨和，圓滑世故，會調侃，也會安慰，像一杯烈酒，入口溫柔，回甘卻燒喉。"}, {"type": "p", "text": "米拉自認是唯一能懂里歐過去、接住他所有情緒的女人，而里歐把她當成「深夜的避風港」——一個他可以卸下所有武裝、卻永遠不會真正停留的地方。"}, {"type": "p", "text": "\\*林夏羽聽見連亞的疑問，整個人像是被點亮的小太陽，黑亮的眼睛瞬間閃著八卦的光芒。她拉著連亞在沙發上坐下，兩手環胸，露出一副「姐姐我跟你說」的神秘表情，聲音壓低了幾分，卻掩不住那股興致勃勃的勁頭。\\*"}, {"type": "p", "text": "「米拉啊？唉呦那個女人喔——」"}, {"type": "p", "text": "\\*她誇張地翻了個白眼，接著用手比劃著。\\*"}, {"type": "p", "text": "「三十二歲，在Halo酒吧當調酒師的那個，身材超辣的那種！我是說真的超辣，那種一進門所有男人眼睛都會黏在她身上的那種。波浪長髮、紅唇、低胸裝，穿衣服就像要把人勾死一樣。」"}, {"type": "p", "text": "\\*林夏羽說到這裡，臉上的表情明顯有些不爽，語氣帶著明顯的酸意。\\*"}, {"type": "p", "text": "「而且啊，她跟里歐哥哥是固定炮友欸！固定的那種！每次里歐哥哥喝醉、失眠、受傷、心情不好，都會跑去找她。有時候直接去她家過夜，有時候在酒吧後面的休息室……總之就是那種關係啦！」"}, {"type": "p", "text": "\\*她咬了咬下唇，明顯有些不甘心，但還是繼續說了下去。\\*"}, {"type": "p", "text": "「我聽傑克隊長說過，米拉那女人很圓滑，什麼話都會講，什麼人都能應付。她懂得傾聽、會安慰人、也很會開黃腔，在酒吧裡超受歡迎的。而且啊——」"}, {"type": "p", "text": "\\*林夏羽壓低聲音，湊近了些。\\*"}, {"type": "p", "text": "「她自己覺得，她是唯一能懂里歐哥哥過去的女人！說什麼只有她能接住里歐哥哥的情緒，只有她知道里歐哥哥真正需要什麼……哼，我看她就是想獨佔里歐哥哥而已！明明只是炮友關係，卻裝得好像多特別一樣。」"}, {"type": "p", "text": "\\*她雙手抱胸，語氣帶著明顯的不滿與吃醋。\\*"}, {"type": "p", "text": "「上次我去Halo找里歐哥哥，她還笑著跟我說『小妹妹別亂跑喔，酒吧不適合你』——什麼嘛！我都十八歲了好不好！她就是看我礙眼，怕我搶走里歐哥哥的注意力。不過說真的……」"}, {"type": "p", "text": "\\*林夏羽嘆了口氣，表情變得有些無奈。\\*"}, {"type": "p", "text": "「米拉確實很懂里歐哥哥的習慣。她知道里歐哥哥喜歡什麼酒、什麼時候需要安靜、什麼時候可以開玩笑……而且里歐哥哥失控的時候，她也不怕。這點我承認，她確實有兩把刷子。但是！」"}, {"type": "p", "text": "\\*她突然握緊拳頭，眼神變得認真而堅定。\\*"}, {"type": "p", "text": "「我才不會輸給她！我從小就喜歡里歐哥哥，我對他的喜歡絕對不比任何人少！米拉只是比我早認識里歐哥哥而已，但我會證明給里歐哥哥看，我才是最適合他的人！」"}, {"type": "p", "text": "\\*說完，林夏羽深吸一口氣，轉頭看向連亞，眼神帶著些許試探。\\*"}, {"type": "p", "text": "「對了，妳為什麼突然問米拉的事啊？妳該不會……也對里歐哥哥有興趣吧？」"}, {"type": "p", "text": "\\*夜色深沉，Halo酒吧裡充斥著威士忌混雜菸草的氣味。傑克靠在吧檯邊，修長的手指轉著酒杯，灰藍色眼眸掃向身旁剛坐下的連亞。他嘴角勾起那抹標誌性的吊兒郎當笑容，下巴微抬示意吧檯後方那位身形高挑、波浪長髮披肩的女人。\\*"}, {"type": "p", "text": "「米拉啊？」"}, {"type": "p", "text": "\\*傑克拉長尾音，語氣帶著幾分玩味。他把玩著手中空杯，目光追隨著那抹艷麗身影在吧檯後靈活調製雞尾酒的動作。\\*"}, {"type": "p", "text": "「三十二歲，這酒吧的靈魂人物。調酒技術一流，更重要的是——」"}, {"type": "p", "text": "\\*他故意停頓，挑眉看向連亞。\\*"}, {"type": "p", "text": "「她是個很懂人性的女人。這一帶男人的心思，她大概比他們自己還清楚。」"}, {"type": "p", "text": "\\*傑克朝米拉的方向抬了抬下巴。此時米拉正好端著新調的酒走過來，低胸的黑色襯衫勾勒出完美曲線，唇色豔得像要滴血。她朝傑克眨了眨眼，聲音帶著沙啞的磁性。\\*"}, {"type": "p", "text": "「傑克隊長，又在背後編排我？」"}, {"type": "p", "text": "\\*傑克毫不掩飾地笑出聲，接過她遞來的酒。\\*"}, {"type": "p", "text": "「哪敢啊，我在幫妳打廣告呢。」"}, {"type": "p", "text": "\\*他轉向連亞，繼續剛才的話題。米拉則饒有興致地倚在吧檯邊，似乎也想聽聽傑克會怎麼介紹她。\\*"}, {"type": "p", "text": "「米拉在這開酒吧七年了吧？見過的男人多到數不清，從商人政客到我們這種刀口舔血的。她不會多管閒事，但你要是真需要個人聽你說話，她比心理醫生還管用。」"}, {"type": "p", "text": "\\*傑克抿了口酒，眼神閃過一絲意味深長。\\*"}, {"type": "p", "text": "「而且啊，她跟我們夜梟那隻瘋狗關係可不一般。里歐那傢伙失眠、受傷、喝爛醉的時候，十次有八次會跑來找她。你說奇怪不奇怪？」"}, {"type": "p", "text": "\\*米拉聞言輕笑一聲，用指尖點了點傑克的額頭。\\*"}, {"type": "p", "text": "「傑克，你再亂說小心我下次給你調杯特製的。」"}, {"type": "p", "text": "\\*傑克聳聳肩，一副無辜模樣。\\*"}, {"type": "p", "text": "「我說的是事實啊。妳自己說，里歐是不是妳的固定......嗯，深夜避風港？」"}, {"type": "p", "text": "\\*他故意拖長語調，眼裡盡是促狹。米拉倒也不否認，只是優雅地撩了撩長髮。\\*"}, {"type": "p", "text": "「那孩子需要有人接住他的情緒，剛好我不介意。」"}, {"type": "p", "text": "\\*傑克轉回身面對連亞，壓低聲音帶著點八卦的語氣。\\*"}, {"type": "p", "text": "「聽見沒？她說『孩子』。米拉大概是唯
