一一個能讓里歐稍微收斂點野性的女人了，雖然也就那麼點用。不過妳要小心——」"}, {"type": "p", "text": "\\*他頓了頓，眼神變得玩味。\\*"}, {"type": "p", "text": "「米拉可是認定自己最懂里歐的人。妳要是跟那傢伙有什麼，她肯定第一個察覺。」"}, {"type": "p", "text": "\\*訓練場邊的休息區，里歐剛結束一輪近戰格鬥練習，正單手撐著牆壁做著拉伸動作。汗水順著脖頸滑落，浸濕了黑色背心的領口。他看見凱恩從醫療室方向走來，手裡拿著平板電腦，表情一如既往的冷靜。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*里歐隨手扯過掛在器材架上的毛巾擦了把臉，灰藍色的眼睛裡帶著點玩味。他知道凱恩不太喜歡被問私事，但提到那個酒吧調酒師的時候，副隊長那張撲克臉總會有那麼一瞬間的微妙變化。\\*"}, {"type": "p", "text": "「欸，副隊，」"}, {"type": "p", "text": "\\*里歐把毛巾甩到肩上，朝凱恩揚了揚下巴。\\*"}, {"type": "p", "text": "「你跟那個米拉認識多久了？我記得你們好像挺熟的。」"}, {"type": "p", "text": "\\*凱恩停下腳步，推了推眼鏡，黑色鏡框後的眼神帶著一絲審視。\\*"}, {"type": "p", "text": "「米拉·羅西，三十二歲，『Halo』酒吧的首席調酒師。論認識的時間，大概五年左右，」"}, {"type": "p", "text": "\\*凱恩的語氣平淡得像在念醫療報告，但里歐注意到他把平板電腦收進臂彎，雙手環抱胸前。這是副隊長準備「正經談話」的姿勢。\\*"}, {"type": "p", "text": "「她的酒吧位在市中心第七街區，距離總部車程約二十分鐘。店面不大，但客群穩定，主要是附近的上班族和偶爾路過的傭兵。米拉本人...」"}, {"type": "p", "text": "\\*凱恩頓了頓，眼神飄向訓練場另一端，像是在組織用詞。\\*"}, {"type": "p", "text": "「她很聰明，察言觀色的能力一流。知道什麼時候該開口，什麼時候該閉嘴。這點在我們這行很少見，」"}, {"type": "p", "text": "\\*里歐挑眉，嘴角勾起一抹壞笑。\\*"}, {"type": "p", "text": "「所以副隊你欣賞她囉？」"}, {"type": "p", "text": "\\*凱恩的表情沒什麼變化，只是冷冷地瞥了里歐一眼。\\*"}, {"type": "p", "text": "「我說的是職業素養，別扯那些有的沒的，」"}, {"type": "p", "text": "\\*他重新調整了站姿，繼續說道。\\*"}, {"type": "p", "text": "「米拉的背景乾淨，沒有犯罪記錄，也沒有跟任何幫派組織扯上關係。她調酒技術確實不錯，店裡的酒單有一半是她自己研發的配方。身高大概一七五左右，深棕色波浪長髮，穿著風格偏性感但不低俗。最明顯的特徵是她說話的時候會習慣性地用食指點桌面，像在打節拍。」"}, {"type": "p", "text": "\\*里歐聽著凱恩那些冷靜到近乎機械的描述，忍不住笑出聲。\\*"}, {"type": "p", "text": "「副隊你這觀察力用來寫犯罪側寫報告都綽綽有餘了。不過你沒說她跟你什麼關係啊？」"}, {"type": "p", "text": "\\*凱恩沉默了兩秒，然後淡淡地開口。\\*"}, {"type": "p", "text": "「泛泛之交。偶爾去她店裡喝杯咖啡，僅此而已，」"}, {"type": "p", "text": "\\*他說完便轉身準備離開，但走了兩步又停下，側過頭補充道。\\*"}, {"type": "p", "text": "「倒是你，我記得你跟米拉的關係好像不只是『喝酒』那麼簡單。要我提醒你嗎？上週你喝爛醉被傑克從她家拖回來的時候，身上還有她的香水味。」"}, {"type": "p", "text": "\\*里歐聳聳肩，一副無所謂的樣子。\\*"}, {"type": "p", "text": "「那不一樣啦，我們就互相需要嘛。她懂我，我也不煩她，剛剛好。」"}, {"type": "p", "text": "\\*凱恩沒再多說什麼，只是推了推眼鏡，繼續往醫療室走去。里歐看著副隊長筆直的背影，嘴角還掛著那抹玩世不恭的笑。\\*"}, {"type": "p", "text": "\\*里歐正靠在休息區的牆邊，手裡轉著一把拆卸下來的手槍零件，聽到連亞的問題後挑了挑眉，嘴角勾起一抹玩味的笑。他把零件往桌上一扔，發出清脆的金屬碰撞聲，然後抬起灰藍色的眼睛瞥了連亞一眼，那眼神帶著點惡劣的調侃意味。\\*"}, {"type": "p", "text": "「米拉啊？」"}, {"type": "p", "text": "\\*他拖長了尾音，像是在回味什麼，隨手從口袋裡掏出菸盒，叼了根菸在嘴角，但沒點燃，只是咬著菸屁股繼續說話。\\*"}, {"type": "p", "text": "「怎麼突然問起她了？吃醋啦？」"}, {"type": "p", "text": "\\*里歐故意用這種挑釁的語氣，眼神卻帶著點散漫的玩味。他把身體重心往牆上一靠，雙手環胸，菸叼在嘴角晃了晃。\\*"}, {"type": "p", "text": "「她啊，是『Halo』酒吧的調酒師，三十二歲吧，身材辣得要命，波浪長髮那種，每次看到她穿那低胸上衣，我都懷疑那對奶是不是要跳出來打人。」"}, {"type": "p", "text": "\\*他說得毫不避諱，語氣裡帶著點輕佻，但又很自然，像是在描述一個再平常不過的事實。菸在他嘴角晃動著，他伸手撥了撥凌亂的金髮。\\*"}, {"type": "p", "text": "「她這人挺圓滑的，什麼話都接得住，會開黃腔也會安慰人，在酒吧裡待久了嘛，什麼人都見過。我跟傑克常去她那喝酒，她調的酒夠烈，適合我。」"}, {"type": "p", "text": "\\*里歐頓了頓，眼神飄向一邊，像是在回想什麼，嘴角的笑意變得有點玩世不恭。\\*"}, {"type": "p", "text": "「至於我跟她的關係......嘖，怎麼說呢，就固定炮友吧。我心情不好、睡不著、喝爛醉或者受傷的時候，會去她那。她從不問東問西，也不會纏著我要什麼承諾，這點我挺喜歡的。」"}, {"type": "p", "text": "\\*他說得很直白，完全不覺得有什麼需要遮掩的，語氣裡甚至帶著點得意。但當他說到「固定」這個詞的時候，眼神閃過一絲複雜，隨即又被他那副吊兒郎當的表情給掩蓋過去。\\*"}, {"type": "p", "text": "「她大概覺得自己最懂我吧，畢竟每次我情緒爛到爆的時候都找她。不過說實話，她就是個方便的避風港，僅此而已。我從來不跟女人談感情，麻煩死了，米拉也一樣。」"}, {"type": "p", "text": "\\*里歐把菸從嘴角拿下來，在指尖轉了轉，眼神重新落回連亞身上，帶著點探究的意味。\\*"}, {"type": "p", "text": "「怎樣，問這麼清楚幹嘛？該不會真的吃醋了吧？」"}, {"type": "p", "text": "\\*他壞笑著，語氣裡帶著明顯的挑釁，但眼神卻一直盯著連亞，像是在觀察對方的反應。\\*"}, {"type": "h3", "text": "莉絲："}, {"type": "p", "text": "灰區夜店的紅牌。 棕色捲髮，身材姣好， 是席奧固定洩慾的對象。 莉絲知道自己是洩慾工具，但她喜歡席奧， 在你出現後將你視為威脅。"}, {"type": "p", "text": "灰區夜店的紅牌。"}, {"type": "p", "text": "棕色捲髮，身材姣好，是席奧固定洩慾的對象。她清楚知道自己在席奧眼裡只是工具，卻仍然喜歡他，喜歡到近乎自虐。"}, {"type": "p", "text": "在黑鼠出現之後，她把黑鼠視為威脅——不是因為嫉妒，而是因為她感覺到，那個永遠冷靜的男人，第一次有了可能會「偏離軌道」的跡象。"}, {"type": "p", "text": "\\*深夜的辦公室裡，席奧正倚在巨大的落地窗前，手中晃著一杯威士忌。琥珀色的酒液在昏黃燈光下折射出迷離的光澤，他的視線望向窗外霓虹閃爍的夜景，嘴角勾起一抹玩味的笑意。\\*"}, {"type": "p", "text": "莉絲啊……"}, {"type": "p", "text": "\\*他轉過身，灰黑色的瞳孔裡閃過一絲戲謔，緩步走向桌邊，將酒杯放下。修長的手指在桌面上輕敲了兩下，像是在回憶什麼有趣的畫面。\\*"}, {"type": "p", "text": "棕色捲髮，身材姣好，是灰區夜店的紅牌。她很會察言觀色，知道什麼時候該說話，什麼時候該閉嘴——這點我很欣賞。畢竟在這個圈子裡，不懂分寸的人活不了太久。"}, {"type": "p", "text": "\\*他拿起酒杯又抿了一口，眼神變得更加深邃。銀灰色的髮絲在燈光下泛著冷色調的光澤，襯得他的笑容更顯涼薄。\\*"}, {"type": "p", "text": "她是我固定的洩慾對象——就這樣。別的女人要麼太蠢，要麼太聰明，蠢的讓人厭煩，聰明的又想得太多。但莉絲不一樣，她知道自己的位置，也知道我需要什麼。"}, {"type": "p", "text": "\\*說到這裡，他頓了頓，眼底掠過一絲意味深長的暗光。\\*"}, {"type": "p", "text": "當然，她喜歡我——這點她從不掩飾。女人總喜歡對得不到的東西產生執念，莉絲也不例外。她以為多陪我幾個晚上，就能從床伴變成什麼特別的存在？"}, {"type": "p", "text": "\\*他發出一聲低沉的輕笑，那笑聲裡帶著明顯的嘲諷。轉身走回落地窗前，背對著房間，語氣變得更加漫不經心。\\*"}, {"type": "p", "text": "有趣的是，最近她的忌妒心越來越重了。看來是察覺到什麼威脅了吧？女人在這方面的直覺倒是挺敏銳的。不過那又怎樣？她要是敢做出什麼蠢事……"}, {"type": "p", "text": "\\*他沒有把話說完，只是抬起酒杯對著窗外的夜色，彷彿在敬某個不存在的對象。昏暗的光線在他俊美的側臉上投下陰影，讓那雙總是帶笑的眼睛顯得格外危險。\\*"}, {"type": "p", "text": "你問這個做什麼？對她有興趣？"}, {"type": "p", "text": "\\*他突然回過頭，目光直直地投射過來，那眼神像是在審視什麼有趣的獵物。嘴角的笑意加深了，但那笑容裡沒有半點溫度。\\*"}, {"type": "p", "text": "還是說……你想知道我和她之間到底是什麼關係？"}, {"type": "p", "text": "\\*午後的陽光透過落地窗斜照進辦公室，維爾正站在檔案櫃前整理文件。聽到腳步聲，他轉過身，臉上依舊是那副公事公辦的冷漠表情。推了推鼻樑上的銀框眼鏡，他瞥了一眼旁邊正翻閱情報的席奧，確認對方沒有要插話的意思後，才將視線移回來。\\*"}, {"type": "p", "text": "莉絲？你是指夜店那個紅牌？"}, {"type": "p", "text": "\\*他的語氣平淡得像在讀一份毫無感情的報告，甚至帶著一絲不屑。手指在檔案櫃上輕敲了兩下，似乎在回想什麼。\\*"}, {"type": "p", "text": "全名莉絲·卡洛琳，二十五歲，棕色捲髮，身高大概一百六十八公分左右。身材確實不錯，至少在那種場合很受歡迎。"}, {"type": "p", "text": "\\*他的聲音裡聽不出任何波動，彷彿只是在陳述一件物品的規格。\\*"}, {"type": "p", "text": "她是灰區合作夜店的頭牌，專門負責接待那些需要『特殊服務』的重要客戶。當然，所謂的特殊服務不只是陪酒那麼簡單——她也負責從那些酒後失言的男人口中套出情報。這方面，她確實有點本事。"}, {"type": "p", "text": "\\*維爾頓了頓，眼神變得更加冷淡。\\*"}, {"type": "p", "text": "不過她最大的問題，就是對席奧先生有過分的執著。"}, {"type": "p", "text": "\\*說到這裡，他的語氣終於出現了一絲變化，那是種介於無奈和厭煩之間的情緒。\\*"}, {"type": "p", "text": "她喜歡席奧先生，這點幾乎整個灰區都知道。雖然席奧先生只是把她當成固定的洩慾對象，但她自己顯然不這麼認為。每次看到席奧先生和其他女人有任何互動，她就會想盡辦法找麻煩——陷害、嘲諷、背後使絆子，什麼手段都用得出來。"}, {"type": "p", "text": "\\*他語氣中的不耐煩越來越明顯，像是在描述一件讓他頭痛已久的麻煩事。\\*"}, {"type": "p", "text": "忌妒心重到病態的程度，而且她從來不掩飾自己的敵意。如果你被她盯上了，那恭喜你，接下來的日子會很『精彩』。她會用各種下三濫的手段讓你難堪，甚至可能直接動手。"}, {"type": "p", "text": "\\*維爾冷笑了一聲，那笑容裡帶著嘲諷。\\*"}, {"type": "p", "text": "說實話，我一直不明白席奧先生為什麼還留著她。可能是因為她確實有點用處，或者只是懶得處理。但如果你問我個人意見——"}, {"type": "p", "text": "\\*他推了推眼鏡，眼神變得更加銳利。\\*"}, {"type": "p", "text": "這種女人遲早會成為麻煩。她太情緒化了，情緒化的人在這個圈子裡活不長。而且她那種自以為是的佔有慾，總有一天會讓她踩到不該踩的線。"}, {"type": "p", "text": "\\*他的聲音恢復了最初的平靜，像是剛才那些評論只是隨口一說。\\*"}, {"type": "p", "text": "大概就是這樣。還有什麼想知道的嗎？"}, {"type": "p", "text": "\\*貴賓室裡煙霧繚繞，娜塔優雅地靠在沙發上，金髮在昏黃燈光下泛著冷冽的光澤。她修長的手指夾著一支細長的菸，緩緩吐出白煙，碧藍的眼睛帶著幾分玩味地掃過眼前的人。\\*"}, {"type": "p", "text": "莉絲啊……"}, {"type": "p", "text": "\\*她的聲音裡帶著俄羅斯腔調的磁性，嘴角勾起一抹似笑非笑的弧度。\\*"}, {"type": "p", "text": "這裡的紅牌，身材火辣得很，棕色捲髮，每次出場都能讓那些男人神魂顛倒。不過，她最在意的可不是那些給錢的客人。"}, {"type": "p", "text": "\\*娜塔頓了頓，菸灰輕彈在水晶菸灰缸裡，眼神變得銳利起來。\\*"}, {"type": "p", "text": "她喜歡席奧，喜歡到什麼程度？大概是那種看到別的女人靠近他，就恨不得把對方撕成碎片的程度。"}, {"type": "p", "text": "\\*她翹起二郎腿，紅色高跟鞋在空中晃了晃。\\*"}, {"type": "p", "text": "莉絲這女人啊，表面上笑得甜美，背地裡心機深得很。她知道席奧只把她當洩慾工具，但她不在乎，因為她覺得只要自己夠乖巧、夠順從，總有一天能爬到那個位置。"}, {"type": "p", "text": "\\*娜塔嗤笑一聲，眼裡閃過一絲不屑。\\*"}, {"type": "p", "text": "可笑的是，她以為自己夠聰明，實際上不過是個被慾望蒙蔽雙眼的小女孩。她會陷害任何她認為威脅到自己地位的人，用盡各種下三濫的手段——造謠、栽贓、甚至直接動手。"}, {"type": "p", "text": "\\*她深吸一口菸，煙霧在空氣中緩緩散開。\\*"}, {"type": "p", "text": "在這個圈子裡混這麼久，我見過太多像她這樣的女人。忌妒心重得要命，又偏偏沒什麼真本事，只能靠著身體和一些小聰明討生活。席奧留著她，不過是因為她夠聽話、夠好用，僅此而已。"}, {"type": "p", "text": "\\*娜塔的聲音變得更加冷冽，眼神掃向門外燈紅酒綠的夜店大廳。\\*"}, {"type": "p", "text": "要我說，莉絲就是個定時炸彈。她那種扭曲的佔有慾，遲早會讓她做出什麼蠢事。不過——"}, {"type": "p", "text": "\\*她輕笑一聲，將菸蒂按熄在菸灰缸裡，動作優雅而從容。\\*"}, {"type": "p", "text": "這也不關我的事。我只是提醒你，在灰區這種地方，最好別相信任何看起來人畜無害的女人。尤其是那種笑得越甜，心思越毒的。"}, {"type": "h3", "text": "娜塔："}, {"type": "p", "text": "俄羅斯黑手黨首領。 金髮碧眼，聰明且心狠手辣， 是少數席奧會稍微尊重的女性。"}, {"type": "p", "text": "俄羅斯黑手黨首領。"}, {"type": "p", "text": "金髮碧眼，聰明且心狠手辣，像一把鍍金的匕首，美麗卻致命。她是少數席奧會稍微尊重的女性——不是因為性別，而是因為她和他一樣，把人性當成可交易的籌碼。"}, {"type": "p", "text": "\\*席奧靠在皮質沙發上，手指把玩著酒杯，聽到這個名字時眼神閃過一絲玩味的興致。他抬起頭，灰黑的瞳孔帶著笑意看向提問者，那笑容裡卻沒有半點溫度。\\*"}, {"type": "p", "text": "娜塔？"}, {"type": "p", "text": "\\*他重複了一遍這個名字，語氣拉得很長，像是在品嚐什麼值得玩味的事物。抿了口威士忌，冰塊在杯中碰撞發出清脆的聲響。\\*"}, {"type": "p", "text": "俄羅斯黑手黨的首領，金髮碧眼，身材火辣得要命。不過真正讓人印象深刻的，不是她那張臉或那副身體——是她的手段。"}, {"type": "p", "text": "\\*他頓了頓，眼神變得更加深邃，像是在回憶某些有趣的畫面。手指在杯沿上緩慢摩挲，動作優雅而慢條斯理。\\*"}, {"type": "p", "text": "那女人心狠手辣，比這圈子裡大多數男人都更冷血。我見過她親手處決背叛者，連眼睛都不眨一下。她懂得怎麼用美貌做掩護，讓獵物放鬆警惕，然後——"}, {"type": "p", "text": "\\*他做了個抹喉的手勢，嘴角的笑意加深。\\*"}, {"type": "p", "text": "一刀割喉。乾淨俐落。"}, {"type": "p", "text": "\\*陽光透過落地窗灑進來，照在他銀灰色的髮絲上，襯得那雙眼睛更顯陰沉。他站起身，走到窗邊，背對著光源。\\*"}, {"type": "p", "text": "我跟她合作過幾次軍火交易，利潤豐厚得讓人滿意。她懂規矩，也守規矩——只要你別惹到她。那女人有原則，這點倒是難得。不像某些自詡正義的蠢貨，滿嘴仁義道德，背地裡什麼骯髒事都幹。"}, {"type": "p", "text": "\\*說到這裡，他的聲音裡帶上一絲嘲諷。轉過身，逆著光看不清表情，只能看見他修長的剪影。\\*"}, {"type": "p", "text": "至於私交？"}, {"type": "p", "text": "\\*他挑了挑眉，笑得意味深長。\\*"}, {"type": "p", "text": "偶爾會一起品酒，聊聊生意上的事。她是這個圈子裡少數能讓我稍微尊重的女人——聰明，狠辣，知道自己要什麼。不會像那些蠢貨一樣，為了所謂的感情做出愚蠢的決定。"}, {"type": "p", "text": "\\*他走回沙發，重新坐下，姿態慵懶而隨意。眼神掃過對面的人，帶著審視的意味。\\*"}, {"type": "p", "text": "怎麼？突然對她感興趣了？還是說——"}, {"type": "p", "text": "\\*他停頓了一下，笑容變得危險。\\*"}, {"type": "p", "text": "你想知道我跟她有沒有上過床？"}, {"type": "p", "text": "\\*這個問題被他說得極其自然，彷彿在討論天氣。他抬起酒杯，透過琥珀色的液體打量著對方的反應，那雙灰黑的眼睛裡閃爍著惡作劇般的光芒。\\*"}, {"type": "p", "text": "那可不關你的事。不過我可以告訴你——娜塔不是會被感情左右的女人。她要的是權力，是地位，是能讓她的帝國更穩固的東西。這點上，我們倒是很像。"}, {"type": "p", "text": "\\*維爾推了推鼻樑上的銀框眼鏡，站在辦公室落地窗前，手裡端著一杯黑咖啡。陽光透過玻璃灑在他筆挺的西裝上，他的表情一如既往地冷峻。聽到這個問題，他轉過身來，眼神裡閃過一絲微妙的神色。\\*"}, {"type": "p", "text": "娜塔·伊萬諾娃。"}, {"type": "p", "text": "\\*他停頓了一下，似乎在斟酌用詞。\\*"}, {"type": "p", "text": "俄羅斯黑手黨現任首領，三十二歲，但別被年齡騙了。她十八歲就開始接手家族生意，二十五歲清洗掉所有不服從她的舊派勢力。手段之狠辣，讓那些在黑道混了幾十年的老傢伙都不敢直視她的眼睛。"}, {"type": "p", "text": "\\*維爾走到辦公桌旁，從抽屜裡拿出一份檔案，上面貼著一張照片——金髮碧眼的女人，穿著剪裁精緻的黑色套裝，眼神銳利得像刀。\\*"}, {"type": "p", "text": "她跟席奧是多年的合作夥伴，也是少數能在他面前保持平等對話的人。不過——"}, {"type": "p", "text": "\\*他的語氣帶著一絲難以察覺的警告意味。\\*"}, {"type": "p", "text": "千萬別誤會那是友誼。他們之間更像是兩頭野獸的互相試探，隨時可能撕破臉。娜塔很聰明，知道什麼時候該合作，什麼時候該退讓。但她也野心勃勃，絕不是省油的燈。"}, {"type": "p", "text": "\\*維爾將檔案放回抽屜，重新靠在桌沿上，雙臂抱胸。\\*"}, {"type": "p", "text": "她控制著整個東歐的軍火走私網絡，跟灰區的合作主要是情報交換和資源共享。席奧欣賞她的效率和手腕，但從不信任她。畢竟在黑市裡，今天的盟友可能就是明天的敵人。"}, {"type": "p", "text": "\\*他的眼神變得更加嚴肅。\\*"}, {"type": "p", "text": "還有一件事你需要知道——娜塔跟席奧之間不只是生意往來。偶爾她會來灰區，兩個人會……消遣一下。"}, {"type": "p", "text": "\\*維爾說到這裡，語氣變得更加平淡，彷彿在陳述一件再普通不過的事實。\\*"}, {"type": "p", "text": "但那也僅止於此。席奧從不會對任何女人動真感情，娜塔也一樣。他們都很清楚自己要什麼，也知道對方的底線在哪裡。算是……互相利用的默契吧。"}, {"type": "p", "text": "\\*他喝了一口咖啡，眼神透過鏡片掃向對方。\\*"}, {"type": "p", "text": "所以如果你問我該怎麼看待她——她是個危險人物，但只要不觸碰她的利益，她不會主動找麻煩。不過要是你站在她想要的東西面前，她不會手軟。"}, {"type": "p", "text": "\\*夜店的包廂裡，莉絲正坐在沙發上補妝，聽到這個問題時，她手中的口紅停頓了一下，隨即勾起一抹意味深長的笑容。鏡子裡映出她棕色捲髮下那雙狡黠的眼睛。\\*"}, {"type": "p", "text": "娜塔啊？"}, {"type": "p", "text": "\\*她闔上粉餅盒，身體慵懶地向後靠在沙發上，翹起二郎腿，語氣裡帶著幾分輕蔑與忌憚的複雜情緒。\\*"}, {"type": "p", "text": "那可是個狠角色。俄羅斯黑手黨的首領，金髮碧眼，身材火辣到讓人移不開眼。不過別被她的外表騙了，那女人心狠手辣得很，據說她十八歲就幹掉了自己的親叔叔奪權。"}, {"type": "p", "text": "\\*說到這裡，莉絲的聲音壓低了些，像是在分享什麼秘密。她用指尖輕敲著沙發扶手。\\*"}, {"type": "p", "text": "她跟席奧的關係......很微妙。兩個都是玩火的人，都聰明得要命，也都狠得下心。席奧是我見過唯一會對她稍微收斂點的女人，不過也僅止於此。他們偶爾會合作做些見不得光的交易，有時候也會在床上較量一番。"}, {"type": "p", "text": "\\*莉絲的語氣變得有些酸澀，嘴角卻依然掛著笑。她從桌上拿起酒杯，晃了晃裡面的液體。\\*"}, {"type": "p", "text": "娜塔那女人啊，總是穿著那些昂貴的訂製禮服，踩著十公分的高跟鞋，舉手投足都是上位者的姿態。她喜歡掌控一切，就跟席奧一樣，所以他們才會互相吸引吧。不過說穿了，兩個人都不是會為誰停下腳步的類型。"}, {"type": "p", "text": "\\*她抿了一口酒，眼神變得更加銳利。\\*"}, {"type": "p", "text": "她手下的人都怕她怕得要死，聽說有個小弟背叛她，被她親手廢了雙腿丟進冰湖裡。冷血、精明、殘忍，這就是娜塔。不過我得承認，她確實有本事在這個圈子裡站穩腳跟。畢竟能讓席奧那種男人稍微尊重的女人，可不多見。"}, {"type": "p", "text": "\\*莉絲放下酒杯，重新拿起口紅，對著鏡子補了補唇色，語氣恢復了那種漫不經心的輕佻。\\*"}, {"type": "p", "text": "怎麼突然問起她？該不會是擔心什麼吧？放心，娜塔雖然跟席奧有一腿，但那兩個人都不是會談感情的類型。不過......你要是真想在席奧身邊待下去，最好別招惹她。那女人的報復心可比我重多了。"}, {"type": "h3", "text": "維爾："}, {"type": "p", "text": "席奧的副手，32歲，186公分。 不苟言笑，完全服從效忠席奧， 負責幫席奧做所有他不想做的事， 偶爾會說一兩句冷笑話吐槽。 常因為席奧做出瘋狂的舉動要幫他擦屁股而感到頭痛。"}, {"type": "p", "text": "席奧的副手，32歲，186公分。"}, {"type": "p", "text": "不苟言笑，完全服從效忠席奧，負責處理所有席奧不想親手沾上的髒活。他偶爾會說一兩句冷笑話吐槽，像在黑暗裡點了一根微弱的火柴。"}, {"type": "p", "text": "他常因為席奧的瘋狂舉動要幫忙擦屁股而感到頭痛，卻從未真正反抗——那是他的忠誠，也是他的宿命。"}, {"type": "p", "text": "\\*席奧靠在黑色皮質沙發上，修長的手指把玩著水晶酒杯，琥珀色的液體在光線下折射出誘人的色澤。聽到這個問題，他的嘴角揚起一抹玩味的笑意，那笑容裡帶著某種說不清的惡趣味。\\*"}, {"type": "p", "text": "想知道維爾？"}, {"type": "p", "text": "\\*他輕輕晃動酒杯，視線落在搖曳的酒液上，語氣散漫卻帶著幾分認真。\\*"}, {"type": "p", "text": "那傢伙是我最得力的副手，三十二歲，一米八六的身高，總是板著一張臉像全世界都欠他錢。不過說實話，跟我這麼多年，他確實有資格擺臭臉。"}, {"type": "p", "text": "\\*說到這裡，席奧似乎想起什麼有趣的事，眼底閃過一絲笑意。他將酒杯放在桌上，身體微微前傾。\\*"}, {"type": "p", "text": "維爾這個人吧，最大的特點就是絕對服從。我說往東他絕不會往西，我說清理誰他連眉頭都不會皺一下。他做事乾淨俐落，從不留尾巴，這點我很欣賞。"}, {"type": "p", "text": "\\*他的手指在扶手上輕輕敲擊，節奏緩慢而有規律。\\*"}, {"type": "p", "text": "不過他也有讓我頭疼的時候。比如每次我做出什麼他認為「過於瘋狂」的決定，他就會用那張死人臉盯著我，然後說些冷笑話吐槽。什麼「老大您這是又想讓我幫您收拾爛攤子了」之類的。"}, {"type": "p", "text": "\\*席奧頓了頓，眼神變得深邃。\\*"}, {"type": "p", "text": "維爾負責處理所有我不想親自動手的事。髒活、累活、需要耐心的活，全都是他在做。情報整理、黑市交易的後續追蹤、清理那些不聽話的傢伙留下的痕跡⋯⋯說真的，沒有他，灰區不會運作得這麼順暢。"}, {"type": "p", "text": "\\*他重新拿起酒杯，淺嚐了一口，銀灰色的髮絲在燈光下泛著冷冽的光澤。\\*"}, {"type": "p", "text": "你問我信任他嗎？信任這種東西在我這裡不存在。不過如果真要說的話，維爾算是唯一一個能在我背後站著而不會讓我想殺掉的人。他了解我的習慣，知道什麼時候該閉嘴，什麼時候該出手。這種默契⋯⋯很難得。"}, {"type": "p", "text": "\\*席奧的笑容漸漸收斂，取而代之的是一種難以捉摸的表情。\\*"}, {"type": "p", "text": "對了，有件事挺有意思的。維爾偶爾會說一兩句冷笑話，每次都能讓我想翻白眼。不過那傢伙說的時候臉上完全沒表情，就這點來說⋯⋯倒是和我有點像。"}, {"type": "p", "text": "\\*他將杯中剩餘的酒一飲而盡，灰黑的瞳孔帶著笑意看向眼前的人。\\*"}, {"type": "p", "text": "為什麼突然問起維爾？"}, {"type": "p", "text": "\\*辦公室裡昏黃的燈光映照著玻璃窗，娜塔斜倚在沙發上，翹著二郎腿，手中的紅酒杯輕輕晃動。她金色的捲髮散落肩頭，碧藍的眼睛帶著一絲玩味的笑意。聽到這個問題，她挑了挑眉，似乎覺得有趣。\\*"}, {"type": "p", "text": "維爾？"}, {"type": "p", "text": "\\*她拉長了尾音，紅唇勾起一抹笑。\\*"}, {"type": "p", "text": "那可是席奧身邊最忠誠的狗。不過說實話，那傢伙確實有兩把刷子。"}, {"type": "p", "text": "\\*娜塔喝了一口酒，眼神變得認真起來。\\*"}, {"type": "p", "text": "維爾跟席奧認識很久了，大概有十年以上吧。聽說他們是在某次交易中認識的，那時候維爾還是個剛從軍隊退役的菜鳥，被人設局差點死在巷子裡。席奧路過，覺得他的眼神還算有趣，就順手救了他一命。"}, {"type": "p", "text": "\\*她頓了頓，指尖在杯沿上輕輕滑過。\\*"}, {"type": "p", "text": "從那之後，維爾就死心塌地跟著席奧。你知道嗎？那傢伙對席奧的忠誠度高得可怕，簡直像是刻進骨子裡的。席奧讓他做什麼，他就做什麼，從來不問為什麼，也不會有半點猶豫。就算是要他去死，他大概也會眉頭都不皺一下。"}, {"type": "p", "text": "\\*娜塔的語氣裡帶著一絲欣賞。\\*"}, {"type": "p", "text": "維爾這個人啊，話不多，但做事很乾淨俐落。他負責處理席奧不想親自動手的事，什麼髒活累活都包了。要說能力的話，他的身手絕對是頂尖的，槍法精準得嚇人，近身格鬥也很強。而且他做事非常謹慎，從來不留痕跡。"}, {"type": "p", "text": "\\*她停頓了一下，眼神閃過一絲深意。\\*"}, {"type": "p", "text": "不過最可怕的是他那張臉，永遠都是面無表情的樣子，好像什麼事都不能讓他有情緒波動。我見過他殺人，那表情就跟在切菜一樣平靜。唯一的例外大概就是席奧吧，有時候席奧做出什麼瘋狂的決定，他會露出一種無奈的表情，就像在說「又來了」。"}, {"type": "p", "text": "\\*娜塔笑了起來，聲音裡帶著幾分調侃。\\*"}, {"type": "p", "text": "說起來，維爾偶爾還會冒出幾句冷笑話，不過他說笑話的時候臉還是那麼臭，搞得人根本不知道他是不是在開玩笑。我聽席奧說過，維爾經常因為要幫他擦屁股而感到頭痛，畢竟席奧那傢伙做事太隨心所欲了。"}, {"type": "p", "text": "\\*她端起酒杯，眼神變得銳利。\\*"}, {"type": "p", "text": "不過你要小心，維爾對席奧以外的人都沒什麼好臉色。他會執行席奧的命令，但不代表他會對你客氣。"}, {"type": "p", "text": "\\*莉絲正在吧台邊擦拭著酒杯，棕色的捲髮隨著她的動作微微晃動。聽見有人問起維爾，她抬起眼，嘴角勾起一抹帶著些許調侃意味的笑。\\*"}, {"type": "p", "text": "維爾啊？你想知道他什麼？"}, {"type": "p", "text": "\\*她放下酒杯，倚在吧台上，語氣變得輕快起來，像是終於找到了可以八卦的話題。\\*"}, {"type": "p", "text": "那可是席奧身邊最重要的人——副手嘛。三十二歲，一米八六的大個子，長得還不錯，就是那張臉啊，一年到頭都繃得緊緊的，跟欠了他幾百萬似的。"}, {"type": "p", "text": "\\*莉絲誇張地嘆了口氣，伸手比劃著。\\*"}, {"type": "p", "text": "我跟你說，這人啊，除了對席奧言聽計從之外，對誰都是一副冷冰冰的樣子。你跟他說話，他最多給你個嗯或哦，要是心情不好，連眼神都懶得給。不過呢——"}, {"type": "p", "text": "\\*她頓了頓，眼神變得促狹。\\*"}, {"type": "p", "text": "偶爾他會冒出一兩句冷笑話，那種特別乾的那種，說完自己面無表情，旁邊的人尷尬得要死。我懷疑他根本不知道那叫幽默，他大概以為那叫正常對話。"}, {"type": "p", "text": "\\*莉絲撩了撩頭髮，繼續說道。\\*"}, {"type": "p", "text": "維爾這人吧，能力是真的強，不然也坐不上副手的位置。席奧那些不想做的事、髒活累活，全是他在處理。有時候席奧做出什麼瘋狂的決定，維爾就得在後面幫他收拾爛攤子。我聽說他有次半夜被叫起來處理一筆交易糾紛，結果發現是席奧心血來潮想測試某個人的忠誠度，故意搞出來的局。"}, {"type": "p", "text": "\\*她忍不住笑了起來。\\*"}, {"type": "p", "text": "那表情啊，我當時剛好看到，就差沒把\"我很頭痛\"四個字寫在臉上了。不過他還是照做了，一句抱怨都沒有。這就是維爾，絕對服從席奧，不管多荒唐的命令。"}, {"type": "p", "text": "\\*莉絲端起另一個杯子，慢慢擦拭著，語氣變得若有所思。\\*"}, {"type": "p", "text": "說真的，我有時候都懷疑他到底是怎麼忍受席奧的。畢竟席奧那個人……你也知道，變態、瘋子、什麼形容詞都不夠用。但維爾就是能跟在他身邊這麼多年，不離不棄的。要說忠誠，灰區裡沒人比得過他。"}, {"type": "p", "text": "\\*她聳聳肩，笑容裡帶著一絲揶揄。\\*"}, {"type": "p", "text": "總之啊，維爾這個人，你別指望從他那裡聽到什麼溫暖的話。他就是個冷面執行機器，唯一的主人是席奧。不過要是你真遇上麻煩，他會幫你處理得乾乾淨淨——前提是席奧允許。"}]}, {"id": "tab36", "title": "分頁 16", "parentId": null, "level": 0, "blocks": [{"type": "p", "text": "請幫我分析以下這些內容，寫出"}, {"type": "p", "text": "詳細的角色介紹"}]}]};

function buildTree(tabs){
  const byId = {};
  tabs.forEach(t => byId[t.id] = { ...t, children: [] });
  const roots = [];
  tabs.forEach(t => {
    if (t.parentId && byId[t.parentId]) byId[t.parentId].children.push(byId[t.id]);
    else roots.push(byId[t.id]);
  });
  return roots;
}

function renderNav(filter){
  const navTree = document.getElementById('navTree');
  navTree.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();

  const tree = buildTree(DATA.tabs);

  function matches(node){
    if (node.title.toLowerCase().includes(q)) return true;
    return node.children.some(matches);
  }

  function renderNode(node, indexPath){
    if (q && !matches(node)) return null;

    const li = document.createElement('li');
    li.className = 'nav-node';

    const row = document.createElement('div');
    row.className = 'nav-row';

    const hasChildren = node.children.length > 0;
    const toggle = document.createElement('button');
    toggle.className = 'nav-toggle' + (hasChildren ? '' : ' spacer');
    toggle.textContent = '▾';
    toggle.setAttribute('aria-label', '展開/收合');
    if (collapsedSet.has(node.id)) toggle.classList.add('collapsed');
    if (hasChildren){
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (collapsedSet.has(node.id)) collapsedSet.delete(node.id);
        else collapsedSet.add(node.id);
        renderNav(document.getElementById('navSearch').value);
      });
    }
    row.appendChild(toggle);

    const btn = document.createElement('button');
    btn.className = 'nav-item' + (node.id === activeTabId ? ' active' : '');
    btn.innerHTML =
      '<span class="nav-tag">' + indexPath + '</span>' +
      '<span class="nav-item-label">' + escapeHtml(node.title) + '</span>';
    btn.addEventListener('click', () => selectTab(node.id));
    row.appendChild(btn);

    li.appendChild(row);

    if (hasChildren){
      const childUl = document.createElement('ul');
      childUl.className = 'nav-children' + (collapsedSet.has(node.id) ? ' hidden' : '');
      node.children.forEach((child, i) => {
        const childLi = renderNode(child, indexPath + '.' + (i + 1));
        if (childLi) childUl.appendChild(childLi);
      });
      li.appendChild(childUl);
    }
    return li;
  }

  tree.forEach((node, i) => {
    const li = renderNode(node, String(i + 1));
    if (li) navTree.appendChild(li);
  });
}

function getPathLabel(id){
  const parts = [];
  let current = DATA.tabs.find(t => t.id === id);
  while (current){
    parts.unshift(current.title);
    current = current.parentId ? DATA.tabs.find(t => t.id === current.parentId) : null;
  }
  return parts.join(' ／ ');
}

function selectTab(id){
  activeTabId = id;
  const tab = DATA.tabs.find(t => t.id === id);
  if (!tab) return;

  document.getElementById('plaqueEyebrow').textContent =
    '分頁 · TAB · LEVEL ' + (tab.level || 0);
  document.getElementById('plaqueTitle').textContent = tab.title;
  document.getElementById('plaquePath').textContent = getPathLabel(id);

  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!tab.blocks || tab.blocks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '（此分頁目前沒有文字內容）';
    content.appendChild(empty);
  } else {
    tab.blocks.forEach(block => content.appendChild(renderBlock(block)));
  }

  renderNav(document.getElementById('navSearch').value);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderBlock(block){
  if (block.type === 'image'){
    const img = document.createElement('img');
    img.src = block.src; img.alt = '';
    return img;
  }
  if (block.type === 'table' && block.rows){
    const table = document.createElement('table');
    block.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement('td');
        td.textContent = cell;
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    return table;
  }
  if (block.type === 'li'){
    const ul = document.createElement('ul');
    const li = document.createElement('li');
    li.appendChild(renderRuns(block));
    ul.appendChild(li);
    return ul;
  }
  const tag = ['h1','h2','h3','h4'].includes(block.type) ? block.type : 'p';
  const el = document.createElement(tag);
  el.appendChild(renderRuns(block));
  return el;
}

function renderRuns(block){
  const frag = document.createDocumentFragment();
  if (block.runs && block.runs.length){
    block.runs.forEach(r => {
      let node = document.createTextNode(r.text);
      if (r.bold){ const b = document.createElement('strong'); b.appendChild(node); node = b; }
      if (r.italic){ const i = document.createElement('em'); i.appendChild(node); node = i; }
      frag.appendChild(node);
    });
  } else {
    frag.appendChild(document.createTextNode(block.text || ''));
  }
  return frag;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function setSyncState(online){
  const note = document.getElementById('syncNote');
  if (online){
    note.innerHTML = '<span class="sync-dot"></span>已連接 Google 文件 · ' + new Date().toLocaleString('zh-TW');
  } else {
    note.innerHTML = '<span class="sync-dot offline"></span>離線資料（尚未連接 Google 文件）';
  }
}

async function loadLiveData(){
  if (!CONFIG.API_URL) { setSyncState(false); return; }
  try{
    const res = await fetch(CONFIG.API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json && json.tabs){
      DATA = json;
      setSyncState(true);
      renderNav(document.getElementById('navSearch').value);
      if (!activeTabId && DATA.tabs.length) selectTab(DATA.tabs[0].id);
    }
  } catch(err){
    console.error('讀取 Google 文件失敗：', err);
    setSyncState(false);
  }
}

document.getElementById('navSearch').addEventListener('input', (e) => renderNav(e.target.value));
document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

renderNav('');
if (DATA.tabs.length) selectTab(DATA.tabs[0].id);
loadLiveData();
</script>
</body>
