<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>夜梟部隊 ｜ Night Owl Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="night-owl-unit-styles.css">
</head>
<body>

<button class="menu-toggle" id="menuToggle">☰ &nbsp; 檔案索引</button>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a href="home.html" class="brand-back" title="回首頁">← 回首頁</a>
      <div class="brand-eyebrow">Classified Archive</div>
      <div class="brand-title" id="brandTitle">夜梟部隊</div>
      <div class="brand-sub" id="brandSub">NIGHT&nbsp;OWL&nbsp;UNIT&nbsp;·&nbsp;檔案索引</div>
    </div>
    <div class="nav-search">
      <input type="text" id="navSearch" placeholder="搜尋分頁 / 人物…" />
    </div>
    <ul class="nav-tree" id="navTree"></ul>
    <div class="sync-note" id="syncNote">
      <span class="sync-dot offline"></span>離線資料（尚未連接 Google 文件）
    </div>
  </aside>

  <main class="main">
    <div class="plaque">
      <div class="plaque-eyebrow">
        <span id="plaqueEyebrow">分頁 · TAB</span>
        <span class="stamp">FILE</span>
      </div>
      <div class="plaque-title" id="plaqueTitle">—</div>
      <div class="plaque-path" id="plaquePath"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ============================================================
   設定：把部署好的 Google Apps Script 網頁應用程式網址貼在這裡
   （結尾通常是 /exec）。留空則使用內建的離線快照資料。
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbymsUBHfDUFl_BRBubqMp6k7MMxtv_07KGTAU_XNBIMHXgFRcujGk1t17IDc_zkyboR/exec'
};

// 從網址讀取 ?project=xxx，決定要跟後端要哪一份文件
// 例如 index.html?project=jungle 就會抓「叢林」那份
const urlParams = new URLSearchParams(window.location.search);
const PROJECT_KEY = urlParams.get('project') || '';

/* 內建離線快照（目前抓取到的文件內容） */
const FALLBACK_DATA = {}
let DATA = FALLBACK_DATA;
let activeTabId = null;
let collapsedSet = new Set();

function buildTree(tabs){
  const byId = {};
  tabs.forEach(t => byId[t.id] = { ...t, children: [] });
  const roots = [];
  tabs.forEach(t => {
    if (t.parentId && byId[t.parentId]) byId[t.parentId].children.push(byId[t.id]);
    else roots.push(byId[t.id]);
  });
  return roots;
}

function renderNav(filter){
  const navTree = document.getElementById('navTree');
  navTree.innerHTML = '';
  const q = (filter || '').trim().toLowerCase();

  const tree = buildTree(DATA.tabs);

  function matches(node){
    if (node.title.toLowerCase().includes(q)) return true;
    return node.children.some(matches);
  }

  function renderNode(node, indexPath){
    if (q && !matches(node)) return null;

    const li = document.createElement('li');
    li.className = 'nav-node';

    const row = document.createElement('div');
    row.className = 'nav-row';

    const hasChildren = node.children.length > 0;
    const toggle = document.createElement('button');
    toggle.className = 'nav-toggle' + (hasChildren ? '' : ' spacer');
    toggle.textContent = '▾';
    toggle.setAttribute('aria-label', '展開/收合');
    if (collapsedSet.has(node.id)) toggle.classList.add('collapsed');
    if (hasChildren){
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (collapsedSet.has(node.id)) collapsedSet.delete(node.id);
        else collapsedSet.add(node.id);
        renderNav(document.getElementById('navSearch').value);
      });
    }
    row.appendChild(toggle);

    const btn = document.createElement('button');
    btn.className = 'nav-item' + (node.id === activeTabId ? ' active' : '');
    btn.innerHTML =
      '<span class="nav-tag">' + indexPath + '</span>' +
      '<span class="nav-item-label">' + escapeHtml(node.title) + '</span>';
    btn.addEventListener('click', () => selectTab(node.id));
    row.appendChild(btn);

    li.appendChild(row);

    if (hasChildren){
      const childUl = document.createElement('ul');
      childUl.className = 'nav-children' + (collapsedSet.has(node.id) ? ' hidden' : '');
      node.children.forEach((child, i) => {
        const childLi = renderNode(child, indexPath + '.' + (i + 1));
        if (childLi) childUl.appendChild(childLi);
      });
      li.appendChild(childUl);
    }
    return li;
  }

  tree.forEach((node, i) => {
    const li = renderNode(node, String(i + 1));
    if (li) navTree.appendChild(li);
  });
}

function getPathLabel(id){
  const parts = [];
  let current = DATA.tabs.find(t => t.id === id);
  while (current){
    parts.unshift(current.title);
    current = current.parentId ? DATA.tabs.find(t => t.id === current.parentId) : null;
  }
  return parts.join(' ／ ');
}

function selectTab(id){
  activeTabId = id;
  const tab = DATA.tabs.find(t => t.id === id);
  if (!tab) return;

  document.getElementById('plaqueEyebrow').textContent =
    '分頁 · TAB · LEVEL ' + (tab.level || 0);
  document.getElementById('plaqueTitle').textContent = tab.title;
  document.getElementById('plaquePath').textContent = getPathLabel(id);

  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!tab.blocks || tab.blocks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '（此分頁目前沒有文字內容）';
    content.appendChild(empty);
  } else {
    tab.blocks.forEach(block => content.appendChild(renderBlock(block)));
  }

  renderNav(document.getElementById('navSearch').value);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderBlock(block){
  if (block.type === 'image'){
    const img = document.createElement('img');
    img.src = block.src; img.alt = '';
    return img;
  }
  if (block.type === 'table' && block.rows){
    const table = document.createElement('table');
    block.rows.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement('td');
        td.textContent = cell;
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    return table;
  }
  if (block.type === 'li'){
    const ul = document.createElement('ul');
    const li = document.createElement('li');
    li.appendChild(renderRuns(block));
    ul.appendChild(li);
    return ul;
  }
  const tag = ['h1','h2','h3','h4'].includes(block.type) ? block.type : 'p';
  const el = document.createElement(tag);
  el.appendChild(renderRuns(block));
  return el;
}

function renderRuns(block){
  const frag = document.createDocumentFragment();
  if (block.runs && block.runs.length){
    block.runs.forEach(r => {
      let node = document.createTextNode(r.text);
      if (r.bold){ const b = document.createElement('strong'); b.appendChild(node); node = b; }
      if (r.italic){ const i = document.createElement('em'); i.appendChild(node); node = i; }
      frag.appendChild(node);
    });
  } else {
    frag.appendChild(document.createTextNode(block.text || ''));
  }
  return frag;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function setSyncState(online){
  const note = document.getElementById('syncNote');
  if (online){
    note.innerHTML = '<span class="sync-dot"></span>已連接 Google 文件 · ' + new Date().toLocaleString('zh-TW');
  } else {
    note.innerHTML = '<span class="sync-dot offline"></span>離線資料（尚未連接 Google 文件）';
  }
}

async function loadLiveData(){
  if (!CONFIG.API_URL) { setSyncState(false); return; }
  try{
    const fetchUrl = PROJECT_KEY
      ? CONFIG.API_URL + '?project=' + encodeURIComponent(PROJECT_KEY)
      : CONFIG.API_URL;
    const res = await fetch(fetchUrl, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json && json.error){
      console.error('後端回傳錯誤：', json.error);
      setSyncState(false);
      return;
    }
    if (json && json.tabs){
      DATA = json;
      setSyncState(true);
      if (json.title){
        document.title = json.title + ' ｜ ' + document.title.split('｜').pop().trim();
        document.getElementById('brandTitle').textContent = json.title;
      }
      renderNav(document.getElementById('navSearch').value);
      if (!activeTabId && DATA.tabs.length) selectTab(DATA.tabs[0].id);
    }
  } catch(err){
    console.error('讀取 Google 文件失敗：', err);
    setSyncState(false);
  }
}

document.getElementById('navSearch').addEventListener('input', (e) => renderNav(e.target.value));
document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

renderNav('');
if (DATA.tabs.length) selectTab(DATA.tabs[0].id);
loadLiveData();
</script>
</body>
</html>
