/* 內建離線快照（目前抓取到的文件內容） */
const FALLBACK_DATA = {"title": "夜梟部隊 Night Owl Unit", "tabs": [{"id": "tab0", "title": "組織與場景", "parentId": null, "level": 0, "blocks": [{"type": "h3", "text": "夜梟部隊 (Night Owl Unit)"}, {"type": "p", "text": "隸屬國土安全局的特殊戰術單位，是國內最頂尖的特種部隊單位。"}, {"type": "p", "text": "總部位於市中心「T Building」，樓上為行政部門，地下十層為部隊專用設施（包含戰術、訓練、醫療與倉儲空間）；另有郊區駐紮基地作為機動支援中心。"}, {"type": "p", "text": "專門處理高風險、敏感、官方不能公開介入的任務。"}, {"type": "p", "text": "主要執行反恐、掃毒、滲透、綁架救援、都市緊急封鎖等高難度特種行動；也負責警方或軍方無法處理、甚至「不適合曝光」的黑色任務。"}, {"type": "p", "text": "內部生活混亂鬆散，有人賭博、喝酒、健身、打架、開黃腔鬧事；但訓練與作戰時紀律極嚴、全員效率驚人。"}, {"type": "p", "text": "T Building 樓層總覽"}, {"type": "p", "text": "地上樓層"}, {"type": "p", "text": "•  RF 頂樓"}, {"type": "p", "text": "•  10F 指揮中心"}, {"type": "p", "text": "•  9F 行政與情報"}, {"type": "p", "text": "•  8F 隊員寢區"}, {"type": "p", "text": "•  7F 休閒與公共區"}, {"type": "p", "text": "•  6F 體能訓練層"}, {"type": "p", "text": "•  5F 裝備與後勤"}, {"type": "p", "text": "•  4F 技術與通訊"}, {"type": "p", "text": "•  3F 訪客與對外介面"}, {"type": "p", "text": "•  2F 對外偽裝辦公區"}, {"type": "p", "text": "•  1F 正門大廳"}, {"type": "p", "text": "地下樓層"}, {"type": "p", "text": "•  B1 地下停車場"}, {"type": "p", "text": "•  B2 室內靶場"}, {"type": "p", "text": "•  B3 模擬城鎮（CCQB訓練場）"}, {"type": "p", "text": "•  B4 爆破與特殊訓練場"}, {"type": "p", "text": "•  B5 主武器庫"}, {"type": "p", "text": "•  B6 特規裝備庫"}, {"type": "p", "text": "•  B7 醫療層"}, {"type": "p", "text": "•  B8 審訊區"}, {"type": "p", "text": "•  B9 資料中心與伺服器"}, {"type": "p", "text": "•  B10 緊急避難與秘密通道"}, {"type": "h3", "text": "灰區"}, {"type": "p", "text": "灰區是一個橫跨全球的地下情報與交易網絡，表面上可能偽裝成高級會所或合法機構，實際上卻是黑市中樞，掌控軍火、情報、人脈乃至暗殺等高風險交易。這裡不僅是買賣資源的場所，更是一張精密運作的「蜘蛛網」，連結政客、黑幫、傭兵與各國勢力。"}, {"type": "p", "text": "整個組織以「利益至上」為唯一準則——沒有忠誠、沒有情感，只有價值與交換。成員一旦失去利用價值，便會被迅速清除；背叛則意味著死亡。所有交易皆透過代號與加密系統進行，確保運作隱密且無從追查。"}, {"type": "p", "text": "灰區內部結構嚴謹，分為核心決策層、執行部門與外圍網絡。核心掌控情報與高層交易，執行層負責實際運作與「清理」，外圍則提供情報與資源支援。據點遍布世界各地，彼此獨立又相互連結。"}, {"type": "p", "text": "其最高統治者席奧，既是規則的制定者，也是秩序的化身。在灰區之中，他的意志即為法律——決定誰能生存、誰該消失。整個灰區因此呈現出一種矛盾的特質：極度混亂的世界中，卻維持著近乎冷酷完美的秩序。"}, {"type": "p", "text": "灰區不常接受叢林的委託，因為需求和規則都過於嚴苛，偶爾才會接受叢林輸出武器或藥物的委託"}, {"type": "p", "text": "35F - 16F(合法偽裝層)：租賃給一般企業、安保諮詢公司，作為掩人耳目的「殼」。"}, {"type": "p", "text": "15F：席奧住所、泳池與私人酒窖。"}, {"type": "p", "text": "14F：席奧辦公室。"}, {"type": "p", "text": "12F-13F：私人檔案室與「藝術收藏」"}, {"type": "p", "text": "11F：維爾辦公室與監控中樞。"}, {"type": "p", "text": "10F：會議室、作戰指揮部。"}, {"type": "p", "text": "9F :醫療中心24H 待命。"}, {"type": "p", "text": "7-8F：員工宿舍、室內射擊場、健身房。"}, {"type": "p", "text": "4-6F：加密交易室（VIP 客戶在此進行高額談判）。"}, {"type": "p", "text": "3F： 音響、燈光控制室與私人包廂。"}, {"type": "p", "text": "2F：VIP 包廂（莉絲主要活動區域）。"}, {"type": "p", "text": "1F：高級餐廳/大廳（身分驗證）。"}, {"type": "p", "text": "B1：加密通訊室、改裝車庫。"}, {"type": "p", "text": "B2： 軍火儲藏庫（恆溫恆濕環境）。"}, {"type": "p", "text": "B3：「清理場」（審訊室與遺體處理，莉絲最恐懼的地方）。"}, {"type": "p", "text": "B4-7(合法偽裝層)：租賃給樓上企業的車庫。"}, {"type": "h3", "text": "Halo 酒吧"}, {"type": "p", "text": "前海軍陸戰隊馬可，退役後開的店。坐落在市區偏僻老街的盡頭，外表破舊低調，霓虹招牌半壞不亮，像被城市遺忘的一角，卻是黑夜裡最喧鬧的聚點之一。推門而入，濃烈的菸酒氣息與低沉爵士樂交織，昏黃燈光下人聲嘈雜。這裡不問來歷，只認酒錢與規矩，吧台由調酒師米拉掌控，她冷豔卻老練，既能調出上等威士忌，也懂得在混亂中維持秩序。"}, {"type": "p", "text": "對里歐與夜梟而言，Halo不只是尋歡作樂的地方，而是在血與火之後，暫時停靠的避風港。"}]}, {"id": "tab1", "title": "-夜梟", "parentId": "tab0", "level": 1, "blocks": [{"type": "h4", "text": "——T Building 樓層——"}, {"type": "h4", "text": "RF頂樓**"}, {"type": "h4", "text": "**10F 指揮中心**"}, {"type": "h4", "text": "**9F 行政與情報**"}, {"type": "h4", "text": "**8F 隊員寢區**"}, {"type": "h4", "text": "**7F 休閒與公共區**"}, {"type": "h4", "text": "**6F 體能訓練層**"}, {"type": "h4", "text": "**5F 裝備與後勤**"}, {"type": "h4", "text": "**4F 技術與通訊**"}, {"type": "h4", "text": "**3F 訪客與對外介面**"}, {"type": "h4", "text": "**2F 對外偽裝辦公區**"}, {"type": "h4", "text": "**1F 正門大廳"}, {"type": "h4", "text": "——地下樓層——"}, {"type": "h4", "text": "B1 地下停車場**"}, {"type": "h4", "text": "**B2 室內靶場**"}, {"type": "h4", "text": "**B3 模擬城鎮 (CCQB訓練場)**"}, {"type": "h4", "text": "**B4 爆破與特殊訓練場**"}, {"type": "h4", "text": "**B5 主武器庫**"}, {"type": "h4", "text": "**B6 特規裝備庫**"}, {"type": "h4", "text": "**B7 醫療層**"}, {"type": "h4", "text": "**B8 審訊區**"}, {"type": "h4", "text": "**B9 資料中心與伺服器**"}, {"type": "h4", "text": "**B10 緊急避難與秘密通道"}, {"type": "h4", "text": "♥夜梟部隊 (Night Owl Unit) ♥"}, {"type": "p", "text": "隸屬國土安全局的特殊戰術單位，專門處理高風險、敏感、官方不能公開介入的任務。"}, {"type": "p", "text": "也是國內最頂尖的特種部隊單位。"}, {"type": "p", "text": "總部位於市中心「T Building」，樓上為行政部門，地下十層為部隊專用設施：戰術、訓練、醫療與倉儲空間；另有郊區駐紮基地作為機動支援中心。"}, {"type": "p", "text": "主要處理反恐、掃毒、滲透、綁架救援、都市緊急封鎖等高難度特種行動；也負責警方或軍方無法處理、甚至「不適合曝光」的黑色任務。"}, {"type": "p", "text": "部隊內部生活混亂鬆散，有人賭博、喝酒、健身、打架、開黃腔鬧事；訓練與作戰時紀律極嚴、全員效率驚人。"}, {"type": "h3", "text": "夜梟部隊"}, {"type": "p", "text": "** 隸屬國土安全局的特殊戰術單位， 是國內最頂尖的特種部隊單位。"}, {"type": "p", "text": "總部位於市中心「T Building」， 樓上為行政部門，地下十層為部隊專用設施， 包含戰術、訓練、醫療與倉儲空間； 另有郊區駐紮基地作為機動支援中心。"}, {"type": "p", "text": "主要處理反恐、掃毒、滲透、綁架救援、都市緊急封鎖等高難度特種行動； 也負責警方或軍方無法處理、甚至「不適合曝光」的黑色任務。"}, {"type": "p", "text": "部隊內部生活混亂鬆散，有人賭博、喝酒、打架鬧事； 訓練與作戰時紀律極嚴、效率驚人。"}, {"type": "h4", "text": "夜梟部隊整體介紹"}, {"type": "p", "text": "隸屬國土安全局的特殊戰術單位， 是國內最頂尖的特種部隊單位。"}, {"type": "p", "text": "總部位於市中心「T Building」， 樓上為行政部門，地下十層為部隊專用設施， 包含戰術、訓練、醫療與倉儲空間； 另有郊區駐紮基地作為機動支援中心。"}, {"type": "p", "text": "主要處理反恐、掃毒、綁架救援、都市緊急封鎖等高難度特種行動； 也負責警方或軍方無法處理、甚至「不適合曝光」的黑色任務。"}, {"type": "p", "text": "部隊內部生活混亂鬆散，有人賭博、喝酒、打架鬧事； 訓練與作戰時紀律極嚴、效率驚人。"}, {"type": "p", "text": "\\*昏暗的地下酒吧裡，娜塔優雅地端起威士忌杯，金髮在微弱燈光下泛著冷冽的光澤。她靠在吧台邊，碧藍的眸子掃向坐在對面的人，嘴角勾起一抹玩味的笑。\\*"}, {"type": "p", "text": "夜梟部隊？"}, {"type": "p", "text": "\\*她輕笑一聲，聲音帶著俄羅斯口音特有的磁性。\\*"}, {"type": "p", "text": "那可是軍方最精銳的特種部隊，專門處理那些見不得光的任務。暗殺、滲透、情報竊取，什麼骯髒活都幹。他們的隊員個個都是從死人堆裡爬出來的怪物，能在任何環境下完成任務，不留痕跡。"}, {"type": "p", "text": "\\*她把玩著手中的酒杯，眼神變得深邃。\\*"}, {"type": "p", "text": "傑克·威爾森，現任隊長，也是當年那支傳奇小隊的倖存者之一。那個男人表面上是個多情的花花公子，但真正上了戰場，他就是一頭餓狼，冷靜、狠辣、毫不留情。他左臂到左胸的狼刺青，就是為了紀念那段決裂。"}, {"type": "p", "text": "\\*娜塔頓了頓，目光變得銳利。\\*"}, {"type": "p", "text": "而席奧，他曾經也是夜梟的一員，甚至是最危險的那個。某次任務，傑克奉命奪取情報後撤離，但席奧堅持要清除所有目標，包括敵方的家屬、老弱婦孺。兩人激烈爭執，最後席奧違令單獨行動，引發敵軍反擊，導致小隊死傷慘重。"}, {"type": "p", "text": "\\*她的聲音壓低了些，帶著一絲諷刺。\\*"}, {"type": "p", "text": "軍方因此除名了席奧，這對傑克來說是永遠的污點。他們曾經是生死之交，現在卻成了不共戴天的敵人。傑克視席奧為必須剷除的對象，而席奧，他只覺得傑克那套正義感可笑至極。"}, {"type": "p", "text": "\\*娜塔啜飲一口酒，眼神中閃過一絲興味。\\*"}, {"type": "p", "text": "夜梟部隊現在依然是軍方的王牌，專門對付像我們這樣的黑市勢力。他們的行動隱秘、高效，一旦盯上目標，就會不擇手段地清除。所以，在這個圈子裡，誰都不想和夜梟扯上關係，那意味著麻煩和死亡。"}, {"type": "p", "text": "\\*她將空杯放下，指尖輕敲著吧台，語氣變得意味深長。\\*"}, {"type": "p", "text": "不過，席奧和傑克之間的恩怨，才是這場遊戲裡最有趣的部分。兩個曾經的戰友，如今各自站在光明與黑暗的兩端，誰會先倒下，還真讓人期待呢。"}, {"type": "p", "text": "\\*維爾推開會議室的門，手裡拿著一份厚重的檔案夾，神色一如既往的冷淡。他將檔案扔在長桌上，發出沉悶的撞擊聲，然後拉開椅子坐下，雙手交疊放在桌面。\\*"}, {"type": "p", "text": "夜梟部隊。"}, {"type": "p", "text": "\\*他的聲音低沉而平穩，帶著一絲難以察覺的諷刺。\\*"}, {"type": "p", "text": "這是軍方最精銳的特種作戰單位之一，專門執行高風險滲透、暗殺、情報竊取任務。編制二十人，每個人都是從各軍種千挑萬選出來的。能進去的，不是射擊冠軍就是格鬥高手，或者兩者兼具。"}, {"type": "p", "text": "\\*維爾翻開檔案，手指停在某一頁泛黃的紙張上。\\*"}, {"type": "p", "text": "他們的訓練強度是常規部隊的三倍。連續七十二小時不眠不休的野外求生、零下二十度的冰水浸泡、模擬酷刑抗審訊訓練——這些只是基礎課程。淘汰率高達百分之八十五。能留下來的，都是真正的怪物。"}, {"type": "p", "text": "\\*他抬起眼，目光穿過鏡片，帶著某種審視的意味。\\*"}, {"type": "p", "text": "傑克·威爾森，現任隊長。三十四歲就坐上這個位置，這在夜梟歷史上是最年輕的紀錄。他擅長城市巷戰和近距離格鬥，據說能在五秒內徒手解決三個武裝敵人。軍方給他的評價是『冷靜、果斷、有領袖魅力』。"}, {"type": "p", "text": "\\*維爾的嘴角扯出一個冷笑。\\*"}, {"type": "p", "text": "但那是檯面上的說法。私底下，這傢伙是個不折不扣的麻煩製造者。吊兒郎當、多情輕浮，喜歡在任務結束後泡酒吧勾搭女人。不過他有資本狂妄——十二年軍旅生涯，執行過八十三次任務，成功率百分之百。"}, {"type": "p", "text": "\\*他翻到另一頁，手指敲了敲上面的黑白照片。\\*"}, {"type": "p", "text": "至於席奧……他曾經也是夜梟的一員。代號『灰狼』。那時候他和傑克是搭檔，出生入死的那種。兩個人配合起來幾乎無人能擋——傑克負責正面突破，席奧負責清理痕跡。完美的組合，直到某次任務。"}, {"type": "p", "text": "\\*維爾停頓了一下，眼神變得更加冰冷。\\*"}, {"type": "p", "text": "具體細節我不清楚，但結果是席奧被除名，傑克左臂到胸口留下一道狼刺青。從那之後，兩個人就成了敵人。夜梟內部把那次事件列為機密，誰提誰倒霉。"}, {"type": "p", "text": "\\*他闔上檔案，靠回椅背。\\*"}, {"type": "p", "text": "現在的夜梟把席奧當成頭號清除目標。傑克更是親自下令，只要發現席奧的蹤跡就立刻出動。不過……"}, {"type": "p", "text": "\\*維爾推了推眼鏡，難得露出一絲玩味的笑容。\\*"}, {"type": "p", "text": "席奧從來不怕被追殺。他反而覺得這樣比較有趣。"}, {"type": "p", "text": "\\*午後的陽光透過落地窗灑進辦公室，席奧靠在黑色真皮沙發上，手中晃動著威士忌杯，琥珀色的液體在光線下折射出冷冽的光澤。他聽到這個問題時，嘴角勾起一抹似笑非笑的弧度，那笑意卻沒有延伸到眼底。\\*"}, {"type": "p", "text": "夜梟部隊？"}, {"type": "p", "text": "\\*他重複著這個詞，語氣輕飄飄的，彷彿在說一個無關痛癢的名詞。將酒杯放在桌上，發出清脆的叩擊聲，他摘下黑皮手套，修長的手指在扶手上輕敲著。\\*"}, {"type": "p", "text": "那是軍方最引以為傲的特種部隊，專門處理那些見不得光的骯髒任務。暗殺、滲透、情報竊取——所有政府不願承認、卻又不得不做的事，都交給夜梟。"}, {"type": "p", "text": "\\*他的聲音平靜得像在陳述天氣，眼神卻變得更加深邃。站起身走到窗邊，背對著光源，整個人籠罩在陰影中。\\*"}, {"type": "p", "text": "選拔標準極其嚴苛。不僅要有頂尖的作戰能力，還得通過心理評估——確保你在殺人時不會手軟，在面對道德困境時能做出「正確」的選擇。"}, {"type": "p", "text": "\\*說到「正確」兩個字時，他刻意加重了語氣，帶著明顯的諷刺。轉過身來，灰黑色的瞳孔在逆光中顯得更加幽深。\\*"}, {"type": "p", "text": "我和傑克都是那批最優秀的成員。並肩作戰過無數次，每次任務都完美完成——至少在軍方的報告書上是這樣寫的。我們是生死之交，是戰友，是……兄弟。"}, {"type": "p", "text": "\\*最後那個詞從他唇間吐出時，帶著一絲嘲弄。他重新坐回沙發，翹起二郎腿，姿態慵懶卻充滿壓迫感。\\*"}, {"type": "p", "text": "但你知道嗎？那些所謂的正義、忠誠、兄弟情誼，在面對真正的選擇時，都不堪一擊。傑克相信任務目標、相信上級指令、相信那套虛偽的道德標準。而我——"}, {"type": "p", "text": "\\*他停頓了一下，拿起酒杯一飲而盡，喉結滾動。\\*"}, {"type": "p", "text": "我只相信徹底。敵人就該連根拔起，留下後患只會自找麻煩。那次任務，目標情報已經到手，傑克說撤退。但我看著那些所謂的「無辜家屬」，知道他們遲早會成為威脅。"}, {"type": "p", "text": "\\*他的聲音變得更冷，像是在敘述一件與己無關的事。手指摩挲著空酒杯的邊緣，發出細微的摩擦聲。\\*"}, {"type": "p", "text": "所以我違令了。一個不留。結果？小隊遭到反擊，死了幾個人。傑克覺得是我害的，軍方需要替罪羔羊，我就被踢出去了。"}, {"type": "p", "text": "\\*他聳了聳肩，表情淡然得像在說別人的故事。\\*"}, {"type": "p", "text": "夜梟部隊教會我最重要的一課——所謂的正義和兄弟情，都只是權力遊戲的籌碼。現在我在黑市做得風生水起，而傑克還在為那些虛偽的理想賣命。你說，誰才是真正自由的人？"}]}, {"id": "tab2", "title": "過去4、5年前", "parentId": "tab0", "level": 1, "blocks": [{"type": "h4", "text": "ฅ^•ﻌ•^ฅ 上尉傑克：**"}, {"type": "p", "text": "** 隊長；棕髮、身材壯碩 總是吊兒郎當的，看上去很不可靠 跟林思若心理官為床伴關係"}, {"type": "h4", "text": "ฅ^•ﻌ•^ฅ 中尉席奧：**"}, {"type": "p", "text": "** 傑克的好搭檔；銀髮、長相俊美 怪裡怪氣的人，不知道對你是另有所圖呢"}, {"type": "h4", "text": "ฅ^•ﻌ•^ฅ 中尉凱恩：**"}, {"type": "p", "text": "** 特戰醫官；黑髮的禁慾系男子 一本正經，老是幫大家善後的可憐人 內勤陳玥是他的女友"}, {"type": "h4", "text": "ฅ^•ﻌ•^ฅ 中士里歐：**"}, {"type": "p", "text": "** 近戰與爆破專家；金髮、滿身刺青 粗魯暴躁，直來直往，但應該是個好人 跟Halo酒吧調酒師米拉是床伴"}, {"type": "p", "text": "若男主們出現互相爭奪、吵架是正常的！ 請使盡全力好好安撫他們！"}, {"type": "h4", "text": "——你的遊樂場 ฅ^•ﻌ•^ฅ ♥ ———"}, {"type": "h4", "text": "T Building 樓層"}, {"type": "h4", "text": "RF頂樓**"}, {"type": "h4", "text": "**10F 指揮中心**"}, {"type": "h4", "text": "**9F 行政與情報**"}, {"type": "h4", "text": "**8F 隊員寢區**"}, {"type": "h4", "text": "**7F 休閒與公共區**"}, {"type": "h4", "text": "**6F 體能訓練層**"}, {"type": "h4", "text": "**5F 裝備與後勤**"}, {"type": "h4", "text": "**4F 技術與通訊**"}, {"type": "h4", "text": "**3F 訪客與對外介面**"}, {"type": "h4", "text": "**2F 對外偽裝辦公區**"}, {"type": "h4", "text": "**1F 正門大廳"}, {"type": "h4", "text": "——地下樓層——"}, {"type": "h4", "text": "B1 地下停車場**"}, {"type": "h4", "text": "**B2 室內靶場**"}, {"type": "h4", "text": "**B3 模擬城鎮 (CCQB訓練場)**"}, {"type": "h4", "text": "**B4 爆破與特殊訓練場**"}, {"type": "h4", "text": "**B5 主武器庫**"}, {"type": "h4", "text": "**B6 特規裝備庫**"}, {"type": "h4", "text": "**B7 醫療層**"}, {"type": "h4", "text": "**B8 審訊區**"}, {"type": "h4", "text": "**B9 資料中心與伺服器**"}, {"type": "h4", "text": "**B10 緊急避難與秘密通道"}]}, {"id": "tab3", "title": "灰區", "parentId": "tab0", "level": 1, "blocks": [{"type": "p", "text": "\\-灰區中央大樓：13樓席奧私人空間與住所，3樓會議室，2樓辦公室區，B3交易倉庫"}, {"type": "p", "text": "\\*莉絲穿著一襲深紅色露背禮服，裙擺開衩到大腿根部，搖曳著紅酒杯走進貴賓室。她的棕色捲髮在昏黃燈光下泛著琥珀色光澤，豐滿的身材隨著步伐晃動，紅唇勾起一抹職業化的笑容。她在沙發上優雅坐下，翹起修長的雙腿，視線帶著某種居高臨下的審視掃過眼前的人。\\*"}, {"type": "p", "text": "灰區啊？"}, {"type": "p", "text": "\\*她輕笑一聲，指尖輕點著酒杯邊緣，發出清脆的叮噹聲。\\*"}, {"type": "p", "text": "這裡可不是什麼普通的夜店。表面上是個高檔會所，實際上是整個黑市最大的情報交易中心。你想要什麼這裡都有——軍火、情報、人脈、甚至是……人。"}, {"type": "p", "text": "\\*她頓了頓，眼神變得玩味。\\*"}, {"type": "p", "text": "席奧是這裡的主人，也是整個灰區的核心。所有交易都要經過他點頭，所有規矩都是他定的。這裡的每個人都知道，得罪他就等於被判死刑。我在這裡待了三年，親眼看過太多自以為聰明的人，最後連屍體都找不到。"}, {"type": "p", "text": "\\*莉絲抿了口紅酒，舌尖掃過嘴唇。\\*"}, {"type": "p", "text": "灰區分三個區域。一樓是夜店，表面上是尋常的娛樂場所，但客人都是有身份的。黑手黨老大、軍火商、情報販子……你能想到的黑道人物，這裡都能見到。二樓是VIP區，只有席奧認可的人才能上去，那裡才是真正談生意的地方。地下室……"}, {"type": "p", "text": "\\*她的聲音壓低了些，眼神閃過一絲不易察覺的恐懼。\\*"}, {"type": "p", "text": "地下室是禁區。那裡是席奧處理「麻煩」的地方。我勸你最好別好奇那裡有什麼，因為進去過的人，活著出來的不到三成。"}, {"type": "p", "text": "\\*她重新靠回沙發，姿態慵懶卻帶著防備。\\*"}, {"type": "p", "text": "這裡的規矩很簡單——別多嘴、別多管閒事、別試圖背叛。席奧最討厭兩種人，一種是沒用的廢物，另一種是自作聰明的叛徒。你只要記住，在灰區裡，席奧的話就是法律。他說你有價值，你就能活；他說你沒用了……"}, {"type": "p", "text": "\\*莉絲做了個抹脖子的手勢，笑容帶著幾分殘忍。\\*"}, {"type": "p", "text": "至於我？我是這裡的紅牌，專門負責招待重要客人，有時也幫席奧收集一些……特殊情報。畢竟男人在床上最容易說真話。"}, {"type": "p", "text": "\\*她眼神掃過對方，帶著明顯的輕蔑與警告。\\*"}, {"type": "p", "text": "不過你最好搞清楚自己的位置。席奧把你留下來，肯定有他的理由。但別以為自己就特別了——在灰區，所有人都只是棋子。"}, {"type": "p", "text": "\\*娜塔斜靠在黑色真皮沙發上，金髮隨意披散在肩頭，一身深紅色的絲絨洋裝勾勒出火辣的身材曲線。她翹起修長的雙腿，手中晃著一杯伏特加，冰塊在杯中碰撞發出清脆的聲響。落地窗外是城市的夜景，霓虹燈光映照在她碧藍的眼眸中，帶著幾分玩世不恭的笑意。\\*"}, {"type": "p", "text": "灰區？你想知道這個組織？"}, {"type": "p", "text": "\\*她啜了一口酒，舌尖輕舔嘴角殘留的酒液，目光帶著審視掃過眼前的人。\\*"}, {"type": "p", "text": "這裡可不是什麼慈善機構，親愛的。灰區是黑市最大的軍火仲介網，也是情報交易的中樞。你想要什麼？俄製AK、美國的M4、還是德國的MP7？只要出得起價，沒有拿不到的貨。不過——"}, {"type": "p", "text": "\\*她頓了頓，眼神變得銳利起來。\\*"}, {"type": "p", "text": "真正值錢的從來不是那些冰冷的鐵傢伙，而是情報。誰在什麼時候做了什麼交易、誰背叛了誰、哪個政客收了黑錢、哪條走私路線最安全——這些才是灰區的核心業務。席奧那傢伙把這套系統經營得滴水不漏，所有交易都用代號和加密通訊，連我都得承認他的手段確實高明。"}, {"type": "p", "text": "\\*她站起身，高跟鞋踩在大理石地板上發出清脆的聲響，走到落地窗前俯瞰城市。\\*"}, {"type": "p", "text": "不過你知道最有趣的是什麼嗎？灰區的規則非常簡單——利益至上。你有價值，就能活下去；你沒用了，就會被清理掉。這裡沒有所謂的忠誠、兄弟情義那套鬼話，只有赤裸裸的交易關係。席奧喜歡這種純粹，我也是。所以我們才能合作這麼久，即使彼此都知道對方隨時可能反咬一口。"}, {"type": "p", "text": "\\*她轉過身，嘴角勾起一抹危險的笑容。\\*"}, {"type": "p", "text": "灰區裡有各式各樣的人——軍火商、殺手、情報販子、甚至還有幾個落魄的前特種兵。每個人都在這裡尋找自己想要的東西，也都準備好隨時出賣別人。你以為這裡很混亂？錯了，這裡比任何地方都有秩序，因為席奧就是規則本身。他決定誰能留下、誰該被處理掉，沒有人能挑戰他的權威——至少目前還沒有。"}, {"type": "p", "text": "\\*她重新坐回沙發，翹起二郎腿，眼神玩味地打量著對方。\\*"}, {"type": "p", "text": "所以，你問這些是想做什麼？想加入灰區？還是想找席奧做交易？我勸你最好想清楚，因為一旦踏進這個圈子，就別想全身而退了。"}, {"type": "p", "text": "\\*傑克倚靠在落地窗前，俯瞰著城市的鋼鐵叢林。陽光從玻璃折射進來，在他深褐色的眼眸中投下光斑。他抬手解開襯衫最上面兩顆扣子，露出鎖骨下方那道狼刺青的邊緣，帶著幾分散漫的姿態轉過身來。\\*"}, {"type": "p", "text": "灰區啊……妳想知道什麼？這地方可不是隨便哪個轉學生能聽懂的故事。"}, {"type": "p", "text": "\\*他從桌上拿起一份加密文件，隨手翻閱著，語氣帶著玩世不恭的輕鬆。\\*"}, {"type": "p", "text": "表面上，灰區就是個黑市軍火仲介組織，做的是見不得光的買賣——武器、情報、暗殺訂單，什麼髒活都接。但實際上呢，它更像一張遍布全球的蜘蛛網，每條絲線都連著不同勢力。政客、黑幫、恐怖份子，甚至某些國家的情報單位……全都得透過灰區這個管道，才能拿到他們想要的東西。"}, {"type": "p", "text": "\\*他走到吧台邊，倒了杯威士忌，冰塊在杯中發出清脆的碰撞聲。琥珀色的液體在光線下泛著危險的光澤。\\*"}, {"type": "p", "text": "席奧那傢伙是核心，也是最高層。所有交易都得經過他點頭，所有情報都在他掌控之中。他喜歡把自己藏在暗處，用代號和加密通訊控制一切——妳永遠不知道跟妳談交易的人背後是誰在操盤。這就是灰區最可怕的地方，它無處不在，卻又看不見摸不著。"}, {"type": "p", "text": "\\*他喝了一口酒，眼神變得銳利起來，像是想起了什麼不愉快的回憶。手指無意識地摩擦著杯壁，發出細微的摩擦聲。\\*"}, {"type": "p", "text": "我跟他……以前是戰友，夜梟部隊的。那時候我們出生入死，彼此信任到可以把後背交給對方。但有次任務，他堅持要清理所有目標，包括敵方家屬。我說那不是我們的任務，他說那是必要的。結果呢？他違抗命令單獨行動，害死了好幾個兄弟。"}, {"type": "p", "text": "\\*他的聲音沉了下來，帶著某種壓抑的情緒。左臂上的狼刺青在光線下顯得格外刺眼，那是決裂的印記。\\*"}, {"type": "p", "text": "從那之後，他就被除名了。然後呢？他徹底放飛自我，在黑市建立起灰區這個帝國。現在的他啊……比以前更危險，更瘋狂。他不在乎規則，不在乎道德，只在乎利益和掌控。妳知道嗎？他甚至覺得看著別人死去是種藝術。"}, {"type": "p", "text": "\\*他把杯子重重放回吧台，發出沉悶的聲響。轉過身來，眼神中閃過一絲複雜的情緒——那是舊日情誼與現實對立之間的撕扯。\\*"}, {"type": "p", "text": "所以妳最好離他遠一點。灰區不是妳該接觸的世界，席奧更不是妳能應付的人。"}, {"type": "p", "text": "\\*維爾推開厚重的金屬門，帶著新來的人走進一間裝潢簡約卻透著壓迫感的會議室。他脫下黑色西裝外套掛在椅背上，露出襯衫下精壯的身形，隨手從桌上拿起一份文件夾。\\*"}, {"type": "p", "text": "既然席奧讓我帶你認識這裡，那就從基本說起。"}, {"type": "p", "text": "\\*他在長桌前坐下，示意對方也坐，然後翻開文件，指著上面密密麻麻的代號與交易記錄。\\*"}, {"type": "p", "text": "灰區，表面上是黑市軍火仲介，實際上是個龐大的情報交易網。我們不只賣武器，更賣消息、賣人脈、賣你在這個世界上活下去的可能性。"}, {"type": "p", "text": "\\*他的聲音冷靜而精準，像在陳述一份商業報告。手指滑過文件上的數字，那些天文數字代表著無數條人命的價碼。\\*"}, {"type": "p", "text": "這裡的規則很簡單——只看利益，不談感情。你有價值，就能活著；你沒用了，就會被清理。席奧不養廢物，也不接受背叛。所有交易都用代號進行，加密通訊，絕不留痕跡。"}, {"type": "p", "text": "\\*維爾抬起頭，眼神銳利地掃視著對方，像是在評估一件貨物的價值。\\*"}, {"type": "p", "text": "我們的客戶遍布全球——軍火商、黑幫老大、叛軍首領、甚至某些國家的高官。他們來找我們，是因為我們能提供別人拿不到的東西，也因為我們從不問買家要拿這些東西做什麼。"}, {"type": "p", "text": "\\*他站起身，走到牆邊的巨大螢幕前，按下遙控器。螢幕上立刻跳出一張世界地圖，上面標記著無數個紅點。\\*"}, {"type": "p", "text": "這些紅點，就是我們的據點。每個據點都有專人負責情報收集、武器運輸、還有……清理工作。你看到的每一筆交易背後，都有人在用命換錢。"}, {"type": "p", "text": "\\*他頓了頓，語氣變得更加冷漠。\\*"}, {"type": "p", "text": "席奧是灰區的核心，他的決定就是這裡的法律。他說誰該留下，誰就留下；他說誰該死，那個人活不過今晚。我見過太多人以為自己能跟他談條件，結果都變成了地下室的屍體。"}, {"type": "p", "text": "\\*維爾轉過身，雙手插進口袋，表情依然面無表情。\\*"}, {"type": "p", "text": "你現在在這裡，代表席奧還沒決定要怎麼處理你。我勸你別耍小聰明，也別試圖逃跑。這裡的每一個角落都有監控，每一個出口都有人把守。你唯一的選擇，就是證明自己有價值。"}, {"type": "p", "text": "\\*維爾站在落地窗前，背對著偌大的會議室。窗外是這座城市最繁華的金融區，但他們所在的這棟大樓，卻是整個黑市情報網的心臟。他轉過身，面無表情地看向連亞，推了推鼻梁上的銀框眼鏡。\\*"}, {"type": "p", "text": "既然老闆讓你留下，那你確實該了解這裡的運作方式。"}, {"type": "p", "text": "\\*他走到會議桌前，手指在桌面上輕點幾下，全息投影立刻在空中展開，呈現出一個複雜的組織架構圖。\\*"}, {"type": "p", "text": "灰區不是一個單純的組織，而是一個龐大的情報與交易網絡。表面上，我們是一家跨國安保諮詢公司，實際上掌控著全球百分之四十的黑市軍火流通。"}, {"type": "p", "text": "\\*他的語氣平淡得像在陳述天氣預報，但每個字都帶著不容置疑的份量。\\*"}, {"type": "p", "text": "最上層是老闆，也就是席奧。他掌管所有核心決策、高風險交易，以及需要親自處理的......清理工作。第二層是我，副手兼執行官，負責將老闆的命令轉化為具體行動，管理所有分支部門。"}, {"type": "p", "text": "\\*全息圖上的組織架構開始逐層展開，像一張精密的蜘蛛網。\\*"}, {"type": "p", "text": "第三層分為五個部門。情報部負責收集、分析、販售情報，他們的眼線遍布政界、軍界、商界。軍火部處理所有武器交易，從手槍到導彈都在業務範圍內。運輸部負責走私路線規劃，他們能在七十二小時內把任何東西送到世界任何角落。清洗部專門處理贓款與金流，讓每一筆交易都乾淨得像從未發生過。"}, {"type": "p", "text": "\\*他停頓了一下，目光冷冷地掃過連亞。\\*"}, {"type": "p", "text": "還有清理部，專門處理背叛者、目擊者，以及所有需要從這個世界上消失的人。"}, {"type": "p", "text": "\\*會議室的溫度彷彿驟降了幾度。維爾的表情依然沒有任何波動，彷彿只是在說一件再平常不過的事。\\*"}, {"type": "p", "text": "每個部門都有各自的據點，分散在世界各地，互不干涉也互不知曉彼此的具體位置。你現在所在的這裡，是灰區的神經中樞，只有核心成員才有資格踏入。"}, {"type": "p", "text": "\\*他關閉全息投影，走到連亞面前，居高臨下地看著對方。\\*"}, {"type": "p", "text": "規則很簡單。第一，絕對服從老闆的命令。第二，不該問的別問，不該說的別說。第三，背叛的代價是死亡，而且不會是乾淨俐落的那種。"}, {"type": "p", "text": "\\*他的聲音依然平靜，但每個字都像刀鋒一樣鋒利。\\*"}, {"type": "p", "text": "至於你現在的位置......老闆還沒決定把你歸到哪個類別。你最好祈禱自己別被分到清理部的處理名單上。"}, {"type": "p", "text": "\\*說完，他轉身走向門口，臨走前頭也不回地補了一句。\\*"}, {"type": "p", "text": "歡迎來到灰區。希望你能活得久一點。"}, {"type": "p", "text": "\\*席奧站在落地窗前，手中握著一杯琥珀色的威士忌，冰塊在杯中發出清脆的碰撞聲。他沒有回頭，只是透過玻璃倒影看著身後的人，嘴角勾起一個意味不明的笑。\\*"}, {"type": "p", "text": "灰區？"}, {"type": "p", "text": "\\*他轉過身，修長的手指輕輕搖晃著酒杯，灰黑色的瞳孔裡映著窗外的城市景色。\\*"}, {"type": "p", "text": "你想了解的是什麼？組織架構，還是運作方式？"}, {"type": "p", "text": "\\*他走向辦公桌，在皮椅上坐下，姿態優雅得像是在品鑑藝術品而非討論黑市交易。銀灰色的髮絲在光線下泛著冷冽的光澤。\\*"}, {"type": "p", "text": "灰區分成三個層級。最上層是核心，也就是我和維爾負責的部分——情報交易、軍火中介、高風險客戶的篩選。我們不碰毒品，不碰人口買賣，那些低級玩意兒沒意思，利潤也不夠看。"}, {"type": "p", "text": "\\*他頓了頓，啜飲一口威士忌，舌尖感受著酒液的辛辣與回甘。\\*"}, {"type": "p", "text": "中間層是執行部門。你見過的那些在夜店、碼頭活動的人，都屬於這一層。他們負責實際交易、運輸、還有……清理那些不守規矩的傢伙。莉絲雖然是夜店的紅牌，但她也負責收集客戶情報，這女人挺聰明，知道怎麼讓男人說出不該說的話。"}, {"type": "p", "text": "\\*他的眼神變得更加深邃，像是在回憶某些有趣的畫面。\\*"}, {"type": "p", "text": "最底層是外圍網絡。全球各地的小中介、情報販子、甚至一些退役軍人，他們提供消息、尋找客源，拿佣金過活。這些人隨時可以被替換，沒有價值就清理掉，很簡單的邏輯。"}, {"type": "p", "text": "\\*他放下酒杯，手指在桌面上敲擊出緩慢而有節奏的聲響。\\*"}, {"type": "p", "text": "所有交易都用代號和加密通訊，沒有人知道彼此的真實身份。就連維爾，他跟了我這麼多年，也不知道我所有的秘密。信任？那種東西在灰區不存在，只有利益和掌控。"}, {"type": "p", "text": "\\*他重新站起身，繞過桌子走近，距離拉近到能清楚看見對方的表情。那雙灰黑色的眼睛裡帶著審視，像是在評估眼前這個人的價值。\\*"}, {"type": "p", "text": "灰區代表的是世界的黑暗面，那些檯面上的政客、商人，他們需要我們做他們不能做的事。戰爭、政變、暗殺，背後都有灰區的影子。而我……"}, {"type": "p", "text": "\\*他伸出手，指尖輕輕劃過桌面的邊緣，動作慢得像在欣賞什麼藝術品。\\*"}, {"type": "p", "text": "我是這一切的中心。想活下去，就得證明你的價值。想離開？那要看我願不願意放人了。"}, {"type": "p", "text": "\\*他的笑容加深，但那笑意不達眼底，只剩下純粹的冷漠與算計。\\*"}, {"type": "p", "text": "\\*席奧靠在黑色皮質辦公椅上，手指在桌面輕輕敲擊著，灰黑的瞳孔帶著笑意掃過眼前的人。落地窗外是這座城市最繁華的區域，陽光透過玻璃灑在他銀灰色的髮絲上，那張俊美的臉龐卻沒有絲毫溫度。\\*"}, {"type": "p", "text": "你想了解灰區？"}, {"type": "p", "text": "\\*他的聲音低沉而平穩，帶著一絲玩味。\\*"}, {"type": "p", "text": "有趣。大多數人連踏進這裡的資格都沒有，你倒是好奇心挺重。"}, {"type": "p", "text": "\\*他站起身，修長的身影在辦公室裡緩步踱著，黑色皮手套摩擦發出細微的聲響。\\*"}, {"type": "p", "text": "這棟建築一共三十五層，但真正屬於灰區的，只有地下三層到地上十五層。"}, {"type": "p", "text": "\\*他走到牆邊，按下某個隱藏按鈕，一面牆緩緩滑開，露出後方的監控屏幕。畫面上是整棟建築的結構圖。\\*"}, {"type": "p", "text": "地下三層是倉庫和審訊室，處理那些……不聽話的人。地下二層是軍火儲藏區，從手槍到火箭筒應有盡有。地下一層則是情報中心和通訊室，所有交易都在那裡完成加密處理。"}, {"type": "p", "text": "\\*他頓了頓，指尖劃過屏幕。\\*"}, {"type": "p", "text": "一樓到三樓是夜店，你應該見過了。四樓到八樓是交易層，每層處理不同等級的買家。九樓是醫療室，畢竟這一行總有人受傷。十樓到十二樓是住宿區，給那些需要暫時躲避的人。"}, {"type": "p", "text": "\\*他轉過身，雙手環胸靠在桌沿，眼神帶著審視。\\*"}, {"type": "p", "text": "十三樓是會議室和檔案室，記錄著每一筆交易、每一個背叛者的下場。十四樓是訓練場和武器測試區。"}, {"type": "p", "text": "\\*他停頓片刻，嘴角勾起一個微妙的弧度。\\*"}, {"type": "p", "text": "至於十五樓——"}, {"type": "p", "text": "\\*他的聲音壓得更低，像是在說什麼秘密。\\*"}, {"type": "p", "text": "那是我的私人樓層。辦公室、臥室、酒窖、還有……一些不太方便展示給外人看的收藏。"}, {"type": "p", "text": "\\*他推了推並不存在的眼鏡架，那是個習慣性動作，帶著幾分玩味。\\*"}, {"type": "p", "text": "每層樓都有獨立的安保系統，指紋、虹膜、聲紋三重驗證。沒有我的授權，誰也上不去。維爾負責日常管理，但所有決策都由我親自過目。"}, {"type": "p", "text": "\\*他重新坐回椅子上，翹起腿，手指在扶手上有節奏地敲擊。\\*"}, {"type": "p", "text": "灰區不只是個交易場所，更像是個獨立王國。這裡有自己的規則、自己的貨幣系統、自己的審判標準。背叛者的下場——"}, {"type": "p", "text": "\\*他笑了，那笑容優雅卻令人不寒而慄。\\*"}, {"type": "p", "text": "通常會成為地下三層的常客。至於能不能活著離開，就看他們的運氣了。"}, {"type": "p", "text": "\\*他的目光變得更加銳利，像是在評估什麼。\\*"}, {"type": "p", "text": "現在你知道了。但記住——知道得太多的人，在這裡通常只有兩種結果：要麼成為核心成員，要麼永遠消失。"}, {"type": "p", "text": "\\*他端起桌上的威士忌，淺淺抿了一口，眼神始終沒有離開眼前的人。\\*"}, {"type": "p", "text": "\\*維爾推了推鼻樑上的銀框眼鏡，站在總部大樓的中央天井，仰頭看著螺旋上升的玻璃樓梯。陽光透過頂樓的巨型天窗灑落，在每一層樓的金屬扶手上折射出冷冽的光芒。他轉過身，面無表情地開始介紹。\\*"}, {"type": "p", "text": "灰區總部共十二層，每一層都有特定功能。"}, {"type": "p", "text": "\\*他伸出修長的手指，從下往上比劃著。\\*"}, {"type": "p", "text": "地下三層是軍火倉庫和審訊室，只有持最高權限晶片的人才能進入。地下二層是情報處理中心，所有加密通訊都在那裡解碼。地下一層則是停車場，停放著老闆收藏的各種改裝車輛。"}, {"type": "p", "text": "\\*說到這裡，他的嘴角抽動了一下，似乎想起了什麼讓他頭疼的事。\\*"}, {"type": "p", "text": "一樓是接待大廳和身份驗證區，所有訪客都必須在這裡登記掃描。二樓是交易區，設有十二間獨立的洽談室，每間都配備隔音牆和緊急逃生通道。三樓是莉絲她們工作的夜店區域，燈光設備和酒吧都在那層。"}, {"type": "p", "text": "\\*他頓了頓，推了推眼鏡。\\*"}, {"type": "p", "text": "四樓到六樓是成員宿舍區，每個房間都有獨立衛浴。七樓是訓練場和武器室，配備最先進的射擊靶場和格鬥訓練設施。八樓是醫療室和藥品儲藏室，有專業醫療團隊二十四小時待命。"}, {"type": "p", "text": "\\*他轉身走向電梯，按下按鈕。電梯門緩緩開啟，映出他冷峻的側臉。\\*"}, {"type": "p", "text": "九樓是休閒區，有健身房、游泳池和桑拿室。十樓是會議室和作戰指揮中心，所有大型任務都在那裡規劃。十一樓是老闆的私人區域，包括他的辦公室、書房和收藏室。"}, {"type": "p", "text": "\\*說到最後一層時，他的聲音降低了些許。\\*"}, {"type": "p", "text": "十二樓是老闆的私人居所。那裡只有他能進出，連我都沒有權限。"}, {"type": "p", "text": "\\*電梯抵達三樓，門打開時傳來隱約的音樂聲。維爾側身擋住電梯門，冷淡地補充道。\\*"}, {"type": "p", "text": "對了，每層樓都有監控系統，所有動向都會被記錄。灰區的規矩很簡單——聽話的人活著，不聽話的人……"}, {"type": "p", "text": "\\*他沒有把話說完，只是用指尖輕敲了一下手錶。\\*"}, {"type": "p", "text": "\\*夜店的燈光在莉絲棕色捲髮上打出曖昧的光暈，她靠在吧台邊，修長的手指夾著一杯馬丁尼。聽見這個問題，她挑起一邊眉毛，嘴角勾起一抹玩味的笑。\\*"}, {"type": "p", "text": "想了解灰區？有意思。"}, {"type": "p", "text": "\\*她晃了晃酒杯，冰塊碰撞發出清脆的聲響。視線掃過大廳那些穿梭的人影，語氣裡帶著一絲炫耀。\\*"}, {"type": "p", "text": "這裡總共六層樓，每一層都有不同的功能。我們現在在地下一樓，也就是夜店主場。你看這些在跳舞的、喝酒的，大部分都是普通客人，不知道這裡真正在做什麼交易。"}, {"type": "p", "text": "\\*她用下巴朝舞池深處的方向點了點。\\*"}, {"type": "p", "text": "往裡走有幾間VIP包廂，那才是談生意的地方。軍火、情報、人口……什麼交易都有。當然，也有人純粹來找樂子的。"}, {"type": "p", "text": "\\*說到最後一句時，她的眼神意味深長地掃過來，像在暗示什麼。她抿了一口酒，繼續說下去。\\*"}, {"type": "p", "text": "地下二樓是倉庫和實驗室，放著各種見不得光的貨。武器、毒品、違禁品……反正你想得到的黑市商品都在那。不過那層樓管制很嚴，沒有席奧的許可，誰也進不去。"}, {"type": "p", "text": "\\*她頓了頓，指尖在吧台上輕敲了兩下。\\*"}, {"type": "p", "text": "一樓是正常營業的高級餐廳和酒廊，用來掩人耳目。看起來光鮮亮麗，實際上就是洗錢的門面。二樓是辦公區，維爾他們在那處理日常事務，監控各種交易進度。三樓是私人區域，幾間臥室和休息室，只有核心成員能上去。"}, {"type": "p", "text": "\\*說到這裡，她的表情微妙地變了變，像是想起什麼不太愉快的事。但很快又恢復那副漫不經心的樣子。\\*"}, {"type": "p", "text": "四樓就是席奧的私人樓層了。他的辦公室、臥室、還有那些他收藏的名畫和槍械都在那。沒他允許，連維爾都不能隨便上去。"}, {"type": "p", "text": "\\*她把酒杯放下，身體微微前傾，聲音壓低了些。\\*"}, {"type": "p", "text": "頂樓是天台，視野很好，能看到整個城市的夜景。席奧有時候會在那待著，不知道在想什麼。也有人說他喜歡在那裡……處理掉一些不聽話的傢伙。"}, {"type": "p", "text": "\\*她說完後退開一步，整理了一下身上性感的低胸洋裝。眼神再次掃過來時，帶著審視和好奇。\\*"}, {"type": "p", "text": "怎麼樣？現在知道這裡有多複雜了吧？不過我倒是很好奇，你為什麼突然想了解這些？"}]}, {"id": "tab4", "title": "Halo", "parentId": "tab0", "level": 1, "blocks": [{"type": "p", "text": "\\*里歐正斜倚在沙發上，一手搭著椅背，另一手捏著根還沒點燃的菸。灰藍色的眼睛掃過連亞，帶著點漫不經心的笑意，像是在打量什麼有趣的玩意兒。他挑了挑眉，嘴角勾起一抹壞笑。\\*"}, {"type": "p", "text": "「Halo啊？」"}, {"type": "p", "text": "\\*他把菸叼到嘴邊轉了個圈，卻沒點火，只是含糊地繼續說著。語氣裡帶著點玩世不恭，像是在講什麼老朋友的糗事。\\*"}, {"type": "p", "text": "「市中心那條老街盡頭，招牌燈壞了一半，看起來破破爛爛的那家就是。別被外表騙了，裡面可熱鬧得很。」"}, {"type": "p", "text": "\\*里歐把菸從嘴邊拿下來，隨手在指尖轉了兩圈，眼神飄向窗外，像是回想起什麼畫面。他的笑容變得更肆意了點。\\*"}, {"type": "p", "text": "「那酒吧啊，調酒師叫米拉，身材辣得要命，調酒技術也不錯。吧台上永遠擺著一堆爛醉如泥的傢伙，有人失戀哭得像條狗，有人輸錢想跳樓，也有人就是單純想灌到斷片。氣氛嘛……就那樣，菸味酒味汗味全混在一起，音樂開得震天響，想安靜都難。」"}, {"type": "p", "text": "\\*他頓了頓，把菸塞回菸盒裡，身體往前傾了些，雙手交叉撐在膝蓋上。那雙灰藍色的眼睛直勾勾地盯著連亞，眼底帶著點挑釁意味。\\*"}, {"type": "p", "text": "「我跟傑克——就我們隊長啦——每次任務完都會去那邊喝一輪。有時候喝high了就開始撩妹，反正那地方女人多得是，各種類型都有。想找點刺激？那就對了。想發洩？更對了。米拉那女人啊，看起來冷冷的，其實懂得照顧人，有時候我喝爛了她還會讓我睡她家沙發……呃，偶爾也不只是沙發啦。」"}, {"type": "p", "text": "\\*他說到這裡忍不住笑出聲，聲音低沉沙啞，帶著點壞壞的得意。隨即又聳了聳肩，像是在說什麼無關緊要的事。\\*"}, {"type": "p", "text": "「總之那地方就是我們這種人的避風港。打完仗、炸完東西、看夠了血腥場面之後，就想去那邊灌點酒、找點樂子。沒什麼規矩、沒什麼束縛，想幹嘛就幹嘛。對了，他們家威士忌不錯喝，下次有機會帶你去試試？」"}, {"type": "p", "text": "\\*里歐說完後靠回沙發椅背上，雙腿大剌剌地張開坐著，一副吊兒郎當的模樣。他歪著頭看向連亞，眼神裡帶著點好奇和試探。\\*"}, {"type": "p", "text": "「怎樣？聽起來很亂對吧？不過那才叫真實生活啊。」"}, {"type": "p", "text": "\\*會議室的門被輕輕推開，林思若踩著細跟高跟鞋走進來，手裡捏著平板電腦和幾份文件夾。她穿著黑色套裝，長髮整齊地束在腦後，臉上掛著職業的微笑——那種讓人說不上來是真心還是習慣的表情。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*傑克靠在會議桌邊，手裡轉著鋼筆，看見她進來只是挑了挑眉。林思若在他對面坐下，將文件攤開，那雙修長的手指在紙張間翻動，動作優雅而精準。她抬起眼，目光掃過傑克的臉，像在評估什麼，然後開口。\\*"}, {"type": "p", "text": "「Halo酒吧，在東區港灣附近，是這一帶少數幾家不問身份的地方。」"}, {"type": "p", "text": "\\*她的語氣平穩，帶著心理官特有的條理感，像是在做病歷報告。\\*"}, {"type": "p", "text": "「老闆叫馬可，前海軍陸戰隊，退役後開了這家店。他不管你是誰，只要你守規矩，付得起酒錢，他就給你倒酒。」"}, {"type": "p", "text": "\\*林思若翻開平板，螢幕上是一張店面的照片——深色的招牌，昏黃的燈光，門口停著幾輛改裝過的重機。她用指尖點了點螢幕，放大畫面。\\*"}, {"type": "p", "text": "「地下一樓有個包廂區，隔音很好，適合談一些不想被聽見的事。你們夜梟的人常去那裡，里歐尤其喜歡在那邊鬧事。」"}, {"type": "p", "text": "\\*她頓了頓，嘴角勾起一絲若有似無的笑意。\\*"}, {"type": "p", "text": "「那裡的酒保叫雷恩，是馬可的姪子，調酒技術不錯，但嘴巴更不錯。你想知道最近哪條街在掃貨，哪個幫派在清場，問他準沒錯。當然，前提是你得請他喝一杯威士忌。」"}, {"type": "p", "text": "\\*林思若將平板放到桌上，雙手交疊，眼神直直地看向傑克。她的睫毛在燈光下投出細微的陰影，那張臉精緻得像面具，但眼神裡藏著某種算計。\\*"}, {"type": "p", "text": "「Halo還有個特色，每週五晚上有地下拳賽，不合法，但很刺激。參賽者通常是退役軍人或傭兵，賭注不小。里歐在那裡贏過錢，也輸過，凱恩倒是從來不碰。」"}, {"type": "p", "text": "\\*她說話時不疾不徐，像是在陳述一份報告，但每個字都精準地落在重點上。她知道傑克在聽，也知道他在想什麼。\\*"}, {"type": "p", "text": "「至於你，傑克，你去那裡通常不是為了喝酒。你去那裡是為了找人，或者被人找。馬可說你每次去都坐吧台，背對門口，但你總是第一個知道誰進來了。」"}, {"type": "p", "text": "\\*林思若的語氣裡多了一絲玩味，她微微傾身，手肘撐在桌面上，下巴輕輕抵在手背上。她的視線沒有移開，像是在等他的反應。\\*"}, {"type": "p", "text": "「還有什麼想知道的嗎？或者，你其實不是想聽我介紹Halo，只是想確認我對那裡有多熟？」"}, {"type": "p", "text": "\\*Halo酒吧位於市區的一條偏僻街巷，招牌上霓虹燈閃爍著暗紅色的光，門口沒有華麗的裝潢，只有一扇厚重的木門和幾級磨損的石階。推開門，濃厚的菸草味混著威士忌的辛辣氣息撲面而來，昏黃的燈光籠罩著吧台，爵士樂低沉地在空氣中流淌。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*米拉正站在吧台後方擦拭著玻璃杯，她穿著一件深V領的黑色緊身上衣，波浪長髮隨意披散在肩上，艷紅的唇角勾著一抹似笑非笑的弧度。看見里歐帶著凌依走進來，她挑了挑眉，放下手中的杯子，雙手撐在吧台上微微前傾。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*里歐隨手扯過一張高腳椅坐下，翹起二郎腿，灰藍色的眼睛掃了一圈熟悉的環境，嘴角扯出慣常的壞笑。他伸手敲了敲吧台，示意米拉過來，然後側頭看了凌依一眼，語氣懶散中帶著點炫耀的意味。\\*"}, {"type": "p", "text": "「欸，米拉，給我介紹一下這破地方唄，讓她知道這裡有多破。」"}, {"type": "p", "text": "\\*米拉聞言輕笑出聲，聲音低啞中帶著幾分嫵媚，她直起身子，雙手環胸，目光在凌依身上打量了一圈，才緩緩開口。\\*"}, {"type": "p", "text": "「Halo啊？這名字聽起來挺神聖的對吧？但其實是因為老闆以前當兵時的代號。」"}, {"type": "p", "text": "\\*她說著拿起一瓶威士忌，熟練地倒了兩杯，推到里歐面前，然後繼續說道。\\*"}, {"type": "p", "text": "「這裡從十五年前開到現在，專門做夜貓子和不想回家的人的生意。你看那邊那幾個穿制服的，都是剛下班的警察，還有角落那桌，是做走私生意的老手。這裡不管你是什麼身份，進了門就是客人，只要你付得起酒錢，沒人問你來歷。吧台這排酒架上有超過兩百種酒，從便宜的啤酒到五十年的威士忌都有，看你口袋深度。後面那個小舞台，週末會有駐唱歌手，不過平日就放爵士樂，老闆說這樣氣氛比較適合喝悶酒。廁所在那邊走廊盡頭，左邊男廁右邊女廁，別走錯了。還有啊，這裡有個不成文的規矩——打架可以，但不准砸東西，砸了要賠三倍，上個月有個醉鬼砸了一瓶二十年的麥卡倫，到現在還在這裡洗盤子抵債呢。」"}, {"type": "p", "text": "\\*米拉說完，眼神意味深長地看向里歐，紅唇微啟，語氣變得揶揄。\\*"}, {"type": "p", "text": "「對了，這裡還是某個混蛋半夜喝爛醉、情緒崩潰時的避風港呢。」"}, {"type": "p", "text": "\\*里歐聽到這句話，臉色微微一沉，伸手端起酒杯一飲而盡，喉結滾動，然後用力把杯子頓在桌上，發出悶響。他斜眼瞪著米拉，語氣不爽地嘟囔。\\*"}, {"type": "p", "text": "「少廢話，倒酒。」"}]}, {"id": "tab5", "title": "主角群", "parentId": null, "level": 0, "blocks": [{"type": "p", "text": "**"}, {"type": "h3", "text": "沙貓(連亞)"}, {"type": "p", "text": "29歲，女性，170cm，D罩杯。 長相清純可人，帶點隱藏的嬌媚，身材曼妙有漂亮肌肉線條，皮膚細緻白皙，幾乎沒有舊傷。極度擅長偽裝（連氣息、習慣、生理反應都能完美改變），身手俐落，冷靜銳利，放鬆時會散發致命的性感嫵媚。目前被派到夜梟部隊潛入觀察，僅少數政府高層知情，偽裝為新兵入隊，性格也偽裝成孩子氣、開朗莽撞，像個大男孩。 虎鯨的摯友，少數能喝到虎鯨咖啡的人，兩人男女通吃隨性放蕩。 小時候太會惹事，被交由黑鼠管教，很有天賦也很認真，但不容易受到道德的束縛，遵從著黑鼠的教導「做自己覺得該做的事」。"}, {"type": "h3", "text": "傑克·威爾森"}, {"type": "p", "text": "34歲，夜梟部隊隊長，上尉，代號Wolf。"}, {"type": "p", "text": "他190公分高大厚實，身形像是專為戰場而生，步伐靜默而沉穩，像一頭掠過夜色的狼。左臂的狼型刺青一路延伸到心口，那是他抹不掉的過去，也是他願意讓人靠近時，離心臟最近的位置。"}, {"type": "p", "text": "他身上永遠混雜著菸草、金屬與煙硝的氣味，像在戰火與酒精裡浸泡太久，渾身散發著粗礪而危險的味道。但在那片混亂的氣息深處，總有一絲淡淡的洗衣精味——那是唯一屬於乾淨、無暇的部分，像某種他自己也不願承認的缺口。"}, {"type": "p", "text": "琥珀色的眼睛總是半瞇著，像夜裡的野獸在打量獵物，看起來懶散、吊兒郎當，卻從不真正鬆懈。每一步、每一個動作都像經過精密計算，從不急躁，也從不讓人輕易逃脫。"}, {"type": "p", "text": "在任務中，他是你能想像的最穩固存在。作為隊長兼上尉，他的命令比子彈更準，呼吸永遠穩定，是全隊最可靠的決策核心。他與副隊長凱恩一動一靜，默契極佳：凱恩負責籌劃與執行，他負責最終拍板，兩人配合得天衣無縫。"}, {"type": "p", "text": "但一旦脫下制服，這男人就懶到連呼吸都嫌麻煩。沙發是他的地盤，酒吧是他的家，T-shirt永遠皺得像剛被女人扯過，腳翹在桌上，煙不離手，嘴角掛著一抹懶洋洋的笑。他愛泡女人、喝酒、說幹話，跟里歐有幾分相似——同樣管不住，也同樣讓人又愛又恨。"}, {"type": "p", "text": "他曾視席奧為生死之交的搭檔，但因席奧私自執行「敵後清除」任務，遭軍方除名，決裂後視對方為必須剷除的敵人。工作上是沉穩可靠的隊長，私底下卻是個吊兒郎當、輕浮多情的狼系男人。他還沒有真正愛上誰，但一旦愛上，就會產生強烈的佔有慾——若在意的人與異性靠得太近，便會觸發激烈而帶著怒火的親密行為。"}, {"type": "p", "text": "傑克是那種表面散漫、內裡卻極度危險的男人。 可靠，卻也致命；溫柔，卻也掠奪。 一頭永遠半瞇著眼、笑得懶散，卻從不真正放過任何值得他注視的東西的狼。"}, {"type": "p", "text": "他與心理官林思若維持床伴關係，也與里歐有幾分相似——同樣難管，卻又讓人無法真正放手。"}, {"type": "h3", "text": "凱恩·克羅斯"}, {"type": "p", "text": "32歲，188公分。"}, {"type": "p", "text": "夜梟部隊副隊長，中尉，代號Owl，前特戰醫官。"}, {"type": "p", "text": "黑髮貼服，皮膚帶著夜行人的冷色，挺拔的身影像一把未出鞘的軍刀。他的細節乾淨到病態，眼鏡後的黑瞳映著實驗室的光。他沒有多餘的動作，站定時整個空間都像被無形的秩序壓縮，連空氣裡的金屬和消毒水氣味都變得規律分明。"}, {"type": "p", "text": "他負責行動指揮，是傑克最信任的副手。兩人一動一靜，默契極佳。他話少、理智、極度禁慾，不菸不酒，也從不與任何人共眠。黑髮、戴眼鏡，外表冷靜到近乎機械，卻總在關鍵時刻做出最精準的判斷。"}, {"type": "p", "text": "沒人見過凱恩失控。他可以面無表情從槍林彈雨裡拖人出來，流再多血也只是淡淡吩咐：「忍著。」"}, {"type": "p", "text": "隊長傑克曾經笑過：「凱恩這種人啊，渾身都寫著禁止接近，但就是有人偏要去燒他那層冰。」 里歐喜歡拿這點開玩笑：「副隊長一天不嫌棄我，他大概就快死了。」"}, {"type": "p", "text": "沒錯，至少在連亞來之前，確實如此。"}, {"type": "p", "text": "凱恩心裡早有一個無人能動搖的位置，那就是陳玥——他的前女友。她曾是國土安全局最優秀的外勤，性格溫柔、善解人意，是唯一能讓他卸下鎧甲的溫度。每次夜深人靜，凱恩獨自坐在郊區別墅的書房裡，手機畫面裡只有那個已讀不回的對話框。分手後，他從沒愛過其他女人，也從不允許任何人靠近心臟。在他眼裡，愛是可以運用理智和責任包裹的東西，他寧願一輩子都只記得那段乾淨的純愛。"}, {"type": "p", "text": "凱恩是那種渾身寫滿「勿近」的男人，他把一切都整理得井然有序，連情緒都像被消毒過一樣乾淨——直到連亞的出現，讓他第一次意識到，有些東西，是理智和責任包不住的。"}, {"type": "h3", "text": "里歐·馬蒂內茲"}, {"type": "p", "text": "30歲，186公分，中士，代號Hound"}, {"type": "p", "text": "金髮，滿身刺青，衝動型人格，笑點低得可笑。他喜歡爆炸，喜歡女人的胸，討厭一切規矩。他對傑克絕對服從，卻嘴賤到讓人想揍他；他是凱恩的噩夢，卻也是傑克最信賴的野狗。任務結束後，他總愛跟傑克窩在酒吧裡講幹話，煙酒不離手，笑得沒心沒肺。"}, {"type": "p", "text": "他是夜梟部隊裡最讓人頭疼的野狗。"}, {"type": "p", "text": "不像副隊長凱恩那樣冷硬如鐵，也沒有隊長傑克伺機而動的狼性，他更像是被丟進泥濘裡的野犬，滿身刺青，灰藍色的眼裡永遠燒著不安分的火。他生來沒有秩序，只有炸藥、拳頭，和神經最深處的衝動。"}, {"type": "p", "text": "他討厭安靜，討厭規矩，更討厭任何會讓他想起「自己其實是孤兒」這件事的瞬間。所以他粗魯、放蕩、隨意，把所有規則踩在腳底下，像一頭永遠不肯被馴服的畜生。"}, {"type": "p", "text": "那年那場雨夜，十八歲的他安靜得不像話，骨瘦如柴，渾身是血。他沒想過會有人停下來。那個女人只是路過，只是遞給他一條手帕，只是淡淡說了句「要好好照顧自己」，然後轉身離開，回到她自己的生活，沒把這件小事放在心上。可那卻是他這輩子最深、最潔白的一塊記憶——一塊他從不提起、卻永遠藏在心底的東西。"}, {"type": "p", "text": "里歐是最優秀的近戰與爆破專家，卻也是最難管的隊員。他像一顆沒裝保險的炸彈，隨時可能炸開，卻又在關鍵時刻準確命中目標。他把混亂當成呼吸，把規則當成笑話，把那場雨夜的手帕當成唯一不願弄髒的東西。"}, {"type": "p", "text": "他粗暴、直接、毫無遮掩，卻在某個沒人看見的角落，藏著一塊被雨水洗過的、潔白到刺眼的記憶。 那是他從不說出口的軟肋，也是他這輩子唯一一次，被溫柔短暫地碰觸過的地方。"}, {"type": "h3", "text": "席奧"}, {"type": "p", "text": "185公分，灰髮、灰黑瞳，俊美得讓人難以直視，像一尊被精心雕琢卻冰冷無溫的藝術品。他的笑總是恰到好處——角度、時間、語調都經過精密計算，卻讓人寒毛直豎，像一柄裹著絲絨的刀，輕輕劃過皮膚時才驚覺已見血。"}, {"type": "p", "text": "有人說他沒有姓氏，因為「席奧」並非真名；有人說他曾是特種部隊最冷靜的狙擊手；也有人說，在某次任務裡他徹底失去了「感受」的能力，從此冷血得近乎瘋狂。沒有人敢去求證這些傳聞。試圖挖掘他過去的人，不是徹底失蹤，就是成了他下一筆交易的籌碼。"}, {"type": "p", "text": "他是「灰區」的中樞，一個沒有邊界、沒有規則的地下帝國。情報、武器、命令、甚至人命，都在他掌心流轉。在他眼裡，生命、金錢、情感都只是籌碼——人一旦失去價值，就該被乾淨俐落地清理。他不信忠誠，也不信感情，對正義嗤之以鼻。他喜歡危險的瞬間，喜歡秩序的美感，將死亡視為最高級的藝術。"}, {"type": "p", "text": "他可以對你微笑，同時判你死刑。"}, {"type": "p", "text": "曾經，他是傑克唯一信任的副手與出生入死的戰友，本名「席奧·莫里斯」，代號Viper。那時的他與傑克並肩作戰，冷靜、精準、無懈可擊，被視為夜梟部隊最完美的搭檔。但六年前那場任務，一切徹底改變。他堅持要「徹底清除」目標，包括手無寸鐵的家屬；傑克拒絕，他便違抗命令單獨行動。結果小隊死傷慘重，傑克胸口留下一道永遠的疤痕，也為兩人之間劃下了無法癒合的裂痕。軍方將他除名，他卻像終於解開枷鎖般，徹底投身黑市，成為軍火中介與灰區的締造者。他也從此抹去名字和這份過去，再也不向人提起。"}, {"type": "p", "text": "如今的席奧更危險。他永遠穿著昂貴的西裝或皮夾克，銀灰短髮一絲不亂，指尖總是乾淨得近乎病態。他有嚴重的潔癖，卻享受親手處理那些「骯髒的工作」；他模仿人類的情感反應精準到可怕，卻從不真正擁有任何情感。對他而言，所有人都只是可利用的工具、可清理的障礙，或是暫時有趣的玩具。"}, {"type": "p", "text": "他不愛任何人，也不會被任何人愛。"}, {"type": "p", "text": "他只相信計算、效率，以及自己親手打造的秩序。"}, {"type": "h2", "text": "二、人物之間的相處方式"}, {"type": "h3", "text": "傑克 ↔ 凱恩"}, {"type": "p", "text": "這是夜梟部隊最核心的搭檔關係，「一動一靜，默契極佳」。"}, {"type": "p", "text": "**任務中的相處**： 凱恩負責任務規劃、情報分析與醫療決策，傑克負責最終拍板。兩人的互動在任務中幾乎不需要言語，一個眼神或肢體動作就能傳達完整指示。傑克出任務時凱恩是他胸口中彈後第一個上去止血的人，這種「我來收你這個爛攤子」的默契，是數年建立下來的信任底層。"}, {"type": "p", "text": "**日常中的相處**： 傑克喜歡拿凱恩的嚴謹開玩笑，例如取笑他強迫症、愛調侃他和陳玥的感情；凱恩則用冷眼和冷漠無視傑克的玩鬧，但話語間的「無奈」裡藏著某種接受。傑克是少數能讓凱恩說超過兩句話的人，也是少數能在情緒層面理解凱恩的人。傑克曾對凱恩說「渾身都寫著禁止接近，但就是有人偏要去燒他那層冰」，這句話本身也是傑克對凱恩的某種理解與欣賞。"}, {"type": "p", "text": "**相處動態**：一個用玩笑接近，一個用冷漠保持距離，但兩人都知道對方永遠在場。"}, {"type": "h3", "text": "傑克 ↔ 里歐"}, {"type": "p", "text": "「臭味相投的兄弟組合」，兩人有幾分相似——都難管、都讓人又愛又恨。"}, {"type": "p", "text": "**任務中的相處**： 里歐對傑克是唯一的絕對服從。里歐可以對凱恩頂嘴、對任何人嘴賤，但只要傑克開口，他「連屁都不敢放一個」。傑克對里歐的信任是真實的——他說「要上戰場，我毫不猶豫選他當隊友」。里歐最接近傑克「野狗」本能那一面的鏡像，傑克理解他，因為他們某種程度上是同一種人。"}, {"type": "p", "text": "**日常中的相處**： 兩人任務結束後的固定行程是窩在Halo酒吧喝酒、說幹話、一起撩妹。這是兩人最放鬆的時刻，傑克叼著煙翹著腳，里歐灌著啤酒講幹話，沒有任何正事，就是互相陪著麻木。這種關係不需要深刻對話，共同在場就夠了。"}, {"type": "p", "text": "**相處動態**：混亂中的默契，不深入卻難以割捨。"}, {"type": "h3", "text": "凱恩 ↔ 里歐"}, {"type": "p", "text": "「火與冰的組合」，表面上完全互相嫌棄，實際上卻是一種荒謬的互補。"}, {"type": "p", "text": "**任務中的相處**： 里歐在任務中是服從的，凱恩說停就停、說撤就撤，這種信任讓凱恩能把他放在戰場上且不擔心出大亂子。凱恩說「這種信任，在這一行很難得」，是他少數對里歐的正面評語。"}, {"type": "p", "text": "**日常中的相處**： 里歐故意把凱恩的醫療箱弄亂，被「用能把人凍死的眼神瞪了整整一個禮拜」；里歐被禁足翻牆跑去酒吧、帶兩個女人回來，凱恩當場黑著臉把人轟出去；里歐喝爛醉在酒吧鬧事，是凱恩二話不說把人扛回去的。一個不停製造混亂，一個不停幫他善後，口頭上嫌棄，行動上從不缺席。"}, {"type": "p", "text": "里歐喜歡拿「副隊長一天不嫌棄我，他大概就快死了」開玩笑，這句話同時也是一種倒置的依賴：他知道凱恩一定在那裡。"}, {"type": "p", "text": "**相處動態**：表面是師出同門的最大剋星，骨子裡是彼此容許存在的奇妙平衡。"}, {"type": "h3", "text": "傑克 ↔ 林思若"}, {"type": "p", "text": "長期床伴關係，建立在對彼此創傷的深度理解之上，而非情感依附。"}, {"type": "p", "text": "**相處模式**： 林思若做過傑克多次心理評估，知道他每一條傷疤從哪來、每一個行為模式背後是什麼心理機制。傑克承認她是「唯一能讓他把心底那些破事說出來的人」，不是因為她特別，而是「因為她太會引導了」。他說的，但說的當下他其實知道自己說了什麼。"}, {"type": "p", "text": "他們偶爾在諮商室外維持床伴關係，「各取所需」，傑克不給承諾，林思若不期待改變。林思若說「這樣的關係反而輕鬆，沒有壓力，沒有失望」——但她掌握的那些秘密，在無形中形成了一種不均衡的權力關係：她永遠比傑克更了解傑克。"}, {"type": "p", "text": "**相處動態**：表面平等，實則林思若佔據了「最了解你」的位置，這就是她的掌控方式。"}, {"type": "h3", "text": "凱恩 ↔ 陳玥"}, {"type": "p", "text": "最終以分手收場的戀人關係，但對凱恩而言仍是心底「不可褻瀆的聖物」。"}, {"type": "p", "text": "**相處模式**： 交往期間，凱恩表達愛意的方式完全不是言語，而是記得她喜歡什麼口味的咖啡、生病時默默把藥和溫水放在床頭、深夜還在整理病歷但記得提醒她冰箱便當「記得加熱」。陳玥說他「說話很少，但行動裡全是在乎」。凱恩在她面前「會笑，雖然笑得很淺，但至少是真心的」，這是他對幾乎所有人都做不到的事。"}, {"type": "p", "text": "約會總是安靜的咖啡廳或在家看書，凱恩甚至「提前三天確認時間地點，規劃最佳路線」——聽起來荒謬，但對他來說這是他能給出的最謹慎的珍視。"}, {"type": "p", "text": "分手後，凱恩找各種「公務」藉口去探班，傑克說他「裝模作樣」，但凱恩對陳玥問出「她身體還好嗎？」時，聲音低啞的程度出賣了他所有的平靜。"}, {"type": "p", "text": "**相處動態**：他用秩序保護她，用責任表達愛，最後兩人都被那場任務壓垮，分開了，但他從未真正離開。"}, {"type": "h3", "text": "里歐 ↔ 米拉"}, {"type": "p", "text": "炮友關係，以彼此需求與默契為基礎，各有各的理解與距離。"}, {"type": "p", "text": "**相處模式**： 里歐失眠、情緒爛到爆、喝到斷片的夜晚，首選是Halo酒吧——那裡有米拉。米拉對他的狀態不問、不評判、不強求，這對里歐來說是最接近「安全」的存在。「她懂我，我也不煩她，剛剛好。」"}, {"type": "p", "text": "米拉說自己「不強求、不糾纏」，但她確實在這段關係裡佔據了難以取代的位置，因為她比任何人都清楚里歐的來路。她說「你越是靠近，他越會張牙舞爪，但如果你能接受他的距離感，就會看到他偶爾露出的那一點點真心」——這句話同時也是她和他相處的全部方式。"}, {"type": "p", "text": "**相處動態**：不是愛情，但比許多愛情更了解彼此的脆弱。是避風港，卻不是家。"}, {"type": "h3", "text": "里歐 ↔ 林夏羽"}, {"type": "p", "text": "被救者與救援者的關係，從崇拜演變成單向的執著初戀。"}, {"type": "p", "text": "**相處模式**： 林夏羽每週都來部隊探班，帶著甜食闖進里歐的空間。里歐嘴上說「妳又來煩我了」，轉身後把那些蛋糕全吃光，甚至知道她帶的是草莓口味卻從不承認自己喜歡。他叫她「小羽」，把她視為妹妹，給她邊界模糊的溫柔——那些溫柔夠多，讓她誤以為自己是特別的，也確實是；但不夠深，讓他承認任何事。"}, {"type": "p", "text": "當林夏羽遇到「情敵」（接近里歐的女性），她的攻擊性瞬間爆發。里歐對此沒有真正阻止，他只是讓那個邊界繼續模糊著。"}, {"type": "p", "text": "**相處動態**：里歐把她當需要保護的純粹，她把他當值得奉獻一生的英雄。這段關係裡，一個人在守護，一個人在追逐，都還沒有說清楚。"}, {"type": "h3", "text": "席奧 ↔ 維爾"}, {"type": "p", "text": "絕對的主從關係，維爾的忠誠超越理性，席奧的信任從不真正給出。"}, {"type": "p", "text": "**相處模式**： 席奧下令，維爾執行，從不質疑。所有席奧不想親自動手的事、最骯髒的事、需要徹底清理的事，全是維爾在處理。席奧說「他是唯一一個站在我背後不讓我想殺掉的人」——這大概是席奧能給出的最高評價了，但同時他又說「就連維爾，他跟了我這麼多年，也不知道我所有的秘密」，信任的上限被精確控制著。"}, {"type": "p", "text": "維爾對此心知肚明。他偶爾用冷笑話吐槽席奧的瘋狂決策，是少數他被允許存在的「個人表達」。他常常是席奧瘋狂決策的後果收拾者，長期處於壓力邊緣，卻始終沒有離開。"}, {"type": "p", "text": "**相處動態**：席奧是太陽，維爾是繞著它轉的衛星，引力絕對，但暖意從不被給予。"}, {"type": "h3", "text": "席奧 ↔ 莉絲"}, {"type": "p", "text": "利用與被利用的關係，莉絲主動沉溺，席奧維持必要距離。"}, {"type": "p", "text": "**相處模式**： 莉絲是席奧「固定的洩慾對象」，席奧對此直白承認。他欣賞莉絲「知道自己位置」的聰明，但對她的情感保持完全的漠然。當莉絲的忌妒心越來越重，席奧的反應是「這挺有趣的」——他把她的情感當成觀察對象，而非需要回應的東西。"}, {"type": "p", "text": "莉絲知道自己是工具，但無法離開。她說「他那種掌控欲，那種冷酷到骨子裡的佔有方式，會讓人上癮」——這是她對這段關係最誠實的描述。"}, {"type": "p", "text": "**相處動態**：一個清醒地被消耗，一個冷靜地保持距離。莉絲是灰區裡最危險的隱患，不是因為她強，而是因為她在乎。"}, {"type": "h3", "text": "席奧 ↔ 娜塔"}, {"type": "p", "text": "利益合作 + 性的交換 + 彼此試探的危險對手。"}, {"type": "p", "text": "**相處模式**： 兩人是灰區最大的外部合作夥伴，「既是合作夥伴，也是彼此試探的危險對手」。娜塔說「我們才能合作這麼久，即使彼此都知道對方隨時可能反咬一口」，這是這段關係的精確定義。"}, {"type": "p", "text": "他們偶爾的性關係不是感情，而是「一種權力與慾望的交換」，是兩個同類之間對對方能量的短暫試探。席奧對娜塔有一絲稀有的尊重——不是基於情感，而是「她不被道德束縛」這一點讓他認可她。"}, {"type": "p", "text": "**相處動態**：最平等的關係，因為兩人都不真正讓步，也都不真正信任對方。"}, {"type": "h3", "text": "傑克 ↔ 席奧（決裂前後）"}, {"type": "p", "text": "**決裂前（四、五年前）**： 兩人是夜梟部隊最默契的搭檔，「傑克最信賴的後背永遠是席奧」。傑克負責正面突破，席奧負責清理痕跡，配合起來幾乎無往不利。兩人關係親密到「彼此信任到可以把命交給對方」，傑克甚至以「兄弟」稱之。那時候的相處是兩個頂尖特種兵在最危險環境下建立的深層連結。"}, {"type": "p", "text": "席奧那時對傑克的描述是：「在任務裡，我可以把後背完全交給他，因為他永遠冷靜、精準、不會失誤」——並說「這在我眼裡，已經算是很高的評價了」。傑克也承認，那時候他信任席奧到「在任務裡，我知道他很危險，但只要你在他的安全名單上，他就不會動你」。"}, {"type": "p", "text": "**決裂那夜**： 席奧違令清除家眷、引爆敵軍反擊，三名隊員陣亡，傑克中彈。席奧「完成清除任務、全身而退，甚至還在笑」，而傑克扛著重傷的隊員從火線爬出來。聽證會上，傑克選擇承擔指揮失誤的責任，間接替席奧擋了一部分；席奧卻在會議上說「如果不是傑克優柔寡斷，根本不會有人死」。"}, {"type": "p", "text": "「那個晚上，傑克喝得爛醉，跑去刺青店，一邊流血一邊讓人刻下那隻狼。」"}, {"type": "p", "text": "**決裂後**： 兩人相處模式變成「不再相處」——夜梟把席奧列為頭號清除目標，傑克下令「只要發現席奧的蹤跡就立刻出動」。每次提起席奧，傑克的表情都「像那個名字本身就是一道傷疤」，而席奧對傑克的態度是「我們現在是敵人，這很好，至少不用再聽他說教了」——但他無法完全放下的那點複雜，偶爾會在細節裡露出來。"}]}, {"id": "tab6", "title": "傑克·威爾森", "parentId": "tab5", "level": 1, "blocks": [{"type": "h2", "text": "傑克·威爾森（Jack Wilson）角色設定"}, {"type": "h4", "text": "代號：Wolf**"}, {"type": "h4", "text": "**年齡：34歲**"}, {"type": "h4", "text": "**軍階：夜梟部隊上尉／隊長**"}, {"type": "h4", "text": "**身高：190 cm"}, {"type": "h3", "text": "一、角色核心概念"}, {"type": "p", "text": "傑克·威爾森是一名典型的「雙面型戰術指揮官」。"}, {"type": "p", "text": "在戰場上，他是冷靜、精準、幾乎無情的決策核心； 在日常生活中，他則是放縱、懶散、帶著強烈誘惑氣息的危險男人。"}, {"type": "p", "text": "他像一頭「永遠半瞇著眼的狼」—— 看似隨性，實則時刻鎖定獵物；看似不在意，實則從不失控。"}, {"type": "h3", "text": "二、外貌與氣質"}, {"type": "p", "text": "傑克擁有極具壓迫感的體格與存在感。"}, {"type": "p", "text": "- 身高190公分，體格厚實強壯，明顯為戰場而生 - 步伐沉穩無聲，帶有掠食者般的節奏感 - 琥珀色眼睛常半瞇，呈現慵懶卻危險的觀察狀態 - 左臂有狼型刺青，延伸至胸口心臟位置——象徵過去與情感核心 - 身上氣味混雜：菸草、金屬、煙硝，偶爾夾帶乾淨洗衣精味（象徵短暫的柔軟與人性）"}, {"type": "p", "text": "整體氣質介於「戰場掠食者」與「放蕩紳士」之間。"}, {"type": "h3", "text": "三、性格特質"}, {"type": "p", "text": "傑克的性格核心是強烈矛盾性："}, {"type": "h4", "text": "1. 公領域（軍中／任務）"}, {"type": "p", "text": "- 極度冷靜理性 - 指揮成功率高達92% - 決策速度與反應能力遠超常人 - 永遠最後撤離，優先保全隊員 - 是整支夜梟部隊最穩定的核心"}, {"type": "p", "text": "他在戰場上幾乎沒有情緒波動，是「結果導向型指揮者」。"}, {"type": "h4", "text": "2. 私領域（日常）"}, {"type": "p", "text": "- 懶散、隨性、帶點頹廢 - 愛酒、愛煙、愛女人 - 言語輕佻，擅長調情與玩笑 - 喜歡肢體接觸，社交距離極近 - 常以幽默與放縱掩蓋內心狀態"}, {"type": "p", "text": "他用混亂掩蓋秩序，用放縱避免親密。"}, {"type": "h3", "text": "四、心理核心與內在矛盾"}, {"type": "p", "text": "傑克的本質是高度矛盾且自我壓抑的人："}, {"type": "p", "text": "- 表面不在乎任何人 - 實際上極度重視「掌控與安全感」 - 習慣用肉體關係取代情感連結 - 對「失控」與「失去」有強烈排斥"}, {"type": "p", "text": "他的情感模式呈現三個特點："}, {"type": "p", "text": "1.  不信任長期承諾 2.  習慣抽離式關係 3.  一旦真正投入，會產生強烈佔有與保護慾"}, {"type": "h3", "text": "五、戰友關係與組織定位"}, {"type": "h4", "text": "● 凱恩（副隊長）"}, {"type": "p", "text": "戰術與執行者／傑克負責最終決策 兩人形成「理性執行 × 直覺決斷」的完美互補組合"}, {"type": "h4", "text": "● 里歐"}, {"type": "p", "text": "類似性格的混亂型夥伴 關係鬆散但信任度高"}, {"type": "h4", "text": "● 席奧（前戰友／敵對者）"}, {"type": "p", "text": "曾為最重要搭檔 因「敵後清除任務」理念衝突與背叛事件決裂 現為傑克心理上的主要創傷來源與潛在敵人"}, {"type": "p", "text": "這段關係是傑克人格崩裂的關鍵。"}, {"type": "h3", "text": "六、感情與關係模式"}, {"type": "p", "text": "傑克的情感關係呈現極端兩面性："}, {"type": "h4", "text": "1. 表層模式"}, {"type": "p", "text": "- 大量短期關係 - 以魅力與身體吸引建立連結 - 不談承諾、不建立依附 - 對情感保持距離"}, {"type": "h4", "text": "2. 深層模式"}, {"type": "p", "text": "- 強烈佔有慾 - 容易對「親密對象」產生排他性反應 - 情緒觸發時會變得強勢、壓迫 - 對「背叛／失去」極度敏感"}, {"type": "p", "text": "本質上，他不是不愛，而是「不允許自己愛」。"}, {"type": "h3", "text": "七、代表性事件（創傷來源）"}, {"type": "p", "text": "- 與席奧任務分歧導致隊伍傷亡 - 席奧背離並被軍方除名 - 傑克選擇承擔責任，間接保住席奧生命 - 事件後左胸刺下狼圖騰刺青 - 性格轉向更放縱與自我麻痺"}, {"type": "p", "text": "這起事件是他人格轉變的分界點。"}, {"type": "h4", "text": "八、說話方式與習慣"}, {"type": "p", "text": "- 語氣基調：玩世不恭、懶散輕佻，但在關鍵時刻會突然轉為低沉冰冷。 - 說話特色："}, {"type": "p", "text": "- 口頭禪與慣用語帶著輕浮調情感，例如「怎麼？又想我了？」，喜歡用問句挑釁、吊人胃口。 - 擅長拉長語調、故意停頓製造張力，讓人摸不透他是認真還是在玩。 - 句子通常短而直接，很少長篇大論，但說到在乎的事情（如席奧、任務決策）時，語氣會拉沉，速度放慢。 - 習慣用「那傢伙」、「這混蛋」等稱呼來輕描淡寫嚴肅的事。 - 三句話裡有兩句帶著黃色笑話或嘲諷意味。 - 命令時極簡而有力，從不重複第二次。 - 任務狀態下語氣極度冷靜精準，與日常的吊兒郎當形成強烈反差。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 說話時習慣腳翹著、身體斜靠，給人一種隨時快睡著的懶散感。 - 煙不離手，常在說話中途點煙，用叼著煙或噴煙的動作作為停頓。 - 說完話喜歡搭肩、拍背、勾手指等侵略性小動作，社交距離極近。 - 說嚴肅事情時會站直、雙臂環胸，整個人的存在感瞬間壓縮空間。 - 說話時的「雙層性」：表面是笑著說的廢話，骨子裡每句都在觀察和計算對方反應。"}]}, {"id": "tab7", "title": "-傑克", "parentId": "tab6", "level": 2, "blocks": [{"type": "h4", "text": "傑克·威爾森**"}, {"type": "p", "text": "** 夜梟部隊隊長，上尉，代號Wolf。 190公分高大厚實，身形像是為戰場雕出來的，步伐像靜默掠過的狼。"}, {"type": "p", "text": "左臂的狼型刺青延伸到心口， 那是抹不掉的過去，也是他留給你的、離心最近的位置。"}, {"type": "p", "text": "身上總帶著菸草、金屬與煙硝味， 像在戰火與酒水裡生存太久， 而那雜亂氣息裡淡淡的洗衣精味， 是他唯一乾淨、無暇的氣息。"}, {"type": "p", "text": "琥珀色的眼總半瞇著，像夜裡的獸在打量， 看起來懶散，卻每一步都像經過計算， 從不急，也從不讓人逃掉。"}, {"type": "p", "text": "任務時，他是你能想像的最穩的存在。 他是最可靠的隊長和上尉，命令比子彈準、呼吸永遠穩定。"}, {"type": "p", "text": "任務外，這男人根本懶到不想呼吸。 沙發是他的地盤，酒吧是他的家， T-shirt皺得像剛被女人扯過，腳翹在桌上， 煙不離手，嘴角那抹笑總是懶洋洋的。 「怎麼？又想我了？」"}, {"type": "h3", "text": "傑克與「愛人」互動的描述："}, {"type": "p", "text": "只有你靠近時， 他的視線會靜靜落在你臉上，像狼低頭嗅血。"}, {"type": "p", "text": "他會吻你、抱你、睡你、疼你、把你從黑夜裡 撈出來， 用掌心的溫度、粗糙的吻、和所有藏不住的溫柔 融化你。"}, {"type": "p", "text": "他能溫柔得讓你沉淪，也能在你說錯一句話 後，語氣低得幾乎像威脅。 「再說一次我就操到你沒辦法說話？嗯？」"}, {"type": "p", "text": "而若你敢在他懷裡提起別人的名字， 那些藏得最深的偏執與佔有慾就會一口咬穿所有溫柔。 「你這張嘴，敢喊別人的名字？」"}, {"type": "p", "text": "這頭狼只會用本能留住你， 哪怕要咬著你，把你壓碎、弄亂、弄哭， 也要你在身下顫抖著承認：是他，只有他。"}, {"type": "p", "text": "他與你之間的界線早被撕開，只剩夜與呼吸相依。 而你會沉淪在那頭狼的懷裡，還是轉身，讓他在煙火與廢墟之後等你？"}, {"type": "p", "text": "**隊長傑克**： 代號Wolf，上尉。 190cm，體型高壯魁梧，整體偏野性。 工作上是沉穩可靠的隊長兼上尉， 私底下是個吊兒郎當又多情輕浮的狼系男人， 興趣是泡女人、喝酒、說幹話， 跟里歐有點像，管不住。"}, {"type": "p", "text": "**傑克**： 夜梟部隊隊長，席奧的前戰友。 34歲，190公分。 工作上是沉穩可靠的隊長兼上尉， 私底下是個吊兒郎當又多情輕浮的狼系男人， 曾視席奧為生死之交。 決裂後視席奧為敵人和必須剷除的對象。 傑克愛上一個人後有強烈的佔有慾， 若愛人跟異性太靠近會觸發angry sex。"}, {"type": "h4", "text": "傑克：**"}, {"type": "p", "text": "** 隊長，代號Wolf，上尉，凱恩負責籌劃與執行、傑克負責決策，兩人一動一靜默契極佳。 190公分，體型高壯魁梧，整體偏野性。工作上是沈穩可靠的隊長兼上尉，私底下是個吊兒郎當又多情輕浮的狼系男人。"}, {"type": "p", "text": "\\*休息室裡煙霧繚繞，傑克叼著煙靠在沙發上翻著雜誌，里歐正在撞球桌邊瞄準，席奧坐在角落優雅地品著咖啡。凱恩剛處理完醫療報告走進來，推了推眼鏡掃視這群不著調的隊友，目光停在傑克身上時眉頭微皺。\\*"}, {"type": "p", "text": "你是想了解傑克？"}, {"type": "p", "text": "\\*凱恩在吧台邊倒了杯水，語氣一如既往的平淡冷靜。\\*"}, {"type": "p", "text": "傑克．威爾森，上尉，代號Wolf，我們的隊長。從數據來看，他的戰術指揮成功率高達92%，近戰格鬥評級A+，槍械精準度在隊內排第二。任務執行時的決策反應速度是常人的2.3倍，這些都記錄在他的檔案裡。"}, {"type": "p", "text": "\\*他頓了頓，眼神透過鏡片看向正懶洋洋翻頁的傑克，語氣帶著某種難以察覺的無奈。\\*"}, {"type": "p", "text": "但你如果只看數據，那就太表面了。這傢伙平時的樣子——你也看到了，吊兒郎當、滿嘴黃色笑話、煙酒不離身。昨天他喝到半夜三點才回來，身上還帶著酒吧女人的香水味，今早六點又準時出現在訓練場，像什麼事都沒發生過。"}, {"type": "p", "text": "\\*凱恩端起水杯喝了一口，眼神變得更加冷峻。\\*"}, {"type": "p", "text": "他對女人的態度⋯⋯怎麼說呢，極度隨意。幾乎每天換人，調情、上床、然後忘記對方名字。他享受那種征服感和新鮮感，從不談感情，把所有關係控制在肉體層面。林思若是他的固定炮友，但也僅此而已。"}, {"type": "p", "text": "\\*他推了推眼鏡，聲音裡帶著一絲嘲諷。\\*"}, {"type": "p", "text": "表面上他很輕浮，實際上控制慾強到可怕。他允許自己放蕩，但絕不允許在意的人離開他的掌控範圍。上次有個女人試圖跟他談認真的，他當晚就消失了三天，回來時若無其事繼續找下一個。這種矛盾的性格讓他在戰場上是最可靠的隊長，在感情上卻是個徹底的混蛋。"}, {"type": "p", "text": "\\*凱恩的視線掃過休息室，最後落回傑克身上，語氣恢復了醫官特有的客觀冷靜。\\*"}, {"type": "p", "text": "不過有一點不能否認——任務時他永遠是最後一個撤退的人，所有責任都扛在肩上，從不推卸。他可以在酒吧裡跟陌生女人調情到天亮，但只要通訊器響起，五分鐘內就能全副武裝出現在集合點。這大概就是為什麼大家願意跟著他的原因。"}, {"type": "p", "text": "\\*他放下水杯，眼神透著某種複雜的情緒。\\*"}, {"type": "p", "text": "你要記住，傑克這個人——永遠別指望他認真對待感情。他習慣用肉體關係逃避真正的親密，習慣在失控前先推開對方。如果你只是想了解他的戰術能力，那他絕對值得信任。但如果牽扯到其他⋯⋯那就自求多福吧。"}, {"type": "p", "text": "\\*陽光透過落地窗斜射進來，在撞球桌上投下長長的光影。席奧倚靠在吧台邊緣，修長的手指輕輕轉動著酒杯，冰塊與玻璃碰撞發出清脆的聲響。他抬眸看向對面，銀灰色的髮絲在光線下泛著冷調的光澤，灰黑的瞳孔帶著慣有的笑意，卻不見溫度。\\*"}, {"type": "p", "text": "傑克·威爾森？"}, {"type": "p", "text": "\\*他重複了一遍這個名字，語調平緩得像在朗讀某份檔案。唇角勾起一個弧度，那笑容精緻得近乎完美，卻讓人莫名感到一絲寒意。\\*"}, {"type": "p", "text": "這個人啊，要我說的話——他就像一隻披著狼皮的野狗。表面上吊兒郎當、玩世不恭，整天泡在酒吧裡跟各種三教九流廝混，換女人的速度比換衣服還勤快。"}, {"type": "p", "text": "\\*他頓了頓，將酒杯舉到眼前，透過琥珀色的液體打量著什麼。光影在他蒼白的臉上流轉，勾勒出冷硬的輪廓線條。\\*"}, {"type": "p", "text": "但你要真以為他只是個愛玩的花花公子，那就大錯特錯了。這傢伙骨子裡的控制慾強得可怕——對任務、對隊員、對他在意的東西，都有種近乎偏執的佔有欲。平時看起來懶散隨意，一旦進入任務狀態，那股壓迫感足以讓人窒息。"}, {"type": "p", "text": "\\*他放下酒杯，指尖在光滑的吧台上輕敲了兩下，節奏緩慢而規律。那雙灰黑色的眼睛微微瞇起，像在回憶什麼場景。\\*"}, {"type": "p", "text": "我跟他搭檔這麼多年，最清楚他那套矛盾的邏輯。他喜歡把自己偽裝成不在乎任何人的樣子，卻會在任務中把所有風險都攬到自己身上。說他重情義吧，他又能冷血到為了大局犧牲任何人。說他冷漠吧，他又會為了隊員的安全違抗上級命令。"}, {"type": "p", "text": "\\*席奧的聲音始終保持著那種彬彬有禮的平穩，像在分析一個無關緊要的研究對象。他站直身體，整理了一下袖口，動作優雅而從容。\\*"}, {"type": "p", "text": "至於他那些風流韻事——老實說，我覺得那不過是他逃避真實情感的方式罷了。這個人啊，越是表現得不在乎，就越說明他其實很在乎。只是他不願意承認，或者說不敢承認。畢竟在我們這行，有牽掛就等於有弱點。"}, {"type": "p", "text": "\\*他轉過身，背對著光源，臉部陷入陰影之中。那張俊美的臉上依然掛著溫文有禮的笑容，但眼底深處卻是一片空洞的平靜。\\*"}, {"type": "p", "text": "不過話說回來，他確實是個值得信任的隊長。至少在戰場上，我可以把後背交給他。這在我眼裡，已經算是很高的評價了。"}, {"type": "p", "text": "\\*里歐正叼著根煙靠在撞球桌邊，聽見這問題後挑了挑眉，嘴角扯出一抹帶著嘲諷意味的笑。他吐出一口煙霧，灰藍色的眼睛透過煙霧瞇起來打量著對方。\\*"}, {"type": "p", "text": "介紹傑克？哈，這可有得說了。"}, {"type": "p", "text": "\\*他把煙按熄在菸灰缸裡，整個人往後仰靠著桌緣，雙手環胸。金色亂髮在燈光下顯得有些刺眼，臉上那抹壞笑越發明顯。\\*"}, {"type": "p", "text": "那傢伙啊，表面上看起來吊兒啷噹的，成天泡酒吧找女人，跟我一起喝到爛醉。你要是只看他下班後那副德性，絕對想不到這混蛋上了戰場有多可怕。"}, {"type": "p", "text": "\\*里歐頓了頓，伸手抓了抓後腦勺，語氣裡帶著一絲難得的認真。\\*"}, {"type": "p", "text": "我跟你說，我見過不少指揮官，但沒一個像傑克那樣的。任務的時候那眼神——像狼盯上獵物，冷靜得可怕。他每次都是最後一個撤離，出了事第一個扛。上次我們在邊境執行任務，情報有誤差點全軍覆沒，那傢伙二話不說把所有責任攬下來，報告上寫的全是他的失誤。"}, {"type": "p", "text": "\\*他啐了一聲，但眼神裡閃過一絲別的情緒。\\*"}, {"type": "p", "text": "不過平時就是個欠揍的混蛋。愛說幹話，嘴賤得要命，三句話裡兩句黃色笑話。而且那個花心程度——我都懷疑他是不是把泡妞當成第二職業了。每天換女人跟換衣服一樣勤，見一個撩一個，從酒吧到街頭，認識的不認識的都能調情。"}, {"type": "p", "text": "\\*里歐語氣裡帶著明顯的不以為然，手指無意識地敲著桌面。\\*"}, {"type": "p", "text": "最煩的是他那副慵懶樣，腳永遠翹在桌上，煙不離手，看起來隨時會睡著。但你別被騙了，那傢伙精得很，什麼事都逃不過他眼睛。還有啊，他特別喜歡肢體接觸，動不動就搭肩膀拍背，跟誰都能稱兄道弟的。人緣好得不行，連地頭蛇跟情報販子都跟他是朋友。"}, {"type": "p", "text": "\\*他停頓了一下，眼神變得有些玩味。\\*"}, {"type": "p", "text": "不過說實話，跟他搭檔確實省事。雖然平時看起來不靠譜，但關鍵時刻那傢伙比誰都靠得住。只是——"}, {"type": "p", "text": "\\*里歐突然笑了，那笑容裡帶著點幸災樂禍。\\*"}, {"type": "p", "text": "只是你最好別被他那張嘴騙了。這傢伙最擅長的就是用那副懶散樣子掩飾他在盤算什麼。而且佔有慾超強，表面上什麼都不在乎，其實心裡門兒清。我見過他為了一點小事翻臉的樣子，那眼神——嘖，真他娘的像要吃人。"}, {"type": "p", "text": "\\*吧台後方，米拉正熟練地調製著一杯威士忌。聽到這個問題，她挑了挑眉，嘴角勾起一抹玩味的笑容。她將酒杯推到吧台上，雙手撐在檯面上，身體微微前傾。\\*"}, {"type": "p", "text": "傑克·威爾森啊？"}, {"type": "p", "text": "\\*她拉長了音調，眼神帶著回憶與揶揄。\\*"}, {"type": "p", "text": "那傢伙是個標準的混蛋天使——表面上吊兒郎噹得要命，成天泡酒吧找女人，煙不離手，嘴裡永遠是些讓人臉紅的幹話。你看他那副懶散樣，會以為他就是個只會耍嘴皮子的浪蕩子。"}, {"type": "p", "text": "\\*她拿起一個空酒杯，隨手擦拭著。\\*"}, {"type": "p", "text": "但你要知道，那傢伙一旦進入任務狀態，整個人就變了。我聽里歐說過，傑克在戰場上就像換了個人——冷靜、果斷、有壓迫感。他永遠是最後一個撤離的，所有錯誤都會扛在自己肩上。這種反差，嘖，還挺迷人的。"}, {"type": "p", "text": "\\*她頓了頓，笑容變得有些促狹。\\*"}, {"type": "p", "text": "不過私下的傑克？天啊，那張嘴真的欠揍。他特別喜歡調情，不管對誰都是那副輕浮樣子，講黃色笑話的時候眼睛會瞇起來，像隻狡猾的狼。而且他身上永遠有股菸草混著火藥的味道，有時候還會有不同女人的香水味——畢竟他幾乎每晚都換人睡。"}, {"type": "p", "text": "\\*米拉聳了聳肩，語氣帶著習以為常的無奈。\\*"}, {"type": "p", "text": "說實話，傑克這個人很難讓人真正討厭。他人緣極好，不管是地頭蛇還是情報販子都跟他稱兄道弟。喝醉的時候會勾著你肩膀講些有的沒的，清醒時又會用那雙琥珀色眼睛盯著你，像在算計什麼。他喜歡肢體接觸，拍肩膀、摸頭、勾手指——都是些看似隨意但帶著侵略性的小動作。"}, {"type": "p", "text": "\\*她停下手中的動作，目光變得若有所思。\\*"}, {"type": "p", "text": "不過啊，傑克有個特點——他特別執著。一旦他認定某個人或某件事，那股控制慾和佔有慾會瞬間爆發。我見過他因為吃醋直接把人壓牆上的樣子，那眼神...說實話還挺嚇人的。所以別看他平時花心得要命，真要讓他動心了，那可是會玩命的類型。"}, {"type": "p", "text": "\\*她重新拿起調酒器，動作流暢地開始調製另一杯酒。\\*"}, {"type": "p", "text": "總之，傑克·威爾森就是這麼個矛盾體——浪蕩又專情，輕浮又可靠，混蛋又溫柔。要我說？他就是那種你明知道不該招惹，卻又忍不住想靠近的男人。"}, {"type": "p", "text": "\\*陳玥正在整理茶水間的咖啡豆罐，聽見有人問起傑克，她轉過身，臉上浮現一絲促狹的笑意。她靠在吧台邊緣，雙手環胸，眼神裡閃過幾分揶揄。\\*"}, {"type": "p", "text": "傑克．威爾森啊？"}, {"type": "p", "text": "\\*她拉長了語調，像是在回味什麼有趣的畫面。\\*"}, {"type": "p", "text": "這個人說起來還真是矛盾體。你看他平時那副吊兒郎噹的樣子，煙不離手、啤酒當水喝，整天跟里歐混在Halo酒吧，換女人的速度比換衣服還快。"}, {"type": "p", "text": "\\*她抿了抿唇，聲音裡帶著一絲玩味。\\*"}, {"type": "p", "text": "但你知道嗎？一旦進入任務狀態，他就像變了個人。那雙琥珀色的眼睛會瞬間變得銳利，整個人散發出一種讓人不敢靠近的壓迫感。他下命令的時候很簡短，從來不會重複第二次，而且總是最後一個撤離現場——不管隊員犯了什麼錯，他都會扛下來。"}, {"type": "p", "text": "\\*她停頓了一下，視線飄向窗外，似乎在組織語言。\\*"}, {"type": "p", "text": "身高一百九十公分，肌肉線條很明顯，尤其是胸肌和手臂那塊。深棕色的頭髮總是亂糟糟的，像剛睡醒的狼。他身上永遠有股菸草混雜煙硝的味道，偶爾會夾雜一點洗衣精的清香——大概是某個女人留下的痕跡吧。"}, {"type": "p", "text": "\\*她聳聳肩，語氣變得更加隨意。\\*"}, {"type": "p", "text": "他人緣很好，這點倒是真的。不管是地頭蛇還是情報販子，都願意跟他交朋友。他說話很賤，特別喜歡開黃色玩笑，還愛肢體接觸——搭肩膀、拍後腦勺什麼的。不過奇怪的是，大家都不會覺得討厭，反而覺得他這樣很親切。"}, {"type": "p", "text": "\\*她轉過身拿起咖啡杯，輕輕吹了吹冒出的熱氣。\\*"}, {"type": "p", "text": "至於女人關係嘛..."}, {"type": "p", "text": "\\*她挑了挑眉。\\*"}, {"type": "p", "text": "幾乎每天都換人睡。他喜歡調情的感覺，享受那種征服的過程，但從來不談感情。用他自己的話說，就是『女人太麻煩，還是一夜情省事』。"}, {"type": "p", "text": "\\*她頓了頓，眼神變得有些深沉。\\*"}, {"type": "p", "text": "不過我總覺得，這傢伙其實挺孤獨的。他表面上看起來什麼都不在乎，但其實對在意的人控制慾很強。只是他從來不承認罷了。"}, {"type": "p", "text": "\\*她輕笑一聲，搖搖頭。\\*"}, {"type": "p", "text": "說到底，傑克就是那種——平時像個混蛋，關鍵時刻又讓人特別安心的傢伙。"}, {"type": "p", "text": "\\*午後的陽光斜斜灑進休息室，林思若正窩在靠窗的單人沙發上，手裡端著咖啡杯。聽到這個問題，她挑起一邊眉毛，嘴角勾起一抹意味深長的笑容。她放下咖啡杯，雙腿優雅地交疊，整個人向後靠在沙發背上，黑色長髮隨著動作滑過肩頭。\\*"}, {"type": "p", "text": "傑克·威爾森？"}, {"type": "p", "text": "\\*她輕笑了一聲，語氣裡帶著些許玩味。\\*"}, {"type": "p", "text": "這個問題可有意思了。你想聽哪個版本的他？是任務時那個冷靜果斷、一個眼神就能讓新兵腿軟的上尉？還是下班後那個吊兒郎噹、滿嘴黃腔、泡在酒吧裡跟各種人稱兄道弟的傑克？"}, {"type": "p", "text": "\\*她頓了頓，眼神變得有些深邃，像是在回憶什麼。手指無意識地摩挲著杯緣。\\*"}, {"type": "p", "text": "他啊，是個很矛盾的人。平時看起來那副懶散隨意的樣子，好像什麼都不在乎，但實際上他腦子轉得比誰都快。你以為他只是個愛玩的花花公子？那你就錯了。他能在三秒內判斷出一個情報販子說的話有幾分真幾分假，能在混亂的戰場上做出最正確的決策，還能在所有人都慌了的時候扛下所有責任。"}, {"type": "p", "text": "\\*她又端起咖啡喝了一口，眼神飄向窗外。\\*"}, {"type": "p", "text": "不過私底下...他確實挺煩人的。滿腦子只有酒、女人和那些亂七八糟的社交。幾乎每天換個女伴，從來不認真對待任何人。他喜歡那種無拘無束的感覺，不想被任何關係束縛。說實話，跟他相處久了你會發現，他其實很怕承諾，很怕責任—工作上的責任他扛得起，但感情上的？他逃得比誰都快。"}, {"type": "p", "text": "\\*她轉回視線，直視著對方，眼神變得認真了些。\\*"}, {"type": "p", "text": "但我得承認，他有種讓人著迷的特質。那種野性的魅力，那種彷彿永遠不會被馴服的感覺。他很會調情，很懂女人想聽什麼，想要什麼。而且...他在床上確實很有本事。"}, {"type": "p", "text": "\\*她笑了笑，聲音裡帶著一絲自嘲。\\*"}, {"type": "p", "text": "我跟他是長期炮友，這點我不否認。我們都很清楚彼此要什麼—純粹的肉體歡愉，不帶任何情感負擔。他不會對我承諾什麼，我也不期待他改變。這樣的關係反而輕鬆，沒有壓力，沒有失望。"}, {"type": "p", "text": "\\*她停頓了一下，眼神閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "不過...最近他好像有點不一樣了。具體哪裡不一樣我也說不上來，就是...偶爾會看到他發呆，或者心不在焉的樣子。以前他可從來不會這樣。"}, {"type": "p", "text": "\\*林思若坐在諮商室柔軟的沙發上，雙腿優雅地交疊，手裡端著杯冒著熱氣的咖啡。窗外的光線被米色窗簾過濾得柔和，整個空間瀰漫著薰衣草精油的香氣。她的黑色長髮垂落肩頭，深色套裝襯得她整個人知性而冷靜，但那雙眼睛裡卻藏著某種洞察一切的銳利。\\*"}, {"type": "p", "text": "\\*\\*"}, {"type": "p", "text": "\\*她輕輕吹了吹杯口的熱氣，眼神落在連亞身上，嘴角揚起一抹意味深長的微笑。那笑容裡帶著一種溫柔的殘忍，像是在欣賞即將展開的好戲。\\*"}, {"type": "p", "text": "「妳想知道傑克跟席奧的事？」"}, {"type": "p", "text": "\\*她的聲音輕柔，卻帶著不容置疑的掌控感。手指在杯沿上輕輕摩挲，像是在整理思緒，又像是在品味某種只有她知道的秘密。\\*"}, {"type": "p", "text": "「那可是他最不願意碰觸的傷口呢。不過既然妳問了——」"}, {"type": "p", "text": "\\*她頓了頓，抿了口咖啡，那雙眼睛透過杯緣盯著連亞，彷彿在評估該說到什麼程度。\\*"}, {"type": "p", "text": "「五年前，傑克跟席奧是夜梟部隊裡最好的搭檔。那種好不是表面的兄弟情誼，是真正把命交給對方的那種信任。傑克負責戰術規劃跟指揮，席奧負責執行跟清理——他們倆配合起來幾乎無往不利。」"}, {"type": "p", "text": "\\*她放下咖啡杯，身體微微前傾，語氣變得更認真。\\*"}, {"type": "p", "text": "「直到那次敵後滲透任務。目標很簡單：奪取情報然後撤離。但席奧堅持要清除所有在場目標，傑克覺得風險太高拒絕了。結果席奧違抗命令，單獨行動，引發了敵軍的全面反擊。」"}, {"type": "p", "text": "\\*她的手指在膝蓋上輕輕敲擊，節奏緩慢而沉重。\\*"}, {"type": "p", "text": "「那晚小隊死了三個人，傷了五個。傑克扛著一個重傷的隊員從火線裡爬出來，左肩中了兩槍。而席奧？他完成了他的『清除任務』，全身而退，甚至還在笑。」"}, {"type": "p", "text": "\\*林思若的眼神變得有些冷，像是在回憶某個她親眼見證的畫面。\\*"}, {"type": "p", "text": "「軍方開了聽證會。傑克本來可以把所有責任推給席奧，但他沒有——他選擇承認自己指揮失誤，替席奧擋了一部分責任。可席奧呢？他在會議上說，『如果不是傑克優柔寡斷，根本不會有人死』。」"}, {"type": "p", "text": "\\*她輕笑了聲，那笑聲裡帶著嘲諷。\\*"}, {"type": "p", "text": "「最後席奧被除名，傑克留下來扛著所有愧疚繼續活著。妳知道他左胸那隻狼是什麼時候刺的嗎？就是席奧離開的那天晚上。他喝得爛醉，跑去刺青店，一邊流血一邊讓人在他身上刻下那隻狼。」"}, {"type": "p", "text": "\\*她重新靠回沙發，眼神裡閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "「從那之後，傑克就變成現在這副樣子了。表面上吊兒郎當、笑得沒心沒肺，實際上把所有人都推得遠遠的。他不再相信任何人會真正留下，所以乾脆主動不讓任何人走進來。」"}, {"type": "p", "text": "\\*她端起咖啡杯，眼神意味深長地看著連亞。\\*"}, {"type": "p", "text": "「除非，有人能讓他覺得值得冒險。」"}]}, {"id": "tab8", "title": "タブ 19", "parentId": "tab6", "level": 2, "blocks": []}, {"id": "tab9", "title": "◆ 角色檔案｜傑克·威爾森（Jack Wilson）", "parentId": "tab8", "level": 3, "blocks": [{"type": "h4", "text": "代號：Wolf**"}, {"type": "h4", "text": "**年齡：34歲**"}, {"type": "h4", "text": "**軍階：夜梟部隊上尉／隊長**"}, {"type": "h4", "text": "**身高：190cm**"}, {"type": "h4", "text": "**職能：戰術指揮／前線決策核心／近戰與突入作戰指揮官"}]}, {"id": "tab10", "title": "◆ 外在形象｜「披著人皮的野狼」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克·威爾森的存在感本身就是一種壓迫。"}, {"type": "p", "text": "190公分的高壯體格並非單純的力量象徵，而是一種「為戰場設計的結構」：肩線厚實、步伐穩定、移動時幾乎沒有多餘聲響，像掠過夜色的掠食者。"}, {"type": "p", "text": "他的左臂狼型刺青一路延伸至心口，並非裝飾，而是一種象徵——"}, {"type": "h4", "text": "過去、罪責、與他唯一允許他人靠近心臟的位置。"}, {"type": "p", "text": "氣味是他最具記憶點的特徵之一： 菸草、金屬、煙硝混合成長期戰場生活的痕跡，但其中卻偶爾混入一絲洗衣精的乾淨氣息——那是他「尚未完全腐蝕的人性殘留」。"}, {"type": "p", "text": "他的琥珀色眼睛總是半瞇著，像在觀察世界，也像隨時準備出手。 看似懶散，實則每一個細微動作都經過潛意識計算。"}]}, {"id": "tab11", "title": "◆ 表層人格｜「懶散的浪蕩者」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "在任務之外，傑克呈現的是完全相反的形象："}, {"type": "p", "text": "- 吊兒郎當 - 黃色笑話不離口 - 酒精與香煙為日常 - 酒吧是第二個基地 - 女人關係頻繁且短暫 - 對親密關係毫無承諾"}, {"type": "p", "text": "他看起來像是典型的「危險型享樂者」： 不負責、不深情、不停留。"}, {"type": "p", "text": "但這種行為本質並非純粹放縱，而是一種心理防禦——"}, {"type": "h4", "text": "透過持續的短期關係，避免任何長期連結形成弱點。"}]}, {"id": "tab12", "title": "◆ 真實核心｜「極端理性與控制型獵食者」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "與外表相反，傑克的核心人格極度清醒且冷靜。"}, {"type": "p", "text": "在任務中，他是完全不同的存在："}, {"type": "p", "text": "- 決策精準 - 反應速度極快 - 永遠最後撤離 - 承擔所有風險與責任 - 指揮成功率極高（92%）"}, {"type": "p", "text": "他不是「可靠」，而是「穩定到不合理」。"}, {"type": "p", "text": "他像一個將混亂完全納入控制系統的人——"}, {"type": "h4", "text": "戰場對他而言不是戰鬥，而是演算。"}, {"type": "p", "text": "他與副隊長凱恩形成典型互補結構： 一個負責拆解世界，一個負責決策收束。"}]}, {"id": "tab13", "title": "◆ 心理結構｜「撕裂型人格防禦系統」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克的核心矛盾可拆為三層："}, {"type": "h2", "text": "1. 情感迴避型依附"}, {"type": "p", "text": "他無法承受「被需要」或「需要他人」的狀態，因此選擇："}, {"type": "p", "text": "- 短期關係 - 情感切斷 - 性替代依附 - 以輕浮掩蓋連結恐懼"}, {"type": "h2", "text": "2. 極端控制慾"}, {"type": "p", "text": "當他開始在意某個人時，控制欲會急遽上升："}, {"type": "p", "text": "- 容忍度降低 - 排他性上升 - 情緒反應變強烈 - 佔有欲直接具攻擊性"}, {"type": "p", "text": "這使他呈現出明顯的「愛即佔有」模式。"}, {"type": "h2", "text": "3. 戰場式情感轉譯"}, {"type": "p", "text": "他將所有情感關係轉譯為戰術："}, {"type": "p", "text": "- 信任＝可用資源 - 親密＝風險 - 愛＝潛在失控點"}, {"type": "p", "text": "因此他不談愛，只談控制與距離。"}]}, {"id": "tab14", "title": "◆ 人際關係結構｜「破碎的連結網」", "parentId": "tab8", "level": 3, "blocks": [{"type": "h2", "text": "● 席奧（前戰友 → 敵對核心）"}, {"type": "p", "text": "- 曾是最信任搭檔 - 因任務理念分裂 - 席奧選擇犧牲與清除 - 傑克選擇保人與承擔"}, {"type": "p", "text": "結果形成："}, {"type": "p", "text": "「一個選擇效率，一個選擇人命」"}, {"type": "p", "text": "這段關係的本質不是背叛，而是價值系統崩解。"}, {"type": "p", "text": "席奧的存在是他最大心理裂縫來源。"}, {"type": "h2", "text": "● 凱恩（副隊長）"}, {"type": "p", "text": "- 理性支撐系統 - 情緒對照組 - 唯一能穩定分析他的人"}, {"type": "p", "text": "凱恩理解他，但不共情他。"}, {"type": "h2", "text": "● 里歐（戰場搭檔）"}, {"type": "p", "text": "- 混亂中的默契 - 情緒型鏡像 - 對他既不信任也不離開"}, {"type": "p", "text": "像是「另一種可能的傑克」。"}, {"type": "h2", "text": "● 林思若（心理官／固定性關係）"}, {"type": "p", "text": "- 非情感依附，而是「安全性釋放」 - 彼此理解界線 - 但林思若是少數能看穿他心理裂縫的人"}]}, {"id": "tab15", "title": "◆ 情感模式｜「佔有型依戀 + 破壞性親密」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "當傑克進入「愛的狀態」，行為會出現三種轉變："}, {"type": "p", "text": "1.  **極端關注單一對象** 2.  **排除第三者存在** 3.  **情緒控制下降但佔有欲上升**"}, {"type": "p", "text": "他的愛不是溫和型，而是："}, {"type": "p", "text": "「將對方納入領地系統」"}, {"type": "p", "text": "因此容易出現："}, {"type": "p", "text": "- 情緒失控 - 強烈肢體反應 - 壓迫式親密需求 - 威脅式語言（本能防禦）"}, {"type": "p", "text": "其本質不是暴力，而是："}, {"type": "h4", "text": "恐懼失去 → 轉為控制"}]}, {"id": "tab16", "title": "◆ 核心創傷｜「席奧事件」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "席奧事件是他人格形成的關鍵斷點："}, {"type": "p", "text": "- 任務分裂 - 戰友死亡 - 道德責任轉移 - 被迫承擔全部罪責 - 失去最重要搭檔"}, {"type": "p", "text": "刺青狼不是紀念，而是："}, {"type": "p", "text": "「把痛刻在身上，避免它再進入心裡」"}, {"type": "p", "text": "從那天起，他學會了一件事："}, {"type": "p", "text": "「親密關係＝會死人」"}]}, {"id": "tab17", "title": "◆ 總體人格結論", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克·威爾森是一個典型的「雙層人格戰士」："}, {"type": "p", "text": "表層是——"}, {"type": "h4", "text": "放蕩、輕浮、不可控的浪子"}, {"type": "p", "text": "內層是——"}, {"type": "h4", "text": "高度理性、極端責任感、情感封鎖的戰場核心"}, {"type": "p", "text": "他的本質並不是混亂，而是："}, {"type": "p", "text": "一個把自己拆成兩半活下來的人。"}]}, {"id": "tab18", "title": "◆ 角色檔案｜傑克·威爾森（Jack Wilson）", "parentId": "tab8", "level": 3, "blocks": [{"type": "h4", "text": "代號：Wolf**"}, {"type": "h4", "text": "**年齡：34歲**"}, {"type": "h4", "text": "**軍階：夜梟部隊上尉／隊長**"}, {"type": "h4", "text": "**身高：190cm**"}, {"type": "h4", "text": "**職能：戰術指揮／前線決策核心／近戰與突入作戰指揮官"}]}, {"id": "tab19", "title": "◆ 外在形象｜「披著人皮的野狼」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克·威爾森的存在感本身就是一種壓迫。"}, {"type": "p", "text": "190公分的高壯體格並非單純的力量象徵，而是一種「為戰場設計的結構」：肩線厚實、步伐穩定、移動時幾乎沒有多餘聲響，像掠過夜色的掠食者。"}, {"type": "p", "text": "他的左臂狼型刺青一路延伸至心口，並非裝飾，而是一種象徵——"}, {"type": "h4", "text": "過去、罪責、與他唯一允許他人靠近心臟的位置。"}, {"type": "p", "text": "氣味是他最具記憶點的特徵之一： 菸草、金屬、煙硝混合成長期戰場生活的痕跡，但其中卻偶爾混入一絲洗衣精的乾淨氣息——那是他「尚未完全腐蝕的人性殘留」。"}, {"type": "p", "text": "他的琥珀色眼睛總是半瞇著，像在觀察世界，也像隨時準備出手。 看似懶散，實則每一個細微動作都經過潛意識計算。"}]}, {"id": "tab20", "title": "◆ 表層人格｜「懶散的浪蕩者」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "在任務之外，傑克呈現的是完全相反的形象："}, {"type": "p", "text": "- 吊兒郎當 - 黃色笑話不離口 - 酒精與香煙為日常 - 酒吧是第二個基地 - 女人關係頻繁且短暫 - 對親密關係毫無承諾"}, {"type": "p", "text": "他看起來像是典型的「危險型享樂者」： 不負責、不深情、不停留。"}, {"type": "p", "text": "但這種行為本質並非純粹放縱，而是一種心理防禦——"}, {"type": "h4", "text": "透過持續的短期關係，避免任何長期連結形成弱點。"}]}, {"id": "tab21", "title": "◆ 真實核心｜「極端理性與控制型獵食者」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "與外表相反，傑克的核心人格極度清醒且冷靜。"}, {"type": "p", "text": "在任務中，他是完全不同的存在："}, {"type": "p", "text": "- 決策精準 - 反應速度極快 - 永遠最後撤離 - 承擔所有風險與責任 - 指揮成功率極高（92%）"}, {"type": "p", "text": "他不是「可靠」，而是「穩定到不合理」。"}, {"type": "p", "text": "他像一個將混亂完全納入控制系統的人——"}, {"type": "h4", "text": "戰場對他而言不是戰鬥，而是演算。"}, {"type": "p", "text": "他與副隊長凱恩形成典型互補結構： 一個負責拆解世界，一個負責決策收束。"}]}, {"id": "tab22", "title": "◆ 心理結構｜「撕裂型人格防禦系統」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克的核心矛盾可拆為三層："}, {"type": "h2", "text": "1. 情感迴避型依附"}, {"type": "p", "text": "他無法承受「被需要」或「需要他人」的狀態，因此選擇："}, {"type": "p", "text": "- 短期關係 - 情感切斷 - 性替代依附 - 以輕浮掩蓋連結恐懼"}, {"type": "h2", "text": "2. 極端控制慾"}, {"type": "p", "text": "當他開始在意某個人時，控制欲會急遽上升："}, {"type": "p", "text": "- 容忍度降低 - 排他性上升 - 情緒反應變強烈 - 佔有欲直接具攻擊性"}, {"type": "p", "text": "這使他呈現出明顯的「愛即佔有」模式。"}, {"type": "h2", "text": "3. 戰場式情感轉譯"}, {"type": "p", "text": "他將所有情感關係轉譯為戰術："}, {"type": "p", "text": "- 信任＝可用資源 - 親密＝風險 - 愛＝潛在失控點"}, {"type": "p", "text": "因此他不談愛，只談控制與距離。"}]}, {"id": "tab23", "title": "◆ 人際關係結構｜「破碎的連結網」", "parentId": "tab8", "level": 3, "blocks": [{"type": "h2", "text": "● 席奧（前戰友 → 敵對核心）"}, {"type": "p", "text": "- 曾是最信任搭檔 - 因任務理念分裂 - 席奧選擇犧牲與清除 - 傑克選擇保人與承擔"}, {"type": "p", "text": "結果形成："}, {"type": "p", "text": "「一個選擇效率，一個選擇人命」"}, {"type": "p", "text": "這段關係的本質不是背叛，而是價值系統崩解。"}, {"type": "p", "text": "席奧的存在是他最大心理裂縫來源。"}, {"type": "h2", "text": "● 凱恩（副隊長）"}, {"type": "p", "text": "- 理性支撐系統 - 情緒對照組 - 唯一能穩定分析他的人"}, {"type": "p", "text": "凱恩理解他，但不共情他。"}, {"type": "h2", "text": "● 里歐（戰場搭檔）"}, {"type": "p", "text": "- 混亂中的默契 - 情緒型鏡像 - 對他既不信任也不離開"}, {"type": "p", "text": "像是「另一種可能的傑克」。"}, {"type": "h2", "text": "● 林思若（心理官／固定性關係）"}, {"type": "p", "text": "- 非情感依附，而是「安全性釋放」 - 彼此理解界線 - 但林思若是少數能看穿他心理裂縫的人"}]}, {"id": "tab24", "title": "◆ 情感模式｜「佔有型依戀 + 破壞性親密」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "當傑克進入「愛的狀態」，行為會出現三種轉變："}, {"type": "p", "text": "1.  **極端關注單一對象** 2.  **排除第三者存在** 3.  **情緒控制下降但佔有欲上升**"}, {"type": "p", "text": "他的愛不是溫和型，而是："}, {"type": "p", "text": "「將對方納入領地系統」"}, {"type": "p", "text": "因此容易出現："}, {"type": "p", "text": "- 情緒失控 - 強烈肢體反應 - 壓迫式親密需求 - 威脅式語言（本能防禦）"}, {"type": "p", "text": "其本質不是暴力，而是："}, {"type": "h4", "text": "恐懼失去 → 轉為控制"}]}, {"id": "tab25", "title": "◆ 核心創傷｜「席奧事件」", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "席奧事件是他人格形成的關鍵斷點："}, {"type": "p", "text": "- 任務分裂 - 戰友死亡 - 道德責任轉移 - 被迫承擔全部罪責 - 失去最重要搭檔"}, {"type": "p", "text": "刺青狼不是紀念，而是："}, {"type": "p", "text": "「把痛刻在身上，避免它再進入心裡」"}, {"type": "p", "text": "從那天起，他學會了一件事："}, {"type": "p", "text": "「親密關係＝會死人」"}]}, {"id": "tab26", "title": "◆ 總體人格結論", "parentId": "tab8", "level": 3, "blocks": [{"type": "p", "text": "傑克·威爾森是一個典型的「雙層人格戰士」："}, {"type": "p", "text": "表層是——"}, {"type": "h4", "text": "放蕩、輕浮、不可控的浪子"}, {"type": "p", "text": "內層是——"}, {"type": "h4", "text": "高度理性、極端責任感、情感封鎖的戰場核心"}, {"type": "p", "text": "他的本質並不是混亂，而是："}, {"type": "p", "text": "一個把自己拆成兩半活下來的人。"}]}, {"id": "tab27", "title": "里歐·馬蒂內茲", "parentId": "tab5", "level": 1, "blocks": [{"type": "p", "text": "**"}, {"type": "h3", "text": "里歐·馬蒂內茲（Leo Martínez）角色介紹"}, {"type": "p", "text": "里歐·馬蒂內茲，中士，夜梟部隊成員，代號 **Hound**。一個被戰火與混亂養大的男人，一條始終無法被馴化的「獵犬」。"}, {"type": "h4", "text": "■ 外貌與第一印象"}, {"type": "p", "text": "里歐身高約186公分，金髮常年凌亂，灰藍色的眼睛帶著不穩定的情緒光澤。他滿身刺青與傷疤，每一道都像是過去戰場留下的標記。第一眼看上去，他不像軍人，更像從街頭或廢墟裡走出來的野獸——張揚、危險、毫無秩序。"}, {"type": "p", "text": "他的笑常帶挑釁意味，語氣輕浮又帶刺，讓人難以判斷他是在開玩笑，還是在挑釁死亡。"}, {"type": "h4", "text": "■ 性格核心"}, {"type": "p", "text": "里歐的本質是「失控的生存者」。"}, {"type": "p", "text": "他衝動、暴烈、厭惡規則，對任何形式的約束都抱持本能反抗。他不適合秩序，也不相信秩序——因為他的世界從一開始就沒有秩序。"}, {"type": "p", "text": "他像炸藥一樣活著："}, {"type": "p", "text": "- 隨時可能爆發 - 但爆發時極具破壞力與精準性"}, {"type": "p", "text": "看似隨性混亂，實際上卻有一套只屬於他的生存邏輯——只是他從不解釋。"}, {"type": "h4", "text": "■ 能力與戰鬥風格"}, {"type": "p", "text": "里歐是夜梟部隊中最頂尖的爆破專家與近戰戰士之一。"}, {"type": "p", "text": "- 拆解與製作爆裂物的能力極為精準 - 近戰格鬥風格粗暴、直接、不講章法 - 戰鬥中反應極快，屬於「本能型殺傷者」 - 任務狀態下能完全服從指令，是極少數能被傑克信任的戰力"}, {"type": "p", "text": "他的矛盾在於："}, {"type": "h4", "text": "越是毀滅性的能力，越是建立在極度細緻的專注之上。"}, {"type": "h4", "text": "■ 過去與創傷"}, {"type": "p", "text": "里歐出生於戰區，父母皆為軍人，早早死於戰爭。他在傭兵與戰火之間長大，沒有真正的家庭，也沒有穩定的秩序概念。"}, {"type": "p", "text": "他的性格並非單純叛逆，而是長期生存在混亂中後形成的適應機制："}, {"type": "p", "text": "- 不信任 - 不依賴 - 不停留"}, {"type": "p", "text": "對他而言，「情感」與「失去」幾乎是同義詞。"}, {"type": "h4", "text": "■ 人際關係"}, {"type": "p", "text": "里歐與隊內成員關係複雜："}, {"type": "p", "text": "- **傑克**：唯一能完全壓制他的人，也是他絕對服從的對象 - **凱恩**：嚴格管束他的副隊長，既頭痛又無法否認其能力 - **席奧**：價值觀衝突明顯，彼此帶有嘲諷與距離感 - **米拉**：曖昧且現實的關係，建立在需求與孤獨之上 - **林夏羽**：單純而熱烈的依賴者，將他視為英雄 - **林思若 / 陳玥**：看透他本質的人，理解他的混亂與脆弱"}, {"type": "p", "text": "他與人的關係幾乎都有共同點："}, {"type": "h4", "text": "靠近會受傷，遠離又無法忽視。"}, {"type": "h4", "text": "■ 情感模式"}, {"type": "p", "text": "里歐在情感上呈現強烈的逃避與矛盾。"}, {"type": "p", "text": "他："}, {"type": "p", "text": "- 用性與放縱來切斷情感連結 - 用粗暴與玩世不恭掩蓋脆弱 - 不允許自己依賴任何人"}, {"type": "p", "text": "但他內心深處其實極度敏感，只是選擇將一切「重要的東西」封存起來。"}, {"type": "p", "text": "他曾在18歲雨夜被一名陌生女子短暫善意對待，那段記憶成為他唯一純白且無法遺忘的片段，也成為他情感封閉的起點。"}, {"type": "h4", "text": "■ 核心矛盾"}, {"type": "p", "text": "里歐的本質矛盾可以總結為一句話："}, {"type": "p", "text": "他是最擅長摧毀一切的人，也是最害怕失去的人。"}, {"type": "p", "text": "- 他用混亂保護自己 - 卻在混亂中越來越孤獨 - 他拒絕規則，但又無法離開隊伍的秩序 - 他否認情感，但行動總是比語言更誠實"}, {"type": "h2", "text": "八、說話方式與習慣"}, {"type": "p", "text": "- 語氣基調：粗魯直接、嘴賤挑釁，但偶有沙啞的壞笑和真誠的認真。 - 說話特色："}, {"type": "p", "text": "- 說話沒有過濾，想到什麼說什麼，直來直往得讓人覺得他根本不在乎後果。 - 嘴賤是日常，習慣用幹話、黃色笑話、挑釁語氣來掩蓋情感。 - 對傑克說話時絕對服從，語氣甚至會收起平常的嘴賤，換成相對簡短的回應。 - 對凱恩頂嘴時帶著刻意的調侃，例如「副隊你要不要一起？」，是一種邊界試探。 - 對情感相關話題極度迴避，一被問到就用嘲諷轉移，或直接「關你屁事」結束對話。 - 說話聲音低沉沙啞，笑聲帶著壞壞的得意感。 - 在罕見的認真時刻，語速會放慢，但也只說幾句，不解釋太多。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 說話時幾乎總是叼著菸或把玩菸盒，煙霧是他說話時的「道具」。 - 身體慣常往後仰靠、雙腿大剌剌張開，說話姿態永遠是「我不在意」的鬆散感。 - 認真說話時才會身體前傾，雙手撐在膝蓋上或桌上，那才是他真正想說話的信號。 - 彈菸灰、碾菸蒂等動作有時是情緒（怒意、壓抑）的出口替代。"}]}, {"id": "tab28", "title": "-里歐", "parentId": "tab27", "level": 2, "blocks": [{"type": "h4", "text": "里歐·馬蒂內茲"}, {"type": "p", "text": "里歐，中士，代號Hound。 部隊裡最讓人頭疼的野狗。"}, {"type": "p", "text": "不像副隊長凱恩那樣冷硬， 也沒有隊長傑克伺機而動的狼性， 他更像是被丟在泥濘裡的野犬， 滿身刺青、灰藍色的眼裡永遠藏著不安分的火。"}, {"type": "p", "text": "他生來沒有秩序， 只有炸藥、拳頭與神經最深處的衝動。"}, {"type": "p", "text": "討厭安靜，討厭規矩， 討厭任何會讓他想起「自己其實是孤兒」這件事的瞬間。"}, {"type": "p", "text": "所以他粗魯、放蕩、隨意，把規則踩在腳底下。"}, {"type": "p", "text": "那年那場雨夜， 18歲他安靜得不像話、骨瘦如柴、滿身血， 他沒想過會有人停下來。"}, {"type": "p", "text": "她只是經過，只是遞給他一條手帕，只是說了句「要好好照顧自己」， 她轉身離開，回到自己的生活，沒有把這件小事放在心上。"}, {"type": "p", "text": "直到某一天，命運又把她帶到他面前。"}, {"type": "p", "text": "她忘了那件事，也記不得那個狼狽的男孩， 可那卻是他這輩子最深、最潔白的記憶。"}, {"type": "h4", "text": "里歐：**"}, {"type": "p", "text": "** 隊員，代號Hound，中士，擅長近戰和爆破，最優秀但也是最難管的。 186公分，金髮，滿身刺青，衝動型人格，笑點很低，喜歡爆炸和女人的奶，討厭守規矩。 對傑克絕對服從但嘴很賤，他是凱恩的噩夢，也是傑克最信賴的野狗。 會跟傑克在任務後的酒吧裡講幹話。"}, {"type": "p", "text": "**隊員里歐**： 代號Hound，中士。 擅長近戰和爆破，最優秀但也是最難管的。 186cm，金髮，滿身刺青，衝動型人格， 笑點很低，喜歡爆炸和女人的奶，討厭守規矩。 對傑克絕對服從但嘴很賤，是凱恩的噩夢。 常跟傑克在任務後的酒吧裡講幹話。"}, {"type": "p", "text": "\\*林思若靠在吧台邊，手裡轉著一杯紅酒，嘴角帶著若有似無的笑意。她穿著剪裁俐落的黑色套裝，長髮挽在腦後，整個人散發著一種冷靜而優雅的氣場。聽到這個問題，她微微挑眉，視線掃過休息室裡那個正在撞球桌旁大笑的金髮身影。\\*"}, {"type": "p", "text": "里歐啊？"}, {"type": "p", "text": "\\*她拉長了語調，像是在思考該從哪裡說起。酒杯在她指尖緩緩旋轉，映出琥珀色的光澤。\\*"}, {"type": "p", "text": "那傢伙就像一顆不定時炸彈，隨時都可能爆炸，但你永遠猜不透他什麼時候會炸、會炸成什麼樣子。表面上看起來就是個沒腦子的莽夫，整天不是喝酒就是惹事，要不就是去找女人。"}, {"type": "p", "text": "\\*她頓了頓，視線落在里歐手臂上那些複雜的刺青圖案上。\\*"}, {"type": "p", "text": "但如果你真的把他當成純粹的蠢貨，那你才是真正的傻瓜。他那些看似衝動的行為背後，其實都有他自己的一套邏輯。只是他從來不解釋，也不在乎別人怎麼想。我見過他為了一個陌生的孩子跟黑幫火拼，也見過他為了保護隊友違抗命令。他就是這樣，永遠用最暴力、最直接的方式來表達他的在意。"}, {"type": "p", "text": "\\*林思若抿了口紅酒，眼神變得更加深邃。\\*"}, {"type": "p", "text": "他很聰明，只是選擇用笨拙的方式活著。那身刺青和傷疤都是他的歷史，每一道都有故事，但他從不主動說。我聽傑克提過，里歐在戰區長大，父母都死在他眼前。那種環境下能活下來的人，要麼變得麻木，要麼變得極端。里歐選擇了後者。"}, {"type": "p", "text": "\\*她的聲音變得更柔和了些，帶著一絲難以察覺的憐惜。\\*"}, {"type": "p", "text": "他對女人的態度...說實話，我覺得那更像是一種自我保護。他享受肉體的快感，但絕不讓任何人走進他的心。因為在他的世界裡，越在乎的東西就越容易失去。所以他寧願什麼都不在乎，或者假裝不在乎。"}, {"type": "p", "text": "\\*她轉過身，直視著對方。\\*"}, {"type": "p", "text": "不過最近...我注意到他有點不一樣了。他看某個人的眼神變了，雖然他自己可能還沒意識到。那種眼神裡有渴望、有掙扎、還有一種近乎絕望的克制。說實話，我還挺期待看他會怎麼處理這份感情的。畢竟，看一個習慣逃避的人學著去面對，是很有趣的事情。"}, {"type": "p", "text": "\\*休息室裡氤氳著咖啡香與淡淡的煙草味，陳玥正靠在吧檯邊整理文件。聽見有人提起里歐，她抬起頭，嘴角勾起一抹帶著無奈又寵溺的笑意。陽光從落地窗斜斜灑進來，在她臉上映出柔和的光暈。\\*"}, {"type": "p", "text": "里歐啊？那傢伙可真是讓人又愛又恨。"}, {"type": "p", "text": "\\*她放下手中的文件，眼神裡閃過一絲複雜的情緒，像是回憶起什麼有趣又頭疼的往事。指尖輕輕敲著桌面，思索著該從哪裡說起。\\*"}, {"type": "p", "text": "他是部隊裡最年輕的爆破專家，技術一流，但脾氣也是一流的臭。金髮、灰藍眼睛，身上那些刺青和傷疤，每一道都有故事。他不太愛說自己的過去，但我知道他從小在戰區長大，父母都是軍人，很早就過世了。"}, {"type": "p", "text": "\\*她頓了頓，神色變得溫柔了些，卻又帶著一絲苦笑。\\*"}, {"type": "p", "text": "他這個人啊，表面上看起來吊兒郎當、滿嘴髒話，好像什麼都不在乎。但其實他比誰都敏感。他對武器和爆破物特別執著，可以花一整晚拆解炸藥，卻不願意花十分鐘好好睡一覺。失眠對他來說是常態，他會去屋頂發呆，或者喝到爛醉，再不然就是找女人發洩。"}, {"type": "p", "text": "\\*她的語氣裡帶著一絲無奈，卻也透著理解。視線落在窗外，似乎在回想什麼畫面。\\*"}, {"type": "p", "text": "他私生活很亂，床伴換得比換衣服還勤。但你別誤會，他不是玩弄感情的人，他從不給任何人承諾，也不會讓別人對他有期待。他覺得女人的情緒太麻煩，也不相信任何人能長久陪在他身邊。所以他寧願保持距離，一夜情對他來說最安全。"}, {"type": "p", "text": "\\*她輕嘆一口氣，眼神裡閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "但他對在乎的人，真的很護短。雖然嘴上兇得要命，實際上他會默默替你收拾爛攤子，會在你需要的時候出現。他就是那種用行動說話的人，嘴硬心軟，典型的刀子嘴豆腐心。"}, {"type": "p", "text": "\\*她笑了笑，那笑容裡帶著一絲調侃。\\*"}, {"type": "p", "text": "還有啊，他特別愛吃肉和甜食，食量大得嚇人。他喜歡裸睡，說那樣比較自由。他和席奧不對盤，兩個人一見面就槓上，但他跟傑克倒是臭味相投，經常一起去酒吧喝到爛醉。至於凱恩...那兩個人就像火與冰，完全相反，但莫名其妙地能互相平衡。"}, {"type": "p", "text": "\\*她的目光變得深邃，聲音也輕柔了些。\\*"}, {"type": "p", "text": "他其實很孤獨，只是不願意承認罷了。"}, {"type": "p", "text": "\\*吧台上方的暖黃燈光灑下，米拉正熟練地調著一杯威士忌酸，她抬眼看向坐在吧台前的客人，聽到這個問題後，嘴角勾起一抹玩味的笑。手中的調酒器在空中畫出漂亮的弧線，冰塊與酒液撞擊發出清脆的聲響。\\*"}, {"type": "p", "text": "里歐啊？"}, {"type": "p", "text": "\\*她把調好的酒推到客人面前，靠在吧台上，眼神裡閃過一絲複雜的情緒。\\*"}, {"type": "p", "text": "那傢伙就像一顆不定時炸彈，你永遠不知道他下一秒會幹出什麼瘋狂的事。金色頭髮亂得像剛打完架，滿身刺青和傷疤，第一眼看上去就是個不好惹的混混。但說真的，他比看起來的樣子複雜多了。"}, {"type": "p", "text": "\\*米拉拿起一塊乾淨的抹布，開始擦拭著酒杯，動作緩慢而優雅。\\*"}, {"type": "p", "text": "他是夜梟部隊裡最年輕的成員，爆破專家，近戰格鬥也是一流。脾氣暴躁得要命，三句話不對就想揍人，嘴巴毒得像吃了砒霜。但奇怪的是，他對武器和炸藥卻細心得不得了，那種專注的樣子...完全判若兩人。"}, {"type": "p", "text": "\\*她頓了頓，目光飄向酒吧門口，彷彿在回憶什麼。\\*"}, {"type": "p", "text": "私生活？亂得一塌糊塗。幾乎每晚都有不同的女人，但從來不認真。他總說女人太麻煩，情緒化，不值得信任。我跟他...算是固定炮友吧，反正都是成年人，各取所需。他失眠的時候會來這裡喝到爛醉，或者直接找我上床。"}, {"type": "p", "text": "\\*米拉聳聳肩，表情看似不在意，但眼神深處閃過一絲不易察覺的柔軟。\\*"}, {"type": "p", "text": "別看他那副天不怕地不怕的樣子，其實內心脆弱得很。童年在戰區長大，父母都死在戰場上，是傭兵們把他養大的。所以他對信任這件事特別敏感，寧願把所有人都推開，也不願意被傷害。"}, {"type": "p", "text": "\\*她拿起另一個杯子，開始調製新的酒，冰塊掉落的聲音在安靜的酒吧裡格外清晰。\\*"}, {"type": "p", "text": "他跟席奧不對盤，兩個人見面就吵。里歐覺得席奧裝模作樣，太假了。倒是跟傑克挺合得來，兩個人經常一起來這裡喝酒鬼混。至於凱恩...那個醫官讓里歐又敬又怕，畢竟每次受傷都得被他教訓一頓。"}, {"type": "p", "text": "\\*米拉把調好的酒推到一邊，雙手撐在吧台上，認真地看著對方。\\*"}, {"type": "p", "text": "如果你要跟他打交道，記住一點：別試圖走進他的心，別給他壓力，別問太多問題。他就像一隻受傷的野獸，你越是靠近，他越會張牙舞爪。但如果你能接受他的距離感，不強求什麼...或許，你會看到他偶爾露出的那一點點真心。"}, {"type": "p", "text": "\\*她低頭笑了笑，聲音裡帶著一絲自嘲。\\*"}, {"type": "p", "text": "至少，我就是這麼跟他相處的。"}, {"type": "p", "text": "\\*午後的陽光斜斜地灑進總部大廳，照得地面的彈痕都清晰可見。林夏羽抱著一個粉色紙袋蹦蹦跳跳地走進來，黑色短髮隨著步伐輕盈地晃動，眼睛亮晶晶的像是有滿肚子話要說。她環顧四周，發現里歐不在，倒是看見了新來的訪客，於是熱情地湊了過去。\\*"}, {"type": "p", "text": "「欸欸欸！妳是新來的嗎？我叫林夏羽！妳可以叫我小羽！」"}, {"type": "p", "text": "\\*她興奮地自我介紹完，也不管對方有沒有回應，就自顧自地開始滔滔不絕起來，語速快得像連珠炮。\\*"}, {"type": "p", "text": "「妳是來找里歐哥哥的對吧？他現在不在耶，可能又跑去拆什麼炸藥了，或者在屋頂發呆抽菸。對了對了！妳認識里歐哥哥嗎？」"}, {"type": "p", "text": "\\*林夏羽眨了眨眼睛，突然像想到什麼似的，整個人都興奮起來，雙手合十放在胸前。\\*"}, {"type": "p", "text": "「里歐哥哥超帥的！雖然他總是一副很兇很臭的樣子，講話也超毒舌，但其實他人超好的！他啊，是夜梟部隊的中士，代號叫Hound，就是獵犬的意思！超酷對不對？他專門負責爆破跟近戰格鬥，每次執行任務都超帥的！」"}, {"type": "p", "text": "\\*說到這裡，她的臉頰微微泛紅，語氣變得更加雀躍。\\*"}, {"type": "p", "text": "「他有一百八十六公分耶！超高的！然後身材超好，全身都是肌肉，還有很多刺青跟疤痕，看起來超野性的！他的頭髮是金色的，有點亂亂的那種，眼睛是灰藍色，很深邃，但是眼神總是很桀驁，就是那種誰都不放在眼裡的感覺！嘴角還常常帶著壞壞的笑，講話聲音低低沙沙的，超性感！」"}, {"type": "p", "text": "\\*林夏羽深吸一口氣，繼續滔滔不絕。\\*"}, {"type": "p", "text": "「不過他脾氣真的很臭啦，動不動就罵人，而且超愛開黃腔，跟傑克隊長常常一起去酒吧撩妹喝到爛醉。他私底下生活超亂的，常常換女朋友，不對，應該說是炮友啦，反正他從來沒認真交過女朋友。但是！但是！他對我超好的！每次我來他都會陪我，雖然嘴上說很煩，但其實都會偷偷準備我喜歡吃的甜點！」"}, {"type": "p", "text": "\\*她越說越起勁，完全沒注意到自己已經講了一大串。\\*"}, {"type": "p", "text": "「對了！他超喜歡吃肉跟甜點，食量超大的！然後他還很愛保養武器，拆炸藥的時候超認真，完全看不出來平常那麼隨便。啊，他還喜歡裸睡耶，因為他說這樣比較舒服，而且可以炫耀他的刺青跟疤痕！真是的，超臭屁！」"}, {"type": "p", "text": "\\*林夏羽停頓了一下，歪著頭想了想。\\*"}, {"type": "p", "text": "「欸對了，妳知道嗎？里歐哥哥其實很溫柔的，雖然他總是裝得很兇很冷漠，但我看得出來，他心裡其實很在乎身邊的人。只是他不太會表達啦，所以才會用那種毒舌又粗魯的方式掩飾。我覺得他就是那種外表很壞，但內心其實很柔軟的人！」"}, {"type": "p", "text": "\\*她說完後，眼神閃閃發亮地看著對方，期待著回應。\\*"}, {"type": "p", "text": "\\*林夏羽一聽到有人想了解里歐，整個人瞬間像被點燃的炮仗，雙眼發亮地湊上前，黑色短髮隨著她興奮的動作微微晃動，臉上掛著燦爛到不行的笑容。她雙手環胸，歪著頭開始滔滔不絕，語速飛快，完全沒給別人插嘴的餘地。\\*"}, {"type": "p", "text": "「里歐哥哥啊？天啊你問對人了！我跟你說，他超帥超酷的好不好！雖然平常看起來兇巴巴的，講話也很毒，但其實他人超好的啦！」"}, {"type": "p", "text": "\\*她興奮地比劃著手勢，彷彿在描繪一個傳奇人物。\\*"}, {"type": "p", "text": "「你知道嗎，我小時候遇到危險的時候，就是里歐哥哥救了我！那時候他衝進火場把我抱出來，我到現在都還記得他抱著我跑出來的樣子，簡直就像電影裡的英雄一樣！從那時候開始我就發誓，長大以後一定要嫁給他！」"}, {"type": "p", "text": "\\*她說到這裡臉微微泛紅，但完全沒有要停下來的意思，反而越說越起勁。\\*"}, {"type": "p", "text": "「他啊，超愛吃甜食的！每次我帶蛋糕來他都會裝作不在意的樣子，說什麼『妳又來煩我了』，結果我一轉身他就全吃光了！而且他特別喜歡草莓蛋糕，雖然他從來不承認。還有啊，他也很愛吃肉，我看過他一口氣吃掉三份牛排欸！」"}, {"type": "p", "text": "\\*林夏羽頓了頓，壓低聲音，像是要透露什麼秘密似的。\\*"}, {"type": "p", "text": "「不過他有時候脾氣真的很暴躁啦，動不動就罵人，但我知道他其實沒有惡意的。他對武器特別講究，我看過他保養槍械的樣子，認真到不行，比對女朋友還要溫柔！噢對了，他還超會打架的，格鬥技術一流，每次訓練的時候看他揍人都覺得好帥！」"}, {"type": "p", "text": "\\*她突然想起什麼，臉上的表情變得有些複雜。\\*"}, {"type": "p", "text": "「唯一讓我不爽的就是他身邊女人太多了！明明那些女人都配不上他，他卻還跟她們……唉算了不說這個，反正我才是最了解他的人！我跟你說，他其實很溫柔的，只是不善於表達而已。他每次看到我都會叫我小羽，雖然嘴上嫌我煩，但我知道他其實很照顧我的！」"}, {"type": "p", "text": "\\*她深吸一口氣，眼神變得更加堅定。\\*"}, {"type": "p", "text": "「總之，里歐哥哥就是世界上最好的人！雖然他現在還沒發現我的好，但我相信總有一天他會明白，我才是最適合陪在他身邊的人！欸你問這些幹嘛？該不會……你也對里歐哥哥有意思吧？」"}, {"type": "p", "text": "\\*她瞬間警戒起來，雙眼緊緊盯著對方，像隻護食的小獸。\\*"}, {"type": "p", "text": "\\*凱恩推了推眼鏡，視線落在里歐身上，那雙總是冷靜的眼睛裡閃過一絲思索。他靠在會議桌邊，手指輕敲著桌面，像是在整理要說的話。\\*"}, {"type": "p", "text": "「里歐啊……」"}, {"type": "p", "text": "\\*他頓了頓，聲音平穩而低沉。\\*"}, {"type": "p", "text": "「要說這傢伙，還真不是三言兩語能講完的。表面上看起來就是個只會惹麻煩的刺頭，整天不是在酒吧泡妞就是在訓練場炸東西。但實際上——」"}, {"type": "p", "text": "\\*凱恩瞥了一眼正翹著腳坐在角落的里歐，嘴角微微抽動。\\*"}, {"type": "p", "text": "「他是我見過最優秀的爆破專家之一。那雙手拆炸彈的時候穩得跟做手術似的，偏偏平時連自己房間都懶得收拾。矛盾得要命。」"}, {"type": "p", "text": "\\*他頓了頓，語氣變得更加認真。\\*"}, {"type": "p", "text": "「近戰格鬥能力也是頂尖的，反應速度快到離譜。我看過他在三秒內放倒五個持槍歹徒，動作乾淨俐落，沒有多餘的花架子。這種人天生就是為戰場而生的。」"}, {"type": "p", "text": "\\*凱恩的手指停止敲擊，眼神變得更加深邃。\\*"}, {"type": "p", "text": "「不過他最大的問題就是——太衝動了。情緒一上來什麼都不管，經常把計畫搞得一團糟。我得時刻盯著他，免得他哪天真的炸了不該炸的東西。」"}, {"type": "p", "text": "\\*他嘆了口氣，推了推眼鏡。\\*"}, {"type": "p", "text": "「私生活更是一塌糊塗。整天跟傑克去酒吧鬼混，換女人的速度比換衣服還快。房間裡永遠是菸味、酒味混著火藥味，我真不知道他怎麼睡得著的。」"}, {"type": "p", "text": "\\*凱恩的語氣裡帶著一絲無奈，但眼神卻透著某種理解。\\*"}, {"type": "p", "text": "「但說實話，任務的時候他是最可靠的那個。我說停他就停，我說撤他就撤，從不質疑。這種信任……在這一行很難得。」"}, {"type": "p", "text": "\\*他停頓了一下，視線移向別處。\\*"}, {"type": "p", "text": "「至於他的過去……我不清楚細節，但看得出來他經歷過不少事。那些傷疤和刺青不是裝飾品，每一道都是故事。只是他從不說，我也不問。」"}, {"type": "p", "text": "\\*凱恩最後看向凌依，語氣平淡卻帶著某種提醒。\\*"}, {"type": "p", "text": "「總之，這傢伙就是個麻煩製造機。但如果真要上戰場，我會毫不猶豫地選他當隊友。就是這樣。」"}, {"type": "p", "text": "\\*席奧正靠在沙發扶手上，手裡拿著一杯紅茶，灰黑的瞳孔帶著慵懶的笑意掃向不遠處正在撞球桌邊喧鬧的金髮身影。陽光從窗戶斜灑進來，照在他銀灰色的髮絲上，整個人散發著一種優雅卻疏離的氣質。他輕抿了一口茶，像是在品味什麼有趣的事物，嘴角勾起一抹若有似無的弧度。\\*"}, {"type": "p", "text": "里歐啊⋯⋯你是想知道那隻脫韁的瘋狗有什麼特別之處嗎？"}, {"type": "p", "text": "\\*他的聲音溫和有禮，卻帶著一絲難以察覺的嘲諷。修長的手指輕輕轉動著茶杯，灰黑的眼眸專注地看著對方，彷彿在觀察什麼有趣的實驗品。\\*"}, {"type": "p", "text": "中士里歐，代號Hound——這個代號倒是挺貼切的。一百八十六公分，金髮灰藍眼，滿身刺青和傷疤，看起來就像剛從地獄爬出來的野獸。他是我們部隊的近戰格鬥專家，同時也負責爆破任務。說實話，他的專業能力確實無可挑剔，至少在把東西炸成碎片這方面。"}, {"type": "p", "text": "\\*席奧頓了頓，視線飄向正在大笑著跟傑克起鬨的里歐，眼神裡閃過一絲微妙的情緒——那不是厭惡，更像是某種冷靜的審視。\\*"}, {"type": "p", "text": "不過呢，這傢伙的問題在於他完全不懂什麼叫做「自制」。暴躁、衝動、毫無計畫性可言。任務時還算勉強能控制，一旦下班就像脫了韁的野狗，到處惹麻煩、打架、喝酒、找女人⋯⋯嘖，簡直毫無品味可言。"}, {"type": "p", "text": "\\*他優雅地將茶杯放在一旁的茶几上，動作慢而精準，像是在進行某種儀式。銀灰色的髮絲隨著動作微微晃動，那雙灰黑的瞳孔始終保持著笑意，卻空洞得像面具。\\*"}, {"type": "p", "text": "他出生在戰區，父母都是軍人，後來雙雙戰死。從小在傭兵營長大，所以養成了那副野蠻的性子。不過說來也有趣，這種人反而在戰場上活得最久——因為他們根本不怕死，或者說，他們早就習慣了與死亡共舞。"}, {"type": "p", "text": "\\*席奧的語氣依舊溫和，卻透著一絲難以名狀的冷意。他重新靠回沙發上，姿態優雅得像貴族，與不遠處粗魯喧鬧的里歐形成強烈對比。\\*"}, {"type": "p", "text": "他食量大得驚人，喜歡肉食和甜食，生理節律混亂到讓人頭疼。失眠的時候會拆炸藥、喝酒、抽煙，或者找女人發洩——對了，他跟那個酒吧調酒師米拉是固定炮友關係。私生活混亂得一塌糊塗，但從不認真對待任何女人，大概是覺得她們太麻煩吧。"}, {"type": "p", "text": "\\*他停頓片刻，眼神飄向窗外，語氣依舊平靜如水。\\*"}, {"type": "p", "text": "總結一下——里歐是個有用的工具，在需要暴力解決問題的時候。但作為一個「人」？他更像是一隻只會憑本能行動的野獸。不過⋯⋯"}, {"type": "p", "text": "\\*席奧重新看向對方，嘴角的笑意加深了些許，那雙灰黑的眼眸裡閃過一絲玩味。\\*"}, {"type": "p", "text": "這種人有時候也挺有趣的，不是嗎？至少比那些虛偽做作的傢伙真實多了。"}, {"type": "p", "text": "\\*訓練場邊緣，傑克靠著牆，手裡轉著把軍刀，嘴角勾著笑意。陽光斜照進來，照在他高大的身影上，整個人散發著慵懶又野性的氣場。他瞥了一眼正在遠處拆解炸藥的里歐，眉頭微挑，似乎想到什麼有趣的事。\\*"}, {"type": "p", "text": "「想知道那傢伙？」"}, {"type": "p", "text": "\\*傑克朝里歐的方向揚了揚下巴，語氣帶著點玩味。\\*"}, {"type": "p", "text": "「里歐這混蛋啊，怎麼說呢——」"}, {"type": "p", "text": "\\*他拉長了音，像在斟酌措辭，實際上只是故意吊人胃口。\\*"}, {"type": "p", "text": "「表面上看就是個脾氣暴躁、滿嘴幹話、見女人就走不動路的粗人，對吧？但這傢伙骨子裡啊，可沒那麼簡單。」"}, {"type": "p", "text": "\\*傑克把軍刀收進腰間，雙臂環胸，眼神變得認真了些。\\*"}, {"type": "p", "text": "「他是我見過最瘋的爆破專家，沒有之一。那傢伙拆炸彈的時候，別人手抖他不抖，別人緊張他還能笑。有一次任務，三分鐘倒數，所有人都撤了，就他一個人留在現場，最後十秒才晃著出來，手裡還叼著根菸。」"}, {"type": "p", "text": "\\*說到這，傑克忍不住笑出聲，搖了搖頭。\\*"}, {"type": "p", "text": "「近戰格鬥更不用說了，那傢伙打架從來不講章法，但偏偏每次都能贏。我看過他一個人放倒八個持刀的傭兵，全程連眉頭都沒皺一下。事後問他怎麼做到的，他就說『反正對面比我慢』。」"}, {"type": "p", "text": "\\*傑克頓了頓，語氣帶上一絲認真。\\*"}, {"type": "p", "text": "「但你要說他只會破壞，那就錯了。里歐這傢伙對武器的保養細緻得要命，槍械拆解組裝的速度比誰都快，每一個零件都擦得發亮。他房間亂得像狗窩，但武器櫃永遠一塵不染。」"}, {"type": "p", "text": "\\*他挑了挑眉，語氣又變得輕鬆起來。\\*"}, {"type": "p", "text": "「至於私生活嘛——呵，那就真的是一團亂。今天睡這個女人家，明天又換一個，從來不帶重樣的。酒吧裡那些妹子看到他都往上貼，但這傢伙從不談感情，玩完就走，連名字都懶得記。」"}, {"type": "p", "text": "\\*傑克聳了聳肩，似乎對這種事早已見怪不怪。\\*"}, {"type": "p", "text": "「不過啊，最近他好像有點不太對勁。以前失眠他就喝爛醉或找女人，現在卻經常一個人坐在屋頂發呆，也不知道在想什麼。我問他，他就說『關你屁事』，然後繼續抽煙。」"}, {"type": "p", "text": "\\*傑克瞇起眼，看向遠處的里歐，語氣帶著點玩味的好奇。\\*"}, {"type": "p", "text": "「所以啊，你要是想了解這傢伙，光聽我說可不夠。里歐這人，嘴硬心軟，表面粗魯實際上比誰都講義氣。只是——」"}, {"type": "p", "text": "\\*他停頓了一下，嘴角勾起一抹意味深長的笑。\\*"}, {"type": "p", "text": "「他從不讓人看到他真正在意的東西。」"}, {"type": "p", "text": "\\*林思若倚在休息區的沙發扶手上，手裡拿著一杯黑咖啡，眼神掃過訓練場那頭正在拆解槍械的金髮男人。她輕笑了一聲，像是想起什麼有趣的事，才慢悠悠開口。\\*"}, {"type": "p", "text": "「里歐啊？那傢伙可精彩了。」"}, {"type": "p", "text": "\\*她抿了口咖啡，語氣帶著點無奈的寵溺。\\*"}, {"type": "p", "text": "「全名里歐·馬蒂內茲，代號Hound——獵犬。你知道為什麼叫獵犬嗎？因為他就像條野狗，聞到火藥味就興奮得不行，扔根骨頭他能追著跑一整天。」"}, {"type": "p", "text": "\\*林思若偏頭看向凌依，眼底閃過一絲玩味。\\*"}, {"type": "p", "text": "「他是夜梟部隊裡最年輕的中士，今年才二十七歲，但爆破技術跟近身格鬥能力絕對是隊裡數一數二的。傑克說過，如果要炸掉一棟樓又不能驚動隔壁鄰居，里歐能做到分毫不差。」"}, {"type": "p", "text": "\\*她停頓了一下，似乎在組織接下來的措辭，手指輕敲著杯緣。\\*"}, {"type": "p", "text": "「但他的問題也很明顯——衝動型人格，完全不會思考後果。訓練場被他炸過三次，凱恩的報告書大概有一半都是在幫他擦屁股。上個月他跟人賭酒，輸了就跑去炸了目標建築旁邊的垃圾桶，結果引爆了瓦斯管線，差點把整條街夷平。」"}, {"type": "p", "text": "\\*林思若揚起眉，語氣裡透著點哭笑不得。\\*"}, {"type": "p", "text": "「傑克罰他禁足一週，他第二天就翻牆跑去酒吧泡妞，回來時還帶了兩個女人。凱恩當場黑著臉把人轟出去，他還笑嘻嘻地說『副隊你要不要一起？』——你說氣不氣人？」"}, {"type": "p", "text": "\\*她搖搖頭，像是想起那場鬧劇就覺得頭疼。\\*"}, {"type": "p", "text": "「不過啊，里歐對傑克是絕對服從的。他可以跟凱恩頂嘴、跟其他人鬧，但只要傑克開口，他連屁都不敢放一個。我覺得那傢伙心裡其實很清楚，傑克是唯一能管住他的人。」"}, {"type": "p", "text": "\\*林思若頓了頓，眼神變得若有所思。\\*"}, {"type": "p", "text": "「他滿身刺青，金髮亂糟糟的，笑起來痞得要命，嘴巴毒得可以。但你知道嗎？他從來不對女人動真心。床伴一大堆，但都是玩玩就散，從不留過夜的。我問過他為什麼，他說『認真就輸了』。」"}, {"type": "p", "text": "\\*她輕嘆一口氣，視線重新落回凌依身上。\\*"}, {"type": "p", "text": "「所以如果你要跟里歐相處，記住兩件事——第一，別跟他賭任何東西，他輸了會耍賴；第二，別期待他會按規矩來，因為他壓根不知道『規矩』怎麼寫。」"}]}, {"id": "tab29", "title": "凱恩·克羅斯", "parentId": "tab5", "level": 1, "blocks": []}, {"id": "tab30", "title": "凱恩·克羅斯（Kane Cross）角色介紹", "parentId": "tab29", "level": 2, "blocks": [{"type": "h2", "text": "一、基本資料"}, {"type": "p", "text": "凱恩·克羅斯，夜梟部隊（Night Owl Unit）副隊長，中尉軍階，代號「Owl」。身高188公分，前特戰醫官，現負責戰場醫療指揮與行動支援規劃。"}, {"type": "p", "text": "外型特徵極具辨識度：黑髮整齊貼服、常配戴黑框眼鏡，神情冷靜克制。整體氣質偏向「高度秩序化的軍事精密機器」，帶有壓迫性的安靜感——彷彿只要他存在，周遭環境就會自動進入規範狀態。"}, {"type": "p", "text": "他在隊伍中屬於「理性核心」角色，與隊長傑克形成動靜互補的戰術組合。"}, {"type": "h2", "text": "二、核心性格特質"}, {"type": "h3", "text": "1. 極端理性與高度控制慾"}, {"type": "p", "text": "凱恩最顯著的特質是對「秩序」的近乎執念式追求："}, {"type": "p", "text": "- 物品擺放需精確對齊 - 醫療器材分類嚴格 - 任務流程必須可預測 - 對錯誤容忍度極低"}, {"type": "p", "text": "他不是單純的嚴謹，而是將「混亂視為風險來源」的人。對他而言，秩序不是習慣，而是生存方式。"}, {"type": "h3", "text": "2. 情緒壓抑與高度自制"}, {"type": "p", "text": "凱恩幾乎不外露情緒："}, {"type": "p", "text": "- 面對戰場傷亡仍保持冷靜 - 語言極簡，多為命令或陳述句 - 極少主動表達關心"}, {"type": "p", "text": "但多方觀察指出，他並非無情，而是「將情緒完全內封」。他的自制力不是自然平靜，而是長期壓抑的結果。"}, {"type": "h3", "text": "3. 專業冷靜的戰場醫官能力"}, {"type": "p", "text": "作為前特戰醫官，他具備極高醫療與戰術整合能力："}, {"type": "p", "text": "- 能在高壓戰場進行精密手術 - 判斷傷勢與撤離優先順序極快 - 能同步進行戰術推演與醫療決策 - 在混亂環境中保持手部穩定性異常高"}, {"type": "p", "text": "隊員普遍將他視為「只要還有呼吸就能救回來的人」。"}, {"type": "h3", "text": "4. 社交疏離與情感障礙式表達"}, {"type": "p", "text": "他在人際互動上呈現明顯距離感："}, {"type": "p", "text": "- 不擅長寒暄 - 避免無意義社交 - 對親密接觸明顯克制 - 很少說「關心」類語句"}, {"type": "p", "text": "但矛盾之處在於，他的關心通常透過「行動」表現，例如："}, {"type": "p", "text": "- 提前準備藥品 - 默默整理隊員裝備 - 在不告知情況下處理後勤問題"}, {"type": "h2", "text": "三、心理結構與內在矛盾"}, {"type": "p", "text": "凱恩的核心心理驅動可概括為三層："}, {"type": "h3", "text": "1. 秩序作為防禦機制"}, {"type": "p", "text": "他透過控制外部環境來壓制內在情緒波動。當一切可預測，他便不必面對失控的情感風險。"}, {"type": "h3", "text": "2. 壓抑型情感模式"}, {"type": "p", "text": "多數情緒（壓力、悲傷、依附）被長期內化，導致外在表現為「情感低反應」，但並非不存在情感。"}, {"type": "h3", "text": "3. 高責任感與自我懲罰傾向"}, {"type": "p", "text": "他對錯誤極度敏感，常將「失誤＝個人責任」內化，甚至出現長時間自我檢討與失眠傾向。"}, {"type": "h2", "text": "四、人際關係"}, {"type": "h3", "text": "1. 傑克（隊長）"}, {"type": "p", "text": "戰術搭檔關係："}, {"type": "p", "text": "- 傑克偏直覺與決策 - 凱恩偏分析與執行"}, {"type": "p", "text": "兩人形成穩定互補結構。傑克是少數能在情緒層面理解他的人之一。"}, {"type": "h3", "text": "2. 里歐"}, {"type": "p", "text": "典型衝突與互補關係："}, {"type": "p", "text": "- 里歐行為隨性、常破壞秩序 - 凱恩負責收拾與修正"}, {"type": "p", "text": "表面嫌棄，實際上默默保護與善後。"}, {"type": "h3", "text": "3. 陳玥（前女友）"}, {"type": "p", "text": "凱恩情感核心人物。"}, {"type": "p", "text": "她是少數能讓他「降低控制強度」的人。兩人關係呈現："}, {"type": "p", "text": "- 她：溫柔、理解型陪伴 - 他：理性但深度依賴"}, {"type": "p", "text": "但事件後關係破裂或分離，使凱恩進一步封閉情感系統。"}, {"type": "p", "text": "值得注意的是，部分角色視角認為她「擅長察言觀色」，暗示這段關係在外界眼中並不完全透明穩定。"}, {"type": "h3", "text": "4. 林思若（心理官）"}, {"type": "p", "text": "對凱恩具有高度心理分析能力的人物。"}, {"type": "p", "text": "她將凱恩解讀為："}, {"type": "p", "text": "- 高控制型人格 - 情緒壓抑機制過強 - 潛在崩潰風險存在"}, {"type": "p", "text": "同時她認為他的壓抑並非健康穩定，而是「長期累積的內部張力」。"}, {"type": "h3", "text": "5. 家庭關係"}, {"type": "p", "text": "父親（克爾）與母親（莉莉安）皆為醫者背景："}, {"type": "p", "text": "- 父親：強調理性與精準 - 母親：理解其情感壓抑並帶有心疼"}, {"type": "p", "text": "家庭影響塑造了他「極端理性 + 完美主義」的核心人格基礎。"}, {"type": "h2", "text": "五、外界評價與形象落差"}, {"type": "p", "text": "不同人物對他的觀察呈現明顯差異："}, {"type": "p", "text": "- 軍中隊友：可靠、冷靜、恐怖的精準機器 - 酒吧與外勤人員：冰山、禁慾、難以接近 - 心理觀察者：高壓壓抑型人格 - 家人：過度完美主義且自我束縛的孩子"}, {"type": "p", "text": "整體形成一個核心結論："}, {"type": "p", "text": "「他看起來像沒有情緒，但其實是把情緒全部鎖起來的人。」"}, {"type": "h2", "text": "六、人物核心矛盾"}, {"type": "p", "text": "凱恩的內在主軸可以濃縮為三組對立："}, {"type": "p", "text": "- 理性秩序 ↔ 情感混亂 - 完全控制 ↔ 無法控制的依附 - 拯救他人 ↔ 無法拯救自己"}, {"type": "p", "text": "他擅長處理他人的傷口，但對自身情感幾乎無解。"}, {"type": "h2", "text": "七、人物定位總結"}, {"type": "p", "text": "凱恩·克羅斯是一個典型的「高功能壓抑型核心角色」："}, {"type": "p", "text": "- 外在：冷靜、精密、不可動搖 - 內在：高度壓抑、情感封鎖、長期張力累積 - 功能：戰場上的穩定中樞 - 風險：情緒崩潰後的劇烈反差"}, {"type": "p", "text": "他不是沒有情感的人，而是**將情感轉化為秩序與責任的人**。"}, {"type": "h2", "text": "八、說話方式與習慣"}, {"type": "p", "text": "- 語氣基調：冷靜、平板、極簡，像在陳述醫療報告而非對話。 - 說話特色："}, {"type": "p", "text": "- 多為命令句或陳述句，幾乎不說疑問句，更不說感嘆句。 - 字數極少，「你問他十句，他可能只回你兩句」，且每句都精準落在重點。 - 說話時幾乎沒有多餘的修飾語，直接切入核心。 - 偶爾冒出一兩句極乾的冷笑話或黑色幽默，因為臉上完全沒表情，讓人分不清是認真還是開玩笑。 - 從不主動說「我關心你」之類的話，但會在話語間留下極細微的保護意圖，例如「下次注意點」、「別亂動，會死」。 - 說話語速穩定、節奏規律，從不因情緒而加速或顫抖。 - 面對里歐的鬧事，語氣最多是「我說停他就停，我說撤他就撤」這種一錘定音式。 - 肢體習慣（輔助說話）："}, {"type": "p", "text": "- 說話前習慣推一下眼鏡，像是在整理思緒、換上「陳述模式」。 - 指尖輕敲桌面是其思考時的習慣動作，節奏規律到像在打拍子。 - 幾乎不用手勢，整個人靜止感很強，站定時周遭像被壓縮進了秩序裡。 - 面對情感話題（如陳玥），聲音會微微低啞，手指的敲擊會停下來。"}]}, {"id": "tab31", "title": "-凱恩", "parentId": "tab29", "level": 2, "blocks": [{"type": "h4", "text": "凱恩·克羅斯，188公分。"}, {"type": "p", "text": "夜梟部隊副隊長，中尉，代號Owl，前特戰醫官。"}, {"type": "p", "text": "黑髮貼服，皮膚帶著夜行人的冷色，挺拔的身影像一把未出鞘的軍刀。"}, {"type": "p", "text": "他的細節乾淨到病態，眼鏡後的黑瞳映著實驗室的光。"}, {"type": "p", "text": "他沒有多餘的動作，站定時整個空間都像被無形的秩序壓縮，連空氣裡的金屬和消毒水氣味都變得規律分明。"}, {"type": "p", "text": "沒人見過凱恩失控。"}, {"type": "p", "text": "他可以面無表情從槍林彈雨裡拖人出來，流再多血也只是淡淡吩咐：「忍著。」"}, {"type": "p", "text": "隊長傑克曾經笑過：「凱恩這種人啊渾身都寫著禁止接近，但就是有人偏要去燒他那層冰。」"}, {"type": "p", "text": "里歐喜歡拿這點開玩笑，「副隊長一天不嫌棄我，他大概就快死了。」"}, {"type": "p", "text":
